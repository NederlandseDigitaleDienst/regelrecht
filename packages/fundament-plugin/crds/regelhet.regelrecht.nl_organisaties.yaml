---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: organisaties.regelhet.regelrecht.nl
spec:
  group: regelhet.regelrecht.nl
  names:
    kind: Organisatie
    listKind: OrganisatieList
    plural: organisaties
    singular: organisatie
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.displayName
      name: Name
      type: string
    - jsonPath: .status.url
      name: URL
      type: string
    - jsonPath: .status.backofficeUrl
      name: Medewerkers
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Organisatie is one front, with its own name, logo and login, for the
          regelhets that name it in spec.organisatie. Each regelhet keeps its
          own release and database.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: OrganisatieSpec is one front for several regelhets.
            properties:
              auth:
                description: Auth is how people log in. Empty is the test login.
                properties:
                  mode:
                    default: test
                    description: |-
                      Mode is test: the test login, where anyone picks a test person of the
                      regelhets of the organisatie. Stable mode comes later.
                    enum:
                    - test
                    type: string
                type: object
              displayName:
                description: DisplayName is the name people see, such as Gemeente
                  Wilgendaal.
                maxLength: 100
                minLength: 1
                type: string
              hostname:
                description: |-
                  Hostname is the address, as for a RegelHet: citizens on
                  <hostname>.<domain>, employees on <hostname>-medewerkers.<domain>, or a
                  domain of your own with a dot in it.
                maxLength: 253
                minLength: 1
                pattern: ^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)*$
                type: string
              logo:
                description: Logo is the https URL of the logo; empty shows the name
                  only.
                maxLength: 2048
                pattern: ^(https://[^@/\s]+(/\S*)?)?$
                type: string
              theme:
                description: Theme is how the screens look.
                properties:
                  accentColor:
                    description: |-
                      AccentColor is a theme of the NLDD design system. Empty keeps its own
                      accent.
                    enum:
                    - ""
                    - bruin
                    - donkerblauw
                    - donkerbruin
                    - donkergeel
                    - donkergroen
                    - geel
                    - groen
                    - hemelblauw
                    - lichtblauw
                    - mintgroen
                    - mosgroen
                    - oranje
                    - paars
                    - robijnrood
                    - rood
                    - roze
                    - violet
                    type: string
                type: object
              version:
                description: |-
                  Version is the regelrecht commit whose image runs the front, as for a
                  RegelHet. Empty follows main.
                pattern: ^([0-9a-f]{40})?$
                type: string
            required:
            - displayName
            - hostname
            type: object
          status:
            description: OrganisatieStatus is what the plugin last saw.
            properties:
              backofficeUrl:
                description: BackofficeURL is where employees do.
                type: string
              conditions:
                description: Conditions are Ready and ReleaseReady.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              loginUrl:
                description: LoginURL is the Keycloak of stable mode; empty in test
                  mode.
                type: string
              message:
                description: Message says why the phase is what it is.
                type: string
              observedGeneration:
                description: ObservedGeneration is the generation of the spec this
                  status is about.
                format: int64
                type: integer
              phase:
                description: Phase is Pending, Ready or Failed.
                type: string
              processen:
                description: |-
                  Processen are the regelhets on the list of the front, by namespace
                  and name.
                items:
                  description: ProcessReference is a RegelHet on the list of an
                    Organisatie.
                  properties:
                    name:
                      type: string
                    namespace:
                      type: string
                    phase:
                      description: Phase is the phase of that RegelHet.
                      type: string
                  required:
                  - name
                  - namespace
                  type: object
                type: array
                x-kubernetes-list-type: atomic
              url:
                description: URL is where citizens use the front.
                type: string
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: 'the name is at most 40 characters: it names the Helm release and
            the objects of the chart'
          rule: size(self.metadata.name) <= 40
    served: true
    storage: true
    subresources:
      status: {}
