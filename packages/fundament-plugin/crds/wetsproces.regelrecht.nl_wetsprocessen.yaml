---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: wetsprocessen.wetsproces.regelrecht.nl
spec:
  group: wetsproces.regelrecht.nl
  names:
    kind: Wetsproces
    listKind: WetsprocesList
    plural: wetsprocessen
    singular: wetsproces
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.auth.mode
      name: Auth
      type: string
    - jsonPath: .status.url
      name: URL
      type: string
    - jsonPath: .status.backofficeUrl
      name: Medewerkers
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Wetsproces is one wetsprocessysteem: a case from a git repository, run by
          the wetsproces server on its own address.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: WetsprocesSpec is one wetsprocessysteem.
            properties:
              auth:
                description: Auth is how people log in. Empty is the test login.
                properties:
                  mode:
                    default: test
                    description: |-
                      Mode is test (the test login) or stable (a Keycloak of its own on
                      <hostname>-login, beside the other addresses).
                    enum:
                    - test
                    - stable
                    type: string
                  testAccounts:
                    description: |-
                      TestAccounts gives the Keycloak of stable mode the test accounts of the
                      case, all with one password the chart generates. For a test setup
                      only; without them, accounts are made in Keycloak itself.
                    type: boolean
                type: object
              fsc4b:
                description: Fsc4b is FSC voor Burgers. Empty is off.
                properties:
                  enabled:
                    description: |-
                      Enabled offers the citizens' routes to an app that proves who the
                      citizen is with a credential, on the demo Stelsel with a test
                      Activatiedienst that checks no identity. Test mode only.
                    type: boolean
                type: object
              hostname:
                description: |-
                  Hostname is the address: a name under the plugin's base domain
                  (`zorgtoeslag` gives zorgtoeslag.<domain> for citizens and
                  zorgtoeslag-medewerkers.<domain> for employees), or a domain name of
                  your own, with a dot in it (employees on medewerkers.<hostname>).
                maxLength: 253
                minLength: 1
                pattern: ^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)*$
                type: string
              manifest:
                description: Manifest is the case to run.
                properties:
                  credentialsSecretRef:
                    description: |-
                      CredentialsSecretRef names a Secret with the keys `username` and
                      `token`, for a private repository. The token needs read access only.
                    properties:
                      name:
                        description: Name of the Secret.
                        maxLength: 253
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                  path:
                    default: bron.yaml
                    description: |-
                      Path of the manifest inside the repository: bron.yaml at the root of a
                      manifest repository, packages/wetsproces/bron.yaml in regelrecht itself.
                    pattern: ^[^/\s]\S*$
                    type: string
                  ref:
                    default: main
                    description: Ref is the branch or tag.
                    pattern: ^[A-Za-z0-9._/][A-Za-z0-9._/-]*$
                    type: string
                  repoUrl:
                    description: RepoURL is the HTTPS URL of the git repository, without
                      credentials.
                    pattern: ^https://[^@/\s]+/\S+$
                    type: string
                required:
                - repoUrl
                type: object
              organisatie:
                description: |-
                  Organisatie puts this wetsproces on the list of an Organisatie in the
                  same Fundament project, behind its front. The wetsproces keeps its own
                  addresses. Empty runs it on its own.
                properties:
                  name:
                    description: Name of the Organisatie.
                    maxLength: 40
                    minLength: 1
                    type: string
                  namespace:
                    description: |-
                      Namespace of the Organisatie; empty is the namespace of the
                      Wetsproces. It must be a namespace of the same Fundament project.
                    maxLength: 63
                    type: string
                required:
                - name
                type: object
              parties:
                description: |-
                  Parties says where the external parties of the case work. Empty
                  leaves them to the admin panel.
                properties:
                  ownInstances:
                    description: |-
                      OwnInstances gives each external party that the executor asks
                      something of by its own policy a release of its own, where its staff
                      log in, linked with the executor's. Which parties those are follows
                      from the regelwerken of the case: the running server names them, and
                      a case that asks no party for anything gets none. Off, an admin
                      enters what every external party did. Test mode only.
                    type: boolean
                type: object
              theme:
                description: Theme is how the screens look.
                properties:
                  accentColor:
                    description: |-
                      AccentColor is a theme of the NLDD design system. Empty keeps its own
                      accent.
                    enum:
                    - ""
                    - bruin
                    - donkerblauw
                    - donkerbruin
                    - donkergeel
                    - donkergroen
                    - geel
                    - groen
                    - hemelblauw
                    - lichtblauw
                    - mintgroen
                    - mosgroen
                    - oranje
                    - paars
                    - robijnrood
                    - rood
                    - roze
                    - violet
                    type: string
                type: object
              version:
                description: |-
                  Version is the regelrecht commit whose wetsproces image runs, the full
                  40-character hash, and whose chart installs it. Empty follows main: the
                  chart on main and the latest build it names.
                pattern: ^([0-9a-f]{40})?$
                type: string
            required:
            - hostname
            - manifest
            type: object
            x-kubernetes-validations:
            - message: 'parties.ownInstances links the releases with keys made at
                start: test mode only'
              rule: '!(has(self.parties) && has(self.parties.ownInstances) && self.parties.ownInstances
                && has(self.auth) && has(self.auth.mode) && self.auth.mode == ''stable'')'
            - message: 'fsc4b.enabled runs on the demo Stelsel, whose test Activatiedienst
                checks no identity: test mode only'
              rule: '!(has(self.fsc4b) && has(self.fsc4b.enabled) && self.fsc4b.enabled
                && has(self.auth) && has(self.auth.mode) && self.auth.mode == ''stable'')'
          status:
            description: WetsprocesStatus is what the plugin last saw.
            properties:
              backofficeUrl:
                description: BackofficeURL is where employees do.
                type: string
              conditions:
                description: |-
                  Conditions are Ready and ReleaseReady, and OrganisatieGevonden with
                  spec.organisatie.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              executorCell:
                description: |-
                  ExecutorCell is the cell of the case the executor's release works
                  for, which a party's release names as its peer; set with Parties.
                type: string
              fsc4bDiscoveryUrl:
                description: |-
                  Fsc4bDiscoveryURL is the discovery configuration of FSC voor Burgers,
                  where an app finds the services; empty when it is off.
                type: string
              keycloakSecret:
                description: |-
                  KeycloakSecret names the Secret in the namespace of this Wetsproces
                  that the chart generates for stable mode: the Keycloak admin password
                  (user admin) under admin-password, and the password of the test
                  accounts under test-password. Only the name, never a value.
                type: string
              loginUrl:
                description: LoginURL is the Keycloak of stable mode; empty in test
                  mode.
                type: string
              message:
                description: Message says why the phase is what it is.
                type: string
              observedGeneration:
                description: ObservedGeneration is the generation of the spec this
                  status is about.
                format: int64
                type: integer
              parties:
                description: |-
                  Parties are the external parties that run on a release of their own,
                  as the running server last named them; empty when none does.
                items:
                  description: PartyStatus is an external party that runs on a release
                    of its own.
                  properties:
                    cell:
                      description: Cell is the party as the case names it.
                      type: string
                    name:
                      description: Name is what a screen calls it.
                      type: string
                    url:
                      description: URL is where its staff log in.
                      type: string
                  required:
                  - cell
                  - url
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - cell
                x-kubernetes-list-type: map
              phase:
                description: Phase is Pending, Ready or Failed.
                type: string
              url:
                description: URL is where citizens use the wetsprocessysteem.
                type: string
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: 'the name is at most 40 characters: it names the Helm release and
            the objects of the chart'
          rule: size(self.metadata.name) <= 40
    served: true
    storage: true
    subresources:
      status: {}
