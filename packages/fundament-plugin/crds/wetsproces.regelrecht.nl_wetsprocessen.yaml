    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Wetsproces is one wetsprocessysteem: a case from a git repository, run by
          the wetsproces server on its own address.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: WetsprocesSpec is one wetsprocessysteem.
            properties:
              hostname:
                description: |-
                  Hostname is the address: a name under the plugin's base domain
                  (`zorgtoeslag` gives zorgtoeslag.<domain> for citizens and
                  zorgtoeslag-medewerkers.<domain> for employees), or a domain name of
                  your own, with a dot in it (employees on medewerkers.<hostname>).
                maxLength: 253
                minLength: 1
                pattern: ^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)*$
                type: string
              manifest:
                description: Manifest is the case to run.
                properties:
                  credentialsSecretRef:
                    description: |-
                      CredentialsSecretRef names a Secret with the keys `username` and
                      `token`, for a private repository. The token needs read access only.
                    properties:
                      name:
                        description: Name of the Secret.
                        maxLength: 253
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                  path:
                    default: packages/wetsproces/bron.yaml
                    description: Path of the manifest inside the repository.
                    pattern: ^[^/\s]\S*$
                    type: string
                  ref:
                    default: main
                    description: Ref is the branch or tag.
                    pattern: ^[A-Za-z0-9._/][A-Za-z0-9._/-]*$
                    type: string
                  repoUrl:
                    description: RepoURL is the HTTPS URL of the git repository, without
                      credentials.
                    pattern: ^https://[^@/\s]+/\S+$
                    type: string
                required:
                - repoUrl
                type: object
              theme:
                description: Theme is how the screens look.
                properties:
                  accentColor:
                    description: |-
                      AccentColor is a theme of the NLDD design system. Empty keeps its own
                      accent.
                    enum:
                    - ""
                    - bruin
                    - donkerblauw
                    - donkerbruin
                    - donkergeel
                    - donkergroen
                    - geel
                    - groen
                    - hemelblauw
                    - lichtblauw
                    - mintgroen
                    - mosgroen
                    - oranje
                    - paars
                    - robijnrood
                    - rood
                    - roze
                    - violet
                    type: string
                type: object
              version:
                description: |-
                  Version is the regelrecht commit whose wetsproces image runs, the full
                  40-character hash. Empty follows the latest build of main.
                pattern: ^([0-9a-f]{40})?$
                type: string
            required:
            - hostname
            - manifest
            type: object
          status:
            description: WetsprocesStatus is what the plugin last saw.
            properties:
              backofficeUrl:
                description: BackofficeURL is where employees do.
                type: string
              conditions:
                description: Conditions are Ready and ReleaseReady.
                items:
