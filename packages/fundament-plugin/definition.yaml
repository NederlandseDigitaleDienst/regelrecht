---
apiVersion: fundament.io/v1
kind: PluginDefinition
metadata:
  name: wetsproces
  displayName: RegelHet
  version: v0.6.0
  description: >-
    Offers the regelrecht wetsprocessysteem to the projects of a cluster.
    Installed once per cluster; project members then create a wetsproces per
    case from the console, each on its own address with its own database, and
    an organisatie that puts several of them behind one front.
  author: regelrecht
  license: EUPL-1.2
  icon: document
  urls:
    homepage: https://code.digitaledienst.overheid.nl/regelrecht/fieldlab-2026
    repository: https://code.digitaledienst.overheid.nl/regelrecht/fieldlab-2026
    documentation: https://code.digitaledienst.overheid.nl/regelrecht/fieldlab-2026/src/branch/main/packages/fundament-plugin/README.md
  tags:
    - regelrecht
    - wetsproces
    - flux
# There is deliberately no spec.image here. Publishing injects the pushed
# image's digest, so the stored definition always pins immutable code.
spec:
  # Defaults only: each wetsproces has its case, version, colour and address in
  # its own Wetsproces object. The Keycloak URL of stable mode joins these once
  # the chart supports stable mode.
  configSchema:
    - name: DOMAIN
      displayName: Base domain
      type: string
      required: true
      description: >-
        A wetsproces with hostname x is served on x.<domain> for citizens and
        x-medewerkers.<domain> for employees, e.g. cluster-a.fieldlab2026.nl,
        whose wildcard record points at the cluster's shared Gateway.
    - name: DEFAULT_IMAGE
      displayName: Image repository
      type: string
      default: code.digitaledienst.overheid.nl/regelrecht/wetsproces
      advanced: true
      description: >-
        Repository of the wetsproces image, without a tag. A wetsproces with a
        version runs <repository>:<version>; one without runs the build of
        main that the chart names.
    - name: CHART_REF
      displayName: Chart branch or tag
      type: string
      default: main
      advanced: true
      description: Branch or tag of the regelrecht repository that the Helm chart is read from.
    - name: ACME
      displayName: Let's Encrypt environment
      type: enum
      default: production
      values:
        - staging
        - production
      advanced: true
      description: Use staging until the routes work; production has a weekly rate limit.

  permissions:
    rbac:
      # Install time: the plugin's own CRDs. get for the establishment wait;
      # patch for the server-side apply. create cannot be kept to one name.
      - apiGroups: [apiextensions.k8s.io]
        resources: [customresourcedefinitions]
        verbs: [create]
      - apiGroups: [apiextensions.k8s.io]
        resources: [customresourcedefinitions]
        resourceNames:
          - wetsprocessen.wetsproces.regelrecht.nl
          - organisaties.wetsproces.regelrecht.nl
          # The check that Flux is there.
          - gitrepositories.source.toolkit.fluxcd.io
          - helmreleases.helm.toolkit.fluxcd.io
        verbs: [get, patch]
      # The roles that let project admins and viewers use wetsprocessen and
      # organisaties (setup.go). They grant nothing the plugin does not hold itself.
      - apiGroups: [rbac.authorization.k8s.io]
        resources: [clusterroles]
        verbs: [create]
      - apiGroups: [rbac.authorization.k8s.io]
        resources: [clusterroles]
        resourceNames: [fundament-wetsproces-admin, fundament-wetsproces-view]
        verbs: [get, update, patch, delete]
      # The controller and the console pages: the pages act with the rights
      # the user and the plugin share, so the plugin holds what the wizard and
      # the detail page do (create, delete).
      # An organisatie is one front for several wetsprocessen, with the same
      # rights as a wetsproces.
      - apiGroups: [wetsproces.regelrecht.nl]
        resources: [wetsprocessen, organisaties]
        verbs: [get, list, watch, create, update, patch, delete]
      - apiGroups: [wetsproces.regelrecht.nl]
        resources: [wetsprocessen/status, organisaties/status]
        verbs: [get, update, patch]
      # Owner references with blockOwnerDeletion need update on finalizers.
      - apiGroups: [wetsproces.regelrecht.nl]
        resources: [wetsprocessen/finalizers, organisaties/finalizers]
        verbs: [update]
      # Namespaces, get only: a wetsproces may join an organisatie in another
      # namespace only when both namespaces carry the same
      # fundament.io/project-id label, so no project puts a wetsproces behind
      # the front of another (organisatie.go, sameProject). Without list or
      # watch the plugin reads only the two namespaces it names; the names
      # are not known in advance, so resourceNames cannot narrow this.
      - apiGroups: ['']
        resources: [namespaces]
        verbs: [get]
      # Flux, which the cluster already runs, does the rest: helm-controller
      # installs the chart with its own service account.
      - apiGroups: [source.toolkit.fluxcd.io]
        resources: [gitrepositories]
        verbs: [get, list, watch, create, patch, update, delete]
      - apiGroups: [helm.toolkit.fluxcd.io]
        resources: [helmreleases]
        verbs: [get, list, watch, create, patch, update, delete]
      # The pods of each release, read only: a container that keeps failing
      # turns the Wetsproces Failed with its reason, long before Helm's
      # install timeout.
      - apiGroups: ['']
        resources: [pods]
        verbs: [get, list, watch]
      # Secrets, without list or watch, so the plugin can see no Secret it
      # does not name. create: the wizard makes the Secret with the token of
      # a private case repository. get and delete: after a Wetsproces is
      # deleted, the plugin reads <name>-keycloak, the Secret the chart's Job
      # generated for its Keycloak, and deletes it when it carries the
      # chart's labels for that release (controller.go,
      # deleteKeycloakSecret). The same for <name>-organisatie, the signing
      # key of the front of a deleted Organisatie (organisatie.go). After a
      # snapshot of the case it reads the token Secret of
      # credentialsSecretRef, and deletes it when it is annotated
      # wetsproces.regelrecht.nl/delete-after-snapshot: "true" (snapshot.go,
      # deleteToken). The names are not known in advance, so resourceNames
      # cannot narrow this, and Fundament grants a ClusterRole.
      # The console pages only create; they never read a Secret.
      - apiGroups: ['']
        resources: [secrets]
        verbs: [create, get, delete]
      # The snapshot of the case (snapshot.go): a Job per Wetsproces and
      # manifest clones the case repository once, with the token, and writes
      # a tar.gz of the files the manifest names to its log. The plugin
      # watches its own Jobs by label, reads that log (pods/log), stores the
      # tar.gz in ConfigMaps the chart unpacks, and deletes the Job and the
      # ConfigMaps of an older snapshot. ConfigMaps are listed by label past
      # the cache, so no watch on them; the pods of the release then need no
      # Secret and no network to git.
      - apiGroups: [batch]
        resources: [jobs]
        verbs: [create, get, list, watch, delete]
      - apiGroups: ['']
        resources: [configmaps]
        verbs: [create, get, list, delete]
      - apiGroups: ['']
        resources: [pods/log]
        verbs: [get]
  crds:
    - wetsprocessen.wetsproces.regelrecht.nl
    - organisaties.wetsproces.regelrecht.nl

  menu:
    project:
      - crd: wetsprocessen.wetsproces.regelrecht.nl
        list: true
        detail: true
        icon: document
        label: Procedures
        singularLabel: Procedure
      - crd: organisaties.wetsproces.regelrecht.nl
        list: true
        detail: true
        icon: building
        label: Organisaties
        singularLabel: Organisatie

  customComponents:
    Wetsproces:
      list: wetsprocessen-list.html
      detail: wetsprocessen-detail.html
      create: wetsprocessen-create.html
    Organisatie:
      list: organisaties-list.html
      detail: organisaties-detail.html
      create: organisaties-create.html

  allowedResources:
    - group: wetsproces.regelrecht.nl
      version: v1alpha1
      resource: wetsprocessen
      verbs: [list, get, create, delete]
    - group: wetsproces.regelrecht.nl
      version: v1alpha1
      resource: organisaties
      verbs: [list, get, create, delete]
    - group: ''
      version: v1
      resource: secrets
      verbs: [create]

  uiHints:
    wetsprocessen.wetsproces.regelrecht.nl:
      statusMapping:
        jsonPath: .status.phase
        values:
          Ready:
            badge: success
            label: Draait
          Failed:
            badge: danger
            label: Mislukt
        default:
          badge: warning
          label: Bezig
    organisaties.wetsproces.regelrecht.nl:
      statusMapping:
        jsonPath: .status.phase
        values:
          Ready:
            badge: success
            label: Draait
          Failed:
            badge: danger
            label: Mislukt
        default:
          badge: warning
          label: Bezig
