---
apiVersion: fundament.io/v1
kind: PluginDefinition
metadata:
  name: regelhet
  displayName: RegelHet
  version: v0.2.0
  description: >-
    Offers the regelrecht RegelHet to the projects of a cluster.
    Installed once per cluster; project members then create a regelhet per
    case from the console, each on its own address with its own database.
  author: regelrecht
  license: EUPL-1.2
  icon: document
  urls:
    homepage: https://code.digitaledienst.overheid.nl/regelrecht/fieldlab-2026
    repository: https://code.digitaledienst.overheid.nl/regelrecht/fieldlab-2026
    documentation: https://code.digitaledienst.overheid.nl/regelrecht/fieldlab-2026/src/branch/main/packages/fundament-plugin/README.md
  tags:
    - regelrecht
    - regelhet
    - flux
# There is deliberately no spec.image here. Publishing injects the pushed
# image's digest, so the stored definition always pins immutable code.
spec:
  # Defaults only: each RegelHet has its case, version, colour and address in
  # its own RegelHet object. The Keycloak URL of stable mode joins these once
  # the chart supports stable mode.
  configSchema:
    - name: DOMAIN
      displayName: Base domain
      type: string
      required: true
      description: >-
        A regelhet with hostname x is served on x.<domain> for citizens and
        x-medewerkers.<domain> for employees, e.g. cluster-a.fieldlab2026.nl,
        whose wildcard record points at the cluster's shared Gateway.
    - name: DEFAULT_IMAGE
      displayName: Image repository
      type: string
      default: code.digitaledienst.overheid.nl/regelrecht/regelhet
      advanced: true
      description: >-
        Repository of the regelhet image, without a tag. A regelhet with a
        version runs <repository>:<version>; one without runs the build of
        main that the chart names.
    - name: CHART_REF
      displayName: Chart branch or tag
      type: string
      default: main
      advanced: true
      description: Branch or tag of the regelrecht repository that the Helm chart is read from.
    - name: ACME
      displayName: Let's Encrypt environment
      type: enum
      default: production
      values:
        - staging
        - production
      advanced: true
      description: Use staging until the routes work; production has a weekly rate limit.

  permissions:
    rbac:
      # Install time: the plugin's own CRD. get for the establishment wait;
      # patch for the server-side apply. create cannot be kept to one name.
      - apiGroups: [apiextensions.k8s.io]
        resources: [customresourcedefinitions]
        verbs: [create]
      - apiGroups: [apiextensions.k8s.io]
        resources: [customresourcedefinitions]
        resourceNames:
          - regelhets.regelhet.regelrecht.nl
          # The check that Flux is there.
          - gitrepositories.source.toolkit.fluxcd.io
          - helmreleases.helm.toolkit.fluxcd.io
        verbs: [get, patch]
      # The roles that let project admins and viewers use RegelHet instances
      # (setup.go). They grant nothing the plugin does not hold itself.
      - apiGroups: [rbac.authorization.k8s.io]
        resources: [clusterroles]
        verbs: [create]
      - apiGroups: [rbac.authorization.k8s.io]
        resources: [clusterroles]
        resourceNames: [fundament-regelhet-admin, fundament-regelhet-view]
        verbs: [get, update, patch, delete]
      # The controller and the console pages: the pages act with the rights
      # the user and the plugin share, so the plugin holds what the wizard and
      # the detail page do (create, delete).
      - apiGroups: [regelhet.regelrecht.nl]
        resources: [regelhets]
        verbs: [get, list, watch, create, update, patch, delete]
      - apiGroups: [regelhet.regelrecht.nl]
        resources: [regelhets/status]
        verbs: [get, update, patch]
      # Owner references with blockOwnerDeletion need update on finalizers.
      - apiGroups: [regelhet.regelrecht.nl]
        resources: [regelhets/finalizers]
        verbs: [update]
      # Flux, which the cluster already runs, does the rest: helm-controller
      # installs the chart with its own service account.
      - apiGroups: [source.toolkit.fluxcd.io]
        resources: [gitrepositories]
        verbs: [get, list, watch, create, patch, update, delete]
      - apiGroups: [helm.toolkit.fluxcd.io]
        resources: [helmreleases]
        verbs: [get, list, watch, create, patch, update, delete]
      # The wizard makes the Secret with the token of a private case
      # repository. Create only: neither the plugin nor its pages read one.
      - apiGroups: ['']
        resources: [secrets]
        verbs: [create]
  crds:
    - regelhets.regelhet.regelrecht.nl

  menu:
    project:
      - crd: regelhets.regelhet.regelrecht.nl
        list: true
        detail: true
        icon: document
        label: RegelHet
        singularLabel: RegelHet

  customComponents:
    RegelHet:
      list: regelhets-list.html
      detail: regelhets-detail.html
      create: regelhets-create.html

  allowedResources:
    - group: regelhet.regelrecht.nl
      version: v1alpha1
      resource: regelhets
      verbs: [list, get, create, delete]
    - group: ''
      version: v1
      resource: secrets
      verbs: [create]

  uiHints:
    regelhets.regelhet.regelrecht.nl:
      statusMapping:
        jsonPath: .status.phase
        values:
          Ready:
            badge: success
            label: Draait
          Failed:
            badge: danger
            label: Mislukt
        default:
          badge: warning
          label: Bezig
