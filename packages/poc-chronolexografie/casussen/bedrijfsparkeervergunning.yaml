---
# Casus: de bedrijfsparkeervergunning bij een fictieve gemeente.
#
# Configuratie is alleen wat niet uit de wet volgt, en het corpus: welke
# regelwerken in deze casus gelden. De regelwerken die de cel daarvan draait,
# het artikel van het bezwaar en de naam van wie beslist, leidt de app af uit
# dit artikel en de cel, binnen dat corpus (src/casus.rs).
cel: gemeente_wilgendaal
artikel: fictieve_parkeerverordening_gemeente_wilgendaal#2
# Het corpus van deze casus: alleen deze regelwerken gelden, elk een map
# onder corpus/. De reducties van de cellen van de casus komen met die
# cellen mee.
corpus:
  - regulation/nl/gemeentelijke_verordening/wilgendaal/fictieve_parkeerverordening_gemeente_wilgendaal
  - regulation/nl/wet/algemene_wet_bestuursrecht
  - regulation/nl/amvb/besluit_administratieve_bepalingen_inzake_het_wegverkeer_babw
  - regulation/nl/ministeriele_regeling/regeling_gehandicaptenparkeerkaart
  - regulation/nl/uitvoeringsbeleid/fictief_beleid_gehandicaptenparkeerkaart_gemeente_wilgendaal
  - regulation/nl/uitvoeringsbeleid/fictief_beleid_handelsregister_kamer_van_koophandel
  - regulation/nl/uitvoeringsbeleid/fictief_uitvoeringsbesluit_parkeren_gemeente_wilgendaal
  - cells/reductions/reductie_algemene_wet_bestuursrecht
# De uitvoer die zegt of het besluit het gevraagde toewijst. De verordening
# merkt die niet aan: decision_type TOEKENNING zegt wat voor besluit het is,
# niet welke van zijn uitvoer de toewijzing is.
uitkomst: bedrijfsparkeervergunning_verleend

# Wat de bezoeker leest.
titel: Bedrijfsparkeervergunning
omschrijving: >-
  Een bedrijf vraagt de gemeente om een bedrijfsparkeervergunning, onder een
  fictieve parkeerverordening naar het model van Delft. Het college verleent
  haar aan een bedrijf dat in een vergunninggebied is gevestigd, tot een
  maximum per bedrijf. Waar het bedrijf is gevestigd en hoeveel mensen er
  werken, vraagt de gemeente aan de Kamer van Koophandel, die antwoordt uit
  haar eigen kroniek van het handelsregister. Hoeveel geldige vergunningen
  het bedrijf al heeft, leest de gemeente uit haar eigen besluiten, met wat
  de Awb zegt over herroepen besluiten.
cel_naam: gemeente Wilgendaal
speeldatum: 2026-10-13

# Fictieve voorbeeldgegevens. Volg je een scenario, dan begint elk formulier
# hiermee, met de waarden van de stap erover; bij vrij spelen blijft het leeg.
# Het KvK-nummer is dat van een verzonnen bakkerij in de binnenstad; de
# KvK-nummers en het kenteken zijn verzonnen. Een bevinding vraagt het
# formulier alleen bij een bedrijf op het maximum: het oordeel over de
# hardheidsclausule. De rest geven de Kamer van Koophandel en de cel van de
# gemeente.
voorbeeld:
  aanvraag:
    kvk_nummer: '99990011'
    kenteken: ZZ-001-Z
    aanvraag_ondertekend: true
    naam_aanvrager: Bakkerij De Wilg
    adres_aanvrager: Kerkstraat 1, 7711 AB Wilgendaal
    dagtekening: '2026-10-05'
    gevraagde_beschikking: bedrijfsparkeervergunning
  bezwaar:
    bezwaar_of_beroepschrift_ondertekend: true
    naam_indiener: Fietsenmakerij Kade
    adres_indiener: Kade 3, 7713 AA Wilgendaal
    omschrijving_bestreden_besluit: weigering van een bedrijfsparkeervergunning
    gronden_bezwaar_of_beroep: er werken nu twee mensen in het bedrijf
  # Het beroepschrift (Awb 6:5): dezelfde velden als het bezwaarschrift.
  beroep:
    bezwaar_of_beroepschrift_ondertekend: true
    naam_indiener: Fietsenmakerij Kade
    adres_indiener: Kade 3, 7713 AA Wilgendaal
    omschrijving_bestreden_besluit: beslissing op bezwaar over de bedrijfsparkeervergunning
    gronden_bezwaar_of_beroep: het maximum hoort het aantal werknemers te volgen
  # Wat de rechter vindt (Awb 8:70): de gemeente schond geen rechtsregel.
  uitspraak:
    indiener_is_belanghebbende: true
    rechtsregel_geschonden: false

# De andere cellen van de sfeer (RFC-052). Het open begrip zegt wie bevoegd
# is: de Kamer van Koophandel voor wat het handelsregister vermeldt (artikel 2
# en 3 van het fictieve uitvoeringsbesluit parkeren van Wilgendaal). Elke cel
# legt bij elke start en reset opnieuw vast wat zij vóór het eerste scenario
# wist, via de cel zoals elke stap.
#
# - De Kamer schreef vier verzonnen bedrijven in, elk met een vestiging: een
#   bakkerij in de binnenstad (vier werkzame personen), een fietsenmakerij in
#   de schil (één werkzame persoon), een thuiszorgbedrijf in de binnenstad
#   (twaalf werkzame personen) en een adviesbureau buiten de
#   vergunninggebieden. Executogrammen van het feit dat artikel 1 van het
#   fictieve beleid van de Kamer vereist; dat artikel zegt ook wat het bevat.
#   Elk draagt de dag waarop de Kamer de gegevens opnam.
# - De gemeente zelf kent nog geen vergunning. Haar eigen cel begint vóór de
#   andere cellen, dus een vergunning die ze al verleende, kan dit bestand
#   niet geven: het besluit zou de Kamer vragen voordat die iets weet. Een
#   eerdere vergunning ontstaat daarom in het scenario zelf.
andere_cellen:
  - cel: kamer_van_koophandel
    cel_naam: Kamer van Koophandel
    begin:
      datum: 2026-03-02
      executogrammen:
        - feit: fictief_beleid_handelsregister_kamer_van_koophandel#1#vestiging_ingeschreven
          datum: 2026-01-05
          velden:
            kvk_nummer: '99990011'
            postcode: 7711 AB
            aantal_werkzame_personen: 4
            datum_inschrijving: '2026-01-05'
        - feit: fictief_beleid_handelsregister_kamer_van_koophandel#1#vestiging_ingeschreven
          datum: 2026-02-02
          velden:
            kvk_nummer: '99990022'
            postcode: 7713 AA
            aantal_werkzame_personen: 1
            datum_inschrijving: '2026-02-02'
        - feit: fictief_beleid_handelsregister_kamer_van_koophandel#1#vestiging_ingeschreven
          datum: 2026-02-16
          velden:
            kvk_nummer: '99990044'
            postcode: 7711 AA
            aantal_werkzame_personen: 12
            datum_inschrijving: '2026-02-16'
        - feit: fictief_beleid_handelsregister_kamer_van_koophandel#1#vestiging_ingeschreven
          datum: 2026-03-02
          velden:
            kvk_nummer: '99990033'
            postcode: 7720 BC
            aantal_werkzame_personen: 3
            datum_inschrijving: '2026-03-02'
  # De bestuursrechter (RFC-053): ook een andere cel, met een eigen kroniek.
  - cel: rechtbank_wilgendaal
    cel_naam: Rechtbank Wilgendaal

# The scenarios, step by step. Each step says what the visitor does
# (`stap`), on which play date, with which values (`invoer`, over the
# example values above) and what it comes to (`uitkomst`), with the text of
# the guide (`tekst`, `gezien`). The guide beside the page and the forms read
# them from here (frontend/src/scenarioGuides.js, scenarioInvoer.js), and
# tests/scenarios.rs plays every scenario with exactly these values.
scenarios:
  - naam: Een bedrijf in de binnenstad krijgt een vergunning
    samenvatting: >-
      Een bakkerij in de binnenstad vraagt een vergunning, en het college
      verleent haar.
    stappen:
      - stap: aanvraag
        tekst: >-
          Klik op Aanvraag indienen. Het kvk nummer in het voorbeeld is van
          een bakkerij in de binnenstad.
        gezien: >-
          De aanvraag staat onder Mijn aanvragen op In behandeling. De
          beslistermijn is vier weken (artikel 4 van de fictieve verordening),
          niet de acht weken van Awb 4:13.
      - stap: besluit
        datum: 2026-10-20
        uitkomst: toegewezen
        tekst: >-
          Het formulier vraagt niets: de Kamer van Koophandel en de eigen
          kroniek van de gemeente geven wat de regels vragen. Klik op Besluit
          nemen.
    eind: >-
      Onder Besluiten staat Toegewezen: de vergunning is verleend, geldig tot
      en met 19 oktober 2027, een jaar vanaf de dag van het besluit (artikel 3
      van de fictieve verordening). Bij het besluit staat "postcode vestiging
      volgens handelsregister: 7711 AB", en in het Logboek dat de Kamer van
      Koophandel dat antwoordde: de gemeente vroeg het aan de cel die het
      uitvoeringsbesluit daarvoor bevoegd maakt. Bij het besluit staat ook
      "aantal geldige bedrijfsparkeervergunningen: 0", uit de eigen kroniek
      van de gemeente. De inschrijving staat in de kroniek van de Kamer, onder
      Andere cellen.
  - naam: Het maximum in de schil, en een vergunning na bezwaar
    samenvatting: >-
      In de schil krijgt een bedrijf zoveel vergunningen als er mensen werken,
      en na een nieuwe inschrijving telt de vergunning uit het bezwaar bij de
      volgende aanvraag.
    stappen:
      - stap: aanvraag
        invoer:
          kvk_nummer: '99990022'
        tekst: >-
          Klik op Aanvraag indienen. In deze fietsenmakerij in de schil werkt
          volgens het handelsregister één persoon.
      - stap: besluit
        datum: 2026-10-20
        uitkomst: toegewezen
        tekst: >-
          Klik op Besluit nemen.
        gezien: >-
          De vergunning is verleend, geldig tot en met 19 oktober 2027.
      - stap: aanvraag
        datum: 2026-10-21
        invoer:
          kvk_nummer: '99990022'
          kenteken: ZZ-002-Z
      - stap: besluit
        datum: 2026-10-22
        invoer:
          toepassing_leidt_tot_onaanvaardbare_gevolgen: false
        uitkomst: afgewezen
        tekst: >-
          Het bedrijf zit op het maximum, dus het formulier vraagt het oordeel
          van het college over de hardheidsclausule (artikel 6 van de fictieve
          verordening). Klik bij de tweede aanvraag op Besluit nemen.
        gezien: >-
          Afgewezen: het bedrijf heeft al één geldige vergunning, en er werkt
          één persoon. Bij het besluit staat "aantal werkzame personen volgens
          handelsregister: 1".
      - stap: bezwaar
        datum: 2026-11-01
        op: 2
        tekst: >-
          Zoek de tweede aanvraag. Klik bij haar besluit op Bezwaar maken en
          dan op Bezwaar indienen.
      - stap: vastleggen
        titel: Nieuwe inschrijving bij de Kamer van Koophandel
        datum: 2026-11-10
        cel: kamer_van_koophandel
        feit: fictief_beleid_handelsregister_kamer_van_koophandel#1#vestiging_ingeschreven
        invoer:
          kvk_nummer: '99990022'
          postcode: 7713 AA
          aantal_werkzame_personen: 2
          datum_inschrijving: '2026-11-10'
        tekst: >-
          De fietsenmakerij heeft iemand aangenomen. Klik bij Kamer van
          Koophandel onder "Vastleggen: Vestiging ingeschreven" op Vastleggen.
        gezien: >-
          De nieuwe inschrijving staat in de kroniek van de Kamer, naast de
          oude; de gemeente leest haar bij de heroverweging.
      - stap: beslissing_op_bezwaar
        datum: 2026-11-20
        uitkomst: gegrond
        tekst: >-
          Klik onder Open bezwaren op Ontvankelijkheid toetsen en dan op
          Beslissen op bezwaar.
        gezien: >-
          Gegrond: de weigering is herroepen (Awb 7:11, tweede lid), en een
          nieuw besluit verleent de vergunning. Onder Kroniek staan nu drie
          besluiten onder artikel 2 van de verordening; niets is overschreven.
      - stap: aanvraag
        titel: Een derde aanvraag indienen
        datum: 2026-12-01
        invoer:
          kvk_nummer: '99990022'
          kenteken: ZZ-003-Z
        gezien: >-
          De derde aanvraag staat onder Mijn aanvragen op In behandeling.
      - stap: besluit
        titel: Besluiten op de derde aanvraag
        invoer:
          toepassing_leidt_tot_onaanvaardbare_gevolgen: false
        uitkomst: afgewezen
        tekst: >-
          Het bedrijf zit op het maximum, dus het formulier vraagt het oordeel
          van het college over de hardheidsclausule (artikel 6 van de fictieve
          verordening). Klik op Besluit nemen. Open daarna bij het besluit
          "Hoe de cel dit beantwoordde".
    eind: >-
      Afgewezen: het bedrijf heeft twee geldige vergunningen, en er werken
      twee mensen. Bij het besluit staat "aantal geldige
      bedrijfsparkeervergunningen: 2". Onder "Hoe de cel dit beantwoordde"
      staat wat de reductie van de Awb gaf. Bij "herroepen besluiten" staat de
      weigering (Awb 7:11, tweede lid). Bij "geldende besluiten" staan de
      eerste vergunning en het nieuwe besluit uit de beslissing op bezwaar;
      die twee telde de reductie van de gemeente. Zelf kent die reductie geen
      bezwaar: ze leest alleen de geldende besluiten.
  - naam: Buiten het gebied, en na de verhuizing erin
    samenvatting: >-
      Een bedrijf buiten de vergunninggebieden krijgt geen vergunning, en na
      zijn verhuizing naar de binnenstad wel.
    stappen:
      - stap: aanvraag
        invoer:
          kvk_nummer: '99990033'
        tekst: >-
          Klik op Aanvraag indienen. Volgens het handelsregister ligt de
          vestiging van dit adviesbureau op postcode 7720 BC, in geen van de
          vergunninggebieden.
      - stap: besluit
        datum: 2026-10-20
        uitkomst: afgewezen
        tekst: >-
          Klik op Besluit nemen.
        gezien: >-
          Afgewezen: uit het handelsregister blijkt niet dat het bedrijf in
          een vergunninggebied is gevestigd. Bij het besluit staat "postcode
          vestiging volgens handelsregister: 7720 BC".
      - stap: vastleggen
        titel: Nieuwe inschrijving bij de Kamer van Koophandel
        datum: 2026-11-01
        cel: kamer_van_koophandel
        feit: fictief_beleid_handelsregister_kamer_van_koophandel#1#vestiging_ingeschreven
        invoer:
          kvk_nummer: '99990033'
          postcode: 7711 AC
          aantal_werkzame_personen: 3
          datum_inschrijving: '2026-11-01'
        tekst: >-
          Het adviesbureau verhuist naar de binnenstad. Klik bij Kamer van
          Koophandel onder "Vastleggen: Vestiging ingeschreven" op Vastleggen.
        gezien: >-
          De nieuwe inschrijving staat in de kroniek van de Kamer; de oude
          staat er nog.
      - stap: aanvraag
        datum: 2026-11-02
        invoer:
          kvk_nummer: '99990033'
      - stap: besluit
        uitkomst: toegewezen
        tekst: >-
          Klik bij de tweede aanvraag op Besluit nemen.
    eind: >-
      Toegewezen. Bij het eerste besluit antwoordde de Kamer met de postcode
      die op 20 oktober gold, bij het tweede met de inschrijving van 1
      november: zij leest de inschrijving die op de dag van het besluit geldt.
      De oude inschrijving blijft in haar kroniek staan; niets is
      overschreven. Het eerste besluit blijft een weigering: een nieuwe
      inschrijving verandert geen besluit dat al genomen is.
  - naam: Het maximum in de binnenstad, en de hardheidsclausule na bezwaar
    samenvatting: >-
      Een thuiszorgbedrijf in de binnenstad zit op het maximum, en na bezwaar
      past het college de hardheidsclausule toe: een oordeel van een mens, dat
      het nieuwe besluit vastlegt.
    stappen:
      - stap: aanvraag
        invoer:
          kvk_nummer: '99990044'
        tekst: >-
          Klik op Aanvraag indienen. Dit thuiszorgbedrijf in de binnenstad
          rijdt met zijn wijkverpleging naar cliënten.
      - stap: besluit
        datum: 2026-10-20
        uitkomst: toegewezen
        tekst: >-
          Klik op Besluit nemen.
        gezien: >-
          De vergunning is verleend. Het formulier vroeg geen oordeel: het
          bedrijf had nog geen vergunning.
      - stap: aanvraag
        datum: 2026-10-21
        invoer:
          kvk_nummer: '99990044'
          kenteken: ZZ-002-Z
      - stap: besluit
        datum: 2026-10-22
        uitkomst: toegewezen
        tekst: >-
          Klik bij de tweede aanvraag op Besluit nemen.
        gezien: >-
          Ook deze vergunning is verleend. Bij een bedrijf onder het maximum
          vraagt het formulier niets over de hardheidsclausule: de regel komt
          daar niet aan toe.
      - stap: aanvraag
        titel: Een derde aanvraag indienen
        datum: 2026-10-23
        invoer:
          kvk_nummer: '99990044'
          kenteken: ZZ-003-Z
        gezien: >-
          De derde aanvraag staat onder Mijn aanvragen op In behandeling.
      - stap: besluit
        titel: Besluiten op de derde aanvraag
        datum: 2026-10-27
        invoer:
          toepassing_leidt_tot_onaanvaardbare_gevolgen: false
        uitkomst: afgewezen
        tekst: >-
          Het bedrijf heeft twee geldige vergunningen, het maximum in de
          binnenstad. Nu vraagt het formulier het oordeel van het college over
          de hardheidsclausule (artikel 6 van de fictieve verordening). De
          engine kan dat oordeel niet uitrekenen, en het bedrijf heeft nog
          geen bijzondere omstandigheden aangevoerd. Klik op Besluit nemen.
        gezien: >-
          Afgewezen. Bij het besluit staat "toepassing leidt tot
          onaanvaardbare gevolgen": Nee. Dat oordeel staat als gegeven bij het
          besluit in de kroniek, naast wat de Kamer van Koophandel en de eigen
          kroniek antwoordden.
      - stap: bezwaar
        datum: 2026-11-01
        invoer:
          gronden_bezwaar_of_beroep: de wijkverpleging rijdt dagelijks met drie auto's naar cliënten
        tekst: >-
          Zoek de derde aanvraag en klik bij haar besluit op Bezwaar maken en
          dan op Bezwaar indienen.
      - stap: beslissing_op_bezwaar
        datum: 2026-11-20
        invoer:
          toepassing_leidt_tot_onaanvaardbare_gevolgen: true
        uitkomst: gegrond
        tekst: >-
          Klik onder Open bezwaren op Ontvankelijkheid toetsen. Het college
          oordeelde eerder Nee. Bij de heroverweging (Awb 7:11) weegt het
          college opnieuw af, met de gronden van het bezwaar. Klik op
          Beslissen op bezwaar.
        gezien: >-
          Gegrond: de weigering is herroepen (Awb 7:11, tweede lid), en een
          nieuw besluit verleent de vergunning. De feiten zijn dezelfde als
          bij de weigering. Het nieuwe besluit rust op het oordeel van het
          college, en legt dat vast.
      - stap: aanvraag
        titel: Een vierde aanvraag indienen
        datum: 2026-12-01
        invoer:
          kvk_nummer: '99990044'
          kenteken: ZZ-004-Z
        gezien: >-
          De vierde aanvraag staat onder Mijn aanvragen op In behandeling.
      - stap: besluit
        titel: Besluiten op de vierde aanvraag
        invoer:
          toepassing_leidt_tot_onaanvaardbare_gevolgen: false
        uitkomst: afgewezen
        tekst: >-
          Het formulier vraagt het oordeel opnieuw, want het geldt per geval.
          Klik op Besluit nemen. Open daarna bij het besluit "Hoe de cel dit
          beantwoordde".
    eind: >-
      Afgewezen, en bij het besluit staat "aantal geldige
      bedrijfsparkeervergunningen: 3": de twee eerste vergunningen en het
      nieuwe besluit uit de beslissing op bezwaar. Onder "Hoe de cel dit
      beantwoordde" staat de weigering bij "herroepen besluiten" (Awb 7:11,
      tweede lid). De feiten zijn niet veranderd; het nieuwe besluit rust op
      het oordeel van het college, en dat staat als gegeven bij het besluit in
      de kroniek. Een volgende aanvraag vraagt dat oordeel opnieuw: het geldt
      per geval.
