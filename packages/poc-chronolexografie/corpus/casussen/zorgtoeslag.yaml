---
# Casus: het voorschot op de zorgtoeslag bij de Dienst Toeslagen.
#
# Configuratie is alleen wat niet uit de wet volgt, en het corpus: welke
# regelwerken in deze casus gelden. Het besluit dat de aanvraag vraagt, het
# artikel van het bezwaar en de naam van wie beslist, leidt de app af uit dit
# artikel en de cel, binnen dat corpus (src/casus.rs).
cel: dienst_toeslagen
artikel: algemene_wet_inkomensafhankelijke_regelingen#15
# Het corpus van deze casus: alleen deze regelwerken gelden. Hieronder de
# gedeelde, elk een map onder het corpus van de poc; de eigen regelwerken van
# de casus, in casussen/zorgtoeslag/regulation/nl, gelden zonder dat ze hier
# staan: de Wet op de zorgtoeslag, de regeling standaardpremie en het
# uitvoeringsbeleid van de Dienst Toeslagen. De Zorgverzekeringswet, de
# Algemene wet inzake rijksbelastingen en de Wet inkomstenbelasting 2001
# staan erbij omdat de Wet op de zorgtoeslag en de Awir eruit lezen.
corpus:
  - regulation/nl/wet/algemene_wet_bestuursrecht
  - regulation/nl/wet/algemene_wet_inkomensafhankelijke_regelingen
  - regulation/nl/wet/algemene_wet_inzake_rijksbelastingen
  - regulation/nl/wet/wet_inkomstenbelasting_2001
  - regulation/nl/wet/zorgverzekeringswet
  - cells/reductions/reductie_algemene_wet_bestuursrecht
# De uitvoer die zegt of het besluit het gevraagde toewijst. De wet merkt die
# niet aan: decision_type TOEKENNING zegt wat voor besluit het is, niet welke
# van zijn uitvoer de toewijzing is.
uitkomst: tegemoetkoming_toegekend
uitkomst_per_besluit:
  algemene_wet_inkomensafhankelijke_regelingen#16: voorschot_verleend

# Een verzekerde vraagt zorgtoeslag aan over 2025 (Awir artikel 15). De
# aanvraag noemt het artikel dat de aanspraak geeft, artikel 2 van de Wet op de
# zorgtoeslag. Op die aanvraag verleent de Dienst Toeslagen een voorschot tot
# het bedrag waarop de zorgtoeslag vermoedelijk wordt vastgesteld (Awir artikel
# 16). Wat hij verwacht, zoals het toetsingsinkomen, geeft hij als zijn eigen
# bevindingen, onder de namen die dat artikel vraagt. Het bedrag volgt uit dat
# artikel en de standaardpremie voor 2025. Tegen het voorschot staat bezwaar
# open. De toekenning (Awir artikel 14) staat op dezelfde aanvraag open; zij
# volgt later (Awir artikel 19), en de scenario's spelen haar niet.

# De Dienst betaalt het voorschot in termijnen uit (Awir artikel 22), als de
# tijd verstrijkt: per maand een termijn, op het voorschot dat dan geldt.
# Hoe hoog een termijn is en op welke dag hij komt, zegt het fictieve beleid
# van de Dienst (artikel 2). Een voorschot dat vóór 2025 is verleend, met de
# eerste termijn in december 2024 (artikel 22, eerste lid), speelt deze
# casus niet: het corpus heeft alleen de versies van 2025, en een besluit in
# 2024 vindt geen wet die dan geldt.


# Wat de bezoeker leest.
titel: Voorschot zorgtoeslag
cel_naam: Dienst Toeslagen
speeldatum: 2025-01-06

# Fictieve voorbeeldgegevens. Volg je een scenario, dan begint elk formulier
# hiermee, met de waarden van de stap erover; bij vrij spelen blijft het leeg.
# Een BSN uit de testreeks. De bedragen staan in eurocent, zoals de wet ze
# rekent: 2500000 is € 25.000. Een alleenstaande met dat inkomen krijgt het
# hele verschil tussen de standaardpremie en de normpremie bij het
# drempelinkomen.
voorbeeld:
  aanvraag:
    bsn: '999993653'
    berekeningsjaar: 2025
    # Welke tegemoetkoming de aanvraag vraagt: het artikel dat de aanspraak
    # geeft (Awir artikel 15, tijdelijke keuze).
    gevraagde_tegemoetkoming: wet_op_de_zorgtoeslag#2
    aanvraag_ondertekend: true
    naam_aanvrager: S. de Vries
    adres_aanvrager: Voorbeeldlaan 7, 1234 AB Wilgendaal
    dagtekening: '2025-01-03'
    gevraagde_beschikking: zorgtoeslag over 2025
  bevindingen:
    toetsingsinkomen: 2500000
    heeft_toeslagpartner: false
    toetsingsinkomen_toeslagpartner: 0
    is_verzekerde: true
    vermogen_onder_grens: true
  bezwaar:
    bezwaar_of_beroepschrift_ondertekend: true
    naam_indiener: S. de Vries
    adres_indiener: Voorbeeldlaan 7, 1234 AB Wilgendaal
    omschrijving_bestreden_besluit: voorschot zorgtoeslag over 2025
    gronden_bezwaar_of_beroep: >-
      mijn inkomen daalt in 2025: ik werk vanaf februari vier dagen in plaats
      van vijf

scenarios:
  - naam: Voorschot wordt verleend
    samenvatting: >-
      Een alleenstaande vraagt zorgtoeslag aan, en de Dienst Toeslagen
      verleent een voorschot.
    stappen:
      - stap: aanvraag
        verhaal: Een alleenstaande vraagt zorgtoeslag aan voor 2025.
      - stap: besluit
        artikel: algemene_wet_inkomensafhankelijke_regelingen#16
        tekst: 'Klik onder Open aanvragen op Besluit nemen: Awir artikel 16.'
        verhaal: >-
          De Dienst verwacht een inkomen van € 25.000 en vindt een
          zorgverzekering.
        uitkomst: toegewezen
        uitvoer:
          voorschotbedrag: 157700
    eind: 'Toegewezen: het voorschot is € 1.577 over 2025.'
  - naam: 'Niet verzekerd: geen voorschot'
    samenvatting: >-
      De Dienst verwacht dat de aanvrager geen zorgverzekering heeft, en
      verleent geen voorschot.
    stappen:
      - stap: aanvraag
        verhaal: Een alleenstaande vraagt zorgtoeslag aan voor 2025.
      - stap: besluit
        artikel: algemene_wet_inkomensafhankelijke_regelingen#16
        tekst: 'Klik onder Open aanvragen op Besluit nemen: Awir artikel 16.'
        verhaal: De Dienst vindt geen zorgverzekering voor 2025.
        invoer:
          is_verzekerde: false
        uitkomst: afgewezen
        uitvoer:
          voorschotbedrag: 0
    eind: 'Afgewezen: zonder zorgverzekering is er geen zorgtoeslag.'
  - naam: Inkomen te hoog, bezwaar gegrond
    samenvatting: >-
      Bij het verwachte inkomen is er geen voorschot, maar na het bezwaar
      verwacht de Dienst minder en verleent hij er alsnog een.
    stappen:
      - stap: aanvraag
        verhaal: Een alleenstaande vraagt zorgtoeslag aan voor 2025.
      - stap: besluit
        artikel: algemene_wet_inkomensafhankelijke_regelingen#16
        tekst: 'Klik onder Open aanvragen op Besluit nemen: Awir artikel 16.'
        verhaal: De Dienst verwacht een inkomen van € 45.000.
        invoer:
          toetsingsinkomen: 4500000
        uitkomst: afgewezen
        uitvoer:
          voorschotbedrag: 0
        gezien: 'Afgewezen: bij dit inkomen is de zorgtoeslag nihil.'
      - stap: bezwaar
        verhaal: De aanvrager maakt bezwaar, omdat het inkomen in 2025 daalt.
        datum: 2025-01-20
      - stap: beslissing_op_bezwaar
        verhaal: De Dienst verwacht nu een inkomen van € 30.000.
        datum: 2025-02-03
        invoer:
          toetsingsinkomen: 3000000
        uitkomst: gegrond
        uitvoer:
          voorschotbedrag: 133100
        tekst: >-
          Klik onder Open bezwaren op Ontvankelijkheid toetsen en dan op
          Beslissen op bezwaar.
    eind: 'Gegrond: het nieuwe besluit verleent een voorschot van € 1.331 over 2025.'
  - naam: 'Bezwaar zonder nieuwe feiten: ongegrond'
    samenvatting: >-
      De aanvrager maakt bezwaar tegen een verleend voorschot, maar de Dienst
      verwacht hetzelfde en het voorschot blijft.
    stappen:
      - stap: aanvraag
        verhaal: Een alleenstaande vraagt zorgtoeslag aan voor 2025.
      - stap: besluit
        artikel: algemene_wet_inkomensafhankelijke_regelingen#16
        tekst: 'Klik onder Open aanvragen op Besluit nemen: Awir artikel 16.'
        verhaal: De Dienst beslist op de aanvraag.
        uitkomst: toegewezen
        gezien: 'Toegewezen: het voorschot is € 1.577.'
      - stap: bezwaar
        verhaal: De aanvrager vindt het voorschot te laag en maakt bezwaar.
        datum: 2025-01-20
        invoer:
          gronden_bezwaar_of_beroep: het voorschot is te laag
      - stap: beslissing_op_bezwaar
        verhaal: De Dienst verwacht bij de heroverweging hetzelfde.
        datum: 2025-02-03
        uitkomst: ongegrond
    eind: 'Ongegrond: het voorschot blijft € 1.577.'
  - naam: Termijnen van het voorschot
    samenvatting: >-
      De Dienst Toeslagen verleent in januari een voorschot en betaalt het
      elke maand in een termijn uit.
    stappen:
      - stap: aanvraag
        verhaal: Een alleenstaande vraagt zorgtoeslag aan voor 2025.
      - stap: besluit
        artikel: algemene_wet_inkomensafhankelijke_regelingen#16
        tekst: Klik onder Open aanvragen bij het voorschot op Besluit nemen.
        verhaal: De Dienst verleent een voorschot van € 1.577 over 2025.
        uitkomst: toegewezen
        uitvoer:
          voorschotbedrag: 157700
      - stap: tijd_verstrijkt
        verhaal: Het halfjaar gaat voorbij en de Dienst betaalt elke maand uit.
        datum: 2025-06-30
        uitvoer:
          maand: ['2025-01-01', '2025-02-01', '2025-03-01', '2025-04-01', '2025-05-01', '2025-06-01']
          uitbetaald_bedrag: [14336, 14336, 14336, 14336, 14336, 14336]
    eind: Zes termijnen van € 143,36 uitbetaald, samen € 860,16.
  - naam: Voorschot in de loop van het jaar
    samenvatting: >-
      De aanvraag komt in maart binnen, dus het deel van het voorschot over
      januari tot en met maart gaat in één keer en de rest in termijnen.
    stappen:
      - stap: aanvraag
        verhaal: Een alleenstaande vraagt in maart zorgtoeslag aan voor 2025.
        datum: 2025-03-10
        invoer:
          dagtekening: '2025-03-07'
      - stap: besluit
        artikel: algemene_wet_inkomensafhankelijke_regelingen#16
        tekst: Klik onder Open aanvragen bij het voorschot op Besluit nemen.
        verhaal: De Dienst verleent op 14 maart een voorschot van € 1.577.
        datum: 2025-03-14
        uitkomst: toegewezen
        uitvoer:
          voorschotbedrag: 157700
      - stap: tijd_verstrijkt
        verhaal: Het voorjaar gaat voorbij en de Dienst betaalt elke maand uit.
        datum: 2025-06-30
        uitvoer:
          maand: ['2025-03-01', '2025-04-01', '2025-05-01', '2025-06-01']
          uitbetaald_bedrag: [52566, 13141, 13141, 13142]
        gezien: In maart komt januari tot en met maart in één bedrag mee (Awir 22, vierde lid).
    eind: 'Uitbetaald: € 525,66 in maart, daarna termijnen van € 131,41 en € 131,42.'
  - naam: Voorschot hoger na bezwaar
    samenvatting: >-
      Na een bezwaar verhoogt de Dienst het voorschot, en de termijnen erna
      gaan uit van het nieuwe voorschot.
    stappen:
      - stap: aanvraag
        verhaal: Een alleenstaande vraagt zorgtoeslag aan voor 2025.
      - stap: besluit
        artikel: algemene_wet_inkomensafhankelijke_regelingen#16
        tekst: Klik onder Open aanvragen bij het voorschot op Besluit nemen.
        verhaal: De Dienst verwacht een inkomen van € 30.000.
        invoer:
          toetsingsinkomen: 3000000
        uitkomst: toegewezen
        uitvoer:
          voorschotbedrag: 133100
      - stap: tijd_verstrijkt
        verhaal: Op 20 januari betaalt de Dienst de eerste termijn uit.
        datum: 2025-02-10
        uitvoer:
          uitbetaald_bedrag: [12100]
        gezien: 'Uitbetaald: € 121, een elfde van het voorschot van € 1.331.'
      - stap: bezwaar
        verhaal: De aanvrager maakt bezwaar, omdat het inkomen rond € 25.000 blijft.
        datum: 2025-02-10
        invoer:
          gronden_bezwaar_of_beroep: mijn inkomen blijft in 2025 rond € 25.000
      - stap: tijd_verstrijkt
        verhaal: Het bezwaar schort de betaling niet op.
        datum: 2025-03-13
        uitvoer:
          uitbetaald_bedrag: [12100]
      - stap: beslissing_op_bezwaar
        verhaal: De Dienst verwacht nu een inkomen van € 25.000.
        datum: 2025-03-14
        invoer:
          toetsingsinkomen: 2500000
        uitkomst: gegrond
        uitvoer:
          voorschotbedrag: 157700
        tekst: >-
          Klik onder Open bezwaren op Ontvankelijkheid toetsen en dan op
          Beslissen op bezwaar.
      - stap: tijd_verstrijkt
        verhaal: Tot eind juni betaalt de Dienst uit op het nieuwe voorschot.
        datum: 2025-06-30
        uitvoer:
          uitbetaald_bedrag: [14833, 14833, 14833, 14833]
    eind: 'Wat van € 1.577 nog rest, gaat over de termijnen erna: € 148,33 per maand.'
