---
# Casus: de zorgtoeslag bij de Dienst Toeslagen.
#
# Configuratie is alleen wat niet uit de wet volgt, en het corpus: welke
# regelwerken in deze casus gelden. Het besluit dat de aanvraag vraagt, het
# artikel van het bezwaar en de naam van wie beslist, leidt de app af uit dit
# artikel en de cel, binnen dat corpus (src/casus.rs).
cel: dienst_toeslagen
artikel: algemene_wet_inkomensafhankelijke_regelingen#15
# Het corpus van deze casus: alleen deze regelwerken gelden. Hieronder de
# gedeelde, elk een map onder het corpus van de poc; de eigen regelwerken van
# de casus, in casussen/zorgtoeslag/regulation/nl, gelden zonder dat ze hier
# staan: de Wet op de zorgtoeslag, de regeling standaardpremie en het
# uitvoeringsbeleid van de Dienst Toeslagen. De Zorgverzekeringswet, de
# Algemene wet inzake rijksbelastingen en de Wet inkomstenbelasting 2001
# staan erbij omdat de Wet op de zorgtoeslag en de Awir eruit lezen.
corpus:
  - regulation/nl/wet/algemene_wet_bestuursrecht
  - regulation/nl/wet/algemene_wet_inkomensafhankelijke_regelingen
  - regulation/nl/wet/algemene_wet_inzake_rijksbelastingen
  - regulation/nl/wet/wet_inkomstenbelasting_2001
  - regulation/nl/wet/zorgverzekeringswet
# De uitvoer die zegt of het besluit het gevraagde toewijst. De wet merkt die
# niet aan: decision_type TOEKENNING zegt wat voor besluit het is, niet welke
# van zijn uitvoer de toewijzing is.
uitkomst: tegemoetkoming_toegekend

# Een verzekerde vraagt zorgtoeslag aan over 2025 (Awir artikel 15). De
# aanvraag noemt het artikel dat de aanspraak geeft, artikel 2 van de Wet op de
# zorgtoeslag. De Dienst Toeslagen kent de tegemoetkoming toe (Awir artikel
# 14), en leest het bedrag uit dat artikel, met de standaardpremie voor 2025.
# Wat de Dienst daarvoor weet, geeft hij als zijn eigen bevindingen, onder de
# namen die dat artikel vraagt. Tegen het besluit staat bezwaar open. Het
# voorschot (Awir artikel 16) en de betaling in termijnen speelt deze casus
# nog niet na.

# Wat de bezoeker leest.
titel: Zorgtoeslag
cel_naam: Dienst Toeslagen
speeldatum: 2025-01-06

# Fictieve voorbeeldgegevens. Volg je een scenario, dan begint elk formulier
# hiermee, met de waarden van de stap erover; bij vrij spelen blijft het leeg.
# Een BSN uit de testreeks. De bedragen staan in eurocent, zoals de wet ze
# rekent: 2500000 is € 25.000. Een alleenstaande met dat inkomen krijgt het
# hele verschil tussen de standaardpremie en de normpremie bij het
# drempelinkomen.
voorbeeld:
  aanvraag:
    bsn: '999993653'
    berekeningsjaar: 2025
    # Welke tegemoetkoming de aanvraag vraagt: het artikel dat de aanspraak
    # geeft (Awir artikel 15, tijdelijke keuze).
    gevraagde_tegemoetkoming: wet_op_de_zorgtoeslag#2
    aanvraag_ondertekend: true
    naam_aanvrager: S. de Vries
    adres_aanvrager: Voorbeeldlaan 7, 1234 AB Wilgendaal
    dagtekening: '2025-01-03'
    gevraagde_beschikking: zorgtoeslag over 2025
  bevindingen:
    toetsingsinkomen: 2500000
    heeft_toeslagpartner: false
    toetsingsinkomen_toeslagpartner: 0
    is_verzekerde: true
    vermogen_onder_grens: true
  bezwaar:
    bezwaar_of_beroepschrift_ondertekend: true
    naam_indiener: S. de Vries
    adres_indiener: Voorbeeldlaan 7, 1234 AB Wilgendaal
    omschrijving_bestreden_besluit: zorgtoeslag over 2025
    gronden_bezwaar_of_beroep: >-
      mijn inkomen daalt in 2025: ik werk vanaf februari vier dagen in plaats
      van vijf

scenarios:
  - naam: Zorgtoeslag wordt toegekend
    samenvatting: >-
      Een alleenstaande vraagt zorgtoeslag aan, en de Dienst Toeslagen
      kent die toe.
    stappen:
      - stap: aanvraag
        verhaal: Een alleenstaande vraagt zorgtoeslag aan voor 2025.
      - stap: besluit
        verhaal: >-
          De Dienst verwacht een inkomen van € 25.000 en vindt een
          zorgverzekering.
        uitkomst: toegewezen
        uitvoer:
          tegemoetkomingbedrag: 157700
    eind: 'Toegewezen: de zorgtoeslag is € 1.577 over 2025.'
  - naam: 'Niet verzekerd: geen zorgtoeslag'
    samenvatting: >-
      De Dienst verwacht dat de aanvrager geen zorgverzekering heeft, en
      kent geen zorgtoeslag toe.
    stappen:
      - stap: aanvraag
        verhaal: Een alleenstaande vraagt zorgtoeslag aan voor 2025.
      - stap: besluit
        verhaal: De Dienst vindt geen zorgverzekering voor 2025.
        invoer:
          is_verzekerde: false
        uitkomst: afgewezen
        uitvoer:
          tegemoetkomingbedrag: 0
    eind: 'Afgewezen: zonder zorgverzekering is er geen zorgtoeslag.'
  - naam: Inkomen te hoog, bezwaar gegrond
    samenvatting: >-
      Bij het verwachte inkomen is er geen zorgtoeslag, maar na het bezwaar
      verwacht de Dienst minder en kent hij die alsnog toe.
    stappen:
      - stap: aanvraag
        verhaal: Een alleenstaande vraagt zorgtoeslag aan voor 2025.
      - stap: besluit
        verhaal: De Dienst verwacht een inkomen van € 45.000.
        invoer:
          toetsingsinkomen: 4500000
        uitkomst: afgewezen
        uitvoer:
          tegemoetkomingbedrag: 0
        gezien: 'Afgewezen: bij dit inkomen is de zorgtoeslag nihil.'
      - stap: bezwaar
        verhaal: De aanvrager maakt bezwaar, omdat het inkomen in 2025 daalt.
        datum: 2025-01-20
      - stap: beslissing_op_bezwaar
        verhaal: De Dienst verwacht nu een inkomen van € 30.000.
        datum: 2025-02-03
        invoer:
          toetsingsinkomen: 3000000
        uitkomst: gegrond
        uitvoer:
          tegemoetkomingbedrag: 133100
        tekst: >-
          Klik onder Open bezwaren op Ontvankelijkheid toetsen en dan op
          Beslissen op bezwaar.
    eind: 'Gegrond: het nieuwe besluit kent € 1.331 toe over 2025.'
  - naam: 'Bezwaar zonder nieuwe feiten: ongegrond'
    samenvatting: >-
      De aanvrager maakt bezwaar tegen de toekenning, maar de Dienst
      verwacht hetzelfde en het bedrag blijft.
    stappen:
      - stap: aanvraag
        verhaal: Een alleenstaande vraagt zorgtoeslag aan voor 2025.
      - stap: besluit
        verhaal: De Dienst beslist op de aanvraag.
        uitkomst: toegewezen
        gezien: 'Toegewezen: de zorgtoeslag is € 1.577.'
      - stap: bezwaar
        verhaal: De aanvrager vindt de zorgtoeslag te laag en maakt bezwaar.
        datum: 2025-01-20
        invoer:
          gronden_bezwaar_of_beroep: de zorgtoeslag is te laag
      - stap: beslissing_op_bezwaar
        verhaal: De Dienst verwacht bij de heroverweging hetzelfde.
        datum: 2025-02-03
        uitkomst: ongegrond
    eind: 'Ongegrond: de zorgtoeslag blijft € 1.577.'
