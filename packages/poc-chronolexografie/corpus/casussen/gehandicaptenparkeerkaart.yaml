---
# Casus: de gehandicaptenparkeerkaart bij een fictieve gemeente.
#
# Configuratie is alleen wat niet uit de wet volgt, en het corpus: welke
# regelwerken in deze casus gelden. De regelwerken die de cel daarvan draait,
# het artikel van het bezwaar en de naam van wie beslist, leidt de app af uit
# dit artikel en de cel, binnen dat corpus (src/casus.rs).
cel: gemeente_wilgendaal
artikel: besluit_administratieve_bepalingen_inzake_het_wegverkeer_babw#49
# Het corpus van deze casus: alleen deze regelwerken gelden. Hieronder de
# gedeelde, elk een map onder het corpus van de poc; de eigen regelwerken
# van de casus, in casussen/gehandicaptenparkeerkaart/regulation/nl, gelden zonder dat ze hier
# staan. De reducties van de cellen van de casus komen met die cellen mee.
corpus:
  - regulation/nl/amvb/besluit_administratieve_bepalingen_inzake_het_wegverkeer_babw
  - regulation/nl/wet/algemene_wet_bestuursrecht
  - regulation/nl/ministeriele_regeling/regeling_gehandicaptenparkeerkaart
  - regulation/nl/gemeentelijke_verordening/wilgendaal/parkeerverordening_gemeente_wilgendaal
  - regulation/nl/uitvoeringsbeleid/beleid_gehandicaptenparkeerkaart_gemeente_wilgendaal
  - regulation/nl/gemeentelijke_verordening/wilgendaal/uitvoeringsbesluit_parkeren_gemeente_wilgendaal
  - regulation/nl/uitvoeringsbeleid/beleid_bedrijfsparkeervergunning_gemeente_wilgendaal
  - cells/reductions/reductie_algemene_wet_bestuursrecht
# De uitvoer die zegt of het besluit het gevraagde toewijst. De wet merkt die
# niet aan: decision_type TOEKENNING zegt wat voor besluit het is, niet welke
# van zijn uitvoer de toewijzing is, en de kaart vermeldt ook nog of zij voor
# een bestuurder of een passagier is.
uitkomst: gehandicaptenparkeerkaart_verstrekt

# Wat de bezoeker leest.
titel: Gehandicaptenparkeerkaart
cel_naam: gemeente Wilgendaal
speeldatum: 2026-10-13

# Fictieve voorbeeldgegevens. Volg je een scenario, dan begint elk formulier
# hiermee, met de waarden van de stap erover; bij vrij spelen blijft het leeg.
# Een BSN uit de testreeks; een kaart als bestuurder. De vier criteria vult
# het beleid uit het advies van de GGD; het formulier vraagt ze alleen zonder
# advies, en dan is het voorbeeld alleen een langdurige loopbeperking. Het
# college laat het onderzoek niet achterwege (Regeling
# gehandicaptenparkeerkaart, artikel 2, tweede lid): die drie bevindingen
# staan uit.
voorbeeld:
  aanvraag:
    bsn_aanvrager: '999990020'
    kaart_als_bestuurder: true
    kaart_als_passagier: false
    aanvraag_ondertekend: true
    naam_aanvrager: A. de Vries
    adres_aanvrager: Voorbeeldlaan 2
    dagtekening: '2026-10-05'
    gevraagde_beschikking: gehandicaptenparkeerkaart
  bevindingen:
    langdurige_loopbeperking_volgens_college: true
    continu_afhankelijk_van_hulp_bestuurder_volgens_college: false
    permanent_rolstoelgebonden_volgens_college: false
    ernstige_beperkingen_andere_dan_loopbeperkingen_volgens_college: false
    geneeskundig_onderzoek_achterwege_gelaten: false
    bekend_dat_aanvrager_nog_steeds_voldoet: false
    keurende_instantie_oordeelt_dat_aanvrager_nog_steeds_voldoet: false
  bezwaar:
    bezwaar_of_beroepschrift_ondertekend: true
    naam_indiener: A. de Vries
    adres_indiener: Voorbeeldlaan 2
    omschrijving_bestreden_besluit: besluit op de aanvraag om een gehandicaptenparkeerkaart
    gronden_bezwaar_of_beroep: ik kan niet verder lopen dan vijftig meter
  # Het beroepschrift (Awb 6:5): dezelfde velden als het bezwaarschrift.
  beroep:
    bezwaar_of_beroepschrift_ondertekend: true
    naam_indiener: A. de Vries
    adres_indiener: Voorbeeldlaan 2
    omschrijving_bestreden_besluit: beslissing op bezwaar over de gehandicaptenparkeerkaart
    gronden_bezwaar_of_beroep: het geneeskundig onderzoek woog mijn loopafstand niet mee
  # Wat de rechter vindt (Awb 8:70): de gemeente schond geen rechtsregel.
  uitspraak:
    indiener_is_belanghebbende: true
    rechtsregel_geschonden: false

# De andere cellen die de casus meeneemt (RFC-052). Het open begrip zegt wie
# bevoegd is: de GGD of de aangewezen deskundige voor het onderzoek (Regeling
# gehandicaptenparkeerkaart, artikel 3). De engine vraagt alleen een cel die
# het begrip noemt, en één cel per vraag. Elke cel legt bij elke start en
# reset opnieuw vast wat zij vóór het eerste scenario wist, via de cel zoals
# elke stap.
#
# - De GGD onderzocht de voorbeeldaanvrager op 9 oktober, na de dagtekening
#   van de voorbeeldaanvraag (5 oktober), dus het onderzoek telt voor die
#   aanvraag. Een executogram van het feit dat artikel 3 vereist; dat
#   artikel zegt ook wat het bevat. Dezelfde dag bracht zij haar advies uit:
#   een langdurige loopbeperking, verder niets (het feit dat artikel 5 van
#   het fictieve beleid van Wilgendaal vereist).
# - Een tweede aanvrager (BSN 999990068) onderzocht zij ook op 9 oktober;
#   haar advies vindt geen enkel criterium.
andere_cellen:
  - cel: ggd_wilgendaal
    cel_naam: GGD Wilgendaal
    begin:
      datum: 2026-10-09
      executogrammen:
        - feit: regeling_gehandicaptenparkeerkaart#3#geneeskundig_onderzoek_verricht
          velden:
            bsn_aanvrager: '999990020'
            datum_onderzoek: '2026-10-09'
            verricht_door: Gemeentelijke Gezondheidsdienst
        - feit: beleid_gehandicaptenparkeerkaart_gemeente_wilgendaal#5#geneeskundig_advies_uitgebracht
          velden:
            bsn_aanvrager: '999990020'
            datum_onderzoek: '2026-10-09'
            langdurige_loopbeperking: true
            continu_afhankelijk_van_hulp_bestuurder: false
            permanent_rolstoelgebonden: false
            ernstige_beperkingen_andere_dan_loopbeperkingen: false
        - feit: regeling_gehandicaptenparkeerkaart#3#geneeskundig_onderzoek_verricht
          velden:
            bsn_aanvrager: '999990068'
            datum_onderzoek: '2026-10-09'
            verricht_door: Gemeentelijke Gezondheidsdienst
        - feit: beleid_gehandicaptenparkeerkaart_gemeente_wilgendaal#5#geneeskundig_advies_uitgebracht
          velden:
            bsn_aanvrager: '999990068'
            datum_onderzoek: '2026-10-09'
            langdurige_loopbeperking: false
            continu_afhankelijk_van_hulp_bestuurder: false
            permanent_rolstoelgebonden: false
            ernstige_beperkingen_andere_dan_loopbeperkingen: false
  # De bestuursrechter (RFC-053): ook een andere cel, met een eigen kroniek.
  # Dat zij de rechter is, zegt haar cel.yaml (categorie "de
  # bestuursrechter", wie volgens Awb 8:70 beslist). Het artikel van het
  # beroep en het feit waarin de gemeente de ontvangst van een uitspraak
  # vastlegt (Awb 8:79), leidt de app af uit de wet.
  - cel: rechtbank_wilgendaal
    cel_naam: Rechtbank Wilgendaal

# The scenarios, step by step. Each step says what the visitor does
# (`stap`), on which play date, with which values (`invoer`, over the
# example values above) and what it comes to (`uitkomst`), with the text of
# the guide (`tekst`, `gezien`). The guide beside the page and the forms read
# them from here (frontend/src/scenarioGuides.js, scenarioInvoer.js), and
# tests/scenarios.rs plays every scenario with exactly these values.
scenarios:
  - naam: De kaart wordt verstrekt op het advies van de GGD
    samenvatting: >-
      Na de aanvraag onderzoekt de GGD de aanvrager en adviseert positief, en
      het college verstrekt de kaart op dat advies.
    stappen:
      - stap: aanvraag
        invoer:
          bsn_aanvrager: '999990032'
        tekst: >-
          Klik op Aanvraag indienen. De GGD heeft deze aanvrager nog niet
          onderzocht.
        gezien: >-
          De aanvraag staat onder Mijn aanvragen op In behandeling, en onder
          Kroniek als eerste chronolexogram van de gemeente.
      - stap: vastleggen
        titel: Onderzoek door de GGD
        datum: 2026-10-16
        cel: ggd_wilgendaal
        feit: regeling_gehandicaptenparkeerkaart#3#geneeskundig_onderzoek_verricht
        invoer:
          bsn_aanvrager: '999990032'
          datum_onderzoek: '2026-10-16'
          verricht_door: Gemeentelijke Gezondheidsdienst
        tekst: >-
          Klik bij GGD Wilgendaal onder "Vastleggen: Geneeskundig onderzoek
          verricht" op Vastleggen.
        gezien: >-
          Het onderzoek staat in de kroniek van de GGD, onder Andere cellen.
          De wet zegt dat er eerst een onderzoek moet zijn (Regeling
          gehandicaptenparkeerkaart, artikel 2) en dat de GGD het doet
          (artikel 3). Hoe de gemeente de GGD daarom vraagt, zegt de wet niet;
          dat verzoek zie je daarom niet in de PoC.
      - stap: vastleggen
        titel: Advies van de GGD
        cel: ggd_wilgendaal
        feit: beleid_gehandicaptenparkeerkaart_gemeente_wilgendaal#5#geneeskundig_advies_uitgebracht
        invoer:
          bsn_aanvrager: '999990032'
          datum_onderzoek: '2026-10-16'
          langdurige_loopbeperking: true
          continu_afhankelijk_van_hulp_bestuurder: false
          permanent_rolstoelgebonden: false
          ernstige_beperkingen_andere_dan_loopbeperkingen: false
        tekst: >-
          Klik bij GGD Wilgendaal onder "Vastleggen: Geneeskundig advies
          uitgebracht" op Vastleggen.
        gezien: >-
          Het advies staat ook in de kroniek van de GGD.
      - stap: besluit
        datum: 2026-10-20
        uitkomst: toegewezen
        tekst: >-
          Het formulier vraagt de vier criteria niet: het advies van de GGD
          geeft ze. Klik op Besluit nemen.
    eind: >-
      Onder Besluiten staat Toegewezen: de kaart is verstrekt en vermeldt de
      bestuurder. Ze is geldig tot en met 19 oktober 2031, vijf jaar vanaf de
      dag van het besluit (BABW artikel 51). Bij het besluit staat "langdurige
      loopbeperking: ja", ingevuld door het fictieve beleid van Wilgendaal
      (artikel 6) uit het advies. In het Logboek staat dat de GGD Wilgendaal
      het advies gaf en antwoordde dat het onderzoek plaatsvond: de gemeente
      vroeg het aan de cel die de wet en het beleid daarvoor bevoegd maken.
      Het onderzoek en het advies staan in de kroniek van de GGD, onder Andere
      cellen. Het besluit zelf staat onder Kroniek, in de kroniek van de
      gemeente, na de aanvraag waarop het berust.
  - naam: Het advies vindt geen criterium
    samenvatting: >-
      Het advies van de GGD vindt geen enkel criterium, en de kaart wordt
      geweigerd.
    stappen:
      - stap: aanvraag
        invoer:
          bsn_aanvrager: '999990068'
        tekst: >-
          Klik op Aanvraag indienen. De GGD onderzocht deze aanvrager op 9
          oktober en vond geen enkel criterium.
      - stap: besluit
        datum: 2026-10-20
        uitkomst: afgewezen
        tekst: >-
          Klik op Besluit nemen.
    eind: >-
      Afgewezen. Het college oordeelt zoals het advies (artikel 6 van het
      fictieve beleid), en kan daar niet van afwijken: een beleid dat een
      begrip invult gaat voor een oordeel van het college (RFC-045). Of het
      college per geval van zijn beleid mag afwijken (Awb 4:84), is niet
      gebouwd. Bij het besluit staat geen antwoord over een eerdere kaart:
      artikel 49 leest het beleid over een tweede kaart alleen voor een
      aanvrager die aan een criterium voldoet.
  - naam: Een tweede kaart naast een geldige
    samenvatting: >-
      Wie al een geldige kaart heeft, krijgt er geen tweede bij.
    stappen:
      - stap: aanvraag
      - stap: besluit
        datum: 2026-10-20
        uitkomst: toegewezen
        tekst: >-
          Klik op Besluit nemen.
        gezien: >-
          De kaart is verstrekt, geldig tot en met 19 oktober 2031.
      - stap: aanvraag
        datum: 2027-03-01
        tekst: >-
          Klik nog een keer op Aanvraag indienen.
      - stap: besluit
        uitkomst: afgewezen
        tekst: >-
          Klik op Besluit nemen. Het beleid van de gemeente geeft geen tweede
          kaart naast een geldige.
    eind: >-
      In het Logboek staat bij het tweede besluit "aanvrager heeft geldige
      gehandicaptenparkeerkaart: ja", ingevuld door het beleid van Wilgendaal
      met het antwoord van de cel; haar reductie vond het eerste besluit. De
      keten loopt via artikel 49, het beleid van Wilgendaal en het begrip dat
      de cel beantwoordde.
  - naam: Ongegrond bezwaar tegen een verstrekking
    samenvatting: >-
      De aanvrager maakt bezwaar tegen de verstrekte kaart, en de
      heroverweging geeft dezelfde uitkomst.
    stappen:
      - stap: aanvraag
      - stap: besluit
        datum: 2026-10-20
        uitkomst: toegewezen
        tekst: >-
          Klik op Besluit nemen.
        gezien: >-
          De kaart is verstrekt, geldig tot en met 19 oktober 2031.
      - stap: bezwaar
        datum: 2026-11-01
      - stap: beslissing_op_bezwaar
        datum: 2026-11-20
        uitkomst: ongegrond
        tekst: >-
          Klik onder Open bezwaren op Ontvankelijkheid toetsen. Laat alle
          bevindingen staan en klik op Beslissen op bezwaar.
    eind: >-
      Ongegrond: de heroverweging geeft dezelfde uitkomst, en het besluit
      blijft geldig tot en met 19 oktober 2031. Opnieuw beslist zou de kaart
      later aflopen, maar de einddatum is afgeleid en geen uitkomst. Bij de
      heroverweging laat de cel het bestreden besluit buiten beschouwing,
      zodat de kaart niet wordt geweigerd vanwege zichzelf. De vier criteria
      vraagt de heroverweging niet: het advies gaf ze, en dat geldt nog.
  - naam: Gegrond bezwaar na een nieuw advies
    samenvatting: >-
      Na het bezwaar onderzoekt de GGD opnieuw, en op dat nieuwe advies komt
      er alsnog een kaart.
    stappen:
      - stap: aanvraag
        invoer:
          bsn_aanvrager: '999990068'
        tekst: >-
          Klik op Aanvraag indienen. Het advies van de GGD vindt geen
          criterium.
      - stap: besluit
        datum: 2026-10-20
        uitkomst: afgewezen
        tekst: >-
          Klik op Besluit nemen.
        gezien: >-
          De kaart is geweigerd: het advies vindt geen criterium.
      - stap: bezwaar
        datum: 2026-11-01
      - stap: vastleggen
        titel: Nieuw advies van de GGD
        datum: 2026-11-10
        cel: ggd_wilgendaal
        feit: beleid_gehandicaptenparkeerkaart_gemeente_wilgendaal#5#geneeskundig_advies_uitgebracht
        invoer:
          bsn_aanvrager: '999990068'
          datum_onderzoek: '2026-11-10'
          langdurige_loopbeperking: true
          continu_afhankelijk_van_hulp_bestuurder: false
          permanent_rolstoelgebonden: false
          ernstige_beperkingen_andere_dan_loopbeperkingen: false
        tekst: >-
          De GGD brengt een nieuw advies uit. Klik bij GGD Wilgendaal onder
          "Vastleggen: Geneeskundig advies uitgebracht" op Vastleggen.
        gezien: >-
          Het nieuwe advies staat in de kroniek van de GGD; de gemeente leest
          het bij de heroverweging.
      - stap: beslissing_op_bezwaar
        datum: 2026-11-20
        uitkomst: gegrond
        tekst: >-
          Klik onder Open bezwaren op Ontvankelijkheid toetsen en dan op
          Beslissen op bezwaar.
    eind: >-
      Gegrond: de weigering is herroepen. Bij de heroverweging telt het advies
      van het laatste onderzoek voor de aanvraag (artikel 5, derde lid, van
      het fictieve beleid), dat van 10 november. Het nieuwe besluit verstrekt
      de kaart, geldig tot en met 19 november 2031, vijf jaar vanaf dat nieuwe
      besluit. Een andere bevinding van het college over de loopbeperking had
      niets veranderd: het advies gaat voor.
  - naam: Een kaart na bezwaar telt bij de volgende aanvraag
    samenvatting: >-
      Na bezwaar komt de kaart er alsnog, en bij de volgende aanvraag weigert
      de gemeente een tweede.
    stappen:
      - stap: aanvraag
        invoer:
          bsn_aanvrager: '999990068'
        tekst: >-
          Klik op Aanvraag indienen. Het advies van de GGD vindt geen
          criterium.
      - stap: besluit
        datum: 2026-10-20
        uitkomst: afgewezen
        tekst: >-
          Klik op Besluit nemen.
        gezien: >-
          De kaart is geweigerd. Onder Kroniek staat één besluit onder artikel
          49, en dat verstrekt geen kaart.
      - stap: bezwaar
        datum: 2026-11-01
      - stap: vastleggen
        titel: Nieuw advies van de GGD
        datum: 2026-11-10
        cel: ggd_wilgendaal
        feit: beleid_gehandicaptenparkeerkaart_gemeente_wilgendaal#5#geneeskundig_advies_uitgebracht
        invoer:
          bsn_aanvrager: '999990068'
          datum_onderzoek: '2026-11-10'
          langdurige_loopbeperking: true
          continu_afhankelijk_van_hulp_bestuurder: false
          permanent_rolstoelgebonden: false
          ernstige_beperkingen_andere_dan_loopbeperkingen: false
        tekst: >-
          De GGD brengt een nieuw advies uit. Klik bij GGD Wilgendaal onder
          "Vastleggen: Geneeskundig advies uitgebracht" op Vastleggen.
        gezien: >-
          Het nieuwe advies staat in de kroniek van de GGD; de gemeente leest
          het bij de heroverweging.
      - stap: beslissing_op_bezwaar
        datum: 2026-11-20
        uitkomst: gegrond
        tekst: >-
          Klik onder Open bezwaren op Ontvankelijkheid toetsen en dan op
          Beslissen op bezwaar.
        gezien: >-
          Gegrond: de weigering is herroepen (Awb 7:11, tweede lid). De
          beslissing op bezwaar nam een nieuw besluit dat de kaart verstrekt,
          geldig tot en met 19 november 2031. Onder Kroniek staan nu twee
          besluiten onder artikel 49: de weigering en het nieuwe besluit.
          Niets is overschreven.
      - stap: aanvraag
        datum: 2027-03-01
        invoer:
          bsn_aanvrager: '999990068'
        tekst: >-
          Klik op Aanvraag indienen. Dezelfde aanvrager vraagt nog een kaart.
      - stap: besluit
        uitkomst: afgewezen
        tekst: >-
          Klik op Besluit nemen.
    eind: >-
      Afgewezen: het beleid van de gemeente geeft geen tweede kaart naast een
      geldige. In het Logboek staat bij het besluit "aanvrager heeft geldige
      gehandicaptenparkeerkaart: ja". De reductie van de Awb liet de herroepen
      weigering weg (Awb 7:11, tweede lid), zodat alleen het nieuwe besluit
      uit de beslissing op bezwaar overbleef. Daarin vond de reductie van de
      gemeente de kaart. Zelf kent die reductie geen bezwaar: ze leest alleen
      de geldende besluiten.
  - naam: Zonder advies oordeelt het college, en zonder onderzoek nog geen kaart
    samenvatting: >-
      Zonder advies oordeelt het college zelf, maar zonder onderzoek komt er
      nog geen kaart.
    stappen:
      - stap: aanvraag
        invoer:
          bsn_aanvrager: '999990032'
        tekst: >-
          Klik op Aanvraag indienen. De GGD heeft deze aanvrager niet
          onderzocht.
      - stap: besluit
        titel: Besluit nemen zonder oordeel over het onderzoek
        datum: 2026-10-20
        uitkomst: geweigerd
        tekst: >-
          Er is geen advies, dus het college oordeelt zelf over de vier
          criteria. Het voorbeeld geeft alleen een langdurige loopbeperking.
          Laat "geneeskundig onderzoek heeft plaatsgehad" op Nog niet
          beoordeeld en klik op Besluit nemen.
    eind: >-
      Er komt geen besluit, maar een melding: het college heeft niet
      beoordeeld of het geneeskundig onderzoek plaatsvond. De kaart "wordt
      niet afgegeven alvorens een geneeskundig onderzoek heeft plaatsgehad"
      (Regeling gehandicaptenparkeerkaart, artikel 2, eerste lid); dat is geen
      grond om te weigeren, dus het college wacht. De kroniek blijft zoals zij
      was. Kiest het college Ja, dan stelt het zelf vast dat het onderzoek
      plaatsvond en volgt de kaart; kiest het Nee, dan weigert het (eigen
      keuze). Of: onder Andere cellen legt de GGD het onderzoek vast (BSN
      999990032, een dag op of na de dagtekening), en dan volgt de kaart
      zonder vaststelling van het college.
  - naam: Een nieuwe kaart zonder nieuw onderzoek
    samenvatting: >-
      Wie eerder een kaart kreeg, krijgt een nieuwe zonder nieuw onderzoek.
    stappen:
      - stap: aanvraag
      - stap: besluit
        datum: 2026-10-20
        uitkomst: toegewezen
        tekst: >-
          Klik op Besluit nemen.
        gezien: >-
          De kaart is verstrekt, geldig tot en met 19 oktober 2031.
      - stap: aanvraag
        datum: 2031-10-20
        invoer:
          dagtekening: '2031-10-20'
        tekst: >-
          Klik op Aanvraag indienen. Het onderzoek en het advies van 2026
          tellen niet voor deze aanvraag.
      - stap: besluit
        invoer:
          geneeskundig_onderzoek_achterwege_gelaten: true
          bekend_dat_aanvrager_nog_steeds_voldoet: true
        uitkomst: toegewezen
        tekst: >-
          Er is geen advies, dus het college oordeelt zelf over de vier
          criteria. Het voorbeeld geeft alleen een langdurige loopbeperking.
          Klik op Besluit nemen.
    eind: >-
      Toegewezen, zonder nieuw onderzoek (Regeling gehandicaptenparkeerkaart,
      artikel 2, tweede lid, onder a). Bij het besluit staat "aanvrager eerder
      gehandicaptenparkeerkaart verstrekt: ja", ingevuld door het beleid van
      Wilgendaal met het antwoord van de cel. Laat je ze uit, dan volgt de
      melding van het vorige scenario.
  - naam: Beroep ongegrond
    samenvatting: >-
      Na een ongegrond bezwaar gaat de aanvrager in beroep, en de rechter
      geeft de gemeente gelijk.
    stappen:
      - stap: aanvraag
        invoer:
          bsn_aanvrager: '999990068'
        tekst: >-
          Klik op Aanvraag indienen. Het advies van de GGD vindt geen
          criterium.
      - stap: besluit
        datum: 2026-10-20
        uitkomst: afgewezen
        tekst: >-
          Klik op Besluit nemen.
      - stap: bezwaar
        datum: 2026-11-01
      - stap: beslissing_op_bezwaar
        datum: 2026-11-20
        uitkomst: ongegrond
        tekst: >-
          Klik onder Open bezwaren op Ontvankelijkheid toetsen. Laat alle
          bevindingen staan en klik op Beslissen op bezwaar.
        gezien: >-
          Ongegrond: de weigering blijft. Bij Aanvrager kun je nu in beroep
          gaan.
      - stap: beroep
        datum: 2026-12-01
      - stap: uitspraak
        datum: 2027-01-11
        tekst: >-
          Klik onder Ingekomen beroepen op Uitspraak doen. De
          voorbeeldbevindingen zeggen dat de gemeente geen rechtsregel schond.
      - stap: toezenden
        tekst: >-
          Klik bij de uitspraak op Toezenden aan gemeente Wilgendaal.
    eind: >-
      Ongegrond: de rechter vernietigt niets en draagt niets op, en artikel
      8:72 vroeg hij niets. De gemeente legt de ontvangst vast in haar eigen
      kroniek, als het afschrift van de uitspraak dat Awb 8:79 vereist. Onder
      Bestuursorgaan is er niets om opnieuw op te beslissen.
