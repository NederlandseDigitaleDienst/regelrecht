---
$schema: https://raw.githubusercontent.com/NederlandseDigitaleDienst/regelrecht/refs/tags/schema-v0.8.15/schema/v0.8.15/schema.json
$id: fictief_beleid_verleend_verlof_obs_de_klimop
regulatory_layer: UITVOERINGSBELEID
publication_date: '2026-07-01'
valid_from: '2026-08-01'
# FICTIEF beleid van het hoofd van OBS De Klimop, eigen keuze in de
# modellering: geen bekendgemaakt beleid, maar een aanname namens de houder
# (RFC-048). Er is geen bekendmaking; de url wijst naar artikel 13a.
# Wat één besluit onder artikel 13a van de Leerplichtwet 1969 betekent voor
# de vraag of de jongere in een schooljaar al verlof kreeg. De reductie van
# de school (reductie_verlof_al_verleend_in_schooljaar) speelt haar kroniek
# af en vraagt dit beleid per besluit dat meetelt. Het staat los van het
# beleid vakantieverlof, omdat dat beleid de reductie aanroept: een stap van
# de reductie kan de regeling waaruit zij gevraagd wordt niet opnieuw
# aanroepen.
url: https://wetten.overheid.nl/BWBR0002628/2026-08-01#Artikel13a
name: Verleend vakantieverlof bij OBS De Klimop (fictief beleid)
competent_authority:
  name: Het hoofd van OBS De Klimop
articles:
  - number: '1'
    text: >-
      FICTIEF, eigen keuze in de modellering: geen bekendgemaakt beleid. Een
      besluit waarin het hoofd de jongere verlof verleent met een eerste
      verlofdag in een schooljaar, telt als verlof verleend in dat schooljaar.
      Een weigering telt niet.
    url: https://wetten.overheid.nl/BWBR0002628/2026-08-01#Artikel13a
    machine_readable:
      # Wat één besluit onder artikel 13a betekent voor de vraag of er in
      # het schooljaar al verlof is verleend. De reductie van de school
      # vraagt het per besluit dat meetelt, met wat zij tot dan toe wist
      # (verleend_in_schooljaar), en met het schooljaar dat artikel 1 van
      # het beleid vakantieverlof geeft. Dit artikel leest niets anders dan
      # wat het krijgt.
      execution:
        parameters:
          - name: verleend_in_schooljaar
            type: boolean
            description: Of er vóór dit besluit al verlof in het schooljaar was verleend.
          - name: verlof_verleend
            type: boolean
            description: Of het besluit verlof verleent.
          - name: eerste_verlofdag
            type: date
            description: De eerste verlofdag van het besluit.
          - name: begin_schooljaar
            type: date
            description: De eerste dag van het schooljaar.
          - name: einde_schooljaar
            type: date
            description: De laatste dag van het schooljaar.
        output:
          - name: verleend_in_schooljaar_na_besluit
            type: boolean
            description: Of er na dit besluit verlof in het schooljaar is verleend.
        actions:
          - output: verleend_in_schooljaar_na_besluit
            value:
              operation: OR
              conditions:
                - $verleend_in_schooljaar
                - operation: AND
                  conditions:
                    - $verlof_verleend
                    - operation: GREATER_THAN_OR_EQUAL
                      subject:
                        operation: DATE_DIFF
                        from: $begin_schooljaar
                        to: $eerste_verlofdag
                        in: days
                      value: 0
                    - operation: GREATER_THAN_OR_EQUAL
                      subject:
                        operation: DATE_DIFF
                        from: $eerste_verlofdag
                        to: $einde_schooljaar
                        in: days
                      value: 0
