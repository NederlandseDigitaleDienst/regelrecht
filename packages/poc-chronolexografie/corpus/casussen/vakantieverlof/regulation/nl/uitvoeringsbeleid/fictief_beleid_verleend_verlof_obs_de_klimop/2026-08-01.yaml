---
$schema: https://raw.githubusercontent.com/NederlandseDigitaleDienst/regelrecht/refs/tags/schema-v0.8.15/schema/v0.8.15/schema.json
$id: fictief_beleid_verleend_verlof_obs_de_klimop
regulatory_layer: UITVOERINGSBELEID
publication_date: '2026-07-01'
valid_from: '2026-08-01'
# FICTIEF beleid van het hoofd van OBS De Klimop, eigen keuze in de
# modellering: geen bekendgemaakt beleid, maar een aanname namens de houder
# (RFC-048). Er is geen bekendmaking; de url wijst naar artikel 13a.
# Wat één besluit onder artikel 13a van de Leerplichtwet 1969 betekent voor
# de vraag of de jongere in een schooljaar al verlof kreeg. De reductie van
# de school (reductie_verlof_al_verleend_in_schooljaar) speelt haar kroniek
# af en vraagt dit beleid per besluit dat meetelt (artikel 1), en per
# ontvangen uitspraak waarin de bestuursrechter zelf in de zaak voorzag
# (artikel 2). Het staat los van het
# beleid vakantieverlof, omdat dat beleid de reductie aanroept: een stap van
# de reductie kan de regeling waaruit zij gevraagd wordt niet opnieuw
# aanroepen.
url: https://wetten.overheid.nl/BWBR0002628/2026-08-01#Artikel13a
name: Verleend vakantieverlof bij OBS De Klimop (fictief beleid)
competent_authority:
  name: Het hoofd van OBS De Klimop
articles:
  - number: '1'
    text: >-
      FICTIEF, eigen keuze in de modellering: geen bekendgemaakt beleid. Een
      besluit waarin het hoofd de jongere verlof verleent met een eerste
      verlofdag in een schooljaar, telt als verlof verleend in dat schooljaar.
      Een weigering telt niet.
    url: https://wetten.overheid.nl/BWBR0002628/2026-08-01#Artikel13a
    machine_readable:
      # Wat één besluit onder artikel 13a betekent voor de vraag of er in
      # het schooljaar al verlof is verleend. De reductie van de school
      # vraagt het per besluit dat meetelt, met wat zij tot dan toe wist
      # (verleend_in_schooljaar), en met het schooljaar dat artikel 1 van
      # het beleid vakantieverlof geeft. Dit artikel leest niets anders dan
      # wat het krijgt.
      execution:
        parameters:
          - name: verleend_in_schooljaar
            type: boolean
            description: Of er vóór dit besluit al verlof in het schooljaar was verleend.
          - name: verlof_verleend
            type: boolean
            description: Of het besluit verlof verleent.
          - name: eerste_verlofdag
            type: date
            description: De eerste verlofdag van het besluit.
          - name: begin_schooljaar
            type: date
            description: De eerste dag van het schooljaar.
          - name: einde_schooljaar
            type: date
            description: De laatste dag van het schooljaar.
        output:
          - name: verleend_in_schooljaar_na_besluit
            type: boolean
            description: Of er na dit besluit verlof in het schooljaar is verleend.
        actions:
          - output: verleend_in_schooljaar_na_besluit
            value:
              operation: OR
              conditions:
                - $verleend_in_schooljaar
                - operation: AND
                  conditions:
                    - $verlof_verleend
                    - operation: GREATER_THAN_OR_EQUAL
                      subject:
                        operation: DATE_DIFF
                        from: $begin_schooljaar
                        to: $eerste_verlofdag
                        in: days
                      value: 0
                    - operation: GREATER_THAN_OR_EQUAL
                      subject:
                        operation: DATE_DIFF
                        from: $eerste_verlofdag
                        to: $einde_schooljaar
                        in: days
                      value: 0
  - number: '2'
    text: >-
      FICTIEF, eigen keuze in de modellering: geen bekendgemaakt beleid. Voorziet
      de bestuursrechter zelf in de zaak en verleent zijn uitspraak de jongere
      verlof met een eerste verlofdag in een schooljaar, dan telt dat als
      verlof verleend in dat schooljaar, zoals een besluit van het hoofd.
    url: https://wetten.overheid.nl/BWBR0005537/2024-01-01#Artikel8:72
    machine_readable:
      # Awb 8:72, derde lid, onder b: de uitspraak treedt in de plaats van
      # het vernietigde besluit. De school legt de ontvangst van het afschrift
      # vast (Awb 8:79), niet het besluit dat de uitspraak in de plaats stelt;
      # dat staat in de ontvangst. Is dat een beslissing op
      # bezwaar (7:11), dan telt het nieuwe besluit dat zij nam. Dit artikel
      # leest niets anders dan wat het krijgt.
      execution:
        parameters:
          - name: verleend_in_schooljaar
            type: boolean
            description: Of er vóór deze uitspraak al verlof in het schooljaar was verleend.
          # Een object, geen besluitwaarde: het afschrift draagt het besluit
          # zoals de uitspraak het gaf, zonder taken_on, en dit artikel neemt
          # het niet opnieuw; het leest alleen zijn uitvoer en gegevens.
          - name: uitspraak_in_de_plaats
            type: object
            nullable: true
            description: Het besluit dat de uitspraak in de plaats stelt, als zij dat doet.
          - name: begin_schooljaar
            type: date
            description: De eerste dag van het schooljaar.
          - name: einde_schooljaar
            type: date
            description: De laatste dag van het schooljaar.
        output:
          - name: verlof_van_de_rechter
            type: object
            nullable: true
            description: Het besluit op de aanvraag om verlof dat de uitspraak in de plaats stelt.
          - name: verleend_in_schooljaar_na_uitspraak
            type: boolean
            description: Of er na deze uitspraak verlof in het schooljaar is verleend.
        actions:
          - output: verlof_van_de_rechter
            value:
              operation: IF
              cases:
                - when:
                    operation: EQUALS
                    subject: $uitspraak_in_de_plaats
                    value: null
                  then: null
                - when:
                    operation: EQUALS
                    subject: $uitspraak_in_de_plaats.basis
                    value: algemene_wet_bestuursrecht#7:11
                  then: $uitspraak_in_de_plaats.outputs.nieuw_besluit
              default: $uitspraak_in_de_plaats
          # Eerst of er een besluit is dat verlof verleent: AND stopt bij de
          # eerste onwaar, en zonder besluit is er geen eerste verlofdag.
          - output: verleend_in_schooljaar_na_uitspraak
            value:
              operation: OR
              conditions:
                - $verleend_in_schooljaar
                - operation: AND
                  conditions:
                    - operation: NOT
                      value:
                        operation: EQUALS
                        subject: $verlof_van_de_rechter
                        value: null
                    - operation: EQUALS
                      subject: $verlof_van_de_rechter.outputs.verlof_verleend
                      value: true
                    - operation: GREATER_THAN_OR_EQUAL
                      subject:
                        operation: DATE_DIFF
                        from: $begin_schooljaar
                        to: $verlof_van_de_rechter.fields.eerste_verlofdag
                        in: days
                      value: 0
                    - operation: GREATER_THAN_OR_EQUAL
                      subject:
                        operation: DATE_DIFF
                        from: $verlof_van_de_rechter.fields.eerste_verlofdag
                        to: $einde_schooljaar
                        in: days
                      value: 0
