---
$schema: https://raw.githubusercontent.com/NederlandseDigitaleDienst/regelrecht/refs/tags/schema-v0.8.9/schema/v0.8.9/schema.json
$id: fictief_beleid_vakantieverlof_obs_de_klimop
regulatory_layer: UITVOERINGSBELEID
publication_date: '2026-07-01'
valid_from: '2026-08-01'
# FICTIEF beleid van het hoofd van OBS De Klimop, eigen keuze in de
# modellering: geen bekendgemaakt beleid, maar een aanname namens de houder
# (RFC-048). Er is geen bekendmaking; de url wijst naar artikel 13a.
# Artikel 1 is een norm die het hoofd hanteert bij artikel 13a, tweede lid
# ("slechts eenmaal per schooljaar"): welk schooljaar dat van het verlof is.
# Artikel 2 geeft het schooljaar mee aan de reductie van de school
# (reductie_verlof_al_verleend_in_schooljaar). Die speelt de kroniek af en
# vraagt per besluit het beleid verleend verlof
# (fictief_beleid_verleend_verlof_obs_de_klimop) wat het besluit betekent;
# welke besluiten meetellen, volgt uit de effecten die de Awb een besluit
# geeft (7:11 en 8:79 met 8:72). Dit beleid leest zelf geen besluiten.
# Artikel 2 en 4 tot en met 6 koppelen open begrippen aan de antwoorden van
# de cel van de school (source.reduction, RFC-048): zo ontleent het hoofd wat
# hij anders per aanvraag vaststelt aan wat zijn eigen cel uit de kroniek
# haalt. Buiten de cel geeft een koppeling niets. Wat dan geldt, zegt elk
# artikel zelf: artikel 2 laat het hoofd dan oordelen (een eigen open begrip
# met decided_per_case_by), bij artikel 4 tot en met 6 is de vestiging dan
# onbekend.
# Artikel 3 leest geen kroniek: het legt het verlof naast de schoolvakanties
# van de regeling en het rooster van de school. Alleen de regio daarvoor komt
# uit de cel, via artikel 4 tot en met 6. Tot schema v0.8.19 was dit een
# reductie van de cel (reductie_verlof_valt_buiten_schoolvakanties); een
# reductie leest sindsdien altijd de kroniek.
url: https://wetten.overheid.nl/BWBR0002628/2026-08-01#Artikel13a
name: Vakantieverlof bij OBS De Klimop (fictief beleid)
competent_authority:
  name: Het hoofd van OBS De Klimop
articles:
  - number: '1'
    text: >-
      FICTIEF, eigen keuze in de modellering: geen bekendgemaakt beleid. Het
      schooljaar van het gevraagde verlof is het schooljaar van de eerste
      verlofdag.
    url: https://wetten.overheid.nl/BWBR0002628/2026-08-01#Artikel13a
    machine_readable:
      execution:
        parameters:
          - name: eerste_verlofdag
            type: date
            description: Eerste dag van het gevraagde verlof.
        input:
          - name: begin_schooljaar
            type: date
            source:
              regulation: fictief_beleid_schooljaargrenzen_obs_de_klimop
              output: begin_schooljaar
              parameters:
                datum: $eerste_verlofdag
          - name: einde_schooljaar
            type: date
            source:
              regulation: fictief_beleid_schooljaargrenzen_obs_de_klimop
              output: einde_schooljaar
              parameters:
                datum: $eerste_verlofdag
        output:
          - name: begin_schooljaar_van_verlof
            type: date
            description: De eerste dag van het schooljaar van het gevraagde verlof.
          - name: einde_schooljaar_van_verlof
            type: date
            description: De laatste dag van het schooljaar van het gevraagde verlof.
        actions:
          - output: begin_schooljaar_van_verlof
            value: $begin_schooljaar
          - output: einde_schooljaar_van_verlof
            value: $einde_schooljaar
  - number: '2'
    text: >-
      FICTIEF, eigen keuze in de modellering: geen bekendgemaakt beleid. Of
      het hoofd de jongere in het schooljaar van het gevraagde verlof al
      verlof verleende, ontleent het hoofd aan het antwoord van zijn eigen
      cel over zijn eerdere besluiten. Geeft de cel geen antwoord, dan stelt
      het hoofd het zelf vast.
    url: https://wetten.overheid.nl/BWBR0002628/2026-08-01#Artikel13a
    machine_readable:
      # Ook als Awb 7:11 artikel 13a opnieuw aanroept. Zonder antwoord geldt
      # wat het hoofd vaststelt: een eigen open begrip van dit artikel
      # (decided_per_case_by), dat de engine alleen vraagt als de cel zwijgt.
      # Geen default: zonder antwoord en zonder vaststelling faalt het
      # besluit, zodat een ontbrekend antwoord geen tweede verlof verleent.
      open_terms:
        - id: verlof_al_verleend_in_schooljaar_volgens_hoofd
          type: boolean
          required: true
          decided_per_case_by: het hoofd van OBS De Klimop
          description: >-
            Wat het hoofd vaststelt over de vraag of hij de jongere in het
            schooljaar van het gevraagde verlof al verlof verleende, als de
            cel geen antwoord geeft.
      implements:
        - law: leerplichtwet_1969
          article: 13a
          open_term: verlof_al_verleend_in_schooljaar
      execution:
        parameters:
          - name: bsn_jongere
            type: string
            description: Burgerservicenummer van de jongere voor wie verlof wordt gevraagd.
          - name: eerste_verlofdag
            type: date
            description: Eerste dag van het gevraagde verlof.
        input:
          # Artikel 1: het schooljaar van het gevraagde verlof. De reductie
          # krijgt het mee, zodat zij per besluit alleen het besluit en het
          # schooljaar doorgeeft.
          - name: begin_schooljaar
            type: date
            source:
              regulation: fictief_beleid_vakantieverlof_obs_de_klimop
              output: begin_schooljaar_van_verlof
              parameters:
                eerste_verlofdag: $eerste_verlofdag
          - name: einde_schooljaar
            type: date
            source:
              regulation: fictief_beleid_vakantieverlof_obs_de_klimop
              output: einde_schooljaar_van_verlof
              parameters:
                eerste_verlofdag: $eerste_verlofdag
          - name: antwoord_verlof_al_verleend
            type: boolean
            nullable: true
            source:
              reduction: verlof_al_verleend_in_schooljaar
              parameters:
                bsn_jongere: $bsn_jongere
                begin_schooljaar: $begin_schooljaar
                einde_schooljaar: $einde_schooljaar
        output:
          - name: verlof_al_verleend_in_schooljaar
            type: boolean
            description: >-
              Of het hoofd de jongere in het schooljaar van het gevraagde verlof
              al verlof verleende: het antwoord van de cel, of zonder dat wat
              het hoofd vaststelt.
        actions:
          - output: verlof_al_verleend_in_schooljaar
            value:
              operation: IF
              cases:
                - when:
                    operation: EQUALS
                    subject: $antwoord_verlof_al_verleend
                    value: null
                  then: $verlof_al_verleend_in_schooljaar_volgens_hoofd
              default: $antwoord_verlof_al_verleend
  - number: '3'
    text: >-
      FICTIEF, eigen keuze in de modellering: geen bekendgemaakt beleid. Het
      gevraagde verlof valt buiten de schoolvakanties als geen dag ervan valt
      in de kerst-, mei- of zomervakantie die de Regeling vaststelling
      schoolvakanties 2025–2030 voor de regio van de school vaststelt, of in
      de herfst- of voorjaarsvakantie die het beleid van het bevoegd gezag
      vaststelt voor het schooljaar van de eerste verlofdag. Is een van die
      vakanties niet bekend, dan oordeelt het hoofd zelf.
    url: https://wetten.overheid.nl/BWBR0002628/2026-08-01#Artikel11
    machine_readable:
      # De kerst-, mei- en zomervakantie stelt de regeling vast (op grond van
      # artikel 15, tweede lid, van de Wet op het primair onderwijs), de
      # zomervakantie per regio. De regio volgt uit de plaats van vestiging,
      # die artikel 4 tot en met 6 aan de cel ontlenen, met de verlofdagen die
      # dit artikel de regeling meegeeft. De herfst- en voorjaarsvakantie
      # stelt het bevoegd gezag zelf vast, in zijn beleid
      # (fictief_beleid_vakantierooster_obs_de_klimop).
      # Niet gemodelleerd: de verlenging van de zomervakantie door het bevoegd
      # gezag (artikel 7, eerste lid, van de regeling), de afwijkingen in
      # artikel 7, tweede tot en met zesde lid, de ontheffing van artikel 8, en
      # vrije dagen die geen vakantie zijn. De regeling stelt geen
      # zomervakantie van 2025 vast (artikel 6 begint bij 2026); voor verlof
      # in het schooljaar 2025–2026 is de vorige zomer dus niet bekend.
      # Is een vakantie niet bekend, bijvoorbeeld in een schooljaar dat het
      # rooster niet bereikt, dan geldt het oordeel van het hoofd: een eigen
      # open begrip van dit artikel (decided_per_case_by), dat de engine alleen
      # vraagt als de vakanties niets zeggen.
      open_terms:
        - id: verlof_valt_buiten_schoolvakanties_volgens_hoofd
          type: boolean
          required: true
          decided_per_case_by: het hoofd van OBS De Klimop
          description: >-
            Het oordeel van het hoofd over de vraag of het gevraagde verlof
            buiten de schoolvakanties valt, als een vakantie van het
            schooljaar niet bekend is.
      implements:
        - law: leerplichtwet_1969
          article: 13a
          open_term: verlof_valt_buiten_schoolvakanties
      execution:
        parameters:
          - name: eerste_verlofdag
            type: date
            description: Eerste dag van het gevraagde verlof.
          - name: laatste_verlofdag
            type: date
            description: Laatste dag van het gevraagde verlof.
        input:
          # Het schooljaar van het gevraagde verlof is dat van de eerste
          # verlofdag (eigen keuze, zoals bij artikel 13a, tweede lid).
          - name: eerste_jaar_schooljaar
            type: number
            source:
              regulation: fictief_beleid_schooljaargrenzen_obs_de_klimop
              output: eerste_jaar_schooljaar
              parameters:
                datum: $eerste_verlofdag
          - name: laatste_jaar_schooljaar
            type: number
            source:
              regulation: fictief_beleid_schooljaargrenzen_obs_de_klimop
              output: laatste_jaar_schooljaar
              parameters:
                datum: $eerste_verlofdag
          # De regio van de school (artikel 2 van de regeling). De plaats van
          # vestiging koppelen artikel 4 tot en met 6 aan het antwoord van de
          # cel, voor de verlofdagen die dit artikel meegeeft; artikel 2
          # declareert ze niet, het beleid dat koppelt wel.
          - name: regio
            type: string
            nullable: true
            source:
              regulation: regeling_vaststelling_schoolvakanties_20252030
              output: regio_van_school
              parameters:
                eerste_verlofdag: $eerste_verlofdag
                laatste_verlofdag: $laatste_verlofdag
          - name: kerstvakantie_eerste_dag
            type: date
            nullable: true
            source:
              regulation: regeling_vaststelling_schoolvakanties_20252030
              output: kerstvakantie_eerste_dag
              parameters:
                eerste_jaar_schooljaar: $eerste_jaar_schooljaar
                regio: $regio
            description: Artikel 5, de kerstvakantie van het schooljaar.
          - name: kerstvakantie_laatste_dag
            type: date
            nullable: true
            source:
              regulation: regeling_vaststelling_schoolvakanties_20252030
              output: kerstvakantie_laatste_dag
              parameters:
                eerste_jaar_schooljaar: $eerste_jaar_schooljaar
                regio: $regio
            description: Artikel 5.
          - name: meivakantie_eerste_dag
            type: date
            nullable: true
            source:
              regulation: regeling_vaststelling_schoolvakanties_20252030
              output: meivakantie_eerste_dag
              parameters:
                eerste_jaar_schooljaar: $eerste_jaar_schooljaar
                regio: $regio
            description: Artikel 5, de meivakantie van het schooljaar.
          - name: meivakantie_laatste_dag
            type: date
            nullable: true
            source:
              regulation: regeling_vaststelling_schoolvakanties_20252030
              output: meivakantie_laatste_dag
              parameters:
                eerste_jaar_schooljaar: $eerste_jaar_schooljaar
                regio: $regio
            description: Artikel 5.
          - name: zomervakantie_eerste_dag
            type: date
            nullable: true
            source:
              regulation: regeling_vaststelling_schoolvakanties_20252030
              output: zomervakantie_eerste_dag
              parameters:
                jaar: $laatste_jaar_schooljaar
                regio: $regio
            description: Artikel 6, de zomervakantie aan het eind van het schooljaar.
          - name: zomervakantie_laatste_dag
            type: date
            nullable: true
            source:
              regulation: regeling_vaststelling_schoolvakanties_20252030
              output: zomervakantie_laatste_dag
              parameters:
                jaar: $laatste_jaar_schooljaar
                regio: $regio
            description: Artikel 6.
          - name: vorige_zomervakantie_eerste_dag
            type: date
            nullable: true
            source:
              regulation: regeling_vaststelling_schoolvakanties_20252030
              output: zomervakantie_eerste_dag
              parameters:
                jaar: $eerste_jaar_schooljaar
                regio: $regio
            description: >-
              Artikel 6, de zomervakantie aan het eind van het vorige
              schooljaar, die tot in dit schooljaar kan lopen.
          - name: vorige_zomervakantie_laatste_dag
            type: date
            nullable: true
            source:
              regulation: regeling_vaststelling_schoolvakanties_20252030
              output: zomervakantie_laatste_dag
              parameters:
                jaar: $eerste_jaar_schooljaar
                regio: $regio
            description: Artikel 6.
          - name: herfstvakantie_eerste_dag
            type: date
            nullable: true
            source:
              regulation: fictief_beleid_vakantierooster_obs_de_klimop
              output: herfstvakantie_eerste_dag
              parameters:
                eerste_jaar_schooljaar: $eerste_jaar_schooljaar
            description: De herfstvakantie van het schooljaar, uit het beleid van de school.
          - name: herfstvakantie_laatste_dag
            type: date
            nullable: true
            source:
              regulation: fictief_beleid_vakantierooster_obs_de_klimop
              output: herfstvakantie_laatste_dag
              parameters:
                eerste_jaar_schooljaar: $eerste_jaar_schooljaar
            description: Uit het beleid van de school.
          - name: voorjaarsvakantie_eerste_dag
            type: date
            nullable: true
            source:
              regulation: fictief_beleid_vakantierooster_obs_de_klimop
              output: voorjaarsvakantie_eerste_dag
              parameters:
                eerste_jaar_schooljaar: $eerste_jaar_schooljaar
            description: De voorjaarsvakantie van het schooljaar, uit het beleid van de school.
          - name: voorjaarsvakantie_laatste_dag
            type: date
            nullable: true
            source:
              regulation: fictief_beleid_vakantierooster_obs_de_klimop
              output: voorjaarsvakantie_laatste_dag
              parameters:
                eerste_jaar_schooljaar: $eerste_jaar_schooljaar
            description: Uit het beleid van de school.
        output:
          - name: verlof_valt_buiten_schoolvakanties_volgens_rooster
            type: boolean
            nullable: true
            description: >-
              Of het gevraagde verlof buiten de schoolvakanties valt volgens de
              regeling en het rooster van de school; afwezig als een vakantie
              van het schooljaar niet bekend is.
          - name: verlof_valt_buiten_schoolvakanties
            type: boolean
            description: >-
              Of het gevraagde verlof buiten de schoolvakanties valt: volgens
              de regeling en het rooster, of zonder dat het oordeel van het
              hoofd.
        actions:
          # Een vakantie raakt het verlof als zij begint op of vóór de
          # laatste verlofdag en eindigt op of na de eerste. Is een
          # periode niet bekend (de regeling stelt er geen vast voor deze
          # regio of dit jaar, of het beleid van de school kent het
          # schooljaar niet), dan is de uitkomst afwezig (null).
          - output: verlof_valt_buiten_schoolvakanties_volgens_rooster
            value:
              operation: IF
              cases:
                - when:
                    operation: AND
                    conditions:
                      - operation: NOT
                        value:
                          operation: EQUALS
                          subject: $kerstvakantie_eerste_dag
                          value: null
                      - operation: NOT
                        value:
                          operation: EQUALS
                          subject: $kerstvakantie_laatste_dag
                          value: null
                      - operation: NOT
                        value:
                          operation: EQUALS
                          subject: $meivakantie_eerste_dag
                          value: null
                      - operation: NOT
                        value:
                          operation: EQUALS
                          subject: $meivakantie_laatste_dag
                          value: null
                      - operation: NOT
                        value:
                          operation: EQUALS
                          subject: $vorige_zomervakantie_eerste_dag
                          value: null
                      - operation: NOT
                        value:
                          operation: EQUALS
                          subject: $vorige_zomervakantie_laatste_dag
                          value: null
                      - operation: NOT
                        value:
                          operation: EQUALS
                          subject: $zomervakantie_eerste_dag
                          value: null
                      - operation: NOT
                        value:
                          operation: EQUALS
                          subject: $zomervakantie_laatste_dag
                          value: null
                      - operation: NOT
                        value:
                          operation: EQUALS
                          subject: $herfstvakantie_eerste_dag
                          value: null
                      - operation: NOT
                        value:
                          operation: EQUALS
                          subject: $herfstvakantie_laatste_dag
                          value: null
                      - operation: NOT
                        value:
                          operation: EQUALS
                          subject: $voorjaarsvakantie_eerste_dag
                          value: null
                      - operation: NOT
                        value:
                          operation: EQUALS
                          subject: $voorjaarsvakantie_laatste_dag
                          value: null
                  then:
                    operation: NOT
                    value:
                      operation: OR
                      conditions:
                        # Kerstvakantie (regeling, artikel 5).
                        - operation: AND
                          conditions:
                            - operation: GREATER_THAN_OR_EQUAL
                              subject:
                                operation: DATE_DIFF
                                from: $kerstvakantie_eerste_dag
                                to: $laatste_verlofdag
                                in: days
                              value: 0
                            - operation: GREATER_THAN_OR_EQUAL
                              subject:
                                operation: DATE_DIFF
                                from: $eerste_verlofdag
                                to: $kerstvakantie_laatste_dag
                                in: days
                              value: 0
                        # Meivakantie (regeling, artikel 5).
                        - operation: AND
                          conditions:
                            - operation: GREATER_THAN_OR_EQUAL
                              subject:
                                operation: DATE_DIFF
                                from: $meivakantie_eerste_dag
                                to: $laatste_verlofdag
                                in: days
                              value: 0
                            - operation: GREATER_THAN_OR_EQUAL
                              subject:
                                operation: DATE_DIFF
                                from: $eerste_verlofdag
                                to: $meivakantie_laatste_dag
                                in: days
                              value: 0
                        # Zomervakantie van het vorige schooljaar (regeling, artikel 6).
                        - operation: AND
                          conditions:
                            - operation: GREATER_THAN_OR_EQUAL
                              subject:
                                operation: DATE_DIFF
                                from: $vorige_zomervakantie_eerste_dag
                                to: $laatste_verlofdag
                                in: days
                              value: 0
                            - operation: GREATER_THAN_OR_EQUAL
                              subject:
                                operation: DATE_DIFF
                                from: $eerste_verlofdag
                                to: $vorige_zomervakantie_laatste_dag
                                in: days
                              value: 0
                        # Zomervakantie (regeling, artikel 6).
                        - operation: AND
                          conditions:
                            - operation: GREATER_THAN_OR_EQUAL
                              subject:
                                operation: DATE_DIFF
                                from: $zomervakantie_eerste_dag
                                to: $laatste_verlofdag
                                in: days
                              value: 0
                            - operation: GREATER_THAN_OR_EQUAL
                              subject:
                                operation: DATE_DIFF
                                from: $eerste_verlofdag
                                to: $zomervakantie_laatste_dag
                                in: days
                              value: 0
                        # Herfstvakantie (beleid van de school).
                        - operation: AND
                          conditions:
                            - operation: GREATER_THAN_OR_EQUAL
                              subject:
                                operation: DATE_DIFF
                                from: $herfstvakantie_eerste_dag
                                to: $laatste_verlofdag
                                in: days
                              value: 0
                            - operation: GREATER_THAN_OR_EQUAL
                              subject:
                                operation: DATE_DIFF
                                from: $eerste_verlofdag
                                to: $herfstvakantie_laatste_dag
                                in: days
                              value: 0
                        # Voorjaarsvakantie (beleid van de school).
                        - operation: AND
                          conditions:
                            - operation: GREATER_THAN_OR_EQUAL
                              subject:
                                operation: DATE_DIFF
                                from: $voorjaarsvakantie_eerste_dag
                                to: $laatste_verlofdag
                                in: days
                              value: 0
                            - operation: GREATER_THAN_OR_EQUAL
                              subject:
                                operation: DATE_DIFF
                                from: $eerste_verlofdag
                                to: $voorjaarsvakantie_laatste_dag
                                in: days
                              value: 0
          - output: verlof_valt_buiten_schoolvakanties
            value:
              operation: IF
              cases:
                - when:
                    operation: EQUALS
                    subject: $verlof_valt_buiten_schoolvakanties_volgens_rooster
                    value: null
                  then: $verlof_valt_buiten_schoolvakanties_volgens_hoofd
              default: $verlof_valt_buiten_schoolvakanties_volgens_rooster
  - number: '4'
    text: >-
      FICTIEF, eigen keuze in de modellering: geen bekendgemaakt beleid. De
      gemeente waarin de school gevestigd is, ontleent het hoofd aan het
      antwoord van zijn eigen cel over de vastgelegde vestiging op de
      verlofdagen.
    url: https://wetten.overheid.nl/BWBR0049811/2025-08-01#Artikel2
    machine_readable:
      # De verlofdagen geeft wie de regio voor een verlof vraagt mee aan
      # artikel 2 van de regeling, dat ze niet declareert; zonder hen faalt
      # het antwoord in de cel.
      implements:
        - law: regeling_vaststelling_schoolvakanties_20252030
          article: '2'
          open_term: gemeente_van_vestiging
      execution:
        parameters:
          - name: eerste_verlofdag
            type: date
            description: Eerste dag van het gevraagde verlof.
          - name: laatste_verlofdag
            type: date
            description: Laatste dag van het gevraagde verlof.
        input:
          - name: antwoord_gemeente
            type: string
            nullable: true
            source:
              reduction: gemeente_van_vestiging
              parameters:
                eerste_verlofdag: $eerste_verlofdag
                laatste_verlofdag: $laatste_verlofdag
        output:
          - name: gemeente_van_vestiging
            type: string
            nullable: true
        actions:
          - output: gemeente_van_vestiging
            value: $antwoord_gemeente
  - number: '5'
