---
# Casus: vakantieverlof bij een fictieve school.
#
# Configuratie is alleen wat niet uit de wet volgt, en het corpus: welke
# regelwerken in deze casus gelden. De regelwerken die de cel daarvan draait,
# het artikel van het bezwaar en de naam van wie beslist, leidt de app af uit
# dit artikel en de cel, binnen dat corpus (src/casus.rs).
cel: obs_de_klimop
artikel: leerplichtwet_1969#13a
# Het corpus van deze casus: alleen deze regelwerken gelden. Hieronder de
# gedeelde, elk een map onder het corpus van de poc; de eigen regelwerken
# van de casus, in casussen/vakantieverlof/regulation/nl, gelden zonder dat ze hier
# staan. De reducties van de cellen van de casus komen met die cellen mee.
corpus:
  - regulation/nl/wet/algemene_wet_bestuursrecht
  - cells/reductions/reductie_algemene_wet_bestuursrecht
# De uitvoer die zegt of het besluit het gevraagde toewijst. De wet merkt die
# niet aan: decision_type TOEKENNING zegt wat voor besluit het is, niet welke
# van zijn uitvoer de toewijzing is.
uitkomst: verlof_verleend

# Wat de bezoeker leest.
titel: Vakantieverlof
cel_naam: OBS De Klimop
speeldatum: 2026-10-14

# Fictieve voorbeeldgegevens. Volg je een scenario, dan begint elk formulier
# hiermee, met de waarden van de stap erover; bij vrij spelen blijft het leeg.
# Een BSN uit de testreeks; vijf schooldagen, dus het oordeel van het hoofd
# over het beroep van de ouder beslist.
voorbeeld:
  aanvraag:
    bsn_jongere: '999990019'
    eerste_verlofdag: '2027-02-01'
    laatste_verlofdag: '2027-02-05'
    aanvraag_ondertekend: true
    naam_aanvrager: J. Jansen
    adres_aanvrager: Voorbeeldstraat 1
    dagtekening: '2026-10-12'
    gevraagde_beschikking: vakantieverlof
  bevindingen:
    specifieke_aard_beroep_ouder: true
  bezwaar:
    bezwaar_of_beroepschrift_ondertekend: true
    naam_indiener: J. Jansen
    adres_indiener: Voorbeeldstraat 1
    omschrijving_bestreden_besluit: weigering vakantieverlof
    gronden_bezwaar_of_beroep: 'verklaring van de werkgever: geen verlof in de schoolvakanties'
  # Het beroepschrift (Awb 6:5): dezelfde velden als het bezwaarschrift.
  beroep:
    bezwaar_of_beroepschrift_ondertekend: true
    naam_indiener: J. Jansen
    adres_indiener: Voorbeeldstraat 1
    omschrijving_bestreden_besluit: beslissing op bezwaar tegen de weigering van vakantieverlof
    gronden_bezwaar_of_beroep: de beslissing is niet deugdelijk gemotiveerd
  # Wat de rechter vindt (Awb 8:70 en 8:72): het beroep is gegrond, de
  # rechtsgevolgen blijven niet in stand, de rechter voorziet niet zelf in
  # de zaak en de school krijgt twee weken.
  uitspraak:
    indiener_is_belanghebbende: true
    rechtsregel_geschonden: true
    geschonden_rechtsregel: artikel 7:12, eerste lid, van de Algemene wet bestuursrecht
    rechtsgevolgen_in_stand: false
    uitspraak_treedt_in_de_plaats: false
    termijn_nieuw_besluit: '2027-01-25'

# Wat de school vastlegde vóór het eerste scenario (RFC-051), bij elke start
# en reset opnieuw, via de cel zoals elke stap. De regeling vaststelling
# schoolvakanties leidt de regio af uit de plaats van vestiging (art. 2): de
# vestiging is een executogram van het feit dat het fictieve beleid
# fictief_beleid_vestiging_obs_de_klimop vereist; geen artikel in het corpus
# vereist dat feit letterlijk. De herfst- en
# voorjaarsvakantie staan in het fictieve beleid van de school
# (fictief_beleid_vakantierooster_obs_de_klimop). Zo beantwoordt de cel
# verlof_valt_buiten_schoolvakanties zelf; 1 tot en met 5 februari en 10 tot
# en met 14 mei 2027 vallen buiten de vakanties van regio midden.
begin:
  datum: 2026-08-01
  executogrammen:
    - feit: fictief_beleid_vestiging_obs_de_klimop#1#vestiging
      velden:
        gemeente: Utrecht
        provincie: Utrecht
        sinds: '2020-08-01'

# De andere cellen van de sfeer (RFC-052).
andere_cellen:
  # De bestuursrechter (RFC-053): ook een andere cel, met een eigen kroniek.
  # Dat zij de rechter is, zegt haar cel.yaml (categorie "de
  # bestuursrechter", wie volgens Awb 8:70 beslist). Het artikel van het
  # beroep en het feit waarin de school de ontvangst van een uitspraak
  # vastlegt (Awb 8:79), leidt de app af uit de wet.
  - cel: rechtbank_wilgendaal
    cel_naam: Rechtbank Wilgendaal

# The scenarios, step by step. Each step says what the visitor does
# (`stap`), on which play date, with which values (`invoer`, over the
# example values above) and what it comes to (`uitkomst`), with the text of
# the guide (`tekst`, `gezien`). The guide beside the page and the forms read
# them from here (frontend/src/scenarioGuides.js, scenarioInvoer.js), and
# tests/scenarios.rs plays every scenario with exactly these values.
scenarios:
  - naam: Aanvraag wordt verleend
    samenvatting: >-
      Een ouder vraagt verlof in februari, en het hoofd verleent het.
    stappen:
      - stap: aanvraag
      - stap: besluit
        uitkomst: toegewezen
        tekst: >-
          Laat "specifieke aard beroep ouder" aan staan en klik op Besluit
          nemen.
    eind: >-
      Bij Aanvrager staat de aanvraag op Toegewezen.
  - naam: 'Afwijzing, bezwaar en heroverweging: gegrond'
    samenvatting: >-
      Het hoofd weigert het verlof, maar na het bezwaar van de ouder krijgt de
      jongere bij heroverweging alsnog verlof.
    stappen:
      - stap: aanvraag
      - stap: besluit
        invoer:
          specifieke_aard_beroep_ouder: false
        uitkomst: afgewezen
        gezien: >-
          Bij Aanvrager staat de aanvraag op Afgewezen.
      - stap: bezwaar
        datum: 2026-11-01
      - stap: beslissing_op_bezwaar
        datum: 2026-11-15
        invoer:
          specifieke_aard_beroep_ouder: true
        uitkomst: gegrond
        tekst: >-
          Klik onder Open bezwaren op Ontvankelijkheid toetsen en dan op
          Beslissen op bezwaar.
    eind: >-
      Gegrond: het besluit is herroepen. Er is een nieuw besluit, en dat
      verleent het verlof. In de Kroniek staan zes chronolexogrammen: de
      vestiging die de school vooraf vastlegde en vijf uit dit scenario.
  - naam: 'Afwijzing, bezwaar en heroverweging: ongegrond'
    samenvatting: >-
      Een tweede verlof in hetzelfde schooljaar wordt geweigerd, en het
      bezwaar daartegen houdt geen stand.
    stappen:
      - stap: aanvraag
      - stap: besluit
        uitkomst: toegewezen
        gezien: >-
          Het verlof is verleend. Bij de tweede aanvraag leest de school dit
          besluit terug.
      - stap: aanvraag
        invoer:
          eerste_verlofdag: '2027-05-10'
          laatste_verlofdag: '2027-05-14'
      - stap: besluit
        uitkomst: afgewezen
        tekst: >-
          Klik bij de tweede aanvraag op Besluit nemen.
        gezien: >-
          Het verlof is geweigerd: de school antwoordt uit haar eigen kroniek
          dat de jongere dit schooljaar al verlof kreeg. In het Logboek staat
          bij het besluit de keten.
      - stap: bezwaar
        datum: 2026-11-01
        op: 2
        tekst: >-
          Klik bij het besluit op de tweede aanvraag op Bezwaar maken en dan
          op Bezwaar indienen.
      - stap: beslissing_op_bezwaar
        datum: 2026-11-15
        uitkomst: ongegrond
        tekst: >-
          Klik onder Open bezwaren op Ontvankelijkheid toetsen, laat de
          bevinding staan en klik op Beslissen op bezwaar.
    eind: >-
      Ongegrond: de heroverweging geeft dezelfde uitkomst. Het besluit blijft,
      er komt geen nieuw besluit.
  - naam: 'Bezwaar te laat: niet-ontvankelijk'
    samenvatting: >-
      De ouder maakt pas na de bezwaartermijn bezwaar, en dat wordt niet
      heroverwogen.
    stappen:
      - stap: aanvraag
      - stap: besluit
        invoer:
          specifieke_aard_beroep_ouder: false
        uitkomst: afgewezen
      - stap: bezwaar
        datum: 2026-12-01
        gezien: >-
          De cel legt het bezwaar vast, ook al is het te laat. Of het op tijd
          is, blijkt pas bij Ontvankelijkheid toetsen (Awb 7:11).
      - stap: beslissing_op_bezwaar
        uitkomst: niet_ontvankelijk
        tekst: >-
          Klik onder Open bezwaren op Ontvankelijkheid toetsen en dan op
          Beslissen op bezwaar.
    eind: >-
      Niet-ontvankelijk: het bezwaar kwam te laat. Er is geen heroverweging,
      dus geen vragen aan het hoofd. Na Beslissen op bezwaar blijft het
      besluit staan.
  - naam: Tweede bezwaar tegen een vervangen besluit
    samenvatting: >-
      De ouder maakt twee keer bezwaar tegen hetzelfde besluit, en de cel
      vervangt een besluit maar één keer.
    stappen:
      - stap: aanvraag
      - stap: besluit
        uitkomst: toegewezen
      - stap: bezwaar
        datum: 2026-11-01
      - stap: bezwaar
        datum: 2026-11-02
        op: 1
        tekst: >-
          Klik nog een keer bij hetzelfde besluit op Bezwaar maken en dan op
          Bezwaar indienen.
        gezien: >-
          Er staan twee bezwaren tegen hetzelfde besluit open, onder
          Bestuursorgaan.
      - stap: beslissing_op_bezwaar
        titel: Beslissen op het eerste bezwaar
        datum: 2026-11-15
        op: 1
        invoer:
          specifieke_aard_beroep_ouder: false
        uitkomst: gegrond
        tekst: >-
          Klik bij het eerste bezwaar op Ontvankelijkheid toetsen en dan op
          Beslissen op bezwaar.
        gezien: >-
          Gegrond: een weigering komt in de plaats van het besluit. Het tweede
          bezwaar staat nog open.
      - stap: beslissing_op_bezwaar
        titel: Beslissen op het tweede bezwaar
        datum: 2026-11-16
        op: 2
        invoer:
          specifieke_aard_beroep_ouder: false
        uitkomst: geweigerd
        tekst: >-
          Klik bij het tweede bezwaar op Ontvankelijkheid toetsen en dan op
          Beslissen op bezwaar.
    eind: >-
      De cel weigert deze stap: een besluit wordt maar één keer vervangen. De
      melding noemt het besluit dat het al vervangt; onder Details staat wat
      de cel zelf meldt. Er komt niets bij in de kroniek.
  - naam: Een herroepen verlof telt niet meer mee
    samenvatting: >-
      Wordt het eerste verlof herroepen, dan telt het niet meer bij het
      tweede.
    stappen:
      - stap: aanvraag
      - stap: besluit
        uitkomst: toegewezen
      - stap: aanvraag
        invoer:
          eerste_verlofdag: '2027-05-10'
          laatste_verlofdag: '2027-05-14'
      - stap: besluit
        uitkomst: afgewezen
        gezien: >-
          Verlof B is geweigerd: de school las A in haar kroniek, dus de
          jongere kreeg dit schooljaar al verlof.
      - stap: bezwaar
        datum: 2026-11-01
        op: 1
        tekst: >-
          Klik bij het besluit op de eerste aanvraag (A) op Bezwaar maken en
          dan op Bezwaar indienen.
      - stap: beslissing_op_bezwaar
        datum: 2026-11-15
        invoer:
          specifieke_aard_beroep_ouder: false
        uitkomst: gegrond
        tekst: >-
          Klik onder Open bezwaren op Ontvankelijkheid toetsen en dan op
          Beslissen op bezwaar.
        gezien: >-
          Gegrond: A is herroepen, en een weigering komt in de plaats.
      - stap: bezwaar
        titel: Bezwaar maken tegen B
        datum: 2026-11-20
        op: 2
        tekst: >-
          Klik bij het besluit op de tweede aanvraag (B) op Bezwaar maken en
          dan op Bezwaar indienen.
      - stap: beslissing_op_bezwaar
        titel: Beslissen op het bezwaar tegen B
        datum: 2026-12-01
        uitkomst: gegrond
        tekst: >-
          Klik onder Open bezwaren op Ontvankelijkheid toetsen, laat de
          bevinding staan en klik op Beslissen op bezwaar.
    eind: >-
      Gegrond: B is herroepen, en het nieuwe besluit verleent het verlof. In
      het Logboek staat bij het besluit "verlof al verleend in schooljaar:
      nee", ingevuld door het beleid van het hoofd met het antwoord van de
      cel. Haar reductie sloeg twee besluiten onder artikel 13a over: A, dat
      herroepen is, en de weigering die ervoor in de plaats kwam.
  - naam: 'Verlof in de kerstvakantie: geweigerd zonder oordeel van het hoofd'
    samenvatting: >-
      Verlof in de kerstvakantie wordt geweigerd, omdat het vakantierooster
      van de school laat zien dat die dagen in een schoolvakantie vallen.
    stappen:
      - stap: aanvraag
        invoer:
          eerste_verlofdag: '2026-12-21'
          laatste_verlofdag: '2026-12-23'
      - stap: besluit
        uitkomst: afgewezen
        tekst: >-
          Laat "specifieke aard beroep ouder" aan staan en klik op Besluit
          nemen.
    eind: >-
      Het verlof wordt geweigerd. Het hoofd oordeelde niet over de
      schoolvakanties: in het Logboek staat bij het besluit "verlof valt
      buiten schoolvakanties: nee", ingevuld door het beleid van het hoofd met
      het antwoord van de cel. Haar reductie las de regio Midden en de
      kerstvakantie van 19 december 2026 tot en met 3 januari 2027 uit de
      regeling, en de herfst- en voorjaarsvakantie uit het beleid van de
      school. De regio volgt uit de plaats van vestiging, Utrecht, die de cel
      binnen die reductie zelf gaf; onderaan het Logboek staat het executogram
      van de vestiging.
  - naam: 'Verlof in een schooljaar dat de school nog niet kent: het hoofd oordeelt'
    samenvatting: >-
      Staat het schooljaar nog niet in het vakantierooster, dan vraagt het
      formulier het hoofd of het verlof buiten de schoolvakanties valt.
    stappen:
      - stap: aanvraag
        invoer:
          eerste_verlofdag: '2027-12-20'
          laatste_verlofdag: '2027-12-22'
      - stap: besluit
        invoer:
          verlof_valt_buiten_schoolvakanties_volgens_hoofd: false
        uitkomst: afgewezen
    eind: >-
      Het verlof wordt geweigerd. In het Logboek staat bij het besluit "verlof
      valt buiten schoolvakanties volgens hoofd: nee" als bevinding van het
      bestuursorgaan bij artikel 4 van het beleid; het beleid vulde er artikel
      13a mee in, omdat de school geen antwoord had.
  - naam: Bezwaar ongegrond, beroep gegrond, nieuw besluit op bezwaar
    samenvatting: >-
      Na een ongegrond bezwaar gaat de ouder in beroep; de rechter vernietigt
      en het hoofd beslist opnieuw.
    stappen:
      - stap: aanvraag
      - stap: besluit
        invoer:
          specifieke_aard_beroep_ouder: false
        uitkomst: afgewezen
      - stap: bezwaar
        datum: 2026-11-01
      - stap: beslissing_op_bezwaar
        datum: 2026-11-15
        uitkomst: ongegrond
        tekst: >-
          Klik onder Open bezwaren op Ontvankelijkheid toetsen, laat de
          bevinding staan en klik op Beslissen op bezwaar.
        gezien: >-
          Ongegrond: de weigering blijft. Bij Aanvrager kun je nu in beroep
          gaan.
      - stap: beroep
        datum: 2026-12-01
      - stap: uitspraak
        datum: 2027-01-11
      - stap: toezenden
        tekst: >-
          Klik bij de uitspraak op Toezenden aan OBS De Klimop.
        gezien: >-
          De school legt de ontvangst vast in haar eigen kroniek (Awb 8:79).
          Onder Bestuursorgaan staat nu Na een uitspraak.
      - stap: opnieuw_beslissen
        datum: 2027-01-18
        invoer:
          specifieke_aard_beroep_ouder: true
        uitkomst: gegrond
    eind: >-
      Gegrond: de weigering is herroepen, en het nieuwe besluit verleent het
      verlof van 1 tot en met 5 februari 2027, binnen de termijn van de
      rechter. De Kroniek toont twee kronieken. In die van de school staan de
      ontvangst van de uitspraak, ontvangen van de rechtbank, en twee
      beslissingen op hetzelfde bezwaar; de tweede is genomen na die
      ontvangst. In die van de rechtbank staan het beroep, met het afschrift
      dat zij van de school ontving, en de uitspraak.
