---
# Casus: de bedrijfsparkeervergunning bij een fictieve gemeente.
#
# Configuratie is alleen wat niet uit de wet volgt, en het corpus: welke
# regelwerken in deze casus gelden. De regelwerken die de cel daarvan draait,
# het artikel van het bezwaar en de naam van wie beslist, leidt de app af uit
# dit artikel en de cel, binnen dat corpus (src/casus.rs).
cel: gemeente_wilgendaal
artikel: parkeerverordening_gemeente_wilgendaal#2
# Het corpus van deze casus: alleen deze regelwerken gelden. Hieronder de
# gedeelde, elk een map onder het corpus van de poc; de eigen regelwerken
# van de casus, in casussen/bedrijfsparkeervergunning/regulation/nl, gelden zonder dat ze hier
# staan. De reducties van de cellen van de casus komen met die cellen mee.
corpus:
  - regulation/nl/gemeentelijke_verordening/wilgendaal/parkeerverordening_gemeente_wilgendaal
  - regulation/nl/wet/algemene_wet_bestuursrecht
  - regulation/nl/amvb/besluit_administratieve_bepalingen_inzake_het_wegverkeer_babw
  - regulation/nl/ministeriele_regeling/regeling_gehandicaptenparkeerkaart
  - regulation/nl/uitvoeringsbeleid/beleid_gehandicaptenparkeerkaart_gemeente_wilgendaal
  - regulation/nl/uitvoeringsbeleid/beleid_geneeskundig_advies_gemeente_wilgendaal
  - regulation/nl/gemeentelijke_verordening/wilgendaal/uitvoeringsbesluit_parkeren_gemeente_wilgendaal
  - regulation/nl/uitvoeringsbeleid/beleid_bedrijfsparkeervergunning_gemeente_wilgendaal
  - regulation/nl/uitvoeringsbeleid/beleid_verleende_bedrijfsparkeervergunningen_gemeente_wilgendaal
  - regulation/nl/uitvoeringsbeleid/beleid_verstrekte_gehandicaptenparkeerkaarten_gemeente_wilgendaal
  - regulation/nl/wet/wet_digitale_overheid
# De uitvoer die zegt of het besluit het gevraagde toewijst. De verordening
# merkt die niet aan: decision_type TOEKENNING zegt wat voor besluit het is,
# niet welke van zijn uitvoer de toewijzing is.
uitkomst: bedrijfsparkeervergunning_verleend

# Wat de bezoeker leest.
titel: Bedrijfsparkeervergunning
cel_naam: gemeente Wilgendaal
speeldatum: 2026-10-13

# Wie inlogt: de aanvrager kiest een authenticatie die de erkende dienst
# voor bedrijfs- en organisatiemiddelen vastlegde, zoals eHerkenning er een
# doorgeeft, en het KvK-nummer daarvan gaat in de aanvraag. Geen naam: die
# geeft eHerkenning niet door. Een gesimuleerde login, geen echt inlogmiddel.
inloggen:
  feit: wet_digitale_overheid#15#authenticatie_verricht
  sleutel: kvk_nummer
  veld: kvk_nummer

# Fictieve voorbeeldgegevens. Volg je een scenario, dan begint elk formulier
# hiermee, met de waarden van de stap erover; bij vrij spelen blijft het leeg.
# Het KvK-nummer is dat van een verzonnen bakkerij in de binnenstad; de
# KvK-nummers en het kenteken zijn verzonnen. Alleen bij een bedrijf op het
# maximum vraagt het formulier een bevinding: het oordeel over de
# hardheidsclausule. Het voorbeeld past die niet toe. De rest geven de Kamer
# van Koophandel en de cel van de gemeente. De naam en het adres vult het
# formulier vooraf in uit het handelsregister (ui_spec.yaml in
# casussen/bedrijfsparkeervergunning), bij het KvK-nummer van wie inlogt.
voorbeeld:
  aanvraag:
    kvk_nummer: '99990011'
    kenteken: ZZ-001-Z
    aanvraag_ondertekend: true
    naam_aanvrager: Bakkerij De Wilg
    adres_aanvrager: Kerkstraat 1, 7711 AB Wilgendaal
    dagtekening: '2026-10-05'
    gevraagde_beschikking: bedrijfsparkeervergunning
  bevindingen:
    toepassing_leidt_tot_onaanvaardbare_gevolgen: false
  bezwaar:
    bezwaar_of_beroepschrift_ondertekend: true
    naam_indiener: Fietsenmakerij Kade
    adres_indiener: Kade 3, 7713 AA Wilgendaal
    omschrijving_bestreden_besluit: weigering van een bedrijfsparkeervergunning
    gronden_bezwaar_of_beroep: er werken nu twee mensen in het bedrijf
  # Wat het bestuursorgaan oordeelt over de ontvankelijkheid van het
  # bezwaar (Awb 7:11): de indiener is belanghebbende (1:2, 7:1 en 8:1),
  # en was bij een te laat bezwaarschrift in verzuim (6:11).
  beslissing_op_bezwaar:
    indiener_bezwaarschrift_is_belanghebbende: true
    indiener_bezwaarschrift_niet_in_verzuim: false
  # Het beroepschrift (Awb 6:5): dezelfde velden als het bezwaarschrift.
  beroep:
    bezwaar_of_beroepschrift_ondertekend: true
    naam_indiener: Fietsenmakerij Kade
    adres_indiener: Kade 3, 7713 AA Wilgendaal
    omschrijving_bestreden_besluit: beslissing op bezwaar over de bedrijfsparkeervergunning
    gronden_bezwaar_of_beroep: het maximum hoort het aantal werknemers te volgen
  # Wat de rechter vindt (Awb 8:70): de gemeente schond geen rechtsregel.
  uitspraak:
    indiener_is_belanghebbende: true
    indiener_beroepschrift_niet_in_verzuim: false
    rechtsregel_geschonden: false

# De andere cellen van de sfeer (RFC-048). Het open begrip zegt wie bevoegd
# is: de Kamer van Koophandel voor wat het handelsregister vermeldt (artikel 2
# en 3 van het fictieve uitvoeringsbesluit parkeren van Wilgendaal), de
# erkende dienst voor wat zij bij een authenticatie verklaarde (artikel 4).
# Elke cel legt bij elke start en reset opnieuw vast wat zij vóór het eerste
# scenario wist, via de cel zoals elke stap.
#
# - De Kamer schreef vier verzonnen bedrijven in, elk met een vestiging: een
#   bakkerij in de binnenstad (vier werkzame personen), een fietsenmakerij in
#   de schil (één werkzame persoon), een thuiszorgbedrijf in de binnenstad
#   (twaalf werkzame personen) en een adviesbureau buiten de
#   vergunninggebieden; verderop staan er nog drie. Executogrammen van het
#   feit dat artikel 1 van het fictieve beleid van de Kamer vereist; dat
#   artikel zegt ook wat het bevat.
#   Elk draagt de dag waarop de Kamer de gegevens opnam.
# - De gemeente zelf kent nog geen vergunning. Haar eigen cel begint vóór de
#   andere cellen, dus een vergunning die ze al verleende, kan dit bestand
#   niet geven: het besluit zou de Kamer vragen voordat die iets weet. Een
#   eerdere vergunning ontstaat daarom in het scenario zelf.
andere_cellen:
  - cel: kamer_van_koophandel
    cel_naam: Kamer van Koophandel
    begin:
      datum: 2026-03-02
      executogrammen:
        - feit: beleid_handelsregister_kamer_van_koophandel#1#vestiging_ingeschreven
          datum: 2026-01-05
          velden:
            kvk_nummer: '99990011'
            handelsnaam: Bakkerij De Wilg
            bezoekadres: Kerkstraat 1, 7711 AB Wilgendaal
            postcode: 7711 AB
            aantal_werkzame_personen: 4
            datum_inschrijving: '2026-01-05'
        - feit: beleid_handelsregister_kamer_van_koophandel#1#vestiging_ingeschreven
          datum: 2026-02-02
          velden:
            kvk_nummer: '99990022'
            handelsnaam: Fietsenmakerij Kade
            bezoekadres: Kade 3, 7713 AA Wilgendaal
            postcode: 7713 AA
            aantal_werkzame_personen: 1
            datum_inschrijving: '2026-02-02'
        - feit: beleid_handelsregister_kamer_van_koophandel#1#vestiging_ingeschreven
          datum: 2026-02-16
          velden:
            kvk_nummer: '99990044'
            handelsnaam: Thuiszorg De Linde
            bezoekadres: Lindelaan 2, 7711 AA Wilgendaal
            postcode: 7711 AA
            aantal_werkzame_personen: 12
            datum_inschrijving: '2026-02-16'
        - feit: beleid_handelsregister_kamer_van_koophandel#1#vestiging_ingeschreven
          datum: 2026-03-02
          velden:
            kvk_nummer: '99990033'
            handelsnaam: Adviesbureau Buitenweg
            bezoekadres: Buitenweg 4, 7720 BC Wilgendaal
            postcode: 7720 BC
            aantal_werkzame_personen: 3
            datum_inschrijving: '2026-03-02'
        # Een drukkerij in de schil, met één werkzame persoon ingeschreven.
        # Het kenmerk noemt deze inschrijving in de casus, zodat een later
        # feit ernaar kan verwijzen (verwijst_naar).
        - feit: beleid_handelsregister_kamer_van_koophandel#1#vestiging_ingeschreven
          kenmerk: inschrijving_drukkerij
          datum: 2026-03-02
          velden:
            kvk_nummer: '99990066'
            handelsnaam: Drukkerij De Pers
            bezoekadres: Singel 9, 7713 AB Wilgendaal
            postcode: 7713 AB
            aantal_werkzame_personen: 1
            datum_inschrijving: '2026-02-23'
        # Er werkten er al twee: de Kamer verbetert de inschrijving
        # (artikel 2 van haar fictieve beleid). De correctie verwijst naar
        # de inschrijving en geldt vanaf de dag ervan.
        - feit: beleid_handelsregister_kamer_van_koophandel#2#inschrijving_gecorrigeerd
          verwijst_naar: inschrijving_drukkerij
          datum: 2026-03-02
          velden:
            postcode: 7713 AB
            aantal_werkzame_personen: 2
        # Twee bedrijven in de binnenstad voor de scenario's over inloggen:
        # een kapsalon en een bloemist.
        - feit: beleid_handelsregister_kamer_van_koophandel#1#vestiging_ingeschreven
          datum: 2026-03-02
          velden:
            kvk_nummer: '99990077'
            handelsnaam: Kapsalon De Krul
            bezoekadres: Kerkstraat 5, 7711 AB Wilgendaal
            postcode: 7711 AB
            aantal_werkzame_personen: 2
            datum_inschrijving: '2026-03-02'
        - feit: beleid_handelsregister_kamer_van_koophandel#1#vestiging_ingeschreven
          datum: 2026-03-02
          velden:
            kvk_nummer: '99990088'
            handelsnaam: Bloemist Het Veld
            bezoekadres: Markt 3, 7711 AC Wilgendaal
            postcode: 7711 AC
            aantal_werkzame_personen: 1
            datum_inschrijving: '2026-03-02'
  # De erkende dienst voor bedrijfs- en organisatiemiddelen (artikel 15 van
  # de Wet digitale overheid). Zij is bevoegd voor de begrippen van artikel 4
