---
$schema: https://raw.githubusercontent.com/NederlandseDigitaleDienst/regelrecht/refs/tags/schema-v0.8.13/schema/v0.8.13/schema.json
$id: reductie_drukopdrachten
regulatory_layer: REDUCTIE
publication_date: '2025-12-01'
valid_from: '2026-01-01'
# Geen regelgeving: een reductie van de (fictieve) Kaartendrukkerij
# Wilgendaal over haar eigen kroniek (RFC-022 §4.1, RFC-048, RFC-051). Ze
# telt de drukopdrachten die de drukker ontving en de kaarten die hij
# leverde, de feiten die artikel 1 en 2 van het fictieve beleid
# beleid_uitreiking_gehandicaptenparkeerkaart_gemeente_wilgendaal vereisen.
# De cel van de drukker geeft die twee als antwoorden (cel.yaml, answers), en
# artikel 5 van dat beleid koppelt ze aan de open begrippen van artikel 2. Er
# is geen bekendmaking; de url wijst naar artikel 49 van het BABW.
url: https://wetten.overheid.nl/BWBR0004826/2026-01-01#Artikel49
name: Drukopdrachten bij de Kaartendrukkerij Wilgendaal (reductie)
articles:
  - number: '1'
    text: >-
      Geen regelgeving. Het systeem van de drukker telt door middel van een
      chronolexografische reductie op zijn eigen kroniek hoeveel
      drukopdrachten hij ontving en hoeveel kaarten hij leverde.
    url: https://wetten.overheid.nl/BWBR0004826/2026-01-01#Artikel49
    machine_readable:
      execution:
        input:
          - name: drukopdrachten
            type: array
            source:
              facts: beleid_uitreiking_gehandicaptenparkeerkaart_gemeente_wilgendaal#1#drukopdracht_ontvangen
          - name: leveringen
            type: array
            source:
              facts: beleid_uitreiking_gehandicaptenparkeerkaart_gemeente_wilgendaal#2#kaart_geleverd
        output:
          - name: aantal_drukopdrachten_ontvangen
            type: number
            description: Hoeveel drukopdrachten de drukker ontving.
          - name: aantal_kaarten_geleverd
            type: number
            description: Hoeveel kaarten de drukker drukte en leverde.
        actions:
          - output: aantal_drukopdrachten_ontvangen
            value:
              operation: FOREACH
              collection: $drukopdrachten
              as: drukopdracht
              body: 1
              combine: ADD
          - output: aantal_kaarten_geleverd
            value:
              operation: FOREACH
              collection: $leveringen
              as: levering
              body: 1
              combine: ADD
