---
$schema: https://raw.githubusercontent.com/NederlandseDigitaleDienst/regelrecht/refs/tags/schema-v0.8.16/schema/v0.8.16/schema.json
$id: reductie_bedrijfsparkeervergunning_op_peildatum
regulatory_layer: REDUCTIE
publication_date: '2025-12-01'
valid_from: '2026-01-01'
# Geen regelgeving: een reductie van het college van de (fictieve) gemeente
# Wilgendaal over zijn eigen kroniek (RFC-022 §4.1, RFC-048). Of er voor één
# kenteken op een dag een geldige bedrijfsparkeervergunning is. Ze speelt
# zelf niets af: ze leest de aggregaten van de besluiten voor dat kenteken
# (reductie_bedrijfsparkeervergunning) en die van de uitspraken van de
# voorzieningenrechter (reductie_schorsing_bedrijfsparkeervergunning), elk
# met hun laatste staat (source.projections, schema v0.8.15). Of een
# vergunning op de peildatum geldig is, zegt artikel 2 van het fictieve
# beleid verleende bedrijfsparkeervergunningen; de reductie geeft het de
# rijen en de dag. Omdat elk besluit en elke uitspraak een eigen aggregaat
# is, raakt een afschrift over een eerder besluit voor het kenteken de
# vergunning van een later besluit niet. Er is geen bekendmaking; de url
# wijst naar het model van de verordening.
url: https://lokaleregelgeving.overheid.nl/CVDR642699
name: Bedrijfsparkeervergunning op een peildatum bij de gemeente Wilgendaal (reductie)
articles:
  - number: '1'
    text: >-
      Geen regelgeving. Het systeem van het college van de gemeente Wilgendaal
      leest door middel van een chronolexografische reductie op zijn eigen
      kroniek of de bedrijfsparkeervergunning voor een kenteken op een dag
      geldig is: verleend, niet verlopen, niet herroepen of vernietigd, en op
      die dag niet geschorst door de voorzieningenrechter.
    url: https://lokaleregelgeving.overheid.nl/CVDR642699
    machine_readable:
      execution:
        parameters:
          - name: kenteken
            type: string
            description: Het kenteken waarvoor de vergunning geldt.
          - name: peildatum
            type: date
            description: De dag waarop de vergunning geldig moet zijn.
        input:
          - name: vergunningen
            type: array
            source:
              projections: reductie_bedrijfsparkeervergunning
              where:
                kenteken: $kenteken
          - name: schorsingen
            type: array
            source:
              projections: reductie_schorsing_bedrijfsparkeervergunning
          - name: geldig
            type: boolean
            source:
              regulation: beleid_verleende_bedrijfsparkeervergunningen_gemeente_wilgendaal
              output: een_geldige_vergunning
              parameters:
                vergunningen: $vergunningen
                schorsingen: $schorsingen
                peildatum: $peildatum
        output:
          - name: bedrijfsparkeervergunning_geldig_op_peildatum
            type: boolean
            description: >-
              Of de vergunning voor het kenteken op de peildatum geldig is.
        actions:
          - output: bedrijfsparkeervergunning_geldig_op_peildatum
            value: $geldig
