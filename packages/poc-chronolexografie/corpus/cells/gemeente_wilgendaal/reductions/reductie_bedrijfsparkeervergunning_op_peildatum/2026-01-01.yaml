---
$schema: https://raw.githubusercontent.com/NederlandseDigitaleDienst/regelrecht/refs/tags/schema-v0.8.16/schema/v0.8.16/schema.json
$id: reductie_bedrijfsparkeervergunning_op_peildatum
regulatory_layer: REDUCTIE
publication_date: '2025-12-01'
valid_from: '2026-01-01'
# Geen regelgeving: een reductie van het college van de (fictieve) gemeente
# Wilgendaal over zijn eigen kroniek (RFC-022 §4.1, RFC-048). Of de
# bedrijfsparkeervergunning voor één kenteken op een dag geldig is. Ze speelt
# de besluiten op de aanvragen voor dat kenteken af, en wat ernaar verwijst:
# een bezwaar, de beslissing erop, het afschrift van een uitspraak van de
# voorzieningenrechter dat de vergunning schorst (Awb 8:81 en 8:84, vierde
# lid) of de voorziening opheft (8:87), en het afschrift van de uitspraak in
# de hoofdzaak (8:79). Een schorsing trekt niets in: de stappen zetten de
# dagen die de records dragen in de staat. Of de vergunning op de peildatum
# geldig is, en of de voorziening dan vervallen is (8:85), zegt artikel 4
# van het fictieve beleid verleende bedrijfsparkeervergunningen; de reductie
# geeft het de staat en de dag. Dat de voorziening vervallen is, staat
# nergens als record: het volgt uit die dagen.
#
# De staat houdt één vergunning en één schorsing, omdat de sleutel één
# kenteken is. Wat de staat niet kan: een afschrift of opheffing aan het
# juiste besluit koppelen als één kenteken meer besluiten of schorsingen
# kent. De stap ziet alleen de staat van het kenteken, niet welk besluit die
# staat draagt; zie tests/schorsing.rs. Er is geen bekendmaking; de url
# wijst naar het model van de verordening.
url: https://lokaleregelgeving.overheid.nl/CVDR642699
name: Bedrijfsparkeervergunning op een peildatum bij de gemeente Wilgendaal (reductie)
articles:
  - number: '1'
    text: >-
      Geen regelgeving. Het systeem van het college van de gemeente Wilgendaal
      leest door middel van een chronolexografische reductie op zijn eigen
      kroniek of de bedrijfsparkeervergunning voor een kenteken op een dag
      geldig is: verleend, niet verlopen, niet herroepen of vernietigd, en op
      die dag niet geschorst door de voorzieningenrechter.
    url: https://lokaleregelgeving.overheid.nl/CVDR642699
    machine_readable:
      projection:
        key: kenteken
        state:
          - name: vergunning_geldig_tot
            type: date
          - name: geschorst_vanaf
            type: date
          - name: voorziening_vervalt_op
            type: date
          - name: voorziening_opgeheven_op
            type: date
          - name: uitspraak_hoofdzaak_op
            type: date
        steps:
          # TIJDELIJKE OMWEG, te verwijderen in PR D (het besluit als
          # aggregaat): deze stap neemt $peildatum, een parameter van de
          # vraag, zodat een besluit van na die dag niet meetelt. Daardoor
          # hangt de fold af van de vraag.
          - record: parkeerverordening_gemeente_wilgendaal#2#BESCHIKKING
            input:
              - name: geldig_tot_na_besluit
                type: date
                source:
                  regulation: beleid_verleende_bedrijfsparkeervergunningen_gemeente_wilgendaal
                  output: vergunning_geldig_tot_na_besluit
                  parameters: &na_besluit
                    vergunning_geldig_tot: $state.vergunning_geldig_tot
                    geschorst_vanaf: $state.geschorst_vanaf
                    bedrijfsparkeervergunning_verleend: $record.bedrijfsparkeervergunning_verleend
                    geldig_tot_volgens_besluit: $record.vergunning_geldig_tot
                    besluit_datum: $record.besluit_datum
                    peildatum: $peildatum
              - name: vanaf_na_besluit
                type: date
                source:
                  regulation: beleid_verleende_bedrijfsparkeervergunningen_gemeente_wilgendaal
                  output: geschorst_vanaf_na_besluit
                  parameters: *na_besluit
            actions:
              - output: vergunning_geldig_tot
                value: $geldig_tot_na_besluit
              - output: geschorst_vanaf
                value: $vanaf_na_besluit
          # Het afschrift van de uitspraak van de voorzieningenrechter.
          # TIJDELIJKE OMWEG, te verwijderen in PR D: ook deze stap neemt
          # $peildatum, zodat een schorsing die na die dag ingaat een eerdere
          # niet vervangt.
          - record: algemene_wet_bestuursrecht#8:84#EXECUTOGRAM
            input:
              - name: vanaf_na_uitspraak
                type: date
                source:
                  regulation: beleid_verleende_bedrijfsparkeervergunningen_gemeente_wilgendaal
                  output: geschorst_vanaf_na_uitspraak
                  parameters: &na_uitspraak
                    geschorst_vanaf: $state.geschorst_vanaf
                    voorziening_vervalt_op: $state.voorziening_vervalt_op
                    voorziening_opgeheven_op: $state.voorziening_opgeheven_op
                    uitspraak_hoofdzaak_op: $state.uitspraak_hoofdzaak_op
                    uitspraak_strekt_tot: $record.uitspraak_strekt_tot
                    besluit_geschorst_vanaf: $record.besluit_geschorst_vanaf
                    vervalt_volgens_uitspraak: $record.voorziening_vervalt_op
                    peildatum: $peildatum
              - name: vervalt_na_uitspraak
                type: date
                source:
                  regulation: beleid_verleende_bedrijfsparkeervergunningen_gemeente_wilgendaal
                  output: vervalt_op_na_uitspraak
                  parameters: *na_uitspraak
              - name: opgeheven_na_uitspraak
                type: date
                source:
                  regulation: beleid_verleende_bedrijfsparkeervergunningen_gemeente_wilgendaal
                  output: opgeheven_op_na_uitspraak
                  parameters: *na_uitspraak
              - name: hoofdzaak_na_uitspraak
                type: date
                source:
                  regulation: beleid_verleende_bedrijfsparkeervergunningen_gemeente_wilgendaal
                  output: uitspraak_hoofdzaak_na_uitspraak
                  parameters: *na_uitspraak
            actions:
              - output: geschorst_vanaf
                value: $vanaf_na_uitspraak
              - output: voorziening_vervalt_op
                value: $vervalt_na_uitspraak
              - output: voorziening_opgeheven_op
                value: $opgeheven_na_uitspraak
              - output: uitspraak_hoofdzaak_op
                value: $hoofdzaak_na_uitspraak
          # De voorzieningenrechter heft de voorziening op (8:87).
          - record: algemene_wet_bestuursrecht#8:87#EXECUTOGRAM
            actions:
              - output: voorziening_opgeheven_op
                value: $record.voorziening_opgeheven_op
          # De uitspraak in de hoofdzaak (8:79); de voorziening vervalt op de
          # dag ervan (8:85, tweede lid, onder c).
          - record: algemene_wet_bestuursrecht#8:79#EXECUTOGRAM
            actions:
              - output: uitspraak_hoofdzaak_op
                value: $record.uitspraak_datum
      execution:
        parameters:
          - name: kenteken
            type: string
            description: Het kenteken waarvoor de vergunning geldt.
          - name: peildatum
            type: date
            description: De dag waarop de vergunning geldig moet zijn.
        input:
          - name: geldig
            type: boolean
            source:
              regulation: beleid_verleende_bedrijfsparkeervergunningen_gemeente_wilgendaal
              output: vergunning_geldig_op_peildatum
              parameters:
                vergunning_geldig_tot: $state.vergunning_geldig_tot
                geschorst_vanaf: $state.geschorst_vanaf
                voorziening_vervalt_op: $state.voorziening_vervalt_op
                voorziening_opgeheven_op: $state.voorziening_opgeheven_op
                uitspraak_hoofdzaak_op: $state.uitspraak_hoofdzaak_op
                peildatum: $peildatum
        output:
          - name: bedrijfsparkeervergunning_geldig_op_peildatum
            type: boolean
            description: >-
              Of de vergunning voor het kenteken op de peildatum geldig is.
        actions:
          - output: bedrijfsparkeervergunning_geldig_op_peildatum
            value: $geldig
