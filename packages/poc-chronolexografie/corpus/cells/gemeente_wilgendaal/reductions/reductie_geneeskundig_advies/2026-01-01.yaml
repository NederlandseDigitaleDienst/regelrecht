---
$schema: https://raw.githubusercontent.com/NederlandseDigitaleDienst/regelrecht/refs/tags/schema-v0.8.19/schema/v0.8.19/schema.json
$id: reductie_geneeskundig_advies
regulatory_layer: REDUCTIE
publication_date: '2025-12-01'
valid_from: '2026-01-01'
# Geen regelgeving: een reductie van het college van de (fictieve) gemeente
# Wilgendaal over zijn eigen kroniek (RFC-022 §4.1, RFC-048, RFC-051), over
# het geneeskundig advies, met een aggregaat en twee read models in één
# bestand (schema v0.8.19). Artikel advies is een aggregaat per ontvangen
# advies: het feit geneeskundig_advies_ontvangen, dat artikel 5 van het
# fictieve beleid beleid_gehandicaptenparkeerkaart_gemeente_wilgendaal
# vereist, en wat ernaar verwijst. Artikel 5 vereist ook het feit
# geneeskundig_advies_uitgebracht, dat de GGD in haar eigen kroniek vastlegt;
# daarom noemt per het feit bij naam (schema v0.8.18). De staat houdt wat het
# advies vermeldt, onder de namen van het feit.
# De artikelen geneeskundig_advies en geneeskundig_onderzoek_heeft_plaatsgehad
# zijn read models over die aggregaten (source.projections). Welk advies telt,
# zegt het fictieve beleid beleid_geneeskundig_advies_gemeente_wilgendaal;
# het eerste read model geeft het de adviezen mee (source.regulation). Eigen
# keuze van deze PoC: een advies noemt de aanvrager en de dag van het
# onderzoek, en geldt daarmee ook als bewijs dat het onderzoek plaatsvond. De
# cel van de gemeente geeft de uitvoer als antwoorden (cel.yaml, answers):
# de vier oordelen uit het advies, die artikel 7 van het beleid koppelt aan
# de open begrippen van artikel 5, en
# geneeskundig_onderzoek_heeft_plaatsgehad, dat artikel 4 van het beleid
# koppelt aan het open begrip van artikel 3 van de regeling. Er is geen
# bekendmaking; de url wijst naar artikel 3 van de regeling, dat zegt wie
# onderzoekt.
url: https://wetten.overheid.nl/BWBR0012625/2013-01-01#Artikel3
name: Geneeskundig advies bij de gemeente Wilgendaal (reductie)
articles:
  - number: advies
    text: >-
      Geen regelgeving. Het systeem van de gemeente houdt door middel van een
      chronolexografische reductie op zijn eigen kroniek per ontvangen advies
      bij over wie het gaat, van een onderzoek op welke dag, en wat het advies
      over elk gegeven zegt.
    url: https://wetten.overheid.nl/BWBR0012625/2013-01-01#Artikel3
    machine_readable:
      projection:
        per: beleid_gehandicaptenparkeerkaart_gemeente_wilgendaal#5#geneeskundig_advies_ontvangen
        state:
          - name: bsn_aanvrager
            type: string
          - name: datum_onderzoek
            type: date
          - name: langdurige_loopbeperking
            type: boolean
          - name: continu_afhankelijk_van_hulp_bestuurder
            type: boolean
          - name: permanent_rolstoelgebonden
            type: boolean
          - name: ernstige_beperkingen_andere_dan_loopbeperkingen
            type: boolean
        steps:
          - record: beleid_gehandicaptenparkeerkaart_gemeente_wilgendaal#5#geneeskundig_advies_ontvangen
            actions:
              - output: bsn_aanvrager
                value: $record.bsn_aanvrager
              - output: datum_onderzoek
                value: $record.datum_onderzoek
              - output: langdurige_loopbeperking
                value: $record.langdurige_loopbeperking
              - output: continu_afhankelijk_van_hulp_bestuurder
                value: $record.continu_afhankelijk_van_hulp_bestuurder
              - output: permanent_rolstoelgebonden
                value: $record.permanent_rolstoelgebonden
              - output: ernstige_beperkingen_andere_dan_loopbeperkingen
                value: $record.ernstige_beperkingen_andere_dan_loopbeperkingen
  - number: geneeskundig_advies
    text: >-
      Geen regelgeving. Het systeem van de gemeente kijkt door middel van een
      chronolexografische reductie op zijn eigen kroniek welke adviezen het
      over de aanvrager ontving, en past daarop het beleid toe:
      het advies van het laatste onderzoek voor de aanvraag telt. Vindt het
      systeem er geen, dan zwijgt het, en oordeelt het college zelf.
    url: https://wetten.overheid.nl/BWBR0012625/2013-01-01#Artikel3
    machine_readable:
      execution:
        # Wat het antwoord vraagt; het beleid dat het koppelt, geeft ze op
        # naam mee.
        parameters:
          - name: bsn_aanvrager
            type: string
            description: Burgerservicenummer van de aanvrager.
          - name: dagtekening_aanvraag
            type: date
            nullable: true
            description: De dagtekening van de aanvraag.
          - name: datum_afgifte
            type: date
            description: De dag waarop het college op de aanvraag besluit.
        input:
          # De ontvangen adviezen over de aanvrager, één rij per aggregaat,
          # met bsn_aanvrager, datum_onderzoek en de vier gegevens.
          - name: adviezen
            type: array
            source:
              projections: reductie_geneeskundig_advies#advies
              where:
                bsn_aanvrager: $bsn_aanvrager
          - name: volgens_beleid_langdurige_loopbeperking
            type: boolean
            nullable: true
            source:
              regulation: beleid_geneeskundig_advies_gemeente_wilgendaal
              output: advies_langdurige_loopbeperking
              parameters:
                bsn_aanvrager: $bsn_aanvrager
                dagtekening_aanvraag: $dagtekening_aanvraag
                datum_afgifte: $datum_afgifte
                adviezen: $adviezen
          - name: volgens_beleid_continu_afhankelijk_van_hulp_bestuurder
            type: boolean
            nullable: true
            source:
              regulation: beleid_geneeskundig_advies_gemeente_wilgendaal
              output: advies_continu_afhankelijk_van_hulp_bestuurder
              parameters:
                bsn_aanvrager: $bsn_aanvrager
                dagtekening_aanvraag: $dagtekening_aanvraag
                datum_afgifte: $datum_afgifte
                adviezen: $adviezen
          - name: volgens_beleid_permanent_rolstoelgebonden
            type: boolean
            nullable: true
            source:
              regulation: beleid_geneeskundig_advies_gemeente_wilgendaal
              output: advies_permanent_rolstoelgebonden
              parameters:
                bsn_aanvrager: $bsn_aanvrager
                dagtekening_aanvraag: $dagtekening_aanvraag
                datum_afgifte: $datum_afgifte
                adviezen: $adviezen
          - name: volgens_beleid_ernstige_beperkingen_andere_dan_loopbeperkingen
            type: boolean
            nullable: true
            source:
              regulation: beleid_geneeskundig_advies_gemeente_wilgendaal
              output: advies_ernstige_beperkingen_andere_dan_loopbeperkingen
              parameters:
                bsn_aanvrager: $bsn_aanvrager
                dagtekening_aanvraag: $dagtekening_aanvraag
                datum_afgifte: $datum_afgifte
                adviezen: $adviezen
        output:
          - name: advies_langdurige_loopbeperking
            type: boolean
            nullable: true
          - name: advies_continu_afhankelijk_van_hulp_bestuurder
            type: boolean
            nullable: true
          - name: advies_permanent_rolstoelgebonden
            type: boolean
            nullable: true
          - name: advies_ernstige_beperkingen_andere_dan_loopbeperkingen
            type: boolean
            nullable: true
        actions:
          - output: advies_langdurige_loopbeperking
            value: $volgens_beleid_langdurige_loopbeperking
          - output: advies_continu_afhankelijk_van_hulp_bestuurder
            value: $volgens_beleid_continu_afhankelijk_van_hulp_bestuurder
          - output: advies_permanent_rolstoelgebonden
            value: $volgens_beleid_permanent_rolstoelgebonden
          - output: advies_ernstige_beperkingen_andere_dan_loopbeperkingen
            value: $volgens_beleid_ernstige_beperkingen_andere_dan_loopbeperkingen
  - number: geneeskundig_onderzoek_heeft_plaatsgehad
    text: >-
      Geen regelgeving. Het systeem van de gemeente kijkt door middel van een
      chronolexografische reductie op zijn eigen kroniek of voor deze aanvraag
      een geneeskundig onderzoek plaatsvond. Dat is zo als de gemeente een
      advies ontving over dezelfde aanvrager, van een onderzoek op of na de
      dagtekening van de aanvraag en uiterlijk op de dag van afgifte. Vindt het
      systeem er geen, dan zwijgt het, en zegt artikel 4 van het beleid wat
      geldt.
    url: https://wetten.overheid.nl/BWBR0012625/2013-01-01#Artikel3
    machine_readable:
      execution:
        # Wat het antwoord vraagt; het beleid dat het koppelt, geeft ze op
        # naam mee.
        parameters:
          - name: bsn_aanvrager
            type: string
            description: Burgerservicenummer van de aanvrager.
          - name: dagtekening_aanvraag
            type: date
            nullable: true
            description: De dagtekening van de aanvraag.
          - name: datum_afgifte
            type: date
            description: De dag waarop de kaart zou worden afgegeven.
        input:
          # De adviezen over de aanvrager, één rij per aggregaat; hier telt
          # datum_onderzoek.
          - name: onderzoeken
            type: array
            source:
              projections: reductie_geneeskundig_advies#advies
              where:
                bsn_aanvrager: $bsn_aanvrager
        output:
          - name: geneeskundig_onderzoek_heeft_plaatsgehad
            type: boolean
            nullable: true
            description: >-
              Waar, als de gemeente een advies van een onderzoek voor deze aanvraag ontving;
              anders afwezig.
        actions:
          # Zonder dagtekening valt niet te zeggen of een onderzoek bij deze
          # aanvraag hoort: dan telt er geen. De voorwaarde staat eerst: AND
          # stopt bij de eerste onwaar, en DATE_DIFF faalt op een afwezige
          # dag.
          - output: geneeskundig_onderzoek_heeft_plaatsgehad
            value:
              operation: IF
              cases:
                - when:
                    operation: FOREACH
                    collection: $onderzoeken
                    as: onderzoek
                    filter:
                      operation: AND
                      conditions:
                        - operation: NOT
                          value:
                            operation: EQUALS
                            subject: $dagtekening_aanvraag
                            value: null
                        - operation: EQUALS
                          subject: $onderzoek.bsn_aanvrager
                          value: $bsn_aanvrager
                        - operation: GREATER_THAN_OR_EQUAL
                          subject:
                            operation: DATE_DIFF
                            from: $dagtekening_aanvraag
                            to: $onderzoek.datum_onderzoek
                            in: days
                          value: 0
                        - operation: GREATER_THAN_OR_EQUAL
                          subject:
                            operation: DATE_DIFF
                            from: $onderzoek.datum_onderzoek
                            to: $datum_afgifte
                            in: days
                          value: 0
                    body: true
                    combine: OR
                  then: true
              default: null
