---
$schema: https://raw.githubusercontent.com/NederlandseDigitaleDienst/regelrecht/refs/tags/schema-v0.8.19/schema/v0.8.19/schema.json
$id: reductie_bedrijfsparkeervergunning
regulatory_layer: REDUCTIE
publication_date: '2025-12-01'
valid_from: '2026-01-01'
# Geen regelgeving: een reductie van het college van de (fictieve) gemeente
# Wilgendaal over zijn eigen kroniek (RFC-022 §4.1, RFC-048), over de
# bedrijfsparkeervergunning (artikel 2 van de fictieve parkeerverordening),
# met twee aggregaten en twee read models in één bestand (schema v0.8.19).
# Artikel vergunning is een aggregaat per besluit op een aanvraag: het besluit
# en wat ernaar verwijst, zoals een bezwaar, de beslissing erop, een
# intrekking (Awb 6:21) en het afschrift van de uitspraak in de hoofdzaak
# (8:79). Welke records meetellen, volgt uit de effecten die de Awb ze geeft (7:11, tweede lid, en
# 8:79 met 8:72). Een nieuw besluit dat een beslissing op bezwaar in de plaats
# van dit besluit nam, houdt die beslissing zelf; het telt in dit aggregaat en
# valt met de beslissing weg. De staat houdt de dagen die de records dragen,
# en welk besluit uit het aggregaat de vergunning nu verleent; daarvoor leest
# een stap het id van zijn record ($record.id, schema v0.8.19).
# Artikel schorsing is een aggregaat per afschrift van een uitspraak van de
# voorzieningenrechter (Awb 8:84, vierde lid), met de uitspraak die de
# voorziening opheft (8:87). Een schorsing trekt niets in: de staat houdt het
# besluit waarop zij ziet en de dagen die de records dragen. Een latere
# uitspraak over hetzelfde besluit is een eigen aggregaat en laat deze zoals
# zij was. Een schorsing telt alleen als zij gaat over het besluit dat de
# vergunning verleent.
# De artikelen bedrijfsparkeervergunning_geldig_op_peildatum en
# aantal_geldige_bedrijfsparkeervergunningen zijn read models: ze spelen zelf
# niets af en lezen de aggregaten van de artikelen vergunning en schorsing
# (source.projections). Wat de rijen op een dag betekenen, zegt het fictieve
# beleid verleende bedrijfsparkeervergunningen (artikel 1 welke besluiten
# geschorst zijn, artikel 2 welke vergunningen geldig zijn). Het eerste read
# model zegt of er voor één kenteken op een dag een geldige vergunning is:
# omdat elk besluit en elke uitspraak een eigen aggregaat is, raakt een
# afschrift over een eerder besluit voor het kenteken de vergunning van een
# later besluit niet. Het tweede telt per bedrijf, over beide
# vergunninggebieden (eigen keuze): artikel 3 van het uitvoeringsbesluit
# stelt het maximum per gebied vast, maar een vergunning blijft geldig tot zij
# afloopt of wordt ingetrokken (artikel 5 van de verordening), ook na een
# verhuizing. De cel van de gemeente geeft hun uitvoer als de antwoorden
# bedrijfsparkeervergunning_geldig_op_peildatum en
# aantal_geldige_bedrijfsparkeervergunningen (cel.yaml, answers). Artikel 2 van
# het fictieve beleid bedrijfsparkeervergunning koppelt het tweede aan het open
# begrip van artikel 3 van het fictieve uitvoeringsbesluit parkeren, ook
# wanneer Awb 7:11 artikel 2 van de verordening opnieuw aanroept; bij die
# heroverweging laat de cel het bestreden besluit buiten beschouwing. Er is
# geen bekendmaking; de url wijst naar het model van de verordening.
url: https://lokaleregelgeving.overheid.nl/CVDR642699
name: Bedrijfsparkeervergunning bij de gemeente Wilgendaal (reductie)
articles:
  - number: vergunning
    text: >-
      Geen regelgeving. Het systeem van het college van de gemeente Wilgendaal
      houdt door middel van een chronolexografische reductie op zijn eigen
      kroniek per besluit op een aanvraag om een bedrijfsparkeervergunning bij
      op welke dag het is genomen, tot en met welke dag de vergunning geldig
      is, op welke dag het bezwaar of beroep is ingetrokken, en op welke dag
      de bestuursrechter in de hoofdzaak uitspraak deed.
    url: https://lokaleregelgeving.overheid.nl/CVDR642699
    machine_readable:
      projection:
        per: parkeerverordening_gemeente_wilgendaal#2#BESCHIKKING
        state:
          # Of het besluit een vergunning verleent. Telt het besluit niet
          # mee, dan zet zijn stap niets en blijft dit onwaar.
          - name: verleend
            type: boolean
          - name: besluit_datum
            type: date
          - name: vergunning_geldig_tot
            type: date
          - name: uitspraak_hoofdzaak_op
            type: date
          # De dag waarop het bezwaar of beroep is ingetrokken (Awb 6:21,
          # 8:85, tweede lid, onder b).
          - name: ingetrokken_op
            type: date
          # Het besluit uit dit aggregaat dat de vergunning nu verleent: het
          # besluit op de aanvraag, of de beslissing op bezwaar die in zijn
          # plaats een nieuw besluit nam. Een schorsing raakt de vergunning
          # alleen als zij over dit besluit gaat.
          - name: besluit_dat_verleent
            type: string
        steps:
          - record: parkeerverordening_gemeente_wilgendaal#2#BESCHIKKING
            actions:
              - output: verleend
                value: $record.bedrijfsparkeervergunning_verleend
              - output: besluit_datum
                value: $record.besluit_datum
              - output: vergunning_geldig_tot
                value: $record.vergunning_geldig_tot
              - output: besluit_dat_verleent
                value: $record.id
          # De beslissing op een bezwaar tegen dit besluit. Nam zij een nieuw
          # besluit in de plaats van het herroepen besluit (Awb 7:11, tweede
          # lid), dan houdt zij dat nieuwe besluit zelf (nieuw_besluit): één
          # handeling is één record. Vernietigt de bestuursrechter de
          # beslissing, dan valt het nieuwe besluit met haar weg.
          - record: algemene_wet_bestuursrecht#7:11#BESCHIKKING
            input:
              - name: verleend_na_bezwaar
                type: boolean
                source:
                  regulation: beleid_verleende_bedrijfsparkeervergunningen_gemeente_wilgendaal
                  output: verleend_na_bezwaar
                  parameters: &bezwaar
                    al_besluit_dat_verleent: $state.besluit_dat_verleent
                    beslissing_op_bezwaar: $record.id
                    al_verleend: $state.verleend
                    al_besluit_datum: $state.besluit_datum
                    al_vergunning_geldig_tot: $state.vergunning_geldig_tot
                    nieuw_besluit: $record.nieuw_besluit
              - name: besluit_datum_na_bezwaar
                type: date
                source:
                  regulation: beleid_verleende_bedrijfsparkeervergunningen_gemeente_wilgendaal
                  output: besluit_datum_na_bezwaar
                  parameters: *bezwaar
              - name: vergunning_geldig_tot_na_bezwaar
                type: date
                source:
                  regulation: beleid_verleende_bedrijfsparkeervergunningen_gemeente_wilgendaal
                  output: vergunning_geldig_tot_na_bezwaar
                  parameters: *bezwaar
              - name: besluit_dat_verleent_na_bezwaar
                type: string
                nullable: true
                source:
                  regulation: beleid_verleende_bedrijfsparkeervergunningen_gemeente_wilgendaal
                  output: besluit_dat_verleent_na_bezwaar
                  parameters: *bezwaar
            actions:
              - output: besluit_dat_verleent
                value: $besluit_dat_verleent_na_bezwaar
              - output: verleend
                value: $verleend_na_bezwaar
              - output: besluit_datum
                value: $besluit_datum_na_bezwaar
              - output: vergunning_geldig_tot
                value: $vergunning_geldig_tot_na_bezwaar
          # De intrekking van het bezwaar tegen dit besluit, of van het beroep
          # tegen de beslissing erop (6:21); de voorziening vervalt op die dag
          # (8:85, tweede lid, onder b).
          - record: algemene_wet_bestuursrecht#6:21#EXECUTOGRAM
            actions:
              - output: ingetrokken_op
                value: $record.ingetrokken_op
          # De uitspraak in de hoofdzaak (8:79); de voorziening vervalt op de
          # dag ervan (8:85, tweede lid, onder c).
          - record: algemene_wet_bestuursrecht#8:79#EXECUTOGRAM
            actions:
              - output: uitspraak_hoofdzaak_op
                value: $record.uitspraak_datum
  - number: schorsing
    text: >-
      Geen regelgeving. Het systeem van het college van de gemeente Wilgendaal
      houdt door middel van een chronolexografische reductie op zijn eigen
      kroniek per uitspraak van de voorzieningenrechter bij op welk besluit
      zij ziet, waartoe zij strekt, vanaf welke dag zij het besluit schorst,
      en wanneer de voorziening vervalt of is opgeheven.
    url: https://lokaleregelgeving.overheid.nl/CVDR642699
    machine_readable:
      projection:
        per: algemene_wet_bestuursrecht#8:84#EXECUTOGRAM
        state:
          - name: besluit
            type: string
          - name: uitspraak_strekt_tot
            type: string
          - name: geschorst_vanaf
            type: date
          - name: voorziening_vervalt_op
            type: date
          - name: voorziening_opgeheven_op
            type: date
        steps:
          - record: algemene_wet_bestuursrecht#8:84#EXECUTOGRAM
            actions:
              - output: besluit
                value: $record.refers_to
              - output: uitspraak_strekt_tot
                value: $record.uitspraak_strekt_tot
              - output: geschorst_vanaf
                value: $record.besluit_geschorst_vanaf
              - output: voorziening_vervalt_op
                value: $record.voorziening_vervalt_op
          # De voorzieningenrechter heft de voorziening op (8:87).
          - record: algemene_wet_bestuursrecht#8:87#EXECUTOGRAM
            actions:
              - output: voorziening_opgeheven_op
                value: $record.voorziening_opgeheven_op
  - number: bedrijfsparkeervergunning_geldig_op_peildatum
    text: >-
      Geen regelgeving. Het systeem van het college van de gemeente Wilgendaal
      leest door middel van een chronolexografische reductie op zijn eigen
      kroniek of de bedrijfsparkeervergunning voor een kenteken op een dag
      geldig is: verleend, niet verlopen, niet herroepen of vernietigd, en op
      die dag niet geschorst door de voorzieningenrechter.
    url: https://lokaleregelgeving.overheid.nl/CVDR642699
    machine_readable:
      execution:
        parameters:
          - name: kenteken
            type: string
            description: Het kenteken waarvoor de vergunning geldt.
          - name: peildatum
            type: date
            description: De dag waarop de vergunning geldig moet zijn.
        input:
          - name: vergunningen
            type: array
            source:
              projections: reductie_bedrijfsparkeervergunning#vergunning
              where:
                kenteken: $kenteken
          - name: schorsingen
            type: array
            source:
              projections: reductie_bedrijfsparkeervergunning#schorsing
          - name: geldig
            type: boolean
            source:
              regulation: beleid_verleende_bedrijfsparkeervergunningen_gemeente_wilgendaal
              output: een_geldige_vergunning
              parameters:
                vergunningen: $vergunningen
                schorsingen: $schorsingen
                peildatum: $peildatum
        output:
          - name: bedrijfsparkeervergunning_geldig_op_peildatum
            type: boolean
            description: >-
              Of de vergunning voor het kenteken op de peildatum geldig is.
        actions:
          - output: bedrijfsparkeervergunning_geldig_op_peildatum
            value: $geldig
  - number: aantal_geldige_bedrijfsparkeervergunningen
    text: >-
      Geen regelgeving. Het systeem van het college van de gemeente Wilgendaal
      telt door middel van een chronolexografische reductie op zijn eigen
      kroniek hoeveel bedrijfsparkeervergunningen het het bedrijf verleende
      die op de dag van het besluit nog geldig zijn: verleend in een besluit
      op een aanvraag (artikel 2 van de fictieve parkeerverordening), niet
      verlopen, niet herroepen, niet door de bestuursrechter vernietigd (Awb
      7:11 en 8:72), en op die dag niet geschorst door de
      voorzieningenrechter (Awb 8:81).
    url: https://lokaleregelgeving.overheid.nl/CVDR642699
    machine_readable:
      execution:
        parameters:
          - name: kvk_nummer
            type: string
            description: Het nummer dat de Kamer van Koophandel het bedrijf toekende.
          - name: besluit_datum
            type: date
            description: De dag waarop het college op de aanvraag besluit.
        input:
          - name: vergunningen
            type: array
            source:
              projections: reductie_bedrijfsparkeervergunning#vergunning
              where:
                kvk_nummer: $kvk_nummer
          - name: schorsingen
            type: array
            source:
              projections: reductie_bedrijfsparkeervergunning#schorsing
          - name: aantal
            type: number
            source:
              regulation: beleid_verleende_bedrijfsparkeervergunningen_gemeente_wilgendaal
              output: aantal_geldige_vergunningen
              parameters:
                vergunningen: $vergunningen
                schorsingen: $schorsingen
                peildatum: $besluit_datum
        output:
          - name: aantal_geldige_bedrijfsparkeervergunningen
            type: number
            description: >-
              Hoeveel vergunningen het college het bedrijf verleende die op de
              dag van het besluit nog geldig zijn.
        actions:
          - output: aantal_geldige_bedrijfsparkeervergunningen
            value: $aantal
