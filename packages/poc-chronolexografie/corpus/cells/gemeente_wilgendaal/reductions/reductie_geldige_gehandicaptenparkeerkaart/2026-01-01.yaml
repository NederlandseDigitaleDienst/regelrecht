---
$schema: https://raw.githubusercontent.com/NederlandseDigitaleDienst/regelrecht/refs/tags/schema-v0.8.19/schema/v0.8.19/schema.json
$id: reductie_geldige_gehandicaptenparkeerkaart
regulatory_layer: REDUCTIE
publication_date: '2025-12-01'
valid_from: '2026-01-01'
# Geen regelgeving: een reductie van het college van de (fictieve) gemeente
# Wilgendaal over zijn eigen kroniek (RFC-022 §4.1, RFC-048), met drie
# artikelen (schema v0.8.19). Artikel kaart is een aggregaat per besluit op
# een aanvraag om een gehandicaptenparkeerkaart (artikel 49 van het BABW):
# het besluit en wat ernaar verwijst, zoals een bezwaar en de beslissing
# erop. Welke records meetellen, volgt uit de effecten die de Awb ze geeft:
# een beslissing op bezwaar die het bestreden besluit herroept (7:11, tweede
# lid), en de ontvangst van een uitspraak die een besluit met zijn
# rechtsgevolgen vernietigt (8:79 met 8:72). De staat houdt of het besluit
# een kaart verstrekt en tot wanneer zij geldig is (artikel 51 van het
# BABW), ook als een beslissing op bezwaar een nieuw besluit in de plaats
# van het herroepen besluit nam, en of de bestuursrechter zelf een kaart
# verstrekte toen hij het besluit vernietigde (Awb 8:72, derde lid, onder
# b). De andere twee artikelen lezen die aggregaten van de besluiten over de
# aanvrager (source.projections); het aggregaat staat in dit bestand omdat
# alleen zij het lezen. Wat die besluiten op een dag betekenen, zegt het
# beleid van het college over verstrekte kaarten
# (beleid_verstrekte_gehandicaptenparkeerkaarten_gemeente_wilgendaal). De cel
# van de gemeente geeft hun uitvoer als twee antwoorden (cel.yaml, answers):
# of de aanvrager een geldige kaart heeft (artikel
# aanvrager_heeft_geldige_gehandicaptenparkeerkaart), en of hij eerder een
# kaart van het college kreeg (artikel
# aanvrager_eerder_gehandicaptenparkeerkaart_verstrekt). Het beleid van het
# college koppelt het eerste aan zijn eigen open begrip, ook als Awb 7:11
# artikel 49 opnieuw aanroept, en het tweede aan het open begrip van artikel
# 2, tweede lid, onder a en b, van de Regeling gehandicaptenparkeerkaart. Twee
# artikelen, omdat het tweede antwoord de dag van het besluit niet kent:
# artikel 2 van de regeling geeft die niet mee. Er is geen bekendmaking; de
# url wijst naar artikel 49.
url: https://wetten.overheid.nl/BWBR0004826/2026-01-01#Artikel49
name: Geldige gehandicaptenparkeerkaart bij de gemeente Wilgendaal (reductie)
articles:
  - number: kaart
    text: >-
      Geen regelgeving. Het systeem van het college van de gemeente Wilgendaal
      houdt door middel van een chronolexografische reductie op zijn eigen
      kroniek per besluit op een aanvraag om een gehandicaptenparkeerkaart bij
      of het een kaart verstrekt, en tot en met welke dag zij geldig is.
    url: https://wetten.overheid.nl/BWBR0004826/2026-01-01#Artikel49
    machine_readable:
      projection:
        per: besluit_administratieve_bepalingen_inzake_het_wegverkeer_babw#49#BESCHIKKING
        state:
          - name: verstrekt
            type: boolean
          - name: kaart_geldig_tot
            type: date
          - name: kaart_van_de_rechter
            type: boolean
        steps:
          # Het besluit op de aanvraag.
          - record: besluit_administratieve_bepalingen_inzake_het_wegverkeer_babw#49#BESCHIKKING
            actions:
              - output: verstrekt
                value: $record.gehandicaptenparkeerkaart_verstrekt
              - output: kaart_geldig_tot
                value: $record.kaart_geldig_tot
          # De beslissing op een bezwaar tegen dit besluit. Nam zij een nieuw
          # besluit in de plaats van het herroepen besluit (Awb 7:11, tweede
          # lid), dan houdt zij dat nieuwe besluit zelf (nieuw_besluit): één
          # handeling is één record. Vernietigt de bestuursrechter de
          # beslissing, dan valt het nieuwe besluit met haar weg.
          - record: algemene_wet_bestuursrecht#7:11#BESCHIKKING
            input:
              - name: verstrekt_na_bezwaar
                type: boolean
                source:
                  regulation: beleid_verstrekte_gehandicaptenparkeerkaarten_gemeente_wilgendaal
                  output: verstrekt_na_bezwaar
                  parameters: &bezwaar
                    al_verstrekt: $state.verstrekt
                    al_kaart_geldig_tot: $state.kaart_geldig_tot
                    nieuw_besluit: $record.nieuw_besluit
              - name: kaart_geldig_tot_na_bezwaar
                type: date
                source:
                  regulation: beleid_verstrekte_gehandicaptenparkeerkaarten_gemeente_wilgendaal
                  output: kaart_geldig_tot_na_bezwaar
                  parameters: *bezwaar
            actions:
              - output: verstrekt
                value: $verstrekt_na_bezwaar
              - output: kaart_geldig_tot
                value: $kaart_geldig_tot_na_bezwaar
          # De ontvangst van een uitspraak (Awb 8:79) over dit besluit:
          # voorzag de bestuursrechter zelf in de zaak en verstrekte hij een
          # kaart (Awb 8:72, derde lid, onder b), dan heeft de aanvrager een
          # kaart van de rechter.
          - record: algemene_wet_bestuursrecht#8:79#EXECUTOGRAM
            input:
              - name: kaart_van_de_rechter_na_uitspraak
                type: boolean
                source:
                  regulation: beleid_verstrekte_gehandicaptenparkeerkaarten_gemeente_wilgendaal
                  output: kaart_van_de_rechter_na_uitspraak
                  parameters:
                    al_kaart_van_de_rechter: $state.kaart_van_de_rechter
                    primair_besluit_in_de_plaats: $record.primair_besluit_in_de_plaats
            actions:
              - output: kaart_van_de_rechter
                value: $kaart_van_de_rechter_na_uitspraak
  - number: aanvrager_heeft_geldige_gehandicaptenparkeerkaart
    text: >-
      Geen regelgeving. Het systeem van het college van de gemeente Wilgendaal
      kijkt door middel van een chronolexografische reductie op zijn eigen
      kroniek of er een besluit meetelt waarin het de aanvrager een kaart
      verstrekte: niet herroepen en niet door de bestuursrechter vernietigd
      (Awb 7:11 en 8:72). De aanvrager heeft een geldige
      gehandicaptenparkeerkaart als het college hem in een besluit op een
      aanvraag (artikel 49 van het BABW) een kaart verstrekte die op de dag van
      het besluit nog geldig is. Verstrekte de bestuursrechter hem zelf een
      kaart (Awb 8:72, derde lid, onder b), dan zegt het systeem niets: het
      kent de geldigheid van die kaart niet.
    url: https://wetten.overheid.nl/BWBR0004826/2026-01-01#Artikel49
    machine_readable:
      execution:
        # Wat het antwoord vraagt; het beleid dat het koppelt, geeft ze op
        # naam mee.
        parameters:
          - name: bsn_aanvrager
            type: string
            description: Burgerservicenummer van de gehandicapte die de kaart aanvraagt.
          - name: besluit_datum
            type: date
            description: De dag waarop het college op de aanvraag besluit.
        input:
          - name: kaarten
            type: array
            source:
              projections: reductie_geldige_gehandicaptenparkeerkaart#kaart
              where:
                bsn_aanvrager: $bsn_aanvrager
          - name: geldig
            type: boolean
            nullable: true
            source:
              regulation: beleid_verstrekte_gehandicaptenparkeerkaarten_gemeente_wilgendaal
              output: geldige_kaart
              parameters:
                kaarten: $kaarten
                besluit_datum: $besluit_datum
        output:
          - name: aanvrager_heeft_geldige_gehandicaptenparkeerkaart
            type: boolean
            nullable: true
            description: >-
              Of het college de aanvrager een kaart verstrekte die op de dag van
              het besluit nog geldig is; afwezig als de bestuursrechter hem
              zelf een kaart verstrekte en het college geen geldige kaart.
        actions:
          - output: aanvrager_heeft_geldige_gehandicaptenparkeerkaart
            value: $geldig
  - number: aanvrager_eerder_gehandicaptenparkeerkaart_verstrekt
    text: >-
      Geen regelgeving. Het systeem van het college van de gemeente Wilgendaal
      kijkt door middel van een chronolexografische reductie op zijn eigen
      kroniek of het de aanvrager eerder een kaart verstrekte. Hij kreeg
      eerder een kaart als het college hem in een besluit op een aanvraag
      (artikel 49 van het BABW) een kaart verstrekte die meetelt, geldig of
      niet, of als de bestuursrechter hem zelf een kaart verstrekte (Awb 8:72,
      derde lid, onder b); anders zegt het systeem niets.
    url: https://wetten.overheid.nl/BWBR0012625/2013-01-01#Artikel2
    machine_readable:
      execution:
        # Artikel 2 van de regeling kent de dag van het besluit niet; dit
        # antwoord heeft hem ook niet nodig.
        parameters:
          - name: bsn_aanvrager
            type: string
            description: Burgerservicenummer van de gehandicapte die de kaart aanvraagt.
        input:
          - name: kaarten
            type: array
            source:
              projections: reductie_geldige_gehandicaptenparkeerkaart#kaart
              where:
                bsn_aanvrager: $bsn_aanvrager
          - name: eerder
            type: boolean
            source:
              regulation: beleid_verstrekte_gehandicaptenparkeerkaarten_gemeente_wilgendaal
              output: eerder_verstrekt
              parameters:
                kaarten: $kaarten
        output:
          - name: aanvrager_eerder_gehandicaptenparkeerkaart_verstrekt
            type: boolean
            nullable: true
            description: >-
              Waar, als het college de aanvrager eerder een kaart verstrekte;
              anders afwezig.
        actions:
          # Vindt het systeem geen kaart, dan zwijgt het (null): een kaart van
          # een andere gemeente of van het CBR kent het niet, en dan stelt het
          # college het vast.
          - output: aanvrager_eerder_gehandicaptenparkeerkaart_verstrekt
            value:
              operation: IF
              cases:
                - when: $eerder
                  then: true
              default: null
