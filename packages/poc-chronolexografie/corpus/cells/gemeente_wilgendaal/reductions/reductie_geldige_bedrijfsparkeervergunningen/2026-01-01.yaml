---
$schema: https://raw.githubusercontent.com/NederlandseDigitaleDienst/regelrecht/refs/tags/schema-v0.8.15/schema/v0.8.15/schema.json
$id: reductie_geldige_bedrijfsparkeervergunningen
regulatory_layer: REDUCTIE
publication_date: '2025-12-01'
valid_from: '2026-01-01'
# Geen regelgeving: een reductie van het college van de (fictieve) gemeente
# Wilgendaal over zijn eigen kroniek (RFC-022 §4.1, RFC-048). Ze speelt de
# kroniek van het bedrijf af (projection, schema v0.8.14); de geldigheidsduur
# staat al in elk besluit (artikel 3 van de fictieve parkeerverordening).
# Welke besluiten meetellen, volgt uit de effecten die de Awb een besluit
# geeft (7:11, tweede lid, en 8:79 met 8:72). Wat een besluit dat meetelt
# betekent, zegt het fictieve beleid verleende bedrijfsparkeervergunningen. De
# cel van de gemeente geeft haar uitvoer als het antwoord
# aantal_geldige_bedrijfsparkeervergunningen (cel.yaml, answers). Artikel 2
# van het fictieve beleid bedrijfsparkeervergunning koppelt dat aan het open
# begrip van artikel 3 van het fictieve uitvoeringsbesluit parkeren. Dat geldt
# ook wanneer Awb 7:11 artikel 2 van de verordening opnieuw aanroept; bij die
# heroverweging laat de cel het bestreden besluit buiten beschouwing. Eigen
# keuze: de reductie telt per bedrijf, over beide vergunninggebieden. Artikel
# 3 van het uitvoeringsbesluit stelt het maximum per gebied vast, maar een
# vergunning blijft geldig tot zij afloopt of wordt ingetrokken (artikel 5 van
# de verordening), ook na een verhuizing. Er is geen bekendmaking; de url
# wijst naar het model van de verordening.
url: https://lokaleregelgeving.overheid.nl/CVDR642699
name: Geldige bedrijfsparkeervergunningen bij de gemeente Wilgendaal (reductie)
articles:
  - number: '1'
    text: >-
      Geen regelgeving. Het systeem van het college van de gemeente Wilgendaal
      telt door middel van een chronolexografische reductie op zijn eigen
      kroniek hoeveel bedrijfsparkeervergunningen het het bedrijf verleende
      die op de dag van het besluit nog geldig zijn: verleend in een besluit
      op een aanvraag (artikel 2 van de fictieve parkeerverordening), niet
      herroepen en niet door de bestuursrechter vernietigd (Awb 7:11 en 8:72).
    url: https://lokaleregelgeving.overheid.nl/CVDR642699
    machine_readable:
      projection:
        # De besluiten over het bedrijf, en wat ernaar verwijst: een bezwaar,
        # de beslissing erop, de ontvangst van een uitspraak.
        key: kvk_nummer
        state:
          - name: aantal
            type: number
        steps:
          # Een besluit op een aanvraag, en een nieuw besluit dat een
          # beslissing op bezwaar in de plaats van een herroepen besluit nam:
          # beide berusten op artikel 2 van de verordening.
          - record: parkeerverordening_gemeente_wilgendaal#2#BESCHIKKING
            input:
              - name: aantal_na_besluit
                type: number
                source:
                  regulation: beleid_verleende_bedrijfsparkeervergunningen_gemeente_wilgendaal
                  output: aantal_na_besluit
                  parameters:
                    aantal: $state.aantal
                    bedrijfsparkeervergunning_verleend: $record.bedrijfsparkeervergunning_verleend
                    vergunning_geldig_tot: $record.vergunning_geldig_tot
                    # TIJDELIJKE OMWEG: de stap neemt de dag van de vraag
                    # (besluit_datum), zodat het afspelen van de vraag afhangt.
                    # Dat verdwijnt zodra een besluit een eigen aggregaat is,
                    # met zijn data in de staat (zie de open vragen).
                    besluit_datum: $besluit_datum
            actions:
              - output: aantal
                value: $aantal_na_besluit
      execution:
        # Wat het antwoord vraagt; het beleid dat het koppelt, geeft ze op
        # naam mee.
        parameters:
          - name: kvk_nummer
            type: string
            description: Het nummer dat de Kamer van Koophandel het bedrijf toekende.
          - name: besluit_datum
            type: date
            description: De dag waarop het college op de aanvraag besluit.
        output:
          - name: aantal_geldige_bedrijfsparkeervergunningen
            type: number
            description: >-
              Hoeveel vergunningen het college het bedrijf verleende die op de
              dag van het besluit nog geldig zijn.
        actions:
          - output: aantal_geldige_bedrijfsparkeervergunningen
            value: $state.aantal
