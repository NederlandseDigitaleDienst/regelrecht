# Wie deze cel is (RFC-046). De Dienst Toeslagen kent de tegemoetkomingen
# toe en verleent de voorschotten erop (artikel 14 en 16 van de Awir), en is
# belast met de uitvoering van de Wet op de zorgtoeslag (artikel 5). Die
# artikelen noemen de Dienst bij naam (competent_authority). De gegevens in
# deze cel zijn verzonnen.
name: Dienst Toeslagen
