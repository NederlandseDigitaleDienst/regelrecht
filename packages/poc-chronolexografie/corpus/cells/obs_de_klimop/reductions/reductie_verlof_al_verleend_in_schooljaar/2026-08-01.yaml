---
$schema: https://raw.githubusercontent.com/NederlandseDigitaleDienst/regelrecht/refs/tags/schema-v0.8.19/schema/v0.8.19/schema.json
$id: reductie_verlof_al_verleend_in_schooljaar
regulatory_layer: REDUCTIE
publication_date: '2026-07-01'
valid_from: '2026-08-01'
# Geen regelgeving: een reductie van het hoofd van OBS De Klimop over zijn
# eigen kroniek (RFC-022 §4.1, RFC-048), met twee artikelen (schema v0.8.19).
# Artikel verlof is een aggregaat per besluit onder artikel 13a van de
# Leerplichtwet 1969: het besluit en wat ernaar verwijst, zoals een bezwaar
# en de beslissing erop. Welke records meetellen, volgt uit de effecten die
# de Awb ze geeft: een beslissing op bezwaar die het bestreden besluit
# herroept (7:11, tweede lid), en de ontvangst van een uitspraak die een
# besluit met zijn rechtsgevolgen vernietigt (8:79 met 8:72). De staat houdt
# of het besluit verlof verleent en de eerste verlofdag, ook als een
# beslissing op bezwaar een nieuw besluit in de plaats van het herroepen
# besluit nam (7:11, tweede lid), en of de bestuursrechter zelf verlof
# verleende toen hij het besluit vernietigde (Awb 8:72, derde lid, onder b),
# met de eerste verlofdag daarvan. Artikel verlof_al_verleend_in_schooljaar
# leest die aggregaten van de besluiten over de jongere (source.projections).
# Het aggregaat staat in dit bestand omdat alleen dit artikel het leest. Wat
# die besluiten voor het schooljaar betekenen, zegt het beleid van het hoofd
# over verleend verlof (fictief_beleid_verleend_verlof_obs_de_klimop); het
# schooljaar geeft artikel 2 van zijn beleid vakantieverlof mee. De cel van de
# school geeft de uitvoer als het antwoord verlof_al_verleend_in_schooljaar
# (cel.yaml, answers); artikel 2 van dat beleid koppelt het aan het open
# begrip van artikel 13a, tweede lid, van de Leerplichtwet 1969, ook als Awb
# 7:11 dat artikel opnieuw aanroept. Er is geen bekendmaking; de url wijst
# naar dat artikel.
url: https://wetten.overheid.nl/BWBR0002628/2026-08-01#Artikel13a
name: Al verleend vakantieverlof in het schooljaar bij OBS De Klimop (reductie)
articles:
  - number: verlof
    text: >-
      Geen regelgeving. Het systeem van het hoofd van OBS De Klimop houdt door
      middel van een chronolexografische reductie op zijn eigen kroniek per
      besluit onder artikel 13a bij of het de jongere verlof verleent, en wat
      de eerste verlofdag is.
    url: https://wetten.overheid.nl/BWBR0002628/2026-08-01#Artikel13a
    machine_readable:
      projection:
        per: leerplichtwet_1969#13a#BESCHIKKING
        state:
          - name: verlof_verleend
            type: boolean
          - name: eerste_verlofdag
            type: date
          - name: rechter_verleent_verlof
            type: boolean
          - name: eerste_verlofdag_van_de_rechter
            type: date
        steps:
          # Het besluit op de aanvraag.
          - record: leerplichtwet_1969#13a#BESCHIKKING
            actions:
              - output: verlof_verleend
                value: $record.verlof_verleend
              - output: eerste_verlofdag
                value: $record.eerste_verlofdag
          # De beslissing op een bezwaar tegen dit besluit. Nam zij een nieuw
          # besluit in de plaats van het herroepen besluit (Awb 7:11, tweede
          # lid), dan houdt zij dat nieuwe besluit zelf (nieuw_besluit): één
          # handeling is één record. Vernietigt de bestuursrechter de
          # beslissing, dan valt het nieuwe besluit met haar weg.
          - record: algemene_wet_bestuursrecht#7:11#BESCHIKKING
            input:
              - name: verleent_verlof
                type: boolean
                source:
                  regulation: fictief_beleid_verleend_verlof_obs_de_klimop
                  output: verlof_verleend_na_bezwaar
                  parameters: &bezwaar
                    al_verlof_verleend: $state.verlof_verleend
                    al_eerste_verlofdag: $state.eerste_verlofdag
                    nieuw_besluit: $record.nieuw_besluit
              - name: eerste_verlofdag
                type: date
                source:
                  regulation: fictief_beleid_verleend_verlof_obs_de_klimop
                  output: eerste_verlofdag_na_bezwaar
                  parameters: *bezwaar
            actions:
              - output: verlof_verleend
                value: $verleent_verlof
              - output: eerste_verlofdag
                value: $eerste_verlofdag
          # De ontvangst van een uitspraak (Awb 8:79) over dit besluit:
          # voorzag de bestuursrechter zelf in de zaak (Awb 8:72, derde lid,
          # onder b), dan telt het verlof dat zijn uitspraak verleent.
          - record: algemene_wet_bestuursrecht#8:79#EXECUTOGRAM
            input:
              - name: verleent_verlof
                type: boolean
                source:
                  regulation: fictief_beleid_verleend_verlof_obs_de_klimop
                  output: rechter_verleent_verlof
                  parameters: &uitspraak
                    al_verleend_door_rechter: $state.rechter_verleent_verlof
                    al_eerste_verlofdag_van_de_rechter: $state.eerste_verlofdag_van_de_rechter
                    primair_besluit_in_de_plaats: $record.primair_besluit_in_de_plaats
              - name: eerste_verlofdag
                type: date
                source:
                  regulation: fictief_beleid_verleend_verlof_obs_de_klimop
                  output: eerste_verlofdag_van_de_rechter
                  parameters: *uitspraak
            actions:
              - output: rechter_verleent_verlof
                value: $verleent_verlof
              - output: eerste_verlofdag_van_de_rechter
                value: $eerste_verlofdag
  - number: verlof_al_verleend_in_schooljaar
    text: >-
      Geen regelgeving. Het systeem van het hoofd van OBS De Klimop kijkt door
      middel van een chronolexografische reductie op zijn eigen kroniek of er
      in het schooljaar van het gevraagde verlof een besluit meetelt waarin de
      jongere verlof kreeg. Welke besluiten meetellen, volgt uit de Awb (7:11
      en 8:72). Wat een besluit betekent, zegt het beleid van het hoofd.
    url: https://wetten.overheid.nl/BWBR0002628/2026-08-01#Artikel13a
    machine_readable:
      execution:
        # Wat het antwoord vraagt; artikel 2 van het beleid geeft ze op naam
        # mee.
        parameters:
          - name: bsn_jongere
            type: string
            description: Burgerservicenummer van de jongere voor wie verlof wordt gevraagd.
          - name: begin_schooljaar
            type: date
            description: De eerste dag van het schooljaar van het gevraagde verlof.
          - name: einde_schooljaar
            type: date
            description: De laatste dag van het schooljaar van het gevraagde verlof.
        input:
          - name: besluiten
            type: array
            source:
              projections: reductie_verlof_al_verleend_in_schooljaar#verlof
              where:
                bsn_jongere: $bsn_jongere
          - name: al_verleend
            type: boolean
            source:
              regulation: fictief_beleid_verleend_verlof_obs_de_klimop
              output: verleend_in_schooljaar
              parameters:
                besluiten: $besluiten
                begin_schooljaar: $begin_schooljaar
                einde_schooljaar: $einde_schooljaar
        output:
          - name: verlof_al_verleend_in_schooljaar
            type: boolean
            description: >-
              Of het hoofd de jongere in het schooljaar van het gevraagde verlof
              al verlof verleende.
        actions:
          - output: verlof_al_verleend_in_schooljaar
            value: $al_verleend
