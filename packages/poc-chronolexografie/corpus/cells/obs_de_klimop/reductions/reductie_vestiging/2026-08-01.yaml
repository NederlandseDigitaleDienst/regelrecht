---
$schema: https://raw.githubusercontent.com/NederlandseDigitaleDienst/regelrecht/refs/tags/schema-v0.8.19/schema/v0.8.19/schema.json
$id: reductie_vestiging
regulatory_layer: REDUCTIE
publication_date: '2026-07-01'
valid_from: '2026-08-01'
# Geen regelgeving: een reductie van het hoofd van OBS De Klimop over zijn
# eigen kroniek (RFC-022 §4.1, RFC-048). Eén aggregaat per vastgelegde
# vestiging: het feit vestiging, dat het fictieve beleid
# fictief_beleid_vestiging_obs_de_klimop (artikel 1) vereist, en wat ernaar
# verwijst. De staat houdt wat de vestiging vermeldt, onder de namen van het
# feit. reductie_plaats_van_vestiging leest de aggregaten. Er is geen
# bekendmaking; de url wijst naar artikel 2 van de Regeling vaststelling
# schoolvakanties 2025–2030.
url: https://wetten.overheid.nl/BWBR0049811/2025-08-01#Artikel2
name: Vestiging van OBS De Klimop per feit (reductie)
articles:
  - number: '1'
    text: >-
      Geen regelgeving. Het systeem van het hoofd van OBS De Klimop houdt door
      middel van een chronolexografische reductie op zijn eigen kroniek per
      vastgelegde vestiging bij in welke gemeente, provincie en welk deel van
      de gemeente de school gevestigd is, en sinds welke dag.
    url: https://wetten.overheid.nl/BWBR0049811/2025-08-01#Artikel2
    machine_readable:
      projection:
        per: fictief_beleid_vestiging_obs_de_klimop#1#vestiging
        state:
          - name: gemeente
            type: string
          - name: provincie
            type: string
          - name: deel_van_gemeente
            type: string
          - name: sinds
            type: date
        steps:
          - record: fictief_beleid_vestiging_obs_de_klimop#1#vestiging
            actions:
              - output: gemeente
                value: $record.gemeente
              - output: provincie
                value: $record.provincie
              - output: deel_van_gemeente
                value: $record.deel_van_gemeente
              - output: sinds
                value: $record.sinds
