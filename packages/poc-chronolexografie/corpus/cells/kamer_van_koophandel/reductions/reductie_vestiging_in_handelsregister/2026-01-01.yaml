---
$schema: https://raw.githubusercontent.com/NederlandseDigitaleDienst/regelrecht/refs/tags/schema-v0.8.19/schema/v0.8.19/schema.json
$id: reductie_vestiging_in_handelsregister
regulatory_layer: REDUCTIE
publication_date: '2025-12-01'
valid_from: '2026-01-01'
# Geen regelgeving: een reductie van de Kamer van Koophandel over haar eigen
# kroniek (RFC-022 §4.1, RFC-048, RFC-051), met twee artikelen (schema
# v0.8.19). Artikel inschrijving is een aggregaat per inschrijving van een
# vestiging (artikel 1 van het fictieve beleid
# beleid_handelsregister_kamer_van_koophandel), met de correcties die ernaar
# verwijzen (artikel 2). Elke stap noemt het feit dat hij leest bij naam
# (schema v0.8.18). Een correctie zet de postcode en het aantal werkzame
# personen van de inschrijving; de dag van inschrijving, het nummer, de
# handelsnaam en het bezoekadres blijven. Een correctie van de postcode
# laat het bezoekadres dus staan; in deze casus verbetert geen correctie de
# postcode. Een nieuwe inschrijving is een eigen aggregaat. Artikel
# vestiging_in_handelsregister leest die aggregaten
# (source.projections) en geeft de inschrijving die op de peildatum geldt.
# Het aggregaat staat in dit bestand omdat alleen dit artikel het leest. De
# cel van de Kamer geeft de uitvoer van dat artikel als de antwoorden
# postcode_vestiging, aantal_werkzame_personen, handelsnaam_vestiging en
# bezoekadres_vestiging (cel.yaml, answers). Artikel 1 van het fictieve
# beleid bedrijfsparkeervergunning van Wilgendaal koppelt de eerste twee aan
# de open begrippen van artikel 2 en 3 van het fictieve uitvoeringsbesluit
# parkeren; daarvoor is de Kamer bevoegd (competent_authority van die
# begrippen, RFC-051 §2). Artikel 4 van dat beleid vult met de andere twee
# het aanvraagformulier vooraf in. De url wijst naar
# artikel 11 van de Handelsregisterwet 2007.
url: https://wetten.overheid.nl/BWBR0021777/2025-07-16#Artikel11
name: Vestiging in het handelsregister (reductie)
articles:
  - number: inschrijving
    text: >-
      Geen regelgeving. Het systeem van de Kamer van Koophandel houdt door
      middel van een chronolexografische reductie op zijn eigen kroniek per
      inschrijving van een vestiging bij met welke handelsnaam, met welk
      bezoekadres en welke postcode, met hoeveel
      werkzame personen en vanaf welke dag zij geldt, met de correcties
      erop.
    url: https://wetten.overheid.nl/BWBR0021777/2025-07-16#Artikel11
    machine_readable:
      projection:
        per: beleid_handelsregister_kamer_van_koophandel#1#vestiging_ingeschreven
        state:
          - name: handelsnaam
            type: string
          - name: bezoekadres
            type: string
          - name: postcode
            type: string
          - name: aantal_werkzame_personen
            type: number
          # Trekt een later record de inschrijving in, dan telt zij niet mee
          # en blijft dit leeg; reductie_vestiging_in_handelsregister slaat
          # zo'n aggregaat over.
          - name: datum_inschrijving
            type: date
        steps:
          - record: beleid_handelsregister_kamer_van_koophandel#1#vestiging_ingeschreven
            actions:
              - output: handelsnaam
                value: $record.handelsnaam
              - output: bezoekadres
                value: $record.bezoekadres
              - output: postcode
                value: $record.postcode
              - output: aantal_werkzame_personen
                value: $record.aantal_werkzame_personen
              - output: datum_inschrijving
                value: $record.datum_inschrijving
          - record: beleid_handelsregister_kamer_van_koophandel#2#inschrijving_gecorrigeerd
            actions:
              - output: postcode
                value: $record.postcode
              - output: aantal_werkzame_personen
                value: $record.aantal_werkzame_personen
  - number: vestiging_in_handelsregister
    text: >-
      Geen regelgeving. Het systeem van de Kamer van Koophandel kijkt door
      middel van een chronolexografische reductie op zijn eigen kroniek welke
      inschrijving van een vestiging van de onderneming op de peildatum geldt:
      de inschrijving met dat nummer en met de laatste dag van inschrijving op
      of vóór de peildatum. Vindt het systeem er geen, dan zwijgt het. Zijn er
      twee met dezelfde dag, dan geeft het geen antwoord maar een fout.
    url: https://wetten.overheid.nl/BWBR0021777/2025-07-16#Artikel11
    machine_readable:
      execution:
        parameters:
          - name: kvk_nummer
            type: string
            description: Het nummer dat de Kamer de onderneming toekende.
          - name: peildatum
            type: date
            description: De dag waarop het gevraagde gegeven moet gelden.
        input:
          # De inschrijvingen van het bedrijf, één rij per aggregaat, met
          # handelsnaam, bezoekadres, postcode, aantal_werkzame_personen en
          # datum_inschrijving zoals de correcties ze laten.
          - name: inschrijvingen
            type: array
            source:
              projections: reductie_vestiging_in_handelsregister#inschrijving
              where:
                kvk_nummer: $kvk_nummer
        output:
          - name: dagen_sinds_inschrijving
            type: number
            nullable: true
            description: >-
              Hoeveel dagen de laatste inschrijving van de onderneming op de
              peildatum al geldt; afwezig zonder inschrijving op of vóór die
              dag.
          - name: inschrijving
            type: object
            nullable: true
            description: De inschrijving die op de peildatum geldt.
          - name: handelsnaam_vestiging
            type: string
            nullable: true
            description: De handelsnaam van de vestiging op de peildatum.
          - name: bezoekadres_vestiging
            type: string
            nullable: true
            description: Het bezoekadres van de vestiging op de peildatum.
          - name: postcode_vestiging
            type: string
            nullable: true
            description: De postcode van het bezoekadres van de vestiging op de peildatum.
          - name: aantal_werkzame_personen
            type: number
            nullable: true
            description: Het aantal personen dat op de peildatum in de onderneming werkzaam is.
        actions:
          # De inschrijving met de laatste dag op of vóór de peildatum. Eerst
          # of zij een dag heeft: AND stopt bij de eerste onwaar.
          - output: dagen_sinds_inschrijving
            value:
              operation: FOREACH
              collection: $inschrijvingen
              as: i
              filter:
                operation: AND
                conditions:
                  - operation: NOT
                    value: {operation: EQUALS, subject: $i.datum_inschrijving, value: null}
                  - operation: GREATER_THAN_OR_EQUAL
                    subject:
                      operation: DATE_DIFF
                      from: $i.datum_inschrijving
                      to: $peildatum
                      in: days
                    value: 0
              body:
                operation: DATE_DIFF
                from: $i.datum_inschrijving
                to: $peildatum
                in: days
              combine: MIN
          # Twee inschrijvingen van hetzelfde nummer op dezelfde dag weigert
          # ONLY: welke dan geldt, zegt het beleid niet. Zonder inschrijving is
          # er geen (null).
          - output: inschrijving
            value:
              operation: FOREACH
              collection: $inschrijvingen
              as: i
              filter:
                operation: AND
                conditions:
                  - operation: NOT
                    value: {operation: EQUALS, subject: $i.datum_inschrijving, value: null}
                  - operation: EQUALS
                    subject:
                      operation: DATE_DIFF
                      from: $i.datum_inschrijving
                      to: $peildatum
                      in: days
                    value: $dagen_sinds_inschrijving
              body: $i
              combine: ONLY
          - output: handelsnaam_vestiging
            value: $inschrijving.handelsnaam
          - output: bezoekadres_vestiging
            value: $inschrijving.bezoekadres
          - output: postcode_vestiging
            value: $inschrijving.postcode
          - output: aantal_werkzame_personen
            value: $inschrijving.aantal_werkzame_personen
