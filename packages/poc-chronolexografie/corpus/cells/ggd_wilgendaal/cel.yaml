# Wie deze cel is (RFC-046). Fictief: de GGD die voor de gemeente Wilgendaal
# het geneeskundig onderzoek verricht (Regeling gehandicaptenparkeerkaart,
# artikel 3, eerste lid). Zij legt haar adviezen vast in haar eigen kroniek
# (artikel 5 van het fictieve beleid van Wilgendaal). Elk advies gaat als
# bericht naar de gemeente, die het in haar eigen kroniek vastlegt en eruit
# antwoordt; de GGD antwoordt zelf niets. Andersom komt een verzoek van de
# gemeente om een onderzoek als bericht bij de GGD binnen, die de ontvangst in
# haar eigen kroniek vastlegt (artikel 9).
name: GGD Wilgendaal
category: Gemeentelijke Gezondheidsdienst
