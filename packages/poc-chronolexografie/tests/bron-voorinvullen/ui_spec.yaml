---
# De UI-beschrijving van de testbron voor voorinvullen. FICTIEF. De poc leest
# alleen `prefill`: per veld van de aanvraag de bron waaruit het formulier
# het voorinvult. De andere sleutels staan er zoals een register ze draagt en
# leest de poc niet.
#
# Bewust in de oudere vorm (`elementen` met `prefill`), zodat de tests die
# vorm blijven lezen zolang de poc haar naast de vorm per veld leest; de casus
# bedrijfsparkeervergunning in corpus/ staat in de vorm per veld.
status: concept
elementen:
  - id: UI1
    element: aanvraagformulier
    voor: partij
    prefill:
      naam_opgegeven: voorbeeld_inschrijving#2#naam_volgens_register
      bestuur: voorbeeld_inschrijving#3#bestuur_volgens_register
      aanhef: voorbeeld_inschrijving#4#aanhef
      referentie: voorbeeld_inschrijving#4#referentie
  - id: UI2
    element: gegeven_aanpassen
    prefill:
      naam_opgegeven: voorbeeld_inschrijving#2#naam_volgens_register
    nog_te_bouwen:
      - {naam: iets, soort: parameter, artikel: voorbeeld_inschrijving#1, reden: een test}
