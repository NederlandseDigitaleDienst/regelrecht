[package]
name = "regelrecht-cel"
version = "0.1.0"
edition.workspace = true
authors = ["MinBZK <noreply@minbzk.nl>"]
description = "A cell that records an application from the law, the decision on it and an objection against that, in its chronicle (chronolexography, RFC-045, RFC-046 and RFC-048)"
license = "EUPL-1.2"
repository = "https://github.com/MinBZK/regelrecht"
publish = false

[dependencies]
regelrecht-engine = { path = "../engine" }
regelrecht-law-model = { path = "../law-model" }
chrono.workspace = true
rust_decimal.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
thiserror.workspace = true
uuid = { workspace = true, features = ["v7"] }

# A chronolexogram's id is a uuid v7, from the clock and random bits. In a
# browser both come from JavaScript.
[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { workspace = true, features = ["v7", "js"] }

# The step bindings of the cell's BDD suite (tests/bdd), generated from
# bdd/grammar.yaml and the cell's bdd/grammar.yaml with the engine's generator
# (see build.rs).
[build-dependencies]
serde = { workspace = true }
serde_yaml_ng = { workspace = true }

[dev-dependencies]
tempfile.workspace = true
# The cell's BDD suite (tests/bdd), which shares its world and dispatch with
# the engine's runner and adds the cell's steps.
cucumber = "0.23"
gherkin = "0.16"
futures = "0.3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
walkdir.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rust_decimal_macros.workspace = true

# The cell's BDD suite (bdd/features): a cell records submissions and
# decisions in its chronicle, and a reduction reads from it. Like the engine's
# `bdd` target it does not run in `cargo test`; `just bdd` and the CI job
# "BDD conformance" name it.
[[test]]
name = "bdd"
path = "tests/bdd/main.rs"
harness = false
test = false

[lints]
workspace = true
