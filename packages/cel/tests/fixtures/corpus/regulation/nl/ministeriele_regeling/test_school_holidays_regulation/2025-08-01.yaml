    text: FICTIEF, naar artikel 2 van de Regeling vaststelling schoolvakanties 2025-2030.
    url: https://example.com/test_school_holidays_regulation/2
    machine_readable:
      open_terms:
        - id: gemeente_van_vestiging
          type: string
          required: false
          description: De gemeente waarin de vestiging van de school ligt, of het openbaar lichaam in
            Caribisch Nederland (Bonaire, Sint-Eustatius, Saba).
        - id: provincie_van_vestiging
          type: string
          required: false
          description: De provincie waarin de vestiging van de school ligt. Afwezig voor een vestiging
            in Caribisch Nederland, dat niet in een provincie ligt.
        - id: deel_van_gemeente_van_vestiging
          type: string
          required: false
          description: De voormalige gemeente of de kern waarin de vestiging ligt, waar artikel 3 een
            gemeente zo verdeelt (Abcoude, Didam, Dodewaard, Aalburg, Hank, Dussen). Afwezig waar artikel
            3 dat niet doet.
      execution:
        input:
          - name: regio_van_plaats_van_vestiging
            type: string
            nullable: true
            source:
              regulation: test_school_holidays_regulation
              output: regio
              parameters:
                gemeente: $gemeente_van_vestiging
                provincie: $provincie_van_vestiging
                deel_van_gemeente: $deel_van_gemeente_van_vestiging
            description: De regio van artikel 3 waarin de plaats van vestiging ligt.
        output:
          - name: regio_van_school
            type: string
            nullable: true
            description: De regio waartoe de school behoort voor de perioden van de zomervakantie van
              artikel 6. Afwezig als artikel 3 de plaats van vestiging in geen regio noemt.
        actions:
          - output: regio_van_school
            value:
              operation: IF
              cases:
                - when:
                    operation: EQUALS
                    subject: $gemeente_van_vestiging
                    value: null
                  then: null
              default: $regio_van_plaats_van_vestiging
            legal_basis:
              law: Regeling vaststelling schoolvakanties 2025–2030
              article: '2'
              explanation: '"De plaats van vestiging is bepalend voor de regio waartoe een school behoort."'
