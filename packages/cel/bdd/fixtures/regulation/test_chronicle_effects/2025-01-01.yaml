---
# FICTIEF. A synthetic law for the cell's BDD suite
# (packages/cel/bdd/features/effects.feature). It is loosely shaped after the
# disabled parking card (Besluit administratieve bepalingen inzake het
# wegverkeer, artikel 49) and Awb 7:11 lid 2, cut down to what the scenarios
# need. None of it is the text of a law. Article 4 (a withdrawal), article 5
# (handing the card in) and article 6 (a warning in the place of a
# withdrawal) are fictional throughout, and so are articles 10 to 16 (schema
# v0.8.15): a ruling of the administrative court, the receipt of a copy of
# it, a ruling on further appeal that annuls that ruling, a provisional
# measure that suspends the card for a while, the lifting of that measure,
# when a suspended card is valid on a day, and the revocation of a
# suspension, each loosely after the Awb or invented for the tests.
$schema: https://raw.githubusercontent.com/NederlandseDigitaleDienst/regelrecht/refs/tags/schema-v0.8.15/schema/v0.8.15/schema.json
$id: test_chronicle_effects
name: Testwet effecten van besluiten
regulatory_layer: WET
bwb_id: BWBR9999916
publication_date: '2025-01-01'
valid_from: '2025-01-01'
url: https://example.com/test_chronicle_effects

articles:
  - number: '1'
    url: https://example.com/test_chronicle_effects/1
    text: >-
      FICTIEF. Op aanvraag verleent het college een gehandicaptenparkeerkaart
      aan wie ernstig beperkt is in zijn loopvermogen.
    machine_readable:
      execution:
        produces:
          - type: AANVRAAG
            requests: test_chronicle_effects#1
            parameters:
              - ernstig_beperkt
              - aanvrager
          - type: BESCHIKKING
            outputs:
              - kaart_verleend
        parameters:
          - name: ernstig_beperkt
            type: boolean
          - name: aanvrager
            type: string
        output:
          - name: kaart_verleend
            type: boolean
        actions:
          - output: kaart_verleend
            value: $ernstig_beperkt

  - number: '2'
    url: https://example.com/test_chronicle_effects/2
    text: >-
      FICTIEF, naar artikel 7:11, tweede lid, van de Algemene wet
      bestuursrecht. Is het bezwaar gegrond, dan herroept het college het
      bestreden besluit.
    machine_readable:
      execution:
        produces:
          - type: BEZWAAR
            requests: test_chronicle_effects#2
            parameters:
              - bestreden_besluit
          - type: BESCHIKKING
            outputs:
              - herroepen
            effects:
              - revokes: bestreden_besluit
                when: herroepen
        parameters:
          - name: bestreden_besluit
            type: string
          # Whether the objection is well-founded is the college's finding
          # on reconsideration (Awb 7:11 lid 1), not part of the objection.
          - name: bezwaar_gegrond
            type: boolean
        output:
          - name: herroepen
            type: boolean
        actions:
          - output: herroepen
            value: $bezwaar_gegrond

  - number: '3'
    url: https://example.com/test_chronicle_effects/3
    text: >-
      FICTIEF, naar artikel 7:11, tweede lid, van de Algemene wet
      bestuursrecht. Het college neemt in de plaats van het herroepen besluit
      een nieuw besluit op de aanvraag.
    machine_readable:
      execution:
        produces:
          - type: BESCHIKKING
            outputs:
              - kaart_verleend
            effects:
              - revokes: bestreden_besluit
        parameters:
          - name: bestreden_besluit
            type: string
          - name: ernstig_beperkt
            type: boolean
          - name: aanvrager
            type: string
        output:
          - name: kaart_verleend
            type: boolean
        actions:
          - output: kaart_verleend
            value: $ernstig_beperkt

  - number: '4'
    url: https://example.com/test_chronicle_effects/4
    text: >-
      FICTIEF. Het college kan een verleende gehandicaptenparkeerkaart
      intrekken. Het corpus modelleert geen intrekking van deze kaart; dit
      artikel bestaat alleen voor de tests.
    machine_readable:
      execution:
        produces:
          - type: BESCHIKKING
            outputs:
              - ingetrokken
            effects:
              - revokes: ingetrokken_besluit
        parameters:
          - name: ingetrokken_besluit
            type: string
        output:
          - name: ingetrokken
            type: boolean
        actions:
          - output: ingetrokken
            value: true

  - number: '5'
    url: https://example.com/test_chronicle_effects/5
    text: >-
      FICTIEF. Levert de houder zijn gehandicaptenparkeerkaart in bij de balie
      van het gemeentehuis, dan wordt dat als feit vastgelegd. Het corpus
      modelleert geen inlevering van deze kaart; dit artikel bestaat alleen
      voor de tests.
    machine_readable:
      requires:
        - fact: kaart_ingeleverd
          description: De houder heeft zijn kaart ingeleverd bij de balie, op de dag die het feit noemt.
          parameters:
            - ingeleverd_op
            - aanvrager
      execution:
        parameters:
          - name: ingeleverd_op
            type: date
          - name: aanvrager
            type: string

  - number: '6'
    url: https://example.com/test_chronicle_effects/6
    text: >-
      FICTIEF. Is het bezwaar tegen een intrekking gegrond, dan kan het
      college in de plaats van de intrekking een waarschuwing geven. Het
      corpus modelleert dit niet; dit artikel bestaat alleen voor de tests.
    machine_readable:
      execution:
        produces:
          - type: BESCHIKKING
            outputs:
              - waarschuwing
            effects:
              - revokes: bestreden_besluit
        parameters:
          - name: bestreden_besluit
            type: string
        output:
          - name: waarschuwing
            type: boolean
        actions:
          - output: waarschuwing
            value: true

  - number: '7'
    url: https://example.com/test_chronicle_effects/7
    text: >-
      FICTIEF. Wie een kaart verleend krijgt, heeft een kaart, en er is een
      verleende kaart meer. Een weigering laat beide zoals ze waren.
    machine_readable:
      execution:
        parameters:
          - name: in_bezit
            type: boolean
          - name: aantal_verleend
            type: number
          - name: kaart_verleend
            type: boolean
        output:
          - name: in_bezit_na_besluit
            type: boolean
          - name: aantal_verleend_na_besluit
            type: number
        actions:
          - output: in_bezit_na_besluit
            value:
              operation: OR
              conditions:
                - $in_bezit
                - $kaart_verleend
          - output: aantal_verleend_na_besluit
            value:
              operation: IF
              cases:
                - when: $kaart_verleend
                  then:
                    operation: ADD
                    values:
                      - $aantal_verleend
                      - 1
              default: $aantal_verleend

  - number: '8'
    url: https://example.com/test_chronicle_effects/8
    text: >-
      FICTIEF. Wie zijn kaart inlevert, heeft geen kaart meer.
    machine_readable:
      execution:
        output:
          - name: in_bezit_na_inlevering
            type: boolean
        actions:
          - output: in_bezit_na_inlevering
            value: false

  - number: '9'
    url: https://example.com/test_chronicle_effects/9
    text: >-
      FICTIEF. Wie een geldige kaart heeft, mag parkeren op een
      gehandicaptenparkeerplaats. Of de aanvrager een geldige kaart heeft,
      stelt het college vast.
    machine_readable:
      open_terms:
        - id: aanvrager_heeft_geldige_kaart
          type: boolean
          required: true
      execution:
        parameters:
          - name: aanvrager
            type: string
        output:
          - name: mag_parkeren
            type: boolean
        actions:
          - output: mag_parkeren
            value: $aanvrager_heeft_geldige_kaart

  - number: '10'
    url: https://example.com/test_chronicle_effects/10
    text: >-
      FICTIEF, naar artikel 8:72, eerste lid, van de Algemene wet
      bestuursrecht. Acht de bestuursrechter het beroep gegrond, dan
      vernietigt hij het bestreden besluit geheel of gedeeltelijk.
    machine_readable:
      execution:
        produces:
          - type: BEROEP
            requests: test_chronicle_effects#10
            parameters:
              - bestreden_besluit
          - type: UITSPRAAK
            outputs:
              - vernietigd
        parameters:
          - name: bestreden_besluit
            type: string
          # Whether the appeal is well-founded is the court's finding. The
          # test reads a well-founded appeal as annulling the whole decision;
          # a partial annulment, and keeping the legal effects of the
          # annulled decision (Awb 8:72 lid 3), are left out.
          - name: beroep_gegrond
            type: boolean
        output:
          - name: vernietigd
            type: boolean
        actions:
          - output: vernietigd
            value: $beroep_gegrond

  - number: '11'
    url: https://example.com/test_chronicle_effects/11
    text: >-
      FICTIEF, naar de artikelen 8:72, eerste lid, en 8:79, eerste lid, van
      de Algemene wet bestuursrecht. Het college legt vast dat het een
      afschrift heeft ontvangen van de uitspraak over zijn besluit. Vernietigt
      de uitspraak het besluit, dan heeft het besluit geen gevolgen meer.
    machine_readable:
      requires:
        - fact: afschrift_uitspraak_ontvangen
          description: >-
            Het college heeft een afschrift ontvangen van de uitspraak van de
            bestuursrechter over zijn besluit.
          parameters:
            - bestreden_besluit
            - vernietigd
          # Both come from the copy, as any field of a receipt: the decision
          # the ruling is about, by its id, and whether the ruling annuls it.
          effects:
            - revokes: bestreden_besluit
              when: vernietigd
      execution:
        parameters:
          - name: bestreden_besluit
            type: string
          - name: vernietigd
            type: boolean

  - number: '12'
    url: https://example.com/test_chronicle_effects/12
    text: >-
      FICTIEF, naar titel 8.5 van de Algemene wet bestuursrecht. Het college
      legt vast dat de hogerberoepsrechter de uitspraak waarvan het een
      afschrift ontving heeft vernietigd en het beroep alsnog ongegrond heeft
      verklaard. Die uitspraak heeft dan geen gevolgen meer.
    machine_readable:
      requires:
        - fact: uitspraak_vernietigd_in_hoger_beroep
          description: >-
            De uitspraak waarvan het college een afschrift ontving, is in hoger
            beroep vernietigd, en het beroep is alsnog ongegrond verklaard.
          parameters:
            - ontvangen_afschrift
          effects:
            - revokes: ontvangen_afschrift
      execution:
        parameters:
          # The receipt of the copy of the annulled ruling, by its id in the
          # cell's chronicle; the ruling itself is in the court's.
          - name: ontvangen_afschrift
            type: string

  - number: '13'
    url: https://example.com/test_chronicle_effects/13
    text: >-
      FICTIEF, naar artikel 8:81 van de Algemene wet bestuursrecht. Het
      college legt vast dat de voorzieningenrechter de kaart van de aanvrager
      heeft geschorst, vanaf de dag waarop de schorsing ingaat tot de dag
      waarop zij eindigt.
    machine_readable:
      # A suspension holds from a day on and ends: it revokes nothing. What
      # it does is a step of the reduction, which keeps the period in its
      # state; article 15 says what the period means on a given day.
      requires:
        - fact: besluit_geschorst
          description: >-
            De voorzieningenrechter heeft de kaart geschorst, van de ene dag
            tot de andere.
          parameters:
            - aanvrager
            - schorsing_vanaf
            - schorsing_tot
      execution:
        parameters:
          - name: aanvrager
            type: string
          - name: schorsing_vanaf
            type: date
          # A suspension without an end holds until the court decides
          # otherwise.
          - name: schorsing_tot
            type: date
            nullable: true

  - number: '14'
    url: https://example.com/test_chronicle_effects/14
    text: >-
      FICTIEF, naar artikel 8:88 van de Algemene wet bestuursrecht. Het
      college legt vast dat de voorzieningenrechter de schorsing heeft
      opgeheven. De schorsing eindigt op de dag van opheffing.
    machine_readable:
      requires:
        - fact: schorsing_opgeheven
          description: >-
            De voorzieningenrechter heeft de schorsing van de kaart opgeheven.
          parameters:
            - aanvrager
            - opgeheven_op
      execution:
        parameters:
          - name: aanvrager
            type: string
          - name: opgeheven_op
            type: date

  - number: '15'
    url: https://example.com/test_chronicle_effects/15
    text: >-
      FICTIEF, naar artikel 8:81 van de Algemene wet bestuursrecht. Wie een
      kaart heeft, heeft op een dag een geldige kaart, tenzij de kaart op die
      dag is geschorst: op of na de dag waarop de schorsing ingaat en voor de
      dag waarop zij eindigt.
    machine_readable:
      execution:
        parameters:
          - name: in_bezit
            type: boolean
          - name: geschorst_vanaf
            type: date
            nullable: true
          - name: geschorst_tot
            type: date
            nullable: true
          - name: peildatum
            type: date
        output:
          - name: kaart_geldig_op_peildatum
            type: boolean
        actions:
          - output: kaart_geldig_op_peildatum
            value:
              operation: IF
              cases:
                - when:
                    operation: NOT
                    value: $in_bezit
                  then: false
                # Never suspended.
                - when:
                    operation: EQUALS
                    subject: $geschorst_vanaf
                    value: null
                  then: true
                # The suspension has not begun on the day.
                - when:
                    operation: LESS_THAN
                    subject:
                      operation: DATE_DIFF
                      from: $geschorst_vanaf
                      to: $peildatum
                      in: days
                    value: 0
                  then: true
                # A suspension without an end holds.
                - when:
                    operation: EQUALS
                    subject: $geschorst_tot
                    value: null
                  then: false
                # The suspension has ended before or on the day.
                - when:
                    operation: GREATER_THAN_OR_EQUAL
                    subject:
                      operation: DATE_DIFF
                      from: $geschorst_tot
                      to: $peildatum
                      in: days
                    value: 0
                  then: true
              default: false

  - number: '16'
    url: https://example.com/test_chronicle_effects/16
    text: >-
      FICTIEF. Het college legt vast dat een vastgelegde schorsing met
      terugwerkende kracht is vervallen. Zij heeft dan nooit gegolden. De Awb
      kent geen hoger beroep tegen een uitspraak van de voorzieningenrechter;
      dit artikel bestaat alleen om te tonen dat een herroepen schorsing
      nooit in de staat van een reductie komt.
    machine_readable:
      requires:
        - fact: schorsing_vervallen
          description: >-
            De schorsing heeft met terugwerkende kracht nooit gegolden.
          parameters:
            - vervallen_schorsing
          effects:
            - revokes: vervallen_schorsing
      execution:
        parameters:
          # The suspension recorded under article 13, by its id.
          - name: vervallen_schorsing
            type: string
