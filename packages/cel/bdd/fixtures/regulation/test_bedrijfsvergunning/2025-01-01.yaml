---
# FICTIEF. A synthetic law for the cell's BDD suite: a permit for a company,
# valid up to a date, and when such a permit counts on a given day. None of
# it is the text of a law.
$schema: https://raw.githubusercontent.com/NederlandseDigitaleDienst/regelrecht/refs/tags/schema-v0.8.14/schema/v0.8.14/schema.json
$id: test_bedrijfsvergunning
name: Testwet bedrijfsvergunning
regulatory_layer: WET
bwb_id: BWBR9999918
publication_date: '2025-01-01'
valid_from: '2025-01-01'
url: https://example.com/test_bedrijfsvergunning

articles:
  - number: '1'
    url: https://example.com/test_bedrijfsvergunning/1
    text: >-
      FICTIEF. Op aanvraag verleent het college een bedrijf een vergunning,
      geldig tot en met de dag die de aanvraag noemt.
    machine_readable:
      execution:
        produces:
          - type: AANVRAAG
            requests: test_bedrijfsvergunning#1
            parameters:
              - bedrijf
              - geldig_tot
          - type: BESCHIKKING
            outputs:
              - vergunning_verleend
        parameters:
          - name: bedrijf
            type: string
          - name: geldig_tot
            type: date
        output:
          - name: vergunning_verleend
            type: boolean
        actions:
          - output: vergunning_verleend
            value: true

  - number: '2'
    url: https://example.com/test_bedrijfsvergunning/2
    text: >-
      FICTIEF. Een verleende vergunning telt op een peildatum mee als zij op
      die dag nog geldig is.
    machine_readable:
      execution:
        parameters:
          - name: aantal
            type: number
          - name: verleend
            type: boolean
          - name: geldig_tot
            type: date
          - name: peildatum
            type: date
        output:
          - name: aantal_na_besluit
            type: number
        actions:
          - output: aantal_na_besluit
            value:
              operation: IF
              cases:
                - when:
                    operation: AND
                    conditions:
                      - $verleend
                      - operation: GREATER_THAN_OR_EQUAL
                        subject:
                          operation: DATE_DIFF
                          from: $peildatum
                          to: $geldig_tot
                          in: days
                        value: 0
                  then:
                    operation: ADD
                    values:
                      - $aantal
                      - 1
              default: $aantal
