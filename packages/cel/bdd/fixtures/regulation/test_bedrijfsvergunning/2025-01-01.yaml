---
# FICTIEF. A synthetic law for the cell's BDD suite: a permit for a company,
# valid up to a date, and when such a permit counts on a given day. None of
# it is the text of a law.
$schema: https://raw.githubusercontent.com/NederlandseDigitaleDienst/regelrecht/refs/tags/schema-v0.8.17/schema/v0.8.17/schema.json
$id: test_bedrijfsvergunning
name: Testwet bedrijfsvergunning
regulatory_layer: WET
bwb_id: BWBR9999918
publication_date: '2025-01-01'
valid_from: '2025-01-01'
url: https://example.com/test_bedrijfsvergunning

articles:
  - number: '1'
    url: https://example.com/test_bedrijfsvergunning/1
    text: >-
      FICTIEF. Op aanvraag verleent het college een bedrijf een vergunning,
      geldig tot en met de dag die de aanvraag noemt.
    machine_readable:
      execution:
        produces:
          - type: AANVRAAG
            requests: test_bedrijfsvergunning#1
            parameters:
              - bedrijf
              - geldig_tot
          - type: BESCHIKKING
            outputs:
              - vergunning_verleend
        parameters:
          - name: bedrijf
            type: string
          - name: geldig_tot
            type: date
        output:
          - name: vergunning_verleend
            type: boolean
        actions:
          - output: vergunning_verleend
            value: true

  - number: '2'
    url: https://example.com/test_bedrijfsvergunning/2
    text: >-
      FICTIEF. Een verleende vergunning telt op een peildatum mee als zij op
      die dag nog geldig is.
    machine_readable:
      execution:
        parameters:
          - name: vergunningen
            type: array
          - name: peildatum
            type: date
        output:
          - name: aantal_geldig
            type: number
        actions:
          - output: aantal_geldig
            value:
              operation: FOREACH
              collection: $vergunningen
              as: vergunning
              filter:
                operation: AND
                conditions:
                  - $vergunning.verleend
                  - operation: GREATER_THAN_OR_EQUAL
                    subject:
                      operation: DATE_DIFF
                      from: $peildatum
                      to: $vergunning.geldig_tot
                      in: days
                    value: 0
              body: 1
              combine: ADD
