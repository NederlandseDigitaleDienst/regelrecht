---
# FICTIEF. A read model of the cell's BDD suite
# (packages/cel/bdd/features/corrections.feature): the address of the
# resident, from the one registration of the resident that holds a postcode
# (test_reductie_inschrijving).
$schema: https://raw.githubusercontent.com/NederlandseDigitaleDienst/regelrecht/refs/tags/schema-v0.8.15/schema/v0.8.15/schema.json
$id: test_reductie_adres
regulatory_layer: REDUCTIE
publication_date: '2025-01-01'
valid_from: '2025-01-01'
url: https://example.com/test_reductie_adres
name: Adres van een bewoner (testreductie)

articles:
  - number: '1'
    url: https://example.com/test_reductie_adres/1
    text: >-
      FICTIEF. De postcode en het huisnummer van de bewoner, uit zijn
      inschrijving met een postcode.
    machine_readable:
      execution:
        parameters:
          - name: bewoner
            type: string
        input:
          - name: inschrijvingen
            type: array
            source:
              projections: test_reductie_inschrijving
              where:
                bewoner: $bewoner
        output:
          - name: postcode
            type: string
            nullable: true
          - name: huisnummer
            type: number
            nullable: true
        actions:
          - output: postcode
            value:
              operation: FOREACH
              collection: $inschrijvingen
              as: inschrijving
              filter:
                operation: NOT
                value: {operation: EQUALS, subject: $inschrijving.postcode, value: null}
              body: $inschrijving.postcode
              combine: ONLY
          - output: huisnummer
            value:
              operation: FOREACH
              collection: $inschrijvingen
              as: inschrijving
              filter:
                operation: NOT
                value: {operation: EQUALS, subject: $inschrijving.postcode, value: null}
              body: $inschrijving.huisnummer
              combine: ONLY
