---
# FICTIEF. A reduction of the cell's BDD suite over test_parkeervergunning,
# keyed by kenteken. The same chronicle is also read keyed by the other field
# (test_reductie_vergunning_per_kenteken, test_reductie_vergunning_per_bewoner):
# a decision that replaces a permit replaces it for both questions.
$schema: https://raw.githubusercontent.com/NederlandseDigitaleDienst/regelrecht/refs/tags/schema-v0.8.15/schema/v0.8.15/schema.json
$id: test_reductie_vergunning_per_kenteken
regulatory_layer: REDUCTIE
publication_date: '2025-01-01'
valid_from: '2025-01-01'
url: https://example.com/test_reductie_vergunning_per_kenteken
name: Parkeervergunning per kenteken (testreductie)

articles:
  - number: '1'
    url: https://example.com/test_reductie_vergunning_per_kenteken/1
    text: >-
      FICTIEF. Een kenteken heeft een vergunning als een verlening of omzetting voor dat kenteken meetelt.
    machine_readable:
      projection:
        key: kenteken
      execution:
        parameters:
          - name: kenteken
            type: string
        input:
          - name: vergunningen
            type: array
            source:
              decisions: test_parkeervergunning#1
          - name: omzettingen
            type: array
            source:
              decisions: test_parkeervergunning#2
        output:
          - name: kenteken_heeft_vergunning
            type: boolean
        actions:
          - output: kenteken_heeft_vergunning
            value:
              operation: OR
              conditions:
                - operation: FOREACH
                  collection: $vergunningen
                  as: besluit
                  body: true
                  combine: OR
                - operation: FOREACH
                  collection: $omzettingen
                  as: besluit
                  body: true
                  combine: OR
