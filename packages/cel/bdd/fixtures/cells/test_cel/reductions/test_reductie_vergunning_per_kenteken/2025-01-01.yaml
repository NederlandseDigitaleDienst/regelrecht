---
# FICTIEF. A reduction of the cell's BDD suite over test_parkeervergunning,
# keyed by kenteken. The same chronicle is also read keyed by the other field
# (test_reductie_vergunning_per_kenteken, test_reductie_vergunning_per_bewoner):
# a decision that moves a permit revokes it for both questions.
$schema: https://raw.githubusercontent.com/NederlandseDigitaleDienst/regelrecht/refs/tags/schema-v0.8.14/schema/v0.8.14/schema.json
$id: test_reductie_vergunning_per_kenteken
regulatory_layer: REDUCTIE
publication_date: '2025-01-01'
valid_from: '2025-01-01'
url: https://example.com/test_reductie_vergunning_per_kenteken
name: Parkeervergunning per kenteken (testreductie)

articles:
  - number: '1'
    url: https://example.com/test_reductie_vergunning_per_kenteken/1
    text: >-
      FICTIEF. Een kenteken heeft een vergunning als een verlening of omzetting voor dat kenteken meetelt.
    machine_readable:
      projection:
        key: kenteken
        state:
          - name: vergunning
            type: boolean
        steps:
          # A grant and a move both make the resident the holder of a permit
          # for the plate in the decision (article 4).
          - record: test_parkeervergunning#1
            apply: test_parkeervergunning#4
            parameters:
              verleend: $record.vergunning_verleend
              kenteken: $record.kenteken
            output:
              vergunning: houder
          - record: test_parkeervergunning#2
            apply: test_parkeervergunning#4
            parameters:
              verleend: $record.vergunning_omgezet
              kenteken: $record.kenteken
            output:
              vergunning: houder
      execution:
        parameters:
          - name: kenteken
            type: string
        output:
          - name: kenteken_heeft_vergunning
            type: boolean
        actions:
          - output: kenteken_heeft_vergunning
            value: $state.vergunning
