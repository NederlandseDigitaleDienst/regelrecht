---
# FICTIEF. The reduction of the cell's BDD suite
# (packages/cel/bdd/features/effects.feature). It is given only the decisions
# whose consequences count, in the order they were recorded; which ones those
# are follows from the effects the law declares (`produces[].effects`), played
# by the cell, not from anything in this reduction.
$schema: https://raw.githubusercontent.com/NederlandseDigitaleDienst/regelrecht/refs/tags/schema-v0.8.14/schema/v0.8.14/schema.json
$id: test_reductie_geldige_kaart
regulatory_layer: REDUCTIE
publication_date: '2025-01-01'
valid_from: '2025-01-01'
url: https://example.com/test_reductie_geldige_kaart
name: Geldige gehandicaptenparkeerkaart (testreductie)

articles:
  - number: '1'
    url: https://example.com/test_reductie_geldige_kaart/1
    text: >-
      FICTIEF. De aanvrager heeft een geldige kaart als een besluit op de
      kaart waarvan de gevolgen meetellen, de kaart verleent.
    machine_readable:
      execution:
        parameters:
          - name: besluiten
            type: array
        output:
          - name: heeft_geldige_kaart
            type: boolean
        actions:
          - output: heeft_geldige_kaart
            value:
              operation: FOREACH
              collection: $besluiten
              as: besluit
              # Only a decision on the card holds `kaart_verleend`: the
              # basis is checked first, and AND stops at the first false.
              filter:
                operation: AND
                conditions:
                  - operation: IN
                    subject: $besluit.basis
                    values:
                      - test_chronicle_effects#1
                      - test_chronicle_effects#3
                  - operation: EQUALS
                    subject: $besluit.kaart_verleend
                    value: true
              body: true
              combine: OR
