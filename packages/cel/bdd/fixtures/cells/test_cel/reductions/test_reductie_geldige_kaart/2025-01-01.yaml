---
# FICTIEF. A read model of the cell's BDD suite
# (packages/cel/bdd/features/effects.feature): it plays nothing itself and
# reads the aggregates of test_reductie_kaart_per_besluit of the applicant.
$schema: https://raw.githubusercontent.com/NederlandseDigitaleDienst/regelrecht/refs/tags/schema-v0.8.15/schema/v0.8.15/schema.json
$id: test_reductie_geldige_kaart
regulatory_layer: REDUCTIE
publication_date: '2025-01-01'
valid_from: '2025-01-01'
url: https://example.com/test_reductie_geldige_kaart
name: Geldige gehandicaptenparkeerkaart (testreductie)

articles:
  - number: '1'
    url: https://example.com/test_reductie_geldige_kaart/1
    text: >-
      FICTIEF. De aanvrager heeft een geldige kaart als hij er een heeft uit
      een van zijn besluiten; zijn kaart is een vervanging als hij er een
      heeft en er meer dan een verlening meetelde.
    machine_readable:
      execution:
        parameters:
          - name: aanvrager
            type: string
        input:
          - name: kaarten
            type: array
            source:
              projections: test_reductie_kaart_per_besluit
              where:
                aanvrager: $aanvrager
        output:
          - name: heeft_geldige_kaart
            type: boolean
          - name: kaart_is_vervanging
            type: boolean
        actions:
          - output: heeft_geldige_kaart
            value:
              operation: FOREACH
              collection: $kaarten
              as: kaart
              body: $kaart.in_bezit
              combine: OR
          - output: kaart_is_vervanging
            value:
              operation: AND
              conditions:
                - $heeft_geldige_kaart
                - operation: GREATER_THAN
                  subject:
                    operation: FOREACH
                    collection: $kaarten
                    as: kaart
                    body: $kaart.aantal_verleend
                    combine: ADD
                  value: 1
