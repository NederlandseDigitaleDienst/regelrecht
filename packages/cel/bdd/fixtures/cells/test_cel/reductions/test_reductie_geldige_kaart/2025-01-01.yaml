---
# FICTIEF. The reduction of the cell's BDD suite
# (packages/cel/bdd/features/effects.feature). It reads the records of one
# applicant that are in force: the grants, the decisions in the place of
# another, and the cards handed in. Which records are in force follows from
# the effects the law gives a decision on another one (`produces[].effects`);
# the engine carries those out by rewinding, and nothing in this reduction
# speaks of revoking or replacing.
$schema: https://raw.githubusercontent.com/NederlandseDigitaleDienst/regelrecht/refs/tags/schema-v0.8.15/schema/v0.8.15/schema.json
$id: test_reductie_geldige_kaart
regulatory_layer: REDUCTIE
publication_date: '2025-01-01'
valid_from: '2025-01-01'
url: https://example.com/test_reductie_geldige_kaart
name: Geldige gehandicaptenparkeerkaart (testreductie)

articles:
  - number: '1'
    url: https://example.com/test_reductie_geldige_kaart/1
    text: >-
      FICTIEF. De aanvrager heeft een geldige kaart als een verlening, een
      besluit in de plaats daarvan of een uitspraak in de plaats daarvan die
      meetelt hem een kaart gaf, later dan
      hij een kaart inleverde. Zijn kaart is een vervanging als hij er een
      heeft en meer dan een verlening meetelt.
    machine_readable:
      # Only the records of the applicant asked for, and what refers to
      # them, such as an objection and the decision on it.
      projection:
        key: aanvrager
      execution:
        parameters:
          - name: aanvrager
            type: string
        input:
          - name: verleningen
            type: array
            source:
              decisions: test_chronicle_effects#1
          - name: besluiten_in_de_plaats
            type: array
            source:
              decisions: test_chronicle_effects#3
          # A court ruling in the place of a decision (FICTIEF, art. 11),
          # received as a copy from the court's cell.
          - name: uitspraken
            type: array
            source:
              decisions: test_chronicle_effects#11
          - name: inleveringen
            type: array
            source:
              facts: test_chronicle_effects#5#kaart_ingeleverd
        output:
          - name: heeft_geldige_kaart
            type: boolean
          - name: kaart_is_vervanging
            type: boolean
        actions:
          - output: heeft_geldige_kaart
            value: &geldige_kaart
              operation: OR
              conditions:
                - operation: FOREACH
                  collection: $verleningen
                  as: besluit
                  filter: &na_de_laatste_inlevering
                    operation: AND
                    conditions:
                      - $besluit.kaart_verleend
                      # Recorded after the last card handed in: fewer days
                      # before the calculation date than that hand-in.
                      - &later_dan_de_inlevering
                        operation: OR
                        conditions:
                          - operation: EQUALS
                            subject: &dagen_sinds_inlevering
                              operation: FOREACH
                              collection: $inleveringen
                              as: inlevering
                              body:
                                operation: DATE_DIFF
                                from: $inlevering.recorded_on
                                to: $referencedate
                                in: days
                              combine: MIN
                            value: null
                          - operation: LESS_THAN
                            subject:
                              operation: DATE_DIFF
                              from: $besluit.recorded_on
                              to: $referencedate
                              in: days
                            value: *dagen_sinds_inlevering
                  body: true
                  combine: OR
                - operation: FOREACH
                  collection: $besluiten_in_de_plaats
                  as: besluit
                  filter: *na_de_laatste_inlevering
                  body: true
                  combine: OR
                - operation: FOREACH
                  collection: $uitspraken
                  as: besluit
                  filter:
                    operation: AND
                    conditions:
                      - $besluit.in_de_plaats_verleend
                      - *later_dan_de_inlevering
                  body: true
                  combine: OR
          - output: kaart_is_vervanging
            value:
              operation: AND
              conditions:
                - *geldige_kaart
                - operation: GREATER_THAN
                  subject:
                    operation: ADD
                    values:
                      -
                        operation: FOREACH
                        collection: $verleningen
                        as: besluit
                        filter: $besluit.kaart_verleend
                        body: 1
                        combine: ADD
                      - operation: FOREACH
                        collection: $besluiten_in_de_plaats
                        as: besluit
                        filter: $besluit.kaart_verleend
                        body: 1
                        combine: ADD
                      - operation: FOREACH
                        collection: $uitspraken
                        as: besluit
                        filter: $besluit.in_de_plaats_verleend
                        body: 1
                        combine: ADD
                  value: 1
