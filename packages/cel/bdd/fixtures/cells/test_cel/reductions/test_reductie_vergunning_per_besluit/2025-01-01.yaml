---
# FICTIEF. A reduction of the cell's BDD suite over test_bedrijfsvergunning
# (schema v0.8.15): one aggregate per decision on an application, with the
# day up to which its permit is valid. test_reductie_geldige_vergunningen_op_peildatum
# reads the aggregates.
$schema: https://raw.githubusercontent.com/NederlandseDigitaleDienst/regelrecht/refs/tags/schema-v0.8.15/schema/v0.8.15/schema.json
$id: test_reductie_vergunning_per_besluit
regulatory_layer: REDUCTIE
publication_date: '2025-01-01'
valid_from: '2025-01-01'
url: https://example.com/test_reductie_vergunning_per_besluit
name: Vergunning per besluit (testreductie)

articles:
  - number: '1'
    url: https://example.com/test_reductie_vergunning_per_besluit/1
    text: >-
      FICTIEF. Per besluit op een aanvraag: of het een vergunning verleent,
      en tot en met welke dag zij geldig is.
    machine_readable:
      projection:
        per: test_bedrijfsvergunning#1#BESCHIKKING
        state:
          - name: verleend
            type: boolean
          - name: geldig_tot
            type: date
        steps:
          - record: test_bedrijfsvergunning#1#BESCHIKKING
            actions:
              - output: verleend
                value: $record.vergunning_verleend
              - output: geldig_tot
                value: $record.geldig_tot
