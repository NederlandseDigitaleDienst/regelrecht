---
# FICTIEF. A reduction of the cell's BDD suite: one aggregate per
# registration under article 1 of test_chronicle_corrections (schema
# v0.8.17), with the corrections about it (article 2).
$schema: https://raw.githubusercontent.com/NederlandseDigitaleDienst/regelrecht/refs/tags/schema-v0.8.17/schema/v0.8.17/schema.json
$id: test_reductie_inschrijving
regulatory_layer: REDUCTIE
publication_date: '2025-01-01'
valid_from: '2025-01-01'
url: https://example.com/test_reductie_inschrijving
name: Inschrijving (testreductie)

articles:
  - number: '1'
    url: https://example.com/test_reductie_inschrijving/1
    text: >-
      FICTIEF. Per inschrijving de postcode en het huisnummer, zoals de
      inschrijving en de correcties die meetellen ze vastleggen.
    machine_readable:
      projection:
        per: test_chronicle_corrections#1
        state:
          - name: postcode
            type: string
          - name: huisnummer
            type: number
        steps:
          - record: test_chronicle_corrections#1
            actions:
              - output: postcode
                value: $record.postcode
              - output: huisnummer
                value: $record.huisnummer
          - record: test_chronicle_corrections#2
            actions:
              - output: postcode
                value: $record.postcode
