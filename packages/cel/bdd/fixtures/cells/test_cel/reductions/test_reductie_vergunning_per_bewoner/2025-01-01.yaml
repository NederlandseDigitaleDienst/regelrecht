---
# FICTIEF. A read model of the cell's BDD suite: the plate of the permit of
# a resident, from the aggregates of test_reductie_parkeervergunning.
$schema: https://raw.githubusercontent.com/NederlandseDigitaleDienst/regelrecht/refs/tags/schema-v0.8.17/schema/v0.8.17/schema.json
$id: test_reductie_vergunning_per_bewoner
regulatory_layer: REDUCTIE
publication_date: '2025-01-01'
valid_from: '2025-01-01'
url: https://example.com/test_reductie_vergunning_per_bewoner
name: Vergunning per bewoner (testreductie)

articles:
  - number: '1'
    url: https://example.com/test_reductie_vergunning_per_bewoner/1
    text: >-
      FICTIEF. De vergunning van een bewoner geldt voor het kenteken van zijn
      vergunning die geldt.
    machine_readable:
      execution:
        parameters:
          - name: bewoner
            type: string
        input:
          - name: vergunningen
            type: array
            source:
              projections: test_reductie_parkeervergunning
              where:
                bewoner: $bewoner
        output:
          - name: kenteken_van_bewoner
            type: string
            nullable: true
        actions:
          - output: kenteken_van_bewoner
            value:
              operation: FOREACH
              collection: $vergunningen
              as: v
              filter: $v.vergunning
              body: $v.kenteken
              combine: ONLY
