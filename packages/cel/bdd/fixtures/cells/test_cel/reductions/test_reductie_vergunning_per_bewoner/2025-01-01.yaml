---
# FICTIEF. A reduction of the cell's BDD suite over test_parkeervergunning,
# keyed by bewoner. The same chronicle is also read keyed by the other field
# (test_reductie_vergunning_per_kenteken, test_reductie_vergunning_per_bewoner):
# a decision that replaces a permit replaces it for both questions.
$schema: https://raw.githubusercontent.com/NederlandseDigitaleDienst/regelrecht/refs/tags/schema-v0.8.15/schema/v0.8.15/schema.json
$id: test_reductie_vergunning_per_bewoner
regulatory_layer: REDUCTIE
publication_date: '2025-01-01'
valid_from: '2025-01-01'
url: https://example.com/test_reductie_vergunning_per_bewoner
name: Parkeervergunning per bewoner (testreductie)

articles:
  - number: '1'
    url: https://example.com/test_reductie_vergunning_per_bewoner/1
    text: >-
      FICTIEF. Een bewoner heeft een vergunning voor elk kenteken waarvoor een verlening of omzetting meetelt.
    machine_readable:
      projection:
        key: bewoner
      execution:
        parameters:
          - name: bewoner
            type: string
          - name: kenteken
            type: string
        input:
          - name: vergunningen
            type: array
            source:
              decisions: test_parkeervergunning#1
          - name: omzettingen
            type: array
            source:
              decisions: test_parkeervergunning#2
        output:
          - name: vergunning_voor_kenteken
            type: boolean
          - name: aantal_vergunningen
            type: number
        actions:
          - output: vergunning_voor_kenteken
            value:
              operation: OR
              conditions:
                - operation: FOREACH
                  collection: $vergunningen
                  as: besluit
                  filter: &voor_het_kenteken
                    operation: EQUALS
                    subject: $besluit.kenteken
                    value: $kenteken
                  body: true
                  combine: OR
                - operation: FOREACH
                  collection: $omzettingen
                  as: besluit
                  filter: *voor_het_kenteken
                  body: true
                  combine: OR
          - output: aantal_vergunningen
            value:
              operation: ADD
              values:
                - operation: FOREACH
                  collection: $vergunningen
                  as: besluit
                  body: 1
                  combine: ADD
                - operation: FOREACH
                  collection: $omzettingen
                  as: besluit
                  body: 1
                  combine: ADD
