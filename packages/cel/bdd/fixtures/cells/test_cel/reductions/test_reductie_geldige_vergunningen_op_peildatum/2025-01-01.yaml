---
# FICTIEF. A reduction of the cell's BDD suite over test_bedrijfsvergunning:
# how many permits of a company count on the day the question names. The
# step passes that day, a parameter of the question, to the law, so the
# projection depends on the question as it does through its key.
$schema: https://raw.githubusercontent.com/NederlandseDigitaleDienst/regelrecht/refs/tags/schema-v0.8.14/schema/v0.8.14/schema.json
$id: test_reductie_geldige_vergunningen_op_peildatum
regulatory_layer: REDUCTIE
publication_date: '2025-01-01'
valid_from: '2025-01-01'
url: https://example.com/test_reductie_geldige_vergunningen_op_peildatum
name: Geldige vergunningen op een peildatum (testreductie)

articles:
  - number: '1'
    url: https://example.com/test_reductie_geldige_vergunningen_op_peildatum/1
    text: >-
      FICTIEF. Het aantal vergunningen van een bedrijf dat op de peildatum
      meetelt.
    machine_readable:
      projection:
        key: bedrijf
        state:
          - name: aantal
            type: number
        steps:
          - record: test_bedrijfsvergunning#1#BESCHIKKING
            input:
              - name: aantal_na_besluit
                type: number
                source:
                  regulation: test_bedrijfsvergunning
                  output: aantal_na_besluit
                  parameters:
                    aantal: $state.aantal
                    verleend: $record.vergunning_verleend
                    geldig_tot: $record.geldig_tot
                    peildatum: $peildatum
            actions:
              - output: aantal
                value: $aantal_na_besluit
      execution:
        parameters:
          - name: bedrijf
            type: string
          - name: peildatum
            type: date
        output:
          - name: aantal_geldige_vergunningen
            type: number
        actions:
          - output: aantal_geldige_vergunningen
            value: $state.aantal
