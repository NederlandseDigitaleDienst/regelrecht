---
# FICTIEF. A reduction of the cell's BDD suite (schema v0.8.20): one
# aggregate per result of test_uitslagen, with the table of lists in its
# state, and a read model that sums the votes of one list over the tables
# of every aggregate with a nested FOREACH.
$schema: https://raw.githubusercontent.com/NederlandseDigitaleDienst/regelrecht/refs/tags/schema-v0.8.20/schema/v0.8.20/schema.json
$id: test_reductie_uitslagen
regulatory_layer: REDUCTIE
publication_date: '2025-01-01'
valid_from: '2025-01-01'
url: https://example.com/test_reductie_uitslagen
name: Uitslagen per stembureau (testreductie)

articles:
  - number: uitslag
    url: https://example.com/test_reductie_uitslagen/uitslag
    text: >-
      FICTIEF. Per uitslag het stembureau en de lijsten met hun stemmen, zoals
      de laatste correctie ze vaststelt.
    machine_readable:
      projection:
        per: test_uitslagen#1
        state:
          - name: stembureau
            type: string
          - name: lijsten
            type: table
            columns:
              - name: aanduiding
                type: string
              - name: aantal_stemmen
                type: number
        steps:
          - record: test_uitslagen#1
            actions:
              - output: stembureau
                value: $record.stembureau
              - output: lijsten
                value: $record.lijsten
          - record: test_uitslagen#2
            actions:
              - output: lijsten
                value: $record.lijsten

  - number: stemmen_op_lijst
    url: https://example.com/test_reductie_uitslagen/stemmen_op_lijst
    text: FICTIEF. Het aantal stemmen op een lijst over alle stembureaus.
    machine_readable:
      execution:
        parameters:
          - name: aanduiding
            type: string
        input:
          - name: uitslagen
            type: array
            source:
              projections: test_reductie_uitslagen#uitslag
        output:
          - name: stemmen_op_lijst
            type: number
        actions:
          - output: stemmen_op_lijst
            value:
              operation: FOREACH
              collection: $uitslagen
              as: uitslag
              combine: ADD
              body:
                operation: FOREACH
                collection: $uitslag.lijsten
                as: lijst
                filter: {operation: EQUALS, subject: $lijst.aanduiding, value: $aanduiding}
                body: $lijst.aantal_stemmen
                combine: ADD
