---
# FICTIEF. A host law for the construct "beslistermijn"
# (packages/cel/bdd/constructs/beslistermijn): an application to have the
# table laid, and the decision of the host on it. It sets no decision term of
# its own, so the eight weeks of test_algemene_bestuursregels, article 1,
# second paragraph, apply. None of it is the text of a law.
$schema: https://raw.githubusercontent.com/NederlandseDigitaleDienst/regelrecht/refs/tags/schema-v0.8.22/schema/v0.8.22/schema.json
$id: test_wet_tafeldekken
name: Testwet tafeldekken
regulatory_layer: WET
bwb_id: BWBR9999982
publication_date: '2026-01-01'
valid_from: '2026-01-01'
url: https://example.com/test_wet_tafeldekken

articles:
  - number: '1'
    url: https://example.com/test_wet_tafeldekken/1
    text: >-
      FICTIEF. Wie de tafel gedekt wil hebben, vraagt de gastheer daarom en
      vermeldt het aantal gasten.
    machine_readable:
      execution:
        produces:
          - type: AANVRAAG
            requests: test_wet_tafeldekken#2
            parameters:
              - aantal_gasten
        parameters:
          - name: aantal_gasten
            type: number

  - number: '2'
    url: https://example.com/test_wet_tafeldekken/2
    text: >-
      FICTIEF. De gastheer beslist op de aanvraag. Hij dekt de tafel voor ten
      hoogste twaalf gasten.
    machine_readable:
      execution:
        produces:
          - type: BESCHIKKING
            outputs:
              - tafel_wordt_gedekt
        parameters:
          - name: aantal_gasten
            type: number
        output:
          - name: tafel_wordt_gedekt
            type: boolean
        actions:
          - output: tafel_wordt_gedekt
            value:
              operation: LESS_THAN_OR_EQUAL
              subject: $aantal_gasten
              value: 12
