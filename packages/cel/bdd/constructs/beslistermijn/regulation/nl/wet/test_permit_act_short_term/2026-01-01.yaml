---
# FICTIEF. A host law for the construct "beslistermijn"
# (packages/cel/bdd/constructs/beslistermijn) with a decision term of its own:
# two weeks after receipt, the term set by statutory provision that article
# 4:13, first paragraph, of test_general_administrative_act refers to. Article
# 2 sets the last day of the term, decision_deadline, with an override on that
# output of 4:13. The fallback of lid 2, reasonable_decision_term_end, stays
# eight weeks. test_permit_act_implements sets it through implements
# instead (RFC-058). None of it is the text of a law.
$schema: https://raw.githubusercontent.com/NederlandseDigitaleDienst/regelrecht/refs/tags/schema-v0.8.22/schema/v0.8.22/schema.json
$id: test_permit_act_short_term
name: Testwet vergunning met korte beslistermijn
regulatory_layer: WET
bwb_id: BWBR9999982
publication_date: '2026-01-01'
valid_from: '2026-01-01'
url: https://example.com/test_permit_act_short_term

articles:
  - number: '1'
    url: https://example.com/test_permit_act_short_term/1
    text: >-
      FICTIEF. Het college verleent op aanvraag een vergunning aan wie aan de
      voorwaarden voldoet.
    machine_readable:
      execution:
        produces:
          - type: AANVRAAG
            requests: test_permit_act_short_term#1
            parameters:
              - meets_conditions
          - type: BESCHIKKING
            outputs:
              - permit_granted
        parameters:
          - name: meets_conditions
            type: boolean
        output:
          - name: permit_granted
            type: boolean
        actions:
          - output: permit_granted
            value: $meets_conditions

  - number: '2'
    url: https://example.com/test_permit_act_short_term/2
    text: >-
      FICTIEF. Het college beslist op de aanvraag binnen twee weken na
      ontvangst ervan.
    machine_readable:
      # The output and the parameter are those of 4:13: an override replaces
      # that output, and reads the same moment.
      overrides:
        - law: test_general_administrative_act
          article: '4:13'
          output: decision_deadline
      execution:
        parameters:
          - name: date_of_receipt
            type: date
            required: false
            description: The day the college received the application.
        output:
          - name: decision_deadline
            type: date
        actions:
          - output: decision_deadline
            value:
              operation: DATE_ADD
              date: $date_of_receipt
              weeks: 2
