---
# De UI-beschrijving van dit wetsprocessysteem, in de vorm van de
# UI-beschrijving van een bron (packages/poc-chronolexografie/src/ui_spec.rs),
# per veld. Welke velden een formulier heeft, zegt de wet; deze beschrijving
# zegt hoe het scherm ze toont en waar elke waarde vandaan komt.
#
# Herkomst per veld (`fill`):
# - zonder `fill` vult de burger het veld zelf in;
# - `{by: system}` zonder meer: het inloggen, met de identiteit van wie
#   inlogde (het BSN);
# - `{by: system, login: naam}`: het inloggen, met de naam;
# - `{by: system, submission: ...}`: wat het systeem van de indiening weet:
#   `date` de dag van indiening volgens de klok van de server (in test mode de
#   testklok), `requested_decision` het artikel waarvan de aanvraag het
#   besluit vraagt (`requests` in de wet), `login_method` het middel waarmee
#   de burger inlogde (DigiD, Keycloak of FSC voor Burgers);
# - `{by: system, value: ...}`: een vaste waarde;
# - `{by: system, from: <regelwerk>#<artikel>#<uitvoer>}`: de uitkomst van
#   een machine-uitvoerbaar artikel, dat de server uitvoert met wat hij van
#   de indiening weet (`parameters`). Zo'n regel geeft het veld een waarde;
#   het veld blijft een gewoon invoerveld van de aanvraag.
# De server vult elk veld met `by: system` zelf bij het indienen en weigert een
# verzoek dat zo'n veld meestuurt.
#
# Zichtbaarheid: zonder `visibility` vraagt het scherm het veld; `shown` op een
# veld van het systeem toont het zonder dat de burger het kan wijzigen;
# `hidden` toont het niet.
#
# Volgorde en groepering: het scherm toont de velden in de volgorde van deze
# beschrijving, onder de kop van hun `group`. `label` en `help` zeggen hoe een
# veld heet en wat eronder staat; zonder die twee heet een veld naar zijn naam
# in het regelwerk.
elements:
  - id: UI1
    element: aanvraagformulier
    fields:
      - name: bsn_aanvrager
        group: Uw gegevens
        visibility: shown
        fill: {by: system}
        label: Burgerservicenummer
      - name: naam_aanvrager
        group: Uw gegevens
        visibility: shown
        fill: {by: system, login: naam}
        label: Naam
      - name: adres_aanvrager
        group: Uw gegevens
        label: Adres
        help: Straat, huisnummer, postcode en woonplaats.
      - name: kaart_als_bestuurder
        group: Uw aanvraag
        label: Ik vraag de kaart aan als bestuurder van de auto
      - name: kaart_als_passagier
        group: Uw aanvraag
        label: Ik vraag de kaart aan als passagier
      # Awb 4:2, eerste lid, onder c: de aanduiding van de gevraagde
      # beschikking. Een vaste waarde: dit formulier vraagt altijd dezelfde.
      - name: gevraagde_beschikking
        group: Over deze aanvraag
        visibility: shown
        fill: {by: system, value: gehandicaptenparkeerkaart}
        label: Wat vraagt u aan?
      # Awb 4:2, eerste lid, onder b: de dag van indiening, volgens de klok
      # van de server.
      - name: dagtekening
        group: Over deze aanvraag
        visibility: shown
        fill: {by: system, submission: date}
        label: Dagtekening
      # Awb 4:2, eerste lid, aanhef: de ondertekening. Geen vinkje: het
      # fictieve beleid van Wilgendaal, artikel 8, zegt wanneer een
      # elektronische aanvraag als ondertekend geldt. De server voert dat
      # artikel uit met het middel waarmee de burger inlogde.
      - name: aanvraag_ondertekend
        group: Over deze aanvraag
        visibility: shown
        fill:
          by: system
          from: beleid_gehandicaptenparkeerkaart_gemeente_wilgendaal#8#aanvraag_geldt_als_ondertekend
          parameters: {inlogmiddel: login_method}
        label: Ondertekend
        help: >-
          Een aanvraag die u indient nadat u met DigiD bent ingelogd, geldt als
          ondertekend.
  # Wat een besluit over de termijn zegt. Dezelfde velden staan in het
  # besluit op de aanvraag (de bezwaartermijn), in de beslissing op bezwaar
  # (de beroepstermijn) en in het bezwaar dat ze overneemt, dus de namen
  # passen bij elk van die drie.
  - id: UI2
    element: besluit
    fields:
      - name: termijn_startdatum
        label: Begin van de termijn voor bezwaar of beroep
      - name: termijn_einddatum
        label: Laatste dag voor bezwaar of beroep
      - name: termijn_weken
        label: Duur van die termijn in weken
      - name: motivering_vereist
        label: Het besluit moet gemotiveerd worden
