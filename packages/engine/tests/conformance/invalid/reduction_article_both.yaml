---
# An article of a reduction is an aggregate or a read model, not both: a
# projection with per and an execution in one article is refused.
$schema: https://raw.githubusercontent.com/NederlandseDigitaleDienst/regelrecht/refs/tags/schema-v0.8.19/schema/v0.8.19/schema.json
$id: test_conformance_article_both
regulatory_layer: REDUCTIE
publication_date: '2026-11-11'
valid_from: '2026-11-11'
url: https://example.invalid/named
name: Testreductie met benoemde artikelen
articles:
  - number: beide
    url: https://example.invalid/named/beide
    text: Een artikel dat speelt en antwoordt.
    machine_readable:
      projection:
        per: test_conformance_decision_effects#2#BESCHIKKING
        state:
          - name: in_bezit
            type: boolean
        steps:
          - record: test_conformance_decision_effects#2#BESCHIKKING
            actions:
              - output: in_bezit
                value: $record.verleend
      execution:
        output:
          - name: in_bezit_antwoord
            type: boolean
        actions:
          - output: in_bezit_antwoord
            value: true
