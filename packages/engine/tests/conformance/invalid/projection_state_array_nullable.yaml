# An array in the state of a projection is never null (schema v0.8.20).
$schema: https://raw.githubusercontent.com/NederlandseDigitaleDienst/regelrecht/refs/tags/schema-v0.8.20/schema/v0.8.20/schema.json
$id: test_conformance_array_nullable
regulatory_layer: REDUCTIE
publication_date: '2026-11-13'
valid_from: '2026-11-13'
url: https://example.invalid/nullable-state
name: Testreductie met een lege eigenschap in de staat
articles:
  - number: uitslag
    url: https://example.invalid/nullable-state/uitslag
    text: Per uitslag het inwonertal, als dat er is.
    machine_readable:
      projection:
        per: test_conformance_parameter_columns#1
        state:
          - name: inwonertal
            type: number
            nullable: false
            description: Het inwonertal van de kieskring, of leeg.
          - name: rijen
            type: array
            nullable: true
            columns:
              - name: aanduiding
                type: string
        steps:
          - record: test_conformance_parameter_columns#1
            actions:
              - output: inwonertal
                value: $state.inwonertal
