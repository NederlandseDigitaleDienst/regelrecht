---
# A `territory` takes no parameters of its own: the engine asks it with the
# code of the candidate regulation and nothing else.
$schema: https://raw.githubusercontent.com/NederlandseDigitaleDienst/regelrecht/refs/tags/schema-v0.8.23/schema/v0.8.23/schema.json
$id: test_conformance_open_term_territory_with_parameters
regulatory_layer: WET
bwb_id: BWBR9999990
publication_date: '2026-11-17'
valid_from: '2026-11-17'
url: https://example.invalid/open-term-territory-with-parameters
articles:
  - number: '1'
    url: https://example.invalid/open-term-territory-with-parameters/1
    text: >-
      Het is verboden een activiteit te verrichten voor zover dat in het
      omgevingsplan is bepaald.
    machine_readable:
      open_terms:
        - id: verboden_in_omgevingsplan
          type: boolean
          required: true
          delegation_type: GEMEENTELIJKE_VERORDENING
          location: $locatie
          territory:
            regulation: test_conformance_grenzenregister
            output: grens_van_gemeente
            parameters:
              jaar: 2026
          combine: OR
      execution:
        parameters:
          - name: locatie
            type: shape
            required: true
        output:
          - name: uitkomst
            type: boolean
        actions:
          - output: uitkomst
            value: $verboden_in_omgevingsplan
