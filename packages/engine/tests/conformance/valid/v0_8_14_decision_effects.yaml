---
# Tier C: what a decision does with another decision (schema v0.8.14). The
# decision on the objection revokes the contested decision, and a new
# decision in its place revokes it too and counts itself (Awb 7:11 lid 2); each effect names the parameter
# whose value is that decision; the revocation holds only when the decision
# has its outcome `herroepen` as true.
$schema: https://raw.githubusercontent.com/NederlandseDigitaleDienst/regelrecht/refs/tags/schema-v0.8.21/schema/v0.8.21/schema.json
$id: test_conformance_decision_effects
regulatory_layer: WET
publication_date: '2026-11-05'
valid_from: '2026-11-05'
bwb_id: BWBR0099993
name: Testwet effecten van besluiten
url: https://example.invalid/effects
articles:
  - number: '1'
    url: https://example.invalid/effects/1
    text: Het bestuursorgaan herroept het bestreden besluit.
    machine_readable:
      execution:
        produces:
          - type: BESCHIKKING
            outputs:
              - herroepen
            effects:
              - revokes: bestreden_besluit
                when: herroepen
        parameters:
          - name: bestreden_besluit
            type: string
        output:
          - name: herroepen
            type: boolean
        actions:
          - output: herroepen
            value: true
  - number: '2'
    url: https://example.invalid/effects/2
    text: Het bestuursorgaan neemt in de plaats daarvan een nieuw besluit.
    machine_readable:
      execution:
        produces:
          - type: BESCHIKKING
            effects:
              - revokes: bestreden_besluit
        parameters:
          - name: bestreden_besluit
            type: string
        output:
          - name: verleend
            type: boolean
        actions:
          - output: verleend
            value: true
