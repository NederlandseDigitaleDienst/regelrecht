---
# Tier C: a projection that names the fact of its records (schema v0.8.18).
# The article requires two facts; `per` and each step address one by its
# name, so the aggregate is a registration with the corrections that refer
# to it.
$schema: https://raw.githubusercontent.com/NederlandseDigitaleDienst/regelrecht/refs/tags/schema-v0.8.22/schema/v0.8.22/schema.json
$id: test_conformance_per_fact
regulatory_layer: REDUCTIE
publication_date: '2026-11-10'
valid_from: '2026-11-10'
url: https://example.invalid/per-fact
name: Testreductie per inschrijving
articles:
  - number: '1'
    url: https://example.invalid/per-fact/1
    text: Per inschrijving de postcode, zoals de correcties haar laten.
    machine_readable:
      projection:
        per: test_conformance_register#1#ingeschreven
        state:
          - name: postcode
            type: string
        steps:
          - record: test_conformance_register#1#ingeschreven
            actions:
              - output: postcode
                value: $record.postcode
          - record: test_conformance_register#1#gecorrigeerd
            actions:
              - output: postcode
                value: $record.postcode
