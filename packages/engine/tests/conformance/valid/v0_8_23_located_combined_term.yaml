$id: test_conformance_located_combined_term
regulatory_layer: WET
bwb_id: BWBR9999978
publication_date: '2026-11-17'
valid_from: '2026-11-17'
url: https://example.invalid/located-combined-term
articles:
  - number: '1'
    url: https://example.invalid/located-combined-term/1
    text: >-
      Het is verboden een activiteit te verrichten voor zover dat in het
      omgevingsplan is bepaald.
    machine_readable:
      open_terms:
        - id: verboden_in_omgevingsplan
          type: boolean
          required: true
          delegation_type: GEMEENTELIJKE_VERORDENING
          location: $locatie
          combine: OR
      execution:
