---
# Tier C: a reduction that plays a chronicle forward (schema v0.8.14). It
# declares a state, a step per article a record rests on, and answers from
# the last state. The second step wires nothing: it binds by name.
$schema: https://raw.githubusercontent.com/NederlandseDigitaleDienst/regelrecht/refs/tags/schema-v0.8.16/schema/v0.8.16/schema.json
$id: test_conformance_projection
regulatory_layer: REDUCTIE
publication_date: '2026-11-05'
valid_from: '2026-11-05'
url: https://example.invalid/projection
name: Testreductie projectie
articles:
  - number: '1'
    url: https://example.invalid/projection/1
    text: De aanvrager heeft een kaart zolang een verlening meetelt en hij haar niet inleverde.
    machine_readable:
      # release-note-begin: projection
      projection:
        key: aanvrager
        state:
          - name: in_bezit
            type: boolean
            description: Of de aanvrager een kaart heeft.
        steps:
          # release-note-begin: step
          - record: test_conformance_decision_effects#2#BESCHIKKING
            input:
              - name: kaart
                type: boolean
                source:
                  regulation: test_conformance_kaart
                  output: kaart
                  parameters:
                    verleend: $record.verleend
            actions:
              - output: in_bezit
                value: $kaart
          # release-note-end: step
          - record: test_conformance_fact#1
            input:
              - name: kaart_weg
                type: boolean
                source:
                  regulation: test_conformance_kaart
                  output: kaart_weg
            actions:
              - output: in_bezit
                value: $kaart_weg
      # release-note-end: projection
      execution:
        parameters:
          - name: aanvrager
            type: string
        output:
          - name: heeft_kaart
            type: boolean
        actions:
          - output: heeft_kaart
            value: $state.in_bezit
