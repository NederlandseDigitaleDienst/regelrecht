---
# Tier C: a read model over the aggregates of another reduction (schema
# v0.8.15): one row per root that holds the asked value, counted by a law.
$schema: https://raw.githubusercontent.com/NederlandseDigitaleDienst/regelrecht/refs/tags/schema-v0.8.15/schema/v0.8.15/schema.json
$id: test_conformance_projections
regulatory_layer: REDUCTIE
publication_date: '2026-11-08'
valid_from: '2026-11-08'
url: https://example.invalid/projections
name: Testreductie kaarten van een aanvrager
articles:
  - number: '1'
    url: https://example.invalid/projections/1
    text: Hoeveel kaarten de aanvrager heeft.
    machine_readable:
      execution:
        parameters:
          - name: aanvrager
            type: string
        input:
          - name: kaarten
            type: array
            source:
              projections: test_conformance_per_record
              where:
                aanvrager: $aanvrager
        output:
          - name: aantal_kaarten
            type: number
        actions:
          - output: aantal_kaarten
            value:
              operation: FOREACH
              collection: $kaarten
              as: kaart
              filter: $kaart.in_bezit
              body: 1
              combine: ADD
