valid_from: '2026-11-08'
url: https://example.invalid/per-record
name: Testreductie per verlening
articles:
  - number: '1'
    url: https://example.invalid/per-record/1
    text: Per verlening of de kaart er nog is.
    machine_readable:
      projection:
        per: test_conformance_decision_effects#2#BESCHIKKING
        state:
          - name: in_bezit
            type: boolean
        steps:
          - record: test_conformance_decision_effects#2#BESCHIKKING
