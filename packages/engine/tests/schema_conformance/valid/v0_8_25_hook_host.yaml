---
# Tier C: a hook that fires only on the decisions of one law, or of one
# article of it (`applies_to.host`, schema v0.8.25, RFC-058).
$schema: https://raw.githubusercontent.com/NederlandseDigitaleDienst/regelrecht/refs/tags/schema-v0.8.25/schema/v0.8.25/schema.json
$id: test_conformance_hook_host
regulatory_layer: BELEIDSREGEL
bwb_id: BWBR9999948
publication_date: '2026-11-19'
valid_from: '2026-11-19'
url: https://example.invalid/hook-host
articles:
  - number: '1'
    url: https://example.invalid/hook-host/1
    text: Bij de vaststelling van een subsidie bewaart de ontvanger de administratie zeven jaar.
    machine_readable:
      hooks:
        - hook_point: post_actions
          applies_to:
            legal_character: BESCHIKKING
            decision_type: TOEKENNING
            host:
              law: subsidiewet_voorbeeld
              article: '3'
      execution:
        output:
          - name: bewaartermijn_jaren
            type: number
        actions:
          - output: bewaartermijn_jaren
            value: 7
