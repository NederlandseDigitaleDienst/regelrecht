# the schema and the loader refuse it.
$schema: https://raw.githubusercontent.com/NederlandseDigitaleDienst/regelrecht/refs/tags/schema-v0.8.24/schema/v0.8.24/schema.json
$id: test_conformance_hook_host_before_v0_8_25
regulatory_layer: BELEIDSREGEL
bwb_id: BWBR9999947
publication_date: '2026-11-19'
valid_from: '2026-11-19'
url: https://example.invalid/hook-host-before
articles:
  - number: '1'
    url: https://example.invalid/hook-host-before/1
    text: Bij een toekenning van subsidie meldt de ontvanger wijzigingen binnen vier weken.
    machine_readable:
      hooks:
        - hook_point: post_actions
          applies_to:
            legal_character: BESCHIKKING
            host:
              law: subsidiewet_voorbeeld
      execution:
        output:
          - name: meldingstermijn_weken
            type: number
        actions:
          - output: meldingstermijn_weken
            value: 4
