---
# Fictief. Een beleidsregel van de minister die alleen over de toekenningen
# van de Subsidiewet voorbeeld gaat. Artikel 3 noemt als host artikel '11'
# waar artikel 1 bedoeld is.
$schema: https://raw.githubusercontent.com/NederlandseDigitaleDienst/regelrecht/refs/tags/schema-v0.8.25/schema/v0.8.25/schema.json
$id: beleidsregel_subsidie_voorbeeld
regulatory_layer: BELEIDSREGEL
publication_date: '2025-06-01'
url: https://example.invalid/beleidsregel-subsidie
articles:
  - number: '1'
    url: https://example.invalid/beleidsregel-subsidie/1
    text: Bij een toekenning op grond van de Subsidiewet voorbeeld meldt de ontvanger wijzigingen binnen vier weken.
    machine_readable:
      hooks:
        - hook_point: post_actions
          applies_to:
            legal_character: BESCHIKKING
            decision_type: TOEKENNING
            host: {law: subsidiewet_voorbeeld}
      execution:
        output:
          - {name: meldingstermijn_weken, type: number}
        actions:
          - {output: meldingstermijn_weken, value: 4}
  - number: '2'
    url: https://example.invalid/beleidsregel-subsidie/2
    text: Na de vaststelling van de subsidie bewaart de ontvanger de administratie zeven jaar.
    machine_readable:
      hooks:
        - hook_point: post_actions
          applies_to:
            legal_character: BESCHIKKING
            decision_type: TOEKENNING
            host: {law: subsidiewet_voorbeeld, article: '3'}
      execution:
        output:
          - {name: bewaartermijn_jaren, type: number}
        actions:
          - {output: bewaartermijn_jaren, value: 7}
  - number: '3'
    url: https://example.invalid/beleidsregel-subsidie/3
    text: Op een aanvraag tot verlening van subsidie wordt binnen tien weken beslist.
    machine_readable:
      implements:
        - law: algemene_wet_voorbeeld
          article: '4:13'
          open_term: wettelijke_beslistermijn
          host: {law: subsidiewet_voorbeeld, article: '11'}
      execution:
        parameters:
          - {name: datum_ontvangst, type: date, required: true}
        output:
          - {name: wettelijke_beslistermijn, type: date}
        actions:
          - output: wettelijke_beslistermijn
            value: {operation: DATE_ADD, date: $datum_ontvangst, weeks: 10}
