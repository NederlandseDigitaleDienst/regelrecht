[package]
name = "regelrecht-engine"
version = "0.3.0"
edition = "2021"
authors = ["MinBZK <noreply@minbzk.nl>"]
description = "RegelRecht law execution engine - Machine-readable Dutch law execution"
license = "EUPL-1.2"
repository = "https://github.com/NederlandseDigitaleDienst/regelrecht"
homepage = "https://github.com/NederlandseDigitaleDienst/regelrecht"
keywords = ["law", "legal", "wasm", "dutch", "regelrecht"]
categories = ["wasm", "parsing"]

[package.metadata.regelrecht]
supported-schemas = ["v0.2.0", "v0.3.0", "v0.3.1", "v0.3.2", "v0.4.0", "v0.5.0", "v0.5.1", "v0.5.2", "v0.5.3", "v0.5.4", "v0.5.5", "v0.5.6", "v0.5.7", "v0.5.8", "v0.5.9", "v0.6.0", "v0.7.0", "v0.7.1", "v0.8.0", "v0.8.1", "v0.8.2", "v0.8.3", "v0.8.4", "v0.8.5", "v0.8.6", "v0.8.7", "v0.8.8", "v0.8.9", "v0.8.10", "v0.8.11", "v0.8.12", "v0.8.13"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
regelrecht-law-model = { path = "../law-model" }
rust_decimal.workspace = true
serde.workspace = true
serde_yaml_ng.workspace = true
serde_json.workspace = true
thiserror.workspace = true
chrono.workspace = true
sha2.workspace = true
hex = "0.4"
strsim = "0.11"
tracing.workspace = true

[dependencies.jsonschema]
workspace = true
optional = true

[dependencies.wasm-bindgen]
version = "0.2"
optional = true

[dependencies.serde-wasm-bindgen]
version = "0.6"
optional = true

[dependencies.js-sys]
version = "0.3"
optional = true

[[bin]]
name = "validate"
path = "src/bin/validate.rs"
required-features = ["validate"]

[[bin]]
name = "validate-annotations"
path = "src/bin/validate_annotations.rs"
required-features = ["validate"]

[[bin]]
name = "evaluate"
path = "src/bin/evaluate.rs"

[[test]]
name = "bdd"
harness = false
# Niet meelopen in `cargo test`: het target draait standaard beide buckets, en
# bucket A (wetvalidatie tegen het echte corpus) hoort niet in een testbaan die
# moet blokkeren. Aanroepers kiezen hun bucket met BDD_BUCKET en noemen het
# target expliciet — `just bdd` lokaal, `BDD_BUCKET=conformance cargo test
# --test bdd` in CI (zie docs/operations/ci-cd.md).
test = false

# The schema<->model suite needs `validate` (jsonschema). Without the feature
# `cargo test --test conformance` refuses and names it, where it would
# otherwise build an empty target and report 0 tests. `just conformance`
# turns it on.
[[test]]
name = "conformance"
required-features = ["validate"]

[features]
wasm = ["dep:wasm-bindgen", "dep:serde-wasm-bindgen", "dep:js-sys"]
validate = ["dep:jsonschema"]

[build-dependencies]
serde = { workspace = true }
serde_yaml_ng = { workspace = true }

[dev-dependencies]
cucumber = "0.23"
gherkin = "0.16"
futures = "0.3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
walkdir.workspace = true
tracing-subscriber.workspace = true
criterion = { version = "0.8", features = ["html_reports"] }
rust_decimal_macros.workspace = true
# Used by the schema↔model conformance suite (tests/conformance.rs, requires the
# `validate` feature). serde_json/serde_yaml_ng are regular deps but must be
# re-declared here to be in scope for the integration-test crate.
serde_json.workspace = true
serde_yaml_ng.workspace = true
# tests/bdd_discovery.rs builds throwaway corpus/bdd trees.
tempfile.workspace = true

[[bench]]
name = "uri_parsing"
harness = false

[[bench]]
name = "variable_resolution"
harness = false

[[bench]]
name = "operations"
harness = false

[[bench]]
name = "article_evaluation"
harness = false

[[bench]]
name = "law_loading"
harness = false

[[bench]]
name = "priority"
harness = false

[[bench]]
name = "service_e2e"
harness = false

[profile.release]
lto = true
opt-level = "z"


[lints]
workspace = true
