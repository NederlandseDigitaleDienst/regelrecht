[workspace]
resolver = "2"
members = [
    "admin",
    "arch-extract",
    "auth",
    "cel",
    "corpus",
    "editor-api",
    "engine",
    "github",
    "harvester",
    "law-model",
    "pipeline",
    "poc-chronolexografie",
    "poc-napp",
    "poc-portal",
    "shared",
    "tui",
]

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

# Common dependencies. Crates inherit with `dep.workspace = true`, optionally
# adding `features = [...]` for crate-specific features.
[workspace.dependencies]
async-trait = "0.1"
axum = "0.8"
base64 = "0.23"
# Symmetric AEAD for sealing per-user GitHub OAuth tokens into the browser
# cookie - the token is deliberately never stored server-side (no DB row, no
# session-store entry; see editor-api github_oauth.rs). `getrandom` gives
# `OsRng` for nonce generation.
chacha20poly1305 = { version = "0.10", features = ["getrandom"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
# Every schema this workspace validates against is baked into the binary with
# `include_str!` and every `$ref` in them is a local `#/definitions/...`
# pointer, so no reference is ever resolved over the network or from disk.
# The default features (`resolve-http`, `resolve-file`, `tls-aws-lc-rs`) drag
# in reqwest, rustls and aws-lc-rs - roughly a hundred crates of HTTP stack
# that is compiled but never called.
jsonschema = { version = "0.60", default-features = false }
# default-features = false drops `rustls-tls`, which would hand
# oauth2/reqwest 0.12 the ring provider and put a second crypto backend in
# every image. TLS comes from our own reqwest declaration instead, which picks
# aws-lc-rs, the provider sqlx and reqwest 0.13 already use.
openidconnect = { version = "4.0", default-features = false, features = ["reqwest"] }
regex = "1.11"
# Note: reqwest is intentionally NOT workspace-hoisted, and must stay that way.
# admin/auth/editor-api require reqwest 0.12 to satisfy openidconnect/oauth2's
# pinned dependency, while corpus/github/harvester/pipeline use 0.13. Hoisting a
# single version would break one side or the other; aligning them would require
# upgrading openidconnect, which is out of scope for this cleanup.
roxmltree = "0.21"
rust_decimal = { version = "1", default-features = false, features = ["maths", "serde", "std"] }
rust_decimal_macros = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"
sha2 = "0.10"
sqlx = "0.8"
strum = { version = "0.28", features = ["derive"] }
subtle = "2"
thiserror = "2.0"
time = "0.3"
tokio = "1"
tower-http = "0.7"
tower-sessions = "0.14"
tower-sessions-sqlx-store = { version = "0.15", features = ["postgres"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"
uuid = { version = "1", features = ["serde"] }
walkdir = "2"

# Test/dev deps.
http-body-util = "0.1"
pretty_assertions = "1.4"
tempfile = "3"
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["postgres"] }
tower = "0.5"
tower-sessions-memory-store = "0.14"
wiremock = "0.6"

# Dev builds: trim debuginfo to speed up codegen and (especially) linking.
# line-tables-only keeps usable backtraces; dependencies rarely need to be
# stepped into, so strip their debuginfo entirely.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.bench]
opt-level = 3
lto = false

# Patch testcontainers to pick up astral-tokio-tar 0.6.0 (fixes RUSTSEC-2026-0066).
# Remove once testcontainers releases a version with astral-tokio-tar >= 0.6.0.
[patch.crates-io]
testcontainers = { git = "https://github.com/testcontainers/testcontainers-rs", rev = "0f5ee81c18683cf2882fb5a23461cf41fa5e3768" }
