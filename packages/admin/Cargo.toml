[package]
name = "regelrecht-admin"
version = "0.1.0"
edition.workspace = true
authors = ["MinBZK <noreply@minbzk.nl>"]
description = "RegelRecht admin UI for viewing pipeline database"
license = "EUPL-1.2"
repository = "https://github.com/NederlandseDigitaleDienst/regelrecht"

[lib]
name = "regelrecht_admin"
path = "src/lib.rs"

[[bin]]
name = "regelrecht-admin"
path = "src/main.rs"

[dependencies]
axum.workspace = true
regelrecht-auth = { path = "../auth" }
regelrecht-shared = { path = "../shared", features = ["telemetry", "dates"] }
sqlx = { workspace = true, features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "postgres", "uuid", "chrono"] }
regelrecht-corpus = { path = "../corpus", default-features = false }
regelrecht-harvester = { path = "../harvester", default-features = false }
regelrecht-pipeline = { path = "../pipeline" }
chrono.workspace = true
uuid.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tower-http = { workspace = true, features = ["fs", "trace"] }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tower-sessions.workspace = true
tower-sessions-sqlx-store.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots-no-provider", "json"] }
url.workspace = true
time.workspace = true
prometheus-client = "0.25"
strum.workspace = true
subtle.workspace = true
sha2.workspace = true

[dev-dependencies]
regelrecht-pipeline = { path = "../pipeline", features = ["test-utils"] }
regelrecht-auth = { path = "../auth", features = ["test-utils"] }
tower.workspace = true
tower-sessions-memory-store.workspace = true
http-body-util.workspace = true
pretty_assertions.workspace = true

[lints]
workspace = true
