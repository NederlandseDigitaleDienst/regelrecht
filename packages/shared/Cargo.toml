[package]
name = "regelrecht-shared"
version = "0.1.0"
edition.workspace = true
authors = ["MinBZK <noreply@minbzk.nl>"]
description = "RegelRecht shared types - Canonical domain types used across crates"
license = "EUPL-1.2"
repository = "https://github.com/NederlandseDigitaleDienst/regelrecht"
homepage = "https://github.com/NederlandseDigitaleDienst/regelrecht"
keywords = ["law", "legal", "dutch", "regelrecht", "types"]

[dependencies]
serde.workspace = true
tracing-subscriber = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
chrono-tz = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true, features = ["runtime-tokio", "postgres", "migrate"] }
tracing = { workspace = true, optional = true }
testcontainers = { workspace = true, optional = true }
testcontainers-modules = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["sync"] }

[features]
default = []
telemetry = ["dep:tracing-subscriber"]
# Europe/Amsterdam calendar dates. Optional so the crates that only want the
# domain types (law-model, and through it corpus) stay free of chrono.
dates = ["dep:chrono", "dep:chrono-tz"]
# Where the database is and running a crate's migrations under an advisory
# lock, for the crates that keep their data in Postgres.
postgres = ["dep:sqlx", "dep:tracing"]
# A fresh Postgres database per test, on one container per test binary.
test-utils = ["postgres", "dep:testcontainers", "dep:testcontainers-modules", "dep:tokio"]

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
