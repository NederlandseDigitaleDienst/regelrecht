# The Tauri shell of the wetsproces app: a window with the citizen's screens
# (dist-app/, `npm run build:app -w frontend-wetsproces`) and the commands of
# the core (packages/wetsproces-app) registered for its webview. Everything a
# test can reach lives in the core; this crate only wires it up.
#
# A workspace of its own: Tauri needs the system libraries of a webview
# (webkit2gtk on Linux), and the Cargo workspace in packages/ must build
# without them. `just check` and CI do not build this crate.
[workspace]

[package]
name = "regelrecht-wetsproces-app-shell"
version = "0.1.0"
edition = "2024"
authors = ["MinBZK <noreply@minbzk.nl>"]
description = "The Tauri shell of the wetsproces app"
license = "EUPL-1.2"
repository = "https://github.com/NederlandseDigitaleDienst/regelrecht"
publish = false

[lib]
# A library as well, for the mobile targets of Tauri (Android, iOS).
name = "wetsproces_app_shell"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "wetsproces-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
regelrecht-wetsproces-app = { path = "../../packages/wetsproces-app" }
# The same minor version as @tauri-apps/api in package.json.
tauri = { version = "=2.12.4", features = [] }
serde_json = "1.0"

[features]
# Serve dist-app/ from the binary instead of a dev server. On by default, so
# that a plain `cargo build` gives an app that runs on its own.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
