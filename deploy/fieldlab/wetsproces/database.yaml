---
# The PostgreSQL database for the chronicles, from the CloudNativePG plugin.
# One instance, no backups. CloudNativePG writes the connection URL to the
# secret `wetsproces-db-app`, key `uri`.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: wetsproces-db
spec:
  instances: 1
  storage:
    size: 1Gi
