---
# The address, on the shared gateway of Haven+ (istio-gateway/public-gateway).
# *.cluster-a.fieldlab2026.nl already points at that gateway. Only its `http`
# listener takes a route from any namespace; HTTPS needs a listener of its own
# on that gateway, and Flux manages it, so that is a question for the platform.
# The test login sets no Secure cookie, so it works over HTTP.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: wetsproces
spec:
  parentRefs:
    - name: public-gateway
      namespace: istio-gateway
      sectionName: http
  hostnames:
    - regelrecht-wetsproces.cluster-a.fieldlab2026.nl
  rules:
    - backendRefs:
        - name: wetsproces
          port: 80
