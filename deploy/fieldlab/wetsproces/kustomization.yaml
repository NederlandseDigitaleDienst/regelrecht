---
# wetsproces on the Fundament cluster of the fieldlab (cluster-a in
# organisation fieldlab-a), in namespace `wetsproces` of project rr-voorbeeld.
# How to put it there: README.md next to this file.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: tnt-rr-voorbeeld--wetsproces
labels:
  - pairs:
      app.kubernetes.io/name: wetsproces
      app.kubernetes.io/part-of: regelrecht
    includeSelectors: false
resources:
  - database.yaml
  - deployment.yaml
  - service.yaml
  - httproute.yaml
images:
  - name: code.digitaledienst.overheid.nl/regelrecht/wetsproces
    newTag: main
