---
# Franse labels voor de Nederlandse veldnamen in het democorpus.
#
# Vertaald door een taalmodel en nog niet nagekeken door een Franstalige
# revisor. Wat onzeker is staat in REVIEW-fr.md, naast dit bestand.
#
# Het corpus is Nederlands en blijft Nederlands: deze namen zijn de
# identifiers waarmee wetten naar elkaar verwijzen, en een naam hernoemen is
# een wijziging die andere wetten zien. Dit bestand bepaalt alleen hoe een
# naam wordt *getoond*.
#
# Drie lagen, specifiek eerst. Een naam die in geen van drieen staat valt
# terug op het Nederlands, gehumaniseerd zoals altijd: een Franse bezoeker
# leest dan een Nederlands label, en dat is een schoonheidsfout en geen
# onwaarheid. Samenstellen gebeurt alles-of-niets, want "A partenaire revenu"
# leest als een fout waar het Nederlandse label leest als iets dat nog niet
# vertaald is.
#
# Frans zet het bijvoeglijk naamwoord achter het zelfstandig naamwoord, bouwt
# met "de" ("Revenu du partenaire") en laat bijvoeglijke naamwoorden
# meebuigen met het geslacht. Woord voor woord in Nederlandse volgorde gaat
# daardoor veel vaker mis dan in het Engels, en de lijst met hele namen is hier
# dus veel langer. De woorden blijven toch allemaal staan: een nieuwe naam die
# toevallig wel goed samenstelt heeft ze nodig, en `check-i18n.mjs` vraagt ze.
# Woorden staan in de mannelijke enkelvoudsvorm. Controleer een nieuwe naam
# met `node scripts/i18n-labels.mjs --locale=fr` vanuit `frontend-demo/`.
#
# Afkortingen (BSN, AOW, KvK, Zvw) staan hier niet: die kent format.ts al, en
# twee plekken die het oneens kunnen worden is er een te veel.
#
# Let op bij het toevoegen: `null` kaal is geen woord maar leegte, en `true` en
# `false` zijn booleans. Die staan daarom tussen aanhalingstekens. `no`, `yes`,
# `on` en `off` zijn dat in YAML 1.1 ook, maar js-yaml volgt 1.2 en leest ze als
# gewone woorden; ze staan hier alleen gequote omdat yamllint dat vraagt. Een
# waarde met een dubbele punt gevolgd door een spatie moet ook tussen
# aanhalingstekens; zet de Franse spatie voor een dubbele punt dus liever niet
# in een label.

# 1. Per wet. Alleen waar hetzelfde woord in twee wetten iets anders betekent.
laws: {}

