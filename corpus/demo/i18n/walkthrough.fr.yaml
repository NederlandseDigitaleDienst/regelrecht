spoken:
  - nl: Wetten worden al decennia met de hand vertaald naar software.
    fr: Cela fait des décennies que les lois sont traduites à la main en logiciel.
  - nl: Iedere uitvoeringsorganisatie heeft zijn eigen interpretatie van wet en regelgeving en een groot
      stuk van die interpretatie die landt in software.
    fr: Chaque organisme d'exécution a sa propre interprétation de la loi, et une grande partie de cette
      interprétation finit dans le logiciel.
  - nl: Dat gebeurt al jaren, al decennia in sommige gevallen en heel veel wetswijzigingen, nieuwe wetsvoorstellen
      landen op die manier boven op elkaar gestapeld in software.
    fr: Cela dure depuis des années, voire des décennies, et d'innombrables modifications de loi et nouveaux
      projets de loi s'empilent ainsi dans le logiciel.
  - nl: Met als gevolg dat er eigenlijk geen overzicht meer is.
    fr: 'Résultat : on n''a plus vraiment de vue d''ensemble.'
  - nl: Het is niet duidelijk welk stukje software zich verhoudt tot welk stukje wet- of regelgeving en
      andersom.
    fr: On ne sait plus quel bout de logiciel correspond à quel bout de loi, et inversement.
  - nl: Wat er weer toe leidt dat het onvoorspelbaar wordt hoe die software werkt.
    fr: Du coup, le fonctionnement de ce logiciel devient imprévisible.
  - nl: Niet alleen voor burgers en ondernemers die aan de ontvangende kant van zo'n stuk software staan,
      maar ook Voor beleidsmakers, voor mensen die moeten werken met die software, ambtenaren en ook zelfs
      voor ICT'ers, voor mensen die die software bouwen.
    fr: Pas seulement pour les citoyens et les entrepreneurs qui subissent ce logiciel, mais aussi pour
      les décideurs, les agents qui travaillent avec, et même pour les informaticiens qui le construisent.
  - nl: Het wordt onbeheersbaar vaak om die software nog aan te passen, wat men niet meer durft, dat men
      niet meer weet wat het effect is van wijziging in de software.
    fr: 'Il devient ingérable de modifier ce logiciel : on n''ose plus, on ne sait plus quel effet aura
      une modification.'
  - nl: RegelRecht gaat over wat nou als we beginnen met de wet, de wet zelf machine-uitvoerbaar maken
      en dat openbaar publiceren.
    fr: 'RegelRecht part d''une idée : et si on commençait par la loi, qu''on la rendait elle-même exécutable
      par machine, et qu''on la publiait ouvertement ?'
  - nl: Ik ben Anne Schuth, ik ben staff engineer bij RegelRecht en ik geef de demo het volgende kwartier
      ongeveer.
    fr: Je suis Anne Schuth, staff engineer chez RegelRecht, et je présente la démo pendant environ un
      quart d'heure.
  - nl: Dit is geen statische demo.
    fr: Ce n'est pas une démo statique.
  - nl: Je kan op elk moment stoppen, zelf gaan rondklikken.
    fr: Vous pouvez m'arrêter à tout moment et cliquer vous-même.
  - nl: Links verschijnen vragen die ik heel vaak krijg.
    fr: À gauche apparaissent les questions qu'on me pose souvent.
  - nl: Daar kan je op klikken om antwoorden te krijgen.
    fr: Cliquez dessus pour obtenir les réponses.
  - nl: Dit is een compleet verhaal.
    fr: Un récit complet.
    shortened: true
  - nl: Het is werkende software, maar het is geen eindproduct.
    fr: C'est un logiciel qui fonctionne, mais pas un produit fini.
  - nl: Dus het is niet bedoeld om ooit in productie te gaan.
    fr: Il n'est donc pas pour la production.
    shortened: true
  - nl: En we doen dit vanuit een beleidsdirectie, dus we maken beleid door te doen, door zover te maken.
    fr: Et nous le faisons depuis une direction des politiques publiques, par la pratique.
    shortened: true
  - nl: We beginnen helemaal aan de achterkant, bij een regelwerk, in dit geval voor de zorgtoeslag.
    fr: Nous commençons tout au fond, par une réglementation, ici celle de l'allocation de soins de santé.
  - nl: Hier zien we een machine-uitvoerbare versie van de zorgtoeslag.
    fr: Voici une version exécutable par machine de l'allocation de soins de santé.
  - nl: Niet de hele wet, maar stukjes uit die wet, namelijk alleen artikel 2 en artikel 4.
    fr: 'Pas toute la loi, seulement des extraits : les articles 2 et 4.'
  - nl: Hier zien we artikel 2, het hele artikel, dus hier zien we de hele tekst.
    fr: Voici l'article 2, en entier, donc tout le texte.
  - nl: En hieronder zien we dan machine-readable, het machine-uitvoerbare stuk van die wet.
    fr: Et en dessous, la partie machine-readable, exécutable par machine, de cette loi.
  - nl: Dat is een interpretatie van die wet.
    fr: C'est une interprétation de cette loi.
  - nl: En wat we hier zien, is dat het begint met een parameter, namelijk BSN.
    fr: 'Et ce qu''on voit ici, c''est que cela commence par un paramètre : le BSN.'
  - nl: En dan hangen er wat acties aan, namelijk of iemand voldoet aan de voorwaarden.
    fr: Et là, des actions dépendent de l'éligibilité aux conditions.
  - nl: Nou, iemand moet tenminste de minimumleeftijd hebben en iemand moet verzekerde zijn.
    fr: Il faut avoir l'âge minimum et être assuré.
  - nl: En dan zien we de hoogte van de zorgtoeslag.
    fr: Et voici le montant de l'allocation de soins de santé.
  - nl: En dat is een hele berekening en daar ga ik niet in detail op in, maar hieronder bijvoorbeeld
      zien we Operation Add, het optellen van inkomen met partnerinkomen, zodat het met het drempelinkomen
      vergelijkbaar wordt als je met een toeslagpartner.
    fr: C'est un calcul complet, je ne détaille pas, mais ici, Operation Add additionne le revenu et celui
      du partenaire, pour le comparer au seuil de revenu avec un partenaire d'allocation.
  - nl: Waar ik net overheen ging, is iets wat wij inputs noemen.
    fr: Ce que j'ai survolé, ce sont ce qu'on appelle des inputs.
  - nl: Dat zijn eigenlijk verwijzingen naar andere wetten.
    fr: Ce sont des renvois vers d'autres lois.
  - nl: Bijvoorbeeld, die is verzekerde, één van de voorwaarden.
    fr: Par exemple, être assuré, l'une des conditions.
  - nl: Dat komt uit een andere wet.
    fr: D'une autre loi.
    shortened: true
  - nl: Dus in de zorgtoeslagwet staat verzekerde, zoals bedoeld in de zorgverzekeringswet.
    fr: 'La loi sur l''allocation dit : assuré au sens de la loi sur l''assurance maladie.'
    shortened: true
  - nl: Dan kunnen we dus naar de zorgverzekeringswet doorklikken en dat doen we nu en dan zien we wat
      het betekent om een verzekerde te zijn.
    fr: On clique vers cette loi pour voir ce qu'est être assuré.
    shortened: true
  - nl: Iemand is namelijk een verzekerde, dat is een output hier, als iemand een verzekering heeft of
      een verdragsverzekering en als iemand niet in detentie zit.
    fr: Est assuré, c'est un output ici, quiconque a une assurance ou une assurance conventionnelle, et
      n'est pas en détention.
  - nl: En dat in detentie zit is weer een input, dat zien we hier, namelijk uit de penitentiaire beginselenwet.
    fr: Et être en détention est encore un input, ici, issu de la loi pénitentiaire.
  - nl: En daar kunnen we dan ook heen gaan en dan zien we wat het betekent om gedetineerd te zijn.
    fr: On peut aussi y aller, et voir ce que signifie être détenu.
  - nl: Namelijk, je zit in een penitentiaire inrichting of in een huis van bewaring en je bent ingesloten
      of tijdelijk afwezig.
    fr: 'À savoir : être dans un établissement pénitentiaire ou une maison d''arrêt, et y être enfermé
      ou temporairement absent.'
  - nl: En zo zie je dus om zorgtoeslag uit te rekenen, het recht op zorgtoeslag en de hoogte van die
      zorgtoeslag, heb je een hele reeks aan wetregelgeving nodig.
    fr: Ainsi, pour calculer l'allocation de soins de santé, le droit et son montant, il faut toute une
      série de textes de loi.
  - nl: En eigenlijk is het niet een reeks, maar een graaf.
    fr: 'Bref : un graphe, pas une série.'
    shortened: true
  - nl: En als je wetten in een machine uitvoerbaar hebt, dan kan je dat ook visualiseren.
    fr: Et quand les lois sont exécutables par machine, on peut les visualiser.
  - nl: Dan kan je zien dat die wetten samen hangen met elkaar.
    fr: On voit alors que ces lois sont liées entre elles.
  - nl: Ik zal wat inzoomen, maar hier zie je bijvoorbeeld de zorgtoeslag.
    fr: Je zoome un peu, et ici, on voit par exemple l'allocation de soins de santé.
  - nl: Even kijken, hier zien we die is verzekerde, dat lijntje kunnen we dan volgen.
    fr: Voyons, ici, on voit « est assuré », et on peut suivre ce lien.
  - nl: Dan komen we bij de zorgverzekeringswet en dan zien we dat is gedetineerd en dat lijntje kunnen
      we ook volgen.
    fr: On arrive à la loi sur l'assurance maladie, puis « est détenu », et ce lien aussi.
    shortened: true
  - nl: Dat zien we dan hier.
    fr: Et on le voit ici.
  - nl: Dan zien we het bepalen van de detentiestatus.
    fr: Voici la détermination du statut de détention.
  - nl: En hier zien we dus eigenlijk het hele stelsel van wet- en regelgeving wat nodig is om tot de
      zorgtoeslag te komen.
    fr: Et ici, on voit tout l'ensemble des textes nécessaires pour obtenir l'allocation de soins de santé.
  - nl: Als ik dit aanklik dan zien we alle wet- en regelgeving die we op dit moment in de proof of concept
      hebben.
    fr: Si je clique ici, on voit toutes les lois que contient actuellement la preuve de concept.
  - nl: Je ziet dat dat best wel een hele queue is.
    fr: Tu vois que c'est une sacrée file d'attente.
  - nl: Je mag bijvoorbeeld eens raden welke dit zou kunnen zijn.
    fr: Essaie de deviner laquelle ce pourrait être.
  - nl: Kijk gerust zelf even rond.
    fr: Regarde donc par toi-même.
  - nl: Je kan gewoon rondklikken, inzoomen, uitzoomen en lijntjes volgen om de samenhang tussen wet en
      regelgeving te zien.
    fr: Tu peux cliquer partout, zoomer, dézoomer et suivre les liens pour voir la cohérence entre loi
      et réglementation.
  - nl: Dan gaan we zo weer verder.
    fr: On reprend tout de suite.
    shortened: true
  - nl: Een van de vragen die ik heel vaak krijg hierbij is hoe we omgaan met ambiguïteit eigenlijk.
    fr: On me demande très souvent comment on gère l'ambiguïté.
  - nl: Dus als er ergens in dit hele netwerk twee definities met dezelfde naam staan, bijvoorbeeld partnerinkomen
      is een veel voortkomende of huishouden.
    fr: Donc si, quelque part dans ce réseau, deux définitions portent le même nom, par exemple revenu
      du partenaire, très fréquent, ou ménage.
