# De rondleiding in het Frans: wat de kijker leest terwijl de
# presentator Nederlands spreekt, en onder `spoken:` wat zijn gekloonde stem
# zegt. Gesleuteld op het Nederlands, zodat een nieuwe knip of build elke
# regel houdt die nog voorkomt.
# `just walkthrough translate fr` vult aan wat ontbreekt; corrigeer gerust
# met de hand. Een build (`just walkthrough build`) zet het in beeld,
# `just walkthrough dub fr` laat het uitspreken.
