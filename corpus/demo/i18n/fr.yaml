# Franse overlay op demo-config.yaml en profiles.yaml.
#
# Het Nederlands in die bestanden is de bron en blijft daar staan; dit bestand
# zegt per pad wat de Franse tekst is. Elk pad moet bestaan: `check-i18n.mjs`
# weigert een pad dat nergens heen wijst, zodat deze vertaling niet stilletjes
# kan verouderen als de dia's veranderen.
#
# Vertaald door een taalmodel en nog niet nagekeken door een Franstalige
# revisor. Wat daarbij aandacht nodig heeft, staat in REVIEW-fr.md.
#
# Over het deck: Frans valt op een dia langer uit dan Nederlands, en nog wat
# langer dan Engels. Deze vertaling is daarom op sommige plekken korter dan een
# letterlijke zou zijn, want een regel die omslaat kost meer dan een bijzin
# oplevert.

