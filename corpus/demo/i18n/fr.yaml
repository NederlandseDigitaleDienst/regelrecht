slides.0.title: RegelRecht
slides.0.subtitle: de la loi à sa mise en œuvre numérique
slides.0.footer: Service numérique néerlandais

slides.1.overline: Aujourd'hui
slides.1.lines.0: Chaque organisation
slides.1.lines.1: a sa **propre lecture** de la loi
slides.1.lines.2: traduite dans **son propre logiciel**

slides.2.overline: Le résultat
slides.2.lines.0: Pas de vue d'ensemble
slides.2.lines.1: Imprévisible
slides.2.lines.2: Ingérable

slides.3.overline: Et si
slides.3.lines.0: On **partait de la loi**
slides.3.lines.1: On la rendait **exécutable par machine**
slides.3.lines.2: On la publiait **ouvertement**

slides.4.title: Démo RegelRecht
slides.4.lines.0: Une histoire complète, pas un produit fini
slides.4.lines.1: Nous construisons les politiques par la pratique

slides.5.overline: La réglementation
slides.5.title: La loi comme réglementation
slides.5.lead: Le texte de loi et la règle exécutable sont côte à côte, article par article.
slides.5.bullets.0: >-
  Chaque article a une partie **machine_readable** : ce qui entre, ce qui
  sort, et comment.
slides.5.bullets.1: Un renvoi à une autre loi est explicite, pas la copie d'un montant.
slides.5.bullets.2: La même réglementation s'exécute dans l'éditeur, dans ce portail et dans la simulation.

slides.6.overline: Cohérence
slides.6.title: Les lois sont liées
slides.6.lead: >-
  Qui est assuré dépend de la détention ; qui reçoit l'allocation de soins de
  santé dépend de l'assurance.
slides.6.bullets.0: >-
  Par loi : quelles données viennent des registres, lesquelles d'autres lois,
  ce qui en sort.
slides.6.bullets.1: Chaque ligne est un vrai renvoi de la loi, avec la valeur pour cette personne.
slides.6.bullets.2: Une loi change ? Vous voyez aussitôt qui est concerné.

slides.8.overline: Tester
slides.8.title: La loi testée, en langage courant
slides.8.lead: Les scénarios décrivent une personne et ce que la loi doit produire pour elle.
slides.8.bullets.0: >-
  Soit un jeune de 17 ans : pas d'allocation de soins de santé. Soit une
  personne seule à bas revenu : oui.
slides.8.bullets.1: Les mêmes scénarios s'exécutent ici dans le navigateur et dans la chaîne d'intégration.
slides.8.bullets.2: Qui modifie la loi voit quel scénario échoue.

slides.10.overline: Politique publique
slides.10.title: Quel effet sur deux mille personnes ?
slides.10.lead: Une population générée passe par tous les dispositifs, avec les vraies lois.
slides.10.bullets.0: >-
  Qui remplit les conditions, pour combien, ventilé par âge, revenu et
  ménage.
slides.10.bullets.1: Ajustez un seuil de la loi et voyez la différence, avant son entrée en vigueur.
slides.10.bullets.2: 'Aussi pour les entreprises : permis, obligations de déclaration, precario.'

slides.11.overline: Le citoyen
slides.11.title: Un citoyen, Merijn
slides.11.lead: Indépendant dans les soins à domicile, parent isolé avec deux jeunes enfants.
slides.11.bullets.0: Tout ce à quoi il a droit, calculé en direct par la loi elle-même.
slides.11.bullets.1: Chaque donnée remonte au registre qui l'a fournie.
slides.11.bullets.2: Une donnée est fausse ? Il la corrige, un gestionnaire l'examine.

slides.12.overline: La demande
slides.12.title: Ne demander que ce que l'administration ignore
slides.12.lead: >-
  La loi calcule avec ce qui existe déjà, et ne pose une question que
  lorsqu'elle bloque.
slides.12.bullets.0: L'allocation logement ne connaît pas le loyer. C'est la seule question, à ce moment-là.
slides.12.bullets.1: Après chaque réponse, la loi recalcule.
slides.12.bullets.2: Vérifier, déclarer, déposer. Sans formulaire de dix pages.

slides.13.overline: Le gestionnaire
slides.13.title: Le même droit, de l'autre côté du guichet
slides.13.lead: La demande arrive avec le calcul que le citoyen a vu.
slides.13.bullets.0: Le moteur le recalcule avec les données enregistrées.
slides.13.bullets.1: Les corrections du citoyen attendent d'être examinées.
slides.13.bullets.2: Accorder ou refuser, avec motivation ; une réclamation revient par le portail.

slides.14.overline: L'entrepreneuse
slides.14.title: Une entrepreneuse, Claudia
slides.14.lead: >-
  Dirigeante du Café Noon à Rotterdam-West, un café avec sa propre petite
  brasserie et une terrasse.
slides.14.bullets.0: >-
  Le même moteur, d'autres lois : règlement local, alcool, sécurité
  alimentaire, accises, precario.
slides.14.bullets.1: >-
  Le permis de terrasse demande l'emplacement et la surface ; une fois
  accordé, la taxe precario en tient compte.
slides.14.bullets.2: >-
  La commune, l'autorité alimentaire et l'agence des entreprises en une
  seule vue, sans avoir à se consulter.

slides.18.overline: Démo RegelRecht
slides.18.title: De la loi à sa mise en œuvre numérique
slides.18.lines.0: Une histoire complète, **pas un produit fini**
slides.18.lines.1: Nous construisons les politiques **par la pratique**
slides.18.link.label: regelrecht.rijks.app
slides.7.overline: Cohérence
slides.7.title: Les lois sont liées
slides.7.lead: >-
  Que Claudia paie le precario dépend de son permis de terrasse, qui dépend
  de sa licence d'exploitation.
slides.7.bullets.0: >-
  Par loi : quelles données viennent des registres, lesquelles d'autres lois,
  ce qui en sort.
slides.7.bullets.1: Registre du commerce, BAG et règlements communaux sont dans un même graphe.
slides.7.bullets.2: Le règlement change ? Vous voyez aussitôt quelles entreprises sont concernées.
slides.9.overline: Tester
slides.9.title: Le règlement testé, en langage courant
slides.9.lead: Les scénarios décrivent une entreprise et ce que le règlement doit produire pour elle.
slides.9.bullets.0: >-
  Soit une terrasse de 20 m² : pas de precario. Soit une terrasse de 80 m² :
  taxe sur 30 m².
slides.9.bullets.1: Les mêmes scénarios s'exécutent ici dans le navigateur et dans la chaîne d'intégration.
slides.9.bullets.2: Qui modifie le règlement voit quel scénario échoue.
slides.15.overline: La demande
slides.15.title: Demander un permis de terrasse
slides.15.lead: >-
  La commune sait déjà beaucoup de choses sur le Café Noon. La demande ne
  porte que sur la terrasse elle-même.
slides.15.bullets.0: Emplacement, surface, saison et heures de fermeture ne figurent dans aucun registre.
slides.15.bullets.1: Après chaque réponse, le règlement recalcule, motifs de refus compris.
slides.15.bullets.2: Une fois déposée, la demande part à la commune pour examen.
slides.16.overline: La commune
slides.16.title: La commune examine
slides.16.lead: La commune de Rotterdam accorde un permis de terrasse après examen par un gestionnaire.
slides.16.bullets.0: La demande arrive avec le calcul que Claudia a vu.
slides.16.bullets.1: Le gestionnaire accorde ou refuse, avec motivation.
slides.16.bullets.2: L'octroi crée le permis sur lequel le precario est prélevé.
slides.17.overline: L'avis d'imposition
slides.17.title: Le precario découle du permis
slides.17.lead: La commune prélève la taxe precario sur la terrasse accordée.
slides.17.bullets.0: Le règlement lit la surface dans le permis de terrasse accordé.
slides.17.bullets.1: Les 50 premiers m² sont exonérés ; au-delà, 36,10 € par m² et par an.
slides.17.bullets.2: Chaque montant remonte à l'article et au permis sur lesquels il repose.

# ---- de persona's -----------------------------------------------------------
# De beschrijving onder de kop van het portaal, en de enige tekst daar die uit
# `profiles.yaml` komt in plaats van uit het woordenboek. Zonder deze overlay
# staat er een Nederlandse zin onder een Franse kop.
#
# Gesleuteld op BSN en niet op de zin zelf, want vijftig van de drieënzestig
# beschrijvingen zijn uniek en de tien wallet-persona's delen er één; op de
# tekst sleutelen zou die tien aan elkaar knopen.
#
# Eigennamen blijven staan: `Merijn van der Meer` is een naam, geen
# omschrijving. Afkortingen van regelingen ook (`Bbz`, `WSNP`, `WGBO`, `AOW`),
# met een Franse toelichting waar de afkorting zonder uitleg niets zegt. Het
# Frans kent geslacht waar het Nederlands neutraal is; dat volgt de naam van
# de persona in profiles.yaml.
