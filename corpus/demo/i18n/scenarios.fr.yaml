# Franse titels van de features en scenario's uit het democorpus.
#
# Vertaald door een taalmodel en nog niet nagekeken door een Franstalige
# revisor. Wat die moet nakijken staat in `corpus/demo/i18n/REVIEW-fr.md`:
# de plekken waar de vertaling twijfelde, met per geval wat vast staat en
# wat niet.
#
# De `.feature`-bestanden zelf blijven Nederlands, en dat is geen
# nalatigheid: de Rust-runner en de browser-runner lezen dezelfde bestanden,
# en `just bdd-demo` toetst erop. Een titel vertalen waar hij staat zou dus
# een testsuite raken om een scherm te veranderen.
#
# De sleutel is de Nederlandse titel zelf. Een titel die hier ontbreekt
# blijft Nederlands staan; de stappen eronder zijn canoniek Engels en dragen
# de inhoud, dus dat is een schoonheidsfout en geen gat.
#
# Verwijzingen naar wetsartikelen zijn met opzet niet "vertaald" maar in hun
# eigen vorm gelaten: (artikel 2:28 lid 4) wordt (article 2:28, alinéa 4),
# want dat nummer is de vindplaats in de wet en niet een woord.
#
# Een waarde die anders te lang wordt, of een dubbele punt met een spatie
# erachter bevat (Frans zet een spatie vóór de dubbele punt), staat als
# gevouwen blok (`>-`); YAML plakt die regels weer met een spatie aaneen,
# dus de titel komt er ongewijzigd uit. Een sléútel kan niet gevouwen
# worden, dus die staat altijd op één regel; daarom raakt de limiet alleen
# de waarde.

