---
# Demo configuration: the two presenter profiles and what each of them shows.
# Ported from the POC's web/demo_profiles.py, web/feature_flags.py and
# web/config/dashboard_outputs.json. Laws are addressed by `law_path`, the
# directory of the law file under corpus/demo/regulation/nl (the POC's law
# identifier), combined with the executing service.

default_profile: merijn

profiles:
  merijn:
    name: Merijn
    type: burger
    bsn: '999100001'
    kvk: null
    default_law: {law_path: zorgtoeslagwet, service: TOESLAGEN}
    # Scenario's: the feature file that opens first, by its path under
    # regulation/nl. A law can have several, so the law alone is not enough.
    default_feature: zorgtoeslagwet/scenarios/zorgtoeslagwet_TOESLAGEN-2025-01-01.feature
    # Graaf: the laws that tell this persona's story (detentie -> verzekerd -> zorgtoeslag)
    graph_laws: [penitentiaire_beginselenwet, zvw, zorgtoeslagwet]
    zaaksysteem_service: TOESLAGEN
    portal_tab_label: Mijn overheid
    portal_heading: Waar heb ik recht op? Wat zijn mijn plichten?
    portal_subtitle: >-
      Bekijk hier je toeslagen, uitkeringen, aangiften, en andere regelingen van de overheid.
    # Merijn is het startprofiel (`default_profile`), dus dit is wat iemand
    # ziet die de demo opent. Alles staat daarom uit: het verhaal begint bij
    # een burger met toeslagen, en wie een feature wil tonen zet hem tijdens de
    # demo aan via Features in het menu. De vlaggen stonden hier eerder aan
    # omdat de features net gebouwd waren, wat geen reden is om ze aan een
    # presentator op te dringen.
    # Claudia (ondernemer) heeft dezelfde vlaggen: dat ze namens Café Noon B.V.
    # begint, volgt uit haar profiel en de Machtigingenwet, niet uit een vlag.
    feature_flags:
      DELEGATION: false
      AUTO_APPROVE_CLAIMS: false
      CHANGE_WIZARD: false
      HARMONIZE: false
    sidebar_laws: null
    disabled_laws:
      BELASTINGDIENST: [zorgverzekeringswet/bijdrage, zvw, zvw/werkgeversbijdrage]
      GEMEENTE_ROTTERDAM:
        - alcoholwet/vergunning/gemeenten
        - >-
          algemene_plaatselijke_verordening/exploitatievergunning/gemeenten
        - algemene_plaatselijke_verordening/terrassen
        - >-
          algemene_plaatselijke_verordening/ontheffingspas_geluid/gemeenten
        - verordening_precariobelasting/gemeenten
      KVK: [handelsregisterwet/jaarrekening]
      NVWA: [warenwet/haccp, warenwet/meldplicht]
      PENSIOENFONDS: [pensioenwet]
      RVO:
        - omgevingswet/werkgebonden_personenmobiliteit
        - omgevingswet/energiebesparing/informatieplicht
      SVB:
        - algemene_kinderbijslagwet
        - algemene_nabestaandenwet
        - algemene_ouderdomswet/leeftijdsbepaling
        - algemene_ouderdomswet_gegevens
        - participatiewet/aio
      TOESLAGEN: [wet_kinderopvang]
  claudia:
    name: Claudia
    type: ondernemer
    bsn: '999999990'
    kvk: '85234567'
    # Claudia's verhaal gaat over haar zaak, dus ze komt binnen namens Café Noon
    # B.V. (KvK-nummer), waarvan ze bestuurder is. Of dat mag zegt de
    # Machtigingenwet (art. 2:240 BW). Met DELEGATION aan is ook "Mezelf" te
    # kiezen, en dan is ze een burger zoals Merijn; zonder de vlag is er geen
    # wisselknop en blijft ze namens de zaak.
    start_namens: '85234567'
    default_law:
      law_path: verordening_precariobelasting/gemeenten
      service: GEMEENTE_ROTTERDAM
    default_feature: verordening_precariobelasting/gemeenten/scenarios/precariobelasting_GEMEENTE_ROTTERDAM-2024-01-01.feature
    # Graaf: the horeca chain in Rotterdam
    graph_laws:
      - alcoholwet/vergunning/rotterdam
      - alcoholwet/vergunning
      - algemene_plaatselijke_verordening/terrassen
      - verordening_precariobelasting
      - algemene_plaatselijke_verordening/exploitatievergunning
      - wet_bag
      - handelsregisterwet
      - handelsregisterwet/bedrijfsgegevens
    # Graaf: the law in focus when this persona is chosen; the graph zooms in
    # on it instead of the whole horeca chain.
    graph_focus: verordening_precariobelasting
    zaaksysteem_service: GEMEENTE_ROTTERDAM
    # Deze teksten horen bij "Mezelf"; namens Café Noon kopt het portaal met de naam
    # van de zaak.
    portal_tab_label: Mijn overheid
    portal_heading: Waar heb ik recht op? Wat zijn mijn plichten?
    portal_subtitle: >-
      Bekijk hier je toeslagen, uitkeringen, aangiften, en andere regelingen van de overheid.
    # Alles uit, zoals bij Merijn. Ze begint toch namens Café Noon
    # (start_namens), want die machtiging volgt uit de wet; DELEGATION voegt
    # alleen de wisselknop in de werkbalk toe.
    feature_flags:
      DELEGATION: false
      AUTO_APPROVE_CLAIMS: false
      CHANGE_WIZARD: false
      HARMONIZE: false
    sidebar_laws: [verordening_precariobelasting/gemeenten]
    # Wat Café Noon in zijn accijnsaangifte opgaf: het huisbier dat de eigen
    # brouwerij verliet. De accijnswet vraagt dat als parameters; hiermee rekent
    # de tegel meteen (data/declarations.ts). Een kleine brouwerij produceerde
    # in het vorige jaar niet meer dan 200.000 hl (art. 7 lid 2).
    declarations:
      wet_op_de_accijns/accijnsplicht_alcohol:
        activiteit: productie
        type_product: bier
        alcoholpercentage: 5.5
        hoeveelheid_hectoliter: 24
        is_kleine_brouwerij: true
    disabled_laws:
      BELASTINGDIENST: [zorgverzekeringswet/bijdrage, zvw, zvw/werkgeversbijdrage]
      DUO: [wet_studiefinanciering]
      GEMEENTE_AMSTERDAM: [participatiewet/bijstand/gemeenten]
      KIESRAAD: [kieswet]
      PENSIOENFONDS: [pensioenwet]
      RVO: [omgevingswet/werkgebonden_personenmobiliteit]
      SVB:
        - algemene_kinderbijslagwet
        - algemene_nabestaandenwet
        - algemene_ouderdomswet/leeftijdsbepaling
        - algemene_ouderdomswet_gegevens
        - participatiewet/aio
      SZW:
        - participatiewet/bijstand
        - besluit_bijstandverlening_zelfstandigen
      TOESLAGEN:
        - zorgtoeslagwet
        - wet_op_de_huurtoeslag
        - wet_op_het_kindgebonden_budget
        - wet_kinderopvang
      UWV:
        - werkloosheidswet
        - ziektewet
        - uwv_toetsingsinkomen
        - uwv_werkgegevens
        - wet_werk_en_inkomen_naar_arbeidsvermogen
        - wet_structuur_uitvoeringsorganisatie_werk_en_inkomen
        - wet_inkomstenbelasting

# Applications under these laws always go to a caseworker of the service,
# whatever the law concludes: Rotterdam grants a terrasvergunning after
# assessing it, so the demo does not decide it on its own. Precario follows
# only once the municipality has granted it.
review_laws:
  GEMEENTE_ROTTERDAM: [algemene_plaatselijke_verordening/terrassen]

# Laws that never appear on a portal: infrastructure, procedural or helper
# laws that other laws consume (the POC's FeatureFlags.LAW_DEFAULTS).
hidden_laws:
  LBB: [wet_bibob]
  SVH: [alcoholwet/register_sociale_hygiene]
  VWS: [alcoholwet/vergunning, zorgtoeslagwet/regelingen]
  ACICT: [wet_adviescollege_ict_toetsing]
  ANVS:
    - besluit_basisveiligheidsnormen_stralingsbescherming
    - besluit_kerninstallaties
    - kernenergiewet
  AWB: [algemene_wet_bestuursrecht/artikel_1_1_bestuursorgaan]
  # De WPM-rapportageverplichting en de werkgeversbijdrage Zvw staan niet in de
  # demo: de simulatie kan de werkgeversbijdrage niet rekenen (geen loongegevens)
  # en geen van beide draagt het verhaal van Merijn of Claudia.
  RVO: [omgevingswet/werkgebonden_personenmobiliteit]
  RvIG: [wet_brp, wet_brp/laa]
  BELASTINGDIENST: [wet_brp/terugmelding, belastingdienst_vermogen, zvw/werkgeversbijdrage]
  CJIB: [wet_brp/terugmelding]
  TOESLAGEN: [wet_brp/terugmelding]
  JenV: [awb/bezwaar, awb/beroep]
  UWV:
    - wet_werk_en_inkomen_naar_arbeidsvermogen
    - ziektewet
    - uwv_werkgegevens
    - uwv_toetsingsinkomen
    - wet_structuur_uitvoeringsorganisatie_werk_en_inkomen
  RVZ: [zvw]
  NATIONAAL_ARCHIEF: [archiefwet]
  KVK: [handelsregisterwet/bedrijfsgegevens]
  SVB:
    - algemene_ouderdomswet_gegevens
    - algemene_ouderdomswet/leeftijdsbepaling
  CBS: [wet_op_het_centraal_bureau_voor_de_statistiek]

# Primary output per law for ranking tiles on the portal (largest impact first).
# Laws not listed fall back to their largest absolute numeric output.
dashboard_outputs:
  BELASTINGDIENST/wet_inkomstenbelasting: totale_belastingschuld
  TOESLAGEN/zorgtoeslagwet: hoogte_toeslag
  TOESLAGEN/wet_op_het_kindgebonden_budget: kindgebonden_budget_jaar
  TOESLAGEN/wet_op_de_huurtoeslag: subsidiebedrag
  TOESLAGEN/wet_kinderopvang: jaarbedrag
  SVB/algemene_ouderdomswet: pensioenbedrag
  SVB/algemene_kinderbijslagwet: ontvangt_kinderbijslag
  SVB/algemene_nabestaandenwet: netto_uitkering
  SVB/participatiewet/aio: aio_aanvulling
  SZW/participatiewet/bijstand: basisbedrag
  SZW/besluit_bijstandverlening_zelfstandigen: algemene_bijstand_bedrag
  GEMEENTE_AMSTERDAM/participatiewet/bijstand/gemeenten: uitkeringsbedrag
  DUO/wet_studiefinanciering: studiefinanciering
  UWV/werkloosheidswet: ww_uitkering_per_maand
  UWV/ziektewet: hoogte_ziekengeld
  UWV/wet_werk_en_inkomen_naar_arbeidsvermogen: hoogte_uitkering
  BELASTINGDIENST/zorgverzekeringswet/bijdrage: verschuldigde_bijdrage
  PENSIOENFONDS/pensioenwet: maandelijks_pensioen
  KIESRAAD/kieswet: heeft_stemrecht
  GEMEENTE_ROTTERDAM/verordening_precariobelasting/gemeenten: belasting_per_jaar
  GEMEENTE_ROTTERDAM/algemene_plaatselijke_verordening/terrassen: heeft_recht_op_terrasvergunning
  # Café Noon heeft deze vergunning al; de tegel kopt dat, net als bij de
  # exploitatievergunning hieronder.
  GEMEENTE_ROTTERDAM/alcoholwet/vergunning/gemeenten: heeft_actieve_vergunning
  # Claudia heeft deze vergunning al; zonder regel hier kopte de tegel de
  # bezwaartermijn (6 weken) als uitkomst.
  GEMEENTE_ROTTERDAM/algemene_plaatselijke_verordening/exploitatievergunning/gemeenten: heeft_actieve_vergunning
  NVWA/warenwet/haccp: heeft_haccp_verplichting
  RVO/omgevingswet/energiebesparing/informatieplicht: heeft_informatieplicht
  NVWA/warenwet/meldplicht: heeft_meldplicht
  # Café Noon is een BV en moet zijn jaarrekening deponeren; zonder regel hier
  # kopte de tegel de bezwaartermijn (6 weken) als uitkomst.
  KVK/handelsregisterwet/jaarrekening: heeft_deponeringsplicht
  IND/vreemdelingenwet: heeft_verblijfsrecht
  DOUANE/wet_op_de_accijns/accijnsplicht_alcohol: verschuldigde_accijns

# Wat een tegel onder de uitkomst laat zien.
#
# Een burger stelt drie vragen: krijg ik het, hoeveel is het, en moet ik nog
# iets doen. Alles daarbuiten is verantwoording, en die hoort een klik verder
# (Berekening, Gebruikte gegevens, Wettekst) waar hij ook te corrigeren is.
#
# Standaard toonde de tegel élke andere uitvoerwaarde van de wet, tot zes toe.
# Daarmee kwam de rekenkeuken op straat: "Uitzondering caribisch nederland van
# toepassing: Nee" bij iemand die in Nederland woont, "Woonlandfactor" en "Alo
# kop bedrag" onder het kindgebonden budget. Dat zijn stappen in de redenering,
# geen antwoorden op een vraag die iemand heeft.
#
# `tile_details` zegt per wet welke waarden er wél toe doen voor de burger. Een
# lege lijst betekent: alleen de uitkomst, verder niets. Een wet die hier niet
# in staat houdt de oude weergave, dus dit kan wet voor wet groeien.
tile_details:
  # Waarom het niet mag en wat er vergund wordt. De precario-uitvoer van deze
  # wet blijft weg: die rekent de precarioverordening, en hier stond hij als
  # "verschuldigd: Ja" naast een afgewezen terras.
  GEMEENTE_ROTTERDAM/algemene_plaatselijke_verordening/terrassen:
    - weigeringsgrond
    - vergunde_oppervlakte
    - vergunde_sluitingstijd_doordeweeks
    - vergunde_sluitingstijd_weekend
  # De uitspraak is het hele antwoord; het uitzonderingsvinkje is een tussenstap.
  KIESRAAD/kieswet: []
  # Het bedrag is het antwoord. Waar het uit is opgebouwd staat in de berekening.
  TOESLAGEN/wet_op_het_kindgebonden_budget: []
  TOESLAGEN/zorgtoeslagwet: []
  TOESLAGEN/wet_op_de_huurtoeslag:
    # Wat de burger zelf betaalt naast de toeslag: dat verandert wat hij doet.
    - basishuur
  SZW/besluit_bijstandverlening_zelfstandigen:
    # Bedrijfskapitaal is een tweede recht, geen tussenstap.
    - bedrijfskapitaal
  BELASTINGDIENST/wet_inkomstenbelasting: []
  # Het maandbedrag is het antwoord; dagloon en opbouwpercentage zijn de weg
  # ernaartoe en staan in de berekening.
  UWV/werkloosheidswet: []
  UWV/ziektewet: []
  UWV/wet_werk_en_inkomen_naar_arbeidsvermogen: []
  SVB/algemene_ouderdomswet: []
  SVB/algemene_nabestaandenwet: []
  SVB/participatiewet/aio: []
  SZW/participatiewet/bijstand: []
  GEMEENTE_AMSTERDAM/participatiewet/bijstand/gemeenten: []
  DUO/wet_studiefinanciering: []
  PENSIOENFONDS/pensioenwet: []
  BELASTINGDIENST/zorgverzekeringswet/bijdrage: []
  TOESLAGEN/wet_kinderopvang: []
  GEMEENTE_ROTTERDAM/verordening_precariobelasting/gemeenten: []
  SVB/algemene_kinderbijslagwet: []
  IND/vreemdelingenwet: []
  DOUANE/wet_op_de_accijns/accijnsplicht_alcohol:
    # Het bedrag is het antwoord; het tarief en de categorie zijn de weg
    # ernaartoe en staan in de berekening. Of er een vergunning voor een
    # accijnsgoederenplaats nodig is, is een tweede vraag met eigen gevolgen
    # (art. 5 verbiedt produceren zonder), dus die blijft op de tegel staan.
    - agp_vergunning_vereist
    - voldoet_aan_vergunningsplicht

# Hoe een tegel haar uitkomst vertelt. Zonder dit zegt elke tegel hetzelfde:
# "Je voldoet aan de voorwaarden", het bedrag, en de veldnaam eronder. Dat is
# een label, geen antwoord. De POC schreef per wet een zin om het bedrag heen
# ("Je huurtoeslag is waarschijnlijk € 302,96 per jaar"), en dat leest als iets
# wat tegen déze burger gaat.
#
# Per wet: `lead` staat boven de uitkomst, `unit` erachter, en `none` vervangt
# het geheel als de wet niets toekent. Een wet die hier niet in staat houdt de
# algemene weergave, dus dit kan wet voor wet groeien.
#
#   lead:  de aanhef, zonder punt; eindigt waar het bedrag begint
#   unit:  wat er ná het bedrag staat ("per jaar", "dit jaar", "per maand")
#   none:  hele zin voor wie er geen recht op heeft
#   yes/no: voor een ja/nee-wet, in plaats van lead/unit
outcome_phrasing:
  TOESLAGEN/zorgtoeslagwet:
    lead: Je zorgtoeslag is waarschijnlijk
    unit: dit jaar
    none: Je krijgt waarschijnlijk geen zorgtoeslag.
  TOESLAGEN/wet_op_de_huurtoeslag:
    lead: Je huurtoeslag is waarschijnlijk
    unit: per jaar
    none: Je krijgt waarschijnlijk geen huurtoeslag.
  TOESLAGEN/wet_op_het_kindgebonden_budget:
    lead: Je kindgebonden budget is waarschijnlijk
    unit: per jaar
    none: Je krijgt waarschijnlijk geen kindgebonden budget.
  TOESLAGEN/wet_kinderopvang:
    lead: Je kinderopvangtoeslag is waarschijnlijk
    unit: per jaar
    none: Je krijgt waarschijnlijk geen kinderopvangtoeslag.
  BELASTINGDIENST/wet_inkomstenbelasting:
    lead: Je verschuldigde inkomstenbelasting is waarschijnlijk
    unit: dit jaar
    none: Je bent waarschijnlijk geen inkomstenbelasting verschuldigd.
  SVB/algemene_ouderdomswet:
    lead: Je AOW-pensioen is waarschijnlijk
    unit: per jaar
    none: Je hebt nog geen recht op AOW.
  SVB/algemene_nabestaandenwet:
    lead: Je nabestaandenuitkering is waarschijnlijk
    unit: per maand
    none: Je hebt waarschijnlijk geen recht op een nabestaandenuitkering.
  SVB/participatiewet/aio:
    lead: Je AIO-aanvulling is waarschijnlijk
    unit: per maand
    none: Je hebt waarschijnlijk geen recht op een AIO-aanvulling.
  SZW/participatiewet/bijstand:
    lead: Je bijstandsuitkering is waarschijnlijk
    unit: per maand
    none: Je hebt waarschijnlijk geen recht op bijstand.
  GEMEENTE_AMSTERDAM/participatiewet/bijstand/gemeenten:
    lead: Je bijstandsuitkering is waarschijnlijk
    unit: per maand
    none: Je hebt waarschijnlijk geen recht op bijstand.
  SZW/besluit_bijstandverlening_zelfstandigen:
    lead: Je Bbz-bijstand is waarschijnlijk
    unit: per maand
    none: Je hebt waarschijnlijk geen recht op Bbz-bijstand.
  UWV/werkloosheidswet:
    lead: Je WW-uitkering is waarschijnlijk
    unit: per maand
    none: Je hebt waarschijnlijk geen recht op WW.
  UWV/ziektewet:
    lead: Je ziekengeld is waarschijnlijk
    unit: per dag
    none: Je hebt waarschijnlijk geen recht op ziekengeld.
  UWV/wet_werk_en_inkomen_naar_arbeidsvermogen:
    lead: Je WIA-uitkering is waarschijnlijk
    unit: per maand
    none: Je hebt waarschijnlijk geen recht op een WIA-uitkering.
  DUO/wet_studiefinanciering:
    lead: Je studiefinanciering is waarschijnlijk
    unit: per maand
    none: Je hebt waarschijnlijk geen recht op studiefinanciering.
  PENSIOENFONDS/pensioenwet:
    lead: Je pensioen is waarschijnlijk
    unit: per maand
    none: Je bouwt hier nog geen pensioen op.
  BELASTINGDIENST/zorgverzekeringswet/bijdrage:
    lead: Je bijdrage Zvw is waarschijnlijk
    unit: dit jaar
    none: Je bent waarschijnlijk geen bijdrage Zvw verschuldigd.
  GEMEENTE_ROTTERDAM/verordening_precariobelasting/gemeenten:
    lead: Je precariobelasting is waarschijnlijk
    unit: per jaar
    none: Je bent waarschijnlijk geen precariobelasting verschuldigd.
  DOUANE/wet_op_de_accijns/accijnsplicht_alcohol:
    lead: Over deze partij ben je waarschijnlijk
    unit: aan accijns verschuldigd
    none: Over deze partij ben je waarschijnlijk geen accijns verschuldigd.
  # Ja/nee-wetten: geen bedrag, wel een uitspraak. `date_input` zet de datum
  # waar de uitspraak over gaat in de aanhef.
  KIESRAAD/kieswet:
    lead: Voor de verkiezingen van {date} heb je
    # Zonder datum valt de hele bijzin weg, niet alleen de plaatshouder.
    lead_no_date: Voor de verkiezingen heb je
    date_input: verkiezingsdatum
    'yes': STEMRECHT
    'no': GEEN stemrecht
  SVB/algemene_kinderbijslagwet:
    lead: Je hebt
    'yes': RECHT OP KINDERBIJSLAG
    'no': GEEN recht op kinderbijslag
  IND/vreemdelingenwet:
    lead: Je hebt
    'yes': VERBLIJFSRECHT
    'no': GEEN verblijfsrecht
  GEMEENTE_ROTTERDAM/algemene_plaatselijke_verordening/terrassen:
    lead: Voor een terras heb je
    'yes': RECHT OP EEN VERGUNNING
    'no': GEEN recht op een vergunning
  GEMEENTE_ROTTERDAM/alcoholwet/vergunning/gemeenten:
    lead: Voor alcoholverkoop heb je
    'yes': EEN ACTIEVE VERGUNNING
    'no': GEEN actieve vergunning
  NVWA/warenwet/haccp:
    lead: Voor voedselveiligheid heb je
    'yes': EEN HACCP-VERPLICHTING
    'no': GEEN HACCP-verplichting
  NVWA/warenwet/meldplicht:
    lead: Bij een voedselveiligheidsincident heb je
    'yes': EEN MELDPLICHT
    'no': GEEN meldplicht
  RVO/omgevingswet/energiebesparing/informatieplicht:
    lead: Voor energiebesparing heb je
    'yes': EEN INFORMATIEPLICHT
    'no': GEEN informatieplicht
  KVK/handelsregisterwet/jaarrekening:
    lead: Voor je jaarrekening heb je
    'yes': EEN DEPONERINGSPLICHT
    'no': GEEN deponeringsplicht

# Which YAML paths the law viewer opens by default for a law, so the audience
# sees the branch that matters (the POC's DEMO_COLLAPSE_CONFIG, trimmed to the
# laws on the default tabs). Paths are dotted, arrays by index or by the value
# of `output`/`name`.
# Simulatie: what adds up to a citizen's disposable income per month (the
# POC's "besteedbaar inkomen"). A law states its amount per month or per
# year; the law itself does not declare that, so it is configured here. Taxes
# are subtracted, benefits added, and only when the law's conditions are met.
simulation:
  disposable_income:
    - law: wet_inkomstenbelasting
      output: totale_belastingschuld
      period: year
      kind: tax
      label: Inkomstenbelasting
    - law: zorgverzekeringswet/bijdrage
      output: verschuldigde_bijdrage
      period: year
      kind: tax
      label: Bijdrage Zvw
    - law: zorgtoeslagwet
      output: hoogte_toeslag
