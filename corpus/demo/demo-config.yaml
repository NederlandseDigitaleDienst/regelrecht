# What the Regelwerken tab shows unfolded per law, prepared for the story (the
# POC's DEMO_COLLAPSE_CONFIG). A path opens the way down to itself and itself;
# what hangs below it stays folded, and so do its siblings. The article is the
# one node the presenter opens by hand, so a single click reveals the right
# lines instead of scrolling; naming the article itself (`articles.1`) opens it
# too. Keep a path as deep as the line you want to land
# on: one that stops at a block (`…execution.actions`) opens that block, not
# the calculation inside it. `*` matches any article number; list items are
# addressed by their `name`/`output` or, without one, by their index.
expanded_paths:
  zorgtoeslagwet:
    - articles.*.machine_readable.execution.parameters
    # the insured-status input and where it comes from
    - articles.*.machine_readable.execution.input.is_verzekerde.source
    - articles.*.machine_readable.execution.output
    # the two requirements: age and insured
    - articles.*.machine_readable.execution.actions.voldoet_aan_voorwaarden.value.conditions.0
    - articles.*.machine_readable.execution.actions.voldoet_aan_voorwaarden.value.conditions.1
    # the age test is a calculation (art. 1 lid 1 onder c), but it starts
    # folded as `subject: AGE`: the two requirements read as two short blocks,
    # and the presenter opens the calculation when the story needs it
    # the amount only for who meets the requirements (art. 2 lid 1): the first
    # thing a click on `hoogte_toeslag` shows, above the calculation
    - articles.*.machine_readable.execution.actions.hoogte_toeslag.value.cases.0.when
    # the calculation for a partner: joint income against the threshold
    - articles.*.machine_readable.execution.actions.hoogte_toeslag.value.cases.0.then.value.cases.0.then.cases.0.when.subject.values
  zvw:
    # the only article, so it opens straight away
    - articles.1
    - articles.*.machine_readable.execution.input.is_gedetineerd.source
    - articles.*.machine_readable.execution.output
    - articles.*.machine_readable.execution.actions.is_verzekerde.value.conditions.0.conditions.0
    - articles.*.machine_readable.execution.actions.is_verzekerde.value.conditions.0.conditions.1
    - articles.*.machine_readable.execution.actions.is_verzekerde.value.conditions.1.value
  penitentiaire_beginselenwet:
    # the only article, so it opens straight away
    - articles.2
    - articles.*.machine_readable.execution.input
    - articles.*.machine_readable.execution.output
    - articles.*.machine_readable.execution.actions.is_gedetineerd.value.conditions.0.values
    - articles.*.machine_readable.execution.actions.is_gedetineerd.value.conditions.1.values
  verordening_precariobelasting:
    - articles.*.machine_readable.execution.input
    - articles.*.machine_readable.execution.output
    - articles.*.machine_readable.execution.actions
  alcoholwet/vergunning/rotterdam:
    - articles.*.machine_readable.execution.output
  alcoholwet/vergunning:
    - articles.*.machine_readable.execution.output
  algemene_plaatselijke_verordening/terrassen:
    - articles.*.machine_readable.execution.input
    - articles.*.machine_readable.execution.output
  algemene_plaatselijke_verordening/exploitatievergunning:
    - articles.*.machine_readable.execution.output
  awb/bezwaar:
    # the only article, so it opens straight away
    - articles.7:1
    # which decisions are open to bezwaar and which are not, spelled out;
    # input and output stay folded as a count
    - articles.*.machine_readable.definitions.excluded_decision_types
    - articles.*.machine_readable.definitions.required_legal_character
    # the three requirements for bezwaar (art. 7:1 lid 1)
    - articles.*.machine_readable.execution.actions.bezwaar_mogelijk.value.conditions.0.value
    - articles.*.machine_readable.execution.actions.bezwaar_mogelijk.value.conditions.1
    - articles.*.machine_readable.execution.actions.bezwaar_mogelijk.value.conditions.2.subject

# Nodes on a prepared path that still start folded, because the presenter opens
# them by hand at that point in the story. What lies below them is prepared all
# the same: one click on `actions` shows the two requirements, one click on
# `hoogte_toeslag` the requirements it waits for and the partner calculation.
# Same path language as above, but a pattern matches only the node itself.
folded_paths:
  zorgtoeslagwet:
    - articles.*.machine_readable.execution.input
    - articles.*.machine_readable.execution.output
    - articles.*.machine_readable.execution.actions
    - articles.*.machine_readable.execution.actions.hoogte_toeslag
  zvw:
    - articles.*.machine_readable.execution.input
    - articles.*.machine_readable.execution.output
  penitentiaire_beginselenwet:
    - articles.*.machine_readable.execution.input
    - articles.*.machine_readable.execution.output

# The presentation slides (Presentatie tab). A slide without `route` covers the
# screen (title, statement, closing); a slide with `route` puts the deck on the
# left and opens that tab, optionally switching the persona (`profile`) and
# pulsing a part of the screen (`highlight`, a CSS selector). `**text**` is bold.
# A slide with `decks` belongs to that persona's story; the others are shared.
# The deck is picked when the presentation starts, from the chosen persona.
slides:
  - kind: title
    title: RegelRecht
    subtitle: van wet naar digitale werking
    footer: Nederlandse Digitale Dienst
  - kind: statement
    overline: Huidige situatie
    lines:
      - Iedere organisatie
      - heeft een **eigen interpretatie** van de wet
      - die landt in **eigen software**
  - kind: statement
    overline: Het gevolg
    lines:
      - Geen overzicht
      - Onvoorspelbaar
      - Onbeheersbaar
  - kind: statement
    overline: Wat als
    lines:
      - We **beginnen met de wet**
      - Deze **machine-uitvoerbaar** maken
      - '**Openbaar** publiceren'
  - kind: section
    title: Demo RegelRecht
    lines:
      - Compleet verhaal, geen eindproduct
      - We maken beleid door te doen
  - kind: demo
    overline: Het regelwerk
    title: De wet als regelwerk
    lead: De wettekst en de uitvoerbare regel staan naast elkaar, per artikel.
    bullets:
      - 'Elk artikel heeft een **machine_readable**-deel: welke gegevens erin gaan, wat eruit komt en hoe.'
      - Een verwijzing naar een andere wet is expliciet, geen kopie van een bedrag.
      - Hetzelfde regelwerk draait in de editor, in dit portaal en in de simulatie.
    # without a law in the path the deck opens the chosen persona's default_law
    # (zorgtoeslag for Merijn, precario for Claudia), not whatever was left open
    route: /regelwerken
    highlight: .yaml-tree
  - kind: demo
    overline: Samenhang
    title: Wetten hangen samen
    lead: Of iemand verzekerd is, hangt af van detentie; of iemand zorgtoeslag krijgt, hangt af van verzekerd zijn.
    bullets:
      - 'Per wet: welke gegevens uit registers, welke uit andere wetten, wat eruit komt.'
      - Elke lijn is een echte verwijzing uit de wet, met de waarde voor deze persoon erbij.
      - Wijzigt een wet, dan zie je meteen wie dat raakt.
    route: /graaf
    decks: [merijn]
  - kind: demo
    overline: Samenhang
    title: Wetten hangen samen
    lead: Of Claudia precario betaalt, hangt af van haar terrasvergunning; die hangt af van haar exploitatievergunning.
    bullets:
      - 'Per wet: welke gegevens uit registers, welke uit andere wetten, wat eruit komt.'
      - Handelsregister, BAG en gemeentelijke verordeningen staan in één graaf.
      - Wijzigt de verordening, dan zie je meteen welke ondernemers dat raakt.
    route: /graaf
    decks: [claudia]
  - kind: demo
    overline: Toetsen
    title: De wet getoetst, in gewone taal
    lead: Scenario's beschrijven een persoon en wat de wet voor die persoon moet opleveren.
    bullets:
      - Gegeven een 17-jarige, dan geen zorgtoeslag. Gegeven een alleenstaande met laag inkomen, dan wel.
      - Dezelfde scenario's draaien hier in de browser en in de bouwstraat.
      - Wie de wet wijzigt, ziet welk scenario omvalt.
    route: /scenarios
    decks: [merijn]
  - kind: demo
    overline: Toetsen
    title: De verordening getoetst, in gewone taal
    lead: Scenario's beschrijven een onderneming en wat de verordening voor die onderneming moet opleveren.
    bullets:
      - Gegeven een terras van 20 m², dan geen precario. Gegeven een terras van 80 m², dan belasting over 30 m².
      - Dezelfde scenario's draaien hier in de browser en in de bouwstraat.
      - Wie de verordening wijzigt, ziet welk scenario omvalt.
    route: /scenarios
    decks: [claudia]
  - kind: demo
    overline: Beleid
    title: Wat doet het met tweeduizend mensen?
    lead: Een gegenereerde bevolking door alle regelingen, met de echte wetten.
    bullets:
      - Wie voldoet aan de voorwaarden, voor hoeveel, uitgesplitst naar leeftijd, inkomen, huishouden.
      - Draai aan een drempel in de wet en zie het verschil, voor de wet ingaat.
      - 'Ook voor ondernemers: vergunningen, meldplichten, precario.'
    route: /simulatie
  - kind: demo
    overline: De burger
    title: Eén burger, Merijn
    lead: ZZP'er in de thuiszorg, alleenstaande ouder met twee jonge kinderen.
    bullets:
      - Alles waar hij recht op heeft, live berekend door de wet zelf.
      - Elk gegeven is herleidbaar naar het register dat het leverde.
      - Klopt een gegeven niet? Hij corrigeert het, een behandelaar beoordeelt.
    route: /portaal
    profile: merijn
    highlight: nldd-card
    decks: [merijn]
  - kind: demo
    overline: Aanvragen
    title: Alleen vragen wat de overheid niet weet
    lead: De wet rekent met wat er al is en vraagt pas iets als ze vastloopt.
    bullets:
      - De huurtoeslag kent de huur niet. Dat is de enige vraag, op dat moment.
      - Na elk antwoord rekent de wet opnieuw.
      - Controleren, verklaren, indienen. Zonder formulier van tien pagina's.
    route: /portaal
    highlight: '[data-highlight="complete-data"]'
    decks: [merijn]
  - kind: demo
    overline: De behandelaar
    title: Hetzelfde recht, andere kant van de balie
    lead: De aanvraag komt binnen met de berekening die de burger zag.
    bullets:
      - De engine rekent het opnieuw na met de geregistreerde gegevens.
      - Correcties van de burger staan klaar ter beoordeling.
      - Toekennen of afwijzen, met motivering; bezwaar komt via het portaal terug.
    route: /zaaksysteem
    decks: [merijn]
  - kind: demo
    overline: De ondernemer
    title: Een ondernemer, Claudia
    lead: Bestuurder van Café Noon in Rotterdam-West, een café met een eigen kleine brouwerij en een terras.
    bullets:
      - 'Dezelfde engine, andere wetten: APV, Alcoholwet, Warenwet, accijns, precario.'
      - De terrasvergunning vraagt om locatie en oppervlakte; is die verleend, dan rekent de precariobelasting ermee.
      - Gemeente, NVWA en RVO in één overzicht, zonder dat zij iets aan elkaar hoeven te vragen.
    route: /portaal
    profile: claudia
  - kind: demo
    overline: Aanvragen
    title: Een terras aanvragen
    lead: De gemeente weet al veel over Café Noon. De aanvraag vraagt alleen naar het terras zelf.
    bullets:
      - Locatie, oppervlakte, seizoen en sluitingstijden staan in geen register.
      - Na elk antwoord rekent de APV opnieuw, met de weigeringsgronden erbij.
      - Na het indienen gaat de aanvraag naar de gemeente ter beoordeling.
    route: /portaal
    highlight: nldd-card[accessible-label^="Terrasvergunning"]
    decks: [claudia]
  - kind: demo
    overline: De gemeente
    title: De gemeente beoordeelt
    lead: Gemeente Rotterdam verleent een terrasvergunning na beoordeling door een behandelaar.
    bullets:
      - De aanvraag komt binnen met de berekening die Claudia zag.
      - De behandelaar kent toe of wijst af, met motivering.
      - Met de toekenning bestaat de vergunning waarover precario wordt geheven.
    route: /zaaksysteem
    decks: [claudia]
  - kind: demo
    overline: De aanslag
    title: Precario volgt uit de vergunning
    lead: De gemeente legt precariobelasting op over het verleende terras.
    bullets:
      - De verordening leest de oppervlakte uit de verleende terrasvergunning.
      - De eerste 50 m² zijn vrijgesteld; daarboven € 36,10 per m² per jaar.
      - Elk bedrag is herleidbaar tot het artikel en de vergunning waarop het rust.
    route: /portaal
    highlight: nldd-card[accessible-label^="Verordening Precariobelasting"]
    decks: [claudia]
  - kind: closing
    overline: Demo RegelRecht
    title: Van wet naar digitale werking
    lines:
      - Compleet verhaal, **geen eindproduct**
      - We maken beleid **door te doen**
    link:
      href: https://regelrecht.rijks.app
      label: regelrecht.rijks.app
