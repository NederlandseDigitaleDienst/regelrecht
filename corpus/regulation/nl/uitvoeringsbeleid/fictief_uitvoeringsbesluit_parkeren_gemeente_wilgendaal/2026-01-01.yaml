---
$schema: https://raw.githubusercontent.com/NederlandseDigitaleDienst/regelrecht/refs/tags/schema-v0.8.12/schema/v0.8.12/schema.json
$id: fictief_uitvoeringsbesluit_parkeren_gemeente_wilgendaal
regulatory_layer: UITVOERINGSBELEID
publication_date: '2025-12-01'
valid_from: '2026-01-01'
# FICTIEF. De gemeente Wilgendaal bestaat niet en dit is geen bekendgemaakt
# besluit, maar een eigen keuze in de modellering, naar het model van het
# Uitvoeringsbesluit Parkeren Delft 2025 (CVDR733452), artikel 8, derde en
# achtste lid. Er is geen bekendmaking; de url wijst daarom naar dat besluit.
# Het Delftse besluit stelt "nadere regels" krachtens de verordening. Eigen
# keuze: de laag is UITVOERINGSBELEID, omdat alleen beleid een open begrip aan
# het antwoord van een cel mag koppelen (source.reduction, RFC-048), en dat
# doen artikel 4 en 5. Weggelaten uit het model: de wachtlijst (artikel 6), het
# maximum per gebied (artikel 5), de tijden waarop een vergunning geldt (lid
# 7) en het parkeren op eigen terrein (lid 10).
url: https://lokaleregelgeving.overheid.nl/CVDR733452
name: Uitvoeringsbesluit Parkeren Wilgendaal 2026 (fictief)
competent_authority:
  name: Het college van burgemeester en wethouders van de gemeente Wilgendaal
# De verordening laat de regels met zoveel woorden aan het college (artikel
# 2, derde en vierde lid).
legal_basis:
  - law_id: fictieve_parkeerverordening_gemeente_wilgendaal
    article: '2'
    description: >-
      Het college stelt regels over de vergunninggebieden en over de wijze
      waarop blijkt dat een bedrijf in een vergunninggebied is gevestigd (lid
      3), en het stelt het maximum aantal bedrijfsparkeervergunningen per
      bedrijf vast (lid 4).
articles:
  - number: '1'
    text: >-
      FICTIEF, eigen keuze in de modellering.

      1 De vergunninggebieden zijn de binnenstad en de schil.

      2 Een adres ligt in de binnenstad als zijn postcode 7711 AA, 7711 AB of
      7711 AC is.

      3 Een adres ligt in de schil als zijn postcode 7713 AA, 7713 AB of 7713
      AC is.
    url: https://lokaleregelgeving.overheid.nl/CVDR733452
    machine_readable:
      # Eigen keuze: het gebied volgt uit een lijst postcodes. Delft wijst
      # zijn gebieden aan in een apart besluit (het "Aanwijzingsbesluit
      # betaald parkeren Delft", artikel 3, tweede lid, van het model), dat
      # niet in het corpus staat. Een postcode staat in het handelsregister
      # bij het adres van de vestiging, dus een lijst postcodes laat het
      # gebied rechtstreeks volgen uit wat het register vermeldt. De
      # postcodes zijn verzonnen.
      execution:
        parameters:
          - name: postcode
            type: string
            nullable: true
            description: De postcode van het adres.
        output:
          - name: vergunninggebied_van_postcode
            type: string
            nullable: true
            description: >-
              Het vergunninggebied waarin het adres ligt: binnenstad of schil;
              afwezig als het in geen van beide ligt.
        actions:
          - output: vergunninggebied_van_postcode
            value:
              operation: IF
              cases:
                - when:
                    operation: IN
                    subject: $postcode
                    values:
                      - 7711 AA
                      - 7711 AB
                      - 7711 AC
                  then: binnenstad
                - when:
                    operation: IN
                    subject: $postcode
                    values:
                      - 7713 AA
                      - 7713 AB
                      - 7713 AC
                  then: schil
              default: null
  - number: '2'
    text: >-
      FICTIEF, naar het model van artikel 8, derde lid, van het
      Uitvoeringsbesluit Parkeren Delft 2025. Uit het handelsregister van de
      Kamer van Koophandel moet blijken dat het bedrijf in een
      vergunninggebied is gevestigd. Het bedrijf is gevestigd in het
      vergunninggebied waarin het bezoekadres van zijn vestiging ligt, zoals
      het handelsregister dat op de dag van het besluit vermeldt.
    url: https://lokaleregelgeving.overheid.nl/CVDR733452
    machine_readable:
      # Vult het begrip van artikel 2, eerste lid, van de verordening
      # (implements, RFC-045). Het adres staat in het handelsregister
      # (artikel 11, eerste lid, onder c, van de Handelsregisterwet 2007: "het
      # post- en bezoekadres"), dus de Kamer van Koophandel antwoordt erop
      # (competent_authority, RFC-052). Artikel 4 koppelt dat begrip aan het
      # antwoord van de cel van de Kamer. Niet verplicht: vermeldt het
      # handelsregister geen vestiging, dan blijkt niet dat het bedrijf in een
      # vergunninggebied is gevestigd, en weigert het college.
      # Het Delftse model vraagt ook dat het bedrijf in het gebied een
      # onroerende zaak "daadwerkelijk in gebruik heeft ten behoeve van de
      # bedrijfsvoering"; dat is weggelaten.
      open_terms:
        - id: postcode_vestiging_volgens_handelsregister
          competent_authority:
            - name: Kamer van Koophandel
          type: string
          required: false
          decided_per_case_by: de Kamer van Koophandel, in het handelsregister
          description: >-
            De postcode van het bezoekadres van de vestiging van het bedrijf,
            zoals het handelsregister die op de dag van het besluit vermeldt.
      implements:
        - law: fictieve_parkeerverordening_gemeente_wilgendaal
          article: '2'
          open_term: bedrijf_gevestigd_in_vergunninggebied
      execution:
        # Uit artikel 2 van de verordening: welk bedrijf, en de dag van het
        # besluit.
        parameters:
          - name: kvk_nummer
            type: string
            description: Het nummer dat de Kamer van Koophandel het bedrijf toekende.
          - name: besluit_datum
            type: date
            description: De dag waarop het college op de aanvraag besluit.
        input:
          - name: vergunninggebied
            type: string
            nullable: true
            source:
              regulation: fictief_uitvoeringsbesluit_parkeren_gemeente_wilgendaal
              output: vergunninggebied_van_postcode
              parameters:
                postcode: $postcode_vestiging_volgens_handelsregister
        output:
          - name: vergunninggebied_van_vestiging
            type: string
            nullable: true
            description: >-
              Het vergunninggebied waarin de vestiging van het bedrijf ligt;
              afwezig als zij in geen van beide ligt, of als het
              handelsregister geen vestiging vermeldt.
          - name: bedrijf_gevestigd_in_vergunninggebied
            type: boolean
            description: Of uit het handelsregister blijkt dat het bedrijf in een vergunninggebied is gevestigd.
        actions:
          - output: vergunninggebied_van_vestiging
            value: $vergunninggebied
          - output: bedrijf_gevestigd_in_vergunninggebied
            value:
              operation: NOT
              value:
                operation: EQUALS
                subject: $vergunninggebied
                value: null
  - number: '3'
    text: >-
      FICTIEF, naar het model van artikel 8, achtste lid, van het
      Uitvoeringsbesluit Parkeren Delft 2025.

      1 Een bedrijf dat in de binnenstad is gevestigd, krijgt ten hoogste twee
      bedrijfsparkeervergunningen.

      2 Een bedrijf dat in de schil is gevestigd, krijgt er ten hoogste zoveel
      als het aantal personen dat volgens het handelsregister in het bedrijf
      werkzaam is.

      3 Het maximum is bereikt als het bedrijf op de dag van het besluit al
      zoveel geldige bedrijfsparkeervergunningen heeft.
    url: https://lokaleregelgeving.overheid.nl/CVDR733452
    machine_readable:
      # Vult het begrip van artikel 2, tweede en vierde lid, van de
      # verordening. Het Delftse model zegt bij de schil "gelijk aan het
      # aantal werknemers per bedrijf"; eigen keuze: dat aantal zoals het
      # handelsregister het vermeldt, zodat de Kamer van Koophandel ook hierop
      # antwoordt (artikel 4). Vermeldt het handelsregister geen aantal, dan
      # is het maximum in de schil nul.
      # Hoeveel geldige vergunningen het bedrijf al heeft, weet het college
      # uit zijn eigen besluiten; artikel 5 koppelt dat begrip aan het
      # antwoord van de cel van de gemeente. Welke vergunning geldt, zegt
      # artikel 3 van de verordening (een jaar vanaf de verlening) en de Awb
      # (een herroepen of vernietigd besluit geldt niet).
      open_terms:
        - id: aantal_werkzame_personen_volgens_handelsregister
          competent_authority:
            - name: Kamer van Koophandel
          type: number
          required: false
          decided_per_case_by: de Kamer van Koophandel, in het handelsregister
          description: >-
            Het aantal personen dat volgens het handelsregister op de dag van
            het besluit in het bedrijf werkzaam is.
        - id: aantal_geldige_bedrijfsparkeervergunningen
          type: number
          required: true
          decided_per_case_by: het college van burgemeester en wethouders van de gemeente Wilgendaal
          description: >-
            Hoeveel bedrijfsparkeervergunningen het college het bedrijf
            verleende die op de dag van het besluit nog geldig zijn.
      implements:
        - law: fictieve_parkeerverordening_gemeente_wilgendaal
          article: '2'
          open_term: maximum_bedrijfsparkeervergunningen_bereikt
      execution:
        parameters:
          - name: kvk_nummer
            type: string
            description: Het nummer dat de Kamer van Koophandel het bedrijf toekende.
          - name: besluit_datum
            type: date
            description: De dag waarop het college op de aanvraag besluit.
        input:
          - name: vergunninggebied
            type: string
            nullable: true
            source:
              regulation: fictief_uitvoeringsbesluit_parkeren_gemeente_wilgendaal
              output: vergunninggebied_van_vestiging
              parameters:
                kvk_nummer: $kvk_nummer
                besluit_datum: $besluit_datum
        output:
          - name: maximum_bedrijfsparkeervergunningen
            type: number
            description: Het maximum aantal bedrijfsparkeervergunningen voor dit bedrijf (lid 1 en 2).
          - name: maximum_bedrijfsparkeervergunningen_bereikt
            type: boolean
            description: Of het bedrijf al zoveel geldige bedrijfsparkeervergunningen heeft (lid 3).
        actions:
          - output: maximum_bedrijfsparkeervergunningen
            value:
              operation: IF
              cases:
                - when:
                    operation: EQUALS
                    subject: $vergunninggebied
                    value: binnenstad
                  then: 2
                - when:
                    operation: AND
                    conditions:
                      - operation: EQUALS
                        subject: $vergunninggebied
                        value: schil
                      - operation: NOT
                        value:
                          operation: EQUALS
                          subject: $aantal_werkzame_personen_volgens_handelsregister
                          value: null
                  then: $aantal_werkzame_personen_volgens_handelsregister
              default: 0
          - output: maximum_bedrijfsparkeervergunningen_bereikt
            value:
              operation: GREATER_THAN_OR_EQUAL
              subject: $aantal_geldige_bedrijfsparkeervergunningen
              value: $maximum_bedrijfsparkeervergunningen
  - number: '4'
    text: >-
      FICTIEF, eigen keuze in de modellering. Wat het handelsregister op de
      dag van het besluit vermeldt over het bezoekadres van de vestiging van
      het bedrijf en over het aantal personen dat in het bedrijf werkzaam is
      (artikel 2 en 3), ontleent het college aan het antwoord van de cel van
      de Kamer van Koophandel. Geeft die cel geen antwoord, dan blijkt het niet
      uit het handelsregister.
    url: https://lokaleregelgeving.overheid.nl/CVDR733452
    machine_readable:
      # De begrippen van artikel 2 en 3 noemen de Kamer van Koophandel als
      # bevoegde (competent_authority). Zwijgt haar cel, dan geeft deze
      # koppeling niets (null): wat niet in het handelsregister staat, blijkt
      # er niet uit. Daarom geen eigen begrip van het college, anders dan bij
      # artikel 5.
      implements:
        - law: fictief_uitvoeringsbesluit_parkeren_gemeente_wilgendaal
          article: '2'
          open_term: postcode_vestiging_volgens_handelsregister
        - law: fictief_uitvoeringsbesluit_parkeren_gemeente_wilgendaal
          article: '3'
          open_term: aantal_werkzame_personen_volgens_handelsregister
      execution:
        parameters:
          - name: kvk_nummer
            type: string
            description: Het nummer dat de Kamer van Koophandel het bedrijf toekende.
          - name: besluit_datum
            type: date
            description: De dag waarop het college op de aanvraag besluit.
        input:
          - name: antwoord_postcode
            type: string
            nullable: true
            source:
              reduction: postcode_vestiging
              parameters:
                kvk_nummer: $kvk_nummer
                peildatum: $besluit_datum
          - name: antwoord_aantal_werkzame_personen
            type: number
            nullable: true
            source:
              reduction: aantal_werkzame_personen
              parameters:
                kvk_nummer: $kvk_nummer
                peildatum: $besluit_datum
        output:
          - name: postcode_vestiging_volgens_handelsregister
            type: string
            nullable: true
          - name: aantal_werkzame_personen_volgens_handelsregister
            type: number
            nullable: true
        actions:
          - output: postcode_vestiging_volgens_handelsregister
            value: $antwoord_postcode
          - output: aantal_werkzame_personen_volgens_handelsregister
            value: $antwoord_aantal_werkzame_personen
  - number: '5'
    text: >-
      FICTIEF, eigen keuze in de modellering. Hoeveel geldige
      bedrijfsparkeervergunningen het bedrijf op de dag van het besluit heeft
      (artikel 3), ontleent het college aan het antwoord van zijn eigen cel
      over zijn eerdere besluiten. Geeft de cel geen antwoord, dan stelt het
      college het zelf vast.
    url: https://lokaleregelgeving.overheid.nl/CVDR733452
    machine_readable:
      # Zonder antwoord geldt wat het college vaststelt: een eigen open
      # begrip, dat de engine alleen vraagt als de cel zwijgt (zoals artikel 2
      # van het fictieve beleid gehandicaptenparkeerkaart van Wilgendaal).
      open_terms:
        - id: aantal_geldige_bedrijfsparkeervergunningen_volgens_college
          type: number
          required: true
          decided_per_case_by: het college van burgemeester en wethouders van de gemeente Wilgendaal
          description: >-
            Wat het college vaststelt over het aantal geldige
            bedrijfsparkeervergunningen van het bedrijf, als de cel geen
            antwoord geeft.
      implements:
        - law: fictief_uitvoeringsbesluit_parkeren_gemeente_wilgendaal
          article: '3'
          open_term: aantal_geldige_bedrijfsparkeervergunningen
      execution:
        parameters:
          - name: kvk_nummer
            type: string
            description: Het nummer dat de Kamer van Koophandel het bedrijf toekende.
          - name: besluit_datum
            type: date
            description: De dag waarop het college op de aanvraag besluit.
        input:
          - name: antwoord_aantal_geldig
            type: number
            nullable: true
            source:
              reduction: aantal_geldige_bedrijfsparkeervergunningen
              parameters:
                kvk_nummer: $kvk_nummer
                besluit_datum: $besluit_datum
        output:
          - name: aantal_geldige_bedrijfsparkeervergunningen
            type: number
            description: >-
              Hoeveel geldige bedrijfsparkeervergunningen het bedrijf heeft: het
              antwoord van de cel, of zonder dat wat het college vaststelt.
        actions:
          - output: aantal_geldige_bedrijfsparkeervergunningen
            value:
              operation: IF
              cases:
                - when:
                    operation: EQUALS
                    subject: $antwoord_aantal_geldig
                    value: null
                  then: $aantal_geldige_bedrijfsparkeervergunningen_volgens_college
              default: $antwoord_aantal_geldig
