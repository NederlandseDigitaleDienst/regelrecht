          type: string
        # Eerste lid, onder d.
        college:
          value: het college van burgemeester en wethouders van de gemeente Groningen
          type: string
      execution:
        produces:
          legal_character: INFORMATIEF
        parameters:
          - name: heeft_aanvraag_om_iit_ingediend
            type: boolean
            required: true
            description: Of de persoon een aanvraag om een individuele inkomenstoeslag heeft ingediend (onder e).
          - name: datum_aanvraag
            type: date
            required: true
            description: De datum van de aanvraag (onder f).
        output:
          - name: is_belanghebbende
            type: boolean
          - name: peildatum
            type: date
          - name: peiljaar_begin
            type: date
            description: De eerste dag van het peiljaar; het peiljaar loopt tot de peildatum.
          - name: referteperiode_begin
            type: date
            description: De eerste dag van de referteperiode; de referteperiode loopt tot de peildatum.
        actions:
          - output: is_belanghebbende
            value:
              operation: EQUALS
              subject: $heeft_aanvraag_om_iit_ingediend
              value: true
            legal_basis:
              law: Beleidsregels individuele inkomenstoeslag Participatiewet (Beleidsregels IIT)
              article: '1'
              paragraph: '1'
              explanation: >-
                Onder e: belanghebbende is wie een aanvraag indient. Wie ambtshalve een toeslag krijgt (artikel 5a),
                heeft geen aanvraag ingediend en is dus geen belanghebbende in de zin van deze beleidsregels (W8).
          - output: peildatum
            value: $datum_aanvraag
            legal_basis:
              law: Beleidsregels individuele inkomenstoeslag Participatiewet (Beleidsregels IIT)
              article: '1'
              paragraph: '1'
              explanation: >-
                Onder f: "datum van aanvraag". De verordening legt de peildatum bij het verzoek; dat is een tweede
                omschrijving van hetzelfde begrip (W11). Bij ambtshalve toekenning is er geen peildatum (W8).
          - output: peiljaar_begin
            value:
              operation: DATE_ADD
              date: $peildatum
              months: -12
            legal_basis:
              law: Beleidsregels individuele inkomenstoeslag Participatiewet (Beleidsregels IIT)
              article: '1'
              paragraph: '1'
              explanation: 'Onder g: "periode van twaalf maanden voorafgaand aan de peildatum".'
          - output: referteperiode_begin
            value:
              operation: DATE_ADD
              date: $peildatum
              years: -2
            legal_basis:
              law: Beleidsregels individuele inkomenstoeslag Participatiewet (Beleidsregels IIT)
              article: '1'
              paragraph: '1'
              explanation: 'Onder h: "periode van twee jaar voorafgaand aan de peildatum".'
  - number: '2'
    text: |-
      **Beoordeling**

      1. Het college moet in het individuele geval beoordelen of belanghebbende, naar het oordeel van het college, al dan
      niet uitzicht op inkomensverbetering heeft en recht heeft op een individuele inkomenstoeslag.

      2. Het college dient volgens artikel 36, tweede lid van de wet in ieder geval in de beoordeling mee te nemen:

         a. de krachten en bekwaamheden van belanghebbende; en

         b. de inspanningen die belanghebbende heeft verricht om tot inkomensverbetering te komen.

      3. Het college stelt het recht op individuele inkomenstoeslag vast met inachtneming van deze beleidsregels.
    url: https://lokaleregelgeving.overheid.nl/CVDR390767/3#artikel_2_Beoordeling
