  text: |-
    Burgemeester en wethouders van de gemeente Groningen;

    Gelet op artikel 4:81 van de Algemene wet bestuursrecht, artikel 36 van de Participatiewet en de Verordening individuele
    inkomenstoeslag Participatiewet 2015;

    overwegende dat het gewenst is beleidsregels vast te stellen betreffende het recht op individuele inkomenstoeslag als
    bedoeld in artikel 36 van de Participatiewet;

    BESLUITEN:

    vast te stellen de Beleidsregels individuele inkomenstoeslag Participatiewet (Beleidsregels IIT).
  url: https://lokaleregelgeving.overheid.nl/CVDR390767/3
articles:
  - number: '1'
    text: |-
      **Begripsbepalingen**

      1. In deze beleidsregels wordt verstaan onder:

         a. wet : Participatiewet;

         b. IOAW : Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers;

         c. IOAZ : Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen

         d. college : het college van burgemeester en wethouders van de gemeente Groningen;

         e. belanghebbende : een persoon die een aanvraag om een individuele inkomenstoeslag indient;

         f. peildatum : datum van aanvraag;

         g. peiljaar : periode van twaalf maanden voorafgaand aan de peildatum;

         h. referteperiode : periode van twee jaar voorafgaand aan de peildatum.

      2. Voor zover niet anders is bepaald, worden begrippen in deze beleidsregels gebruikt in dezelfde betekenis als in de
      wet.
    url: https://lokaleregelgeving.overheid.nl/CVDR390767/3#artikel_1_Begripsbepalingen
    machine_readable:
      markings:
        - about: de betekenis die de begrippen van de wet in deze beleidsregels hebben
          reason: >-
            Het tweede lid geeft elk begrip dat deze beleidsregels niet zelf omschrijven de betekenis die het in de
            Participatiewet heeft. Het model kent alleen een binding per begrip: een input met een source naar het
            artikel dat het begrip bepaalt. Een verklaring dat alle overige begrippen uit een andere regeling komen,
            heeft geen veld, dus elk artikel dat zo'n begrip gebruikt, moet het zelf binden of als gegeven vragen.
          resolution: model
          resolved_by: >-
            Een vorm waarin een regeling verklaart dat de begrippen van een andere regeling in haar bereik komen,
            waarna de binding per begrip uit die verklaring volgt in plaats van per artikel te worden geschreven.
          target: []
          legal_text_excerpt: >-
            Voor zover niet anders is bepaald, worden begrippen in deze beleidsregels gebruikt in dezelfde betekenis
            als in de wet.
          accepted: true
      definitions:
        # Eerste lid, onder a.
        wet:
          value: Participatiewet
          type: string
        # Eerste lid, onder b.
        ioaw:
          value: Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers
