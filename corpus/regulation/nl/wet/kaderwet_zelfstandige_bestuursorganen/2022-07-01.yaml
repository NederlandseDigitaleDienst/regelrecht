---
$schema: https://raw.githubusercontent.com/NederlandseDigitaleDienst/regelrecht/refs/tags/schema-v0.9.0/schema/v0.9.0/schema.json
$id: kaderwet_zelfstandige_bestuursorganen
regulatory_layer: WET
# De datum van de wet zelf (Wet van 2 november 2006).
publication_date: '2006-11-02'
valid_from: '2022-07-01'
bwb_id: BWBR0020495
url: https://wetten.overheid.nl/BWBR0020495/2022-07-01
name: Kaderwet zelfstandige bestuursorganen
# Alleen de artikelen die het voorbeeld van een hook op een organisatie
# nodig heeft.
articles:
  - number: '1'
    text: >-
      In deze wet wordt verstaan onder: a. zelfstandig bestuursorgaan: een bestuursorgaan van de centrale overheid dat bij
      de wet, krachtens de wet bij algemene maatregel van bestuur of krachtens de wet bij ministeriële regeling met
      openbaar gezag is bekleed, en dat niet hiërarchisch ondergeschikt is aan een minister; b. Onze Minister: Onze
      Minister wie het aangaat.
    url: https://wetten.overheid.nl/BWBR0020495/2022-07-01#Artikel1
    machine_readable:
      # Onderdeel a vestigt de soort van organisaties waarop deze wet
      # ingrijpt. Een organisatie claimt het lidmaatschap in de wet die haar
      # instelt (`organizations` met `member_of`).
      kinds:
        - id: zelfstandig_bestuursorgaan
          level: organization
          description: >-
            Een bestuursorgaan van de centrale overheid dat bij of krachtens de
            wet met openbaar gezag is bekleed en dat niet hiërarchisch
            ondergeschikt is aan een minister (onderdeel a).
  - number: '2'
    text: >-
      1. Deze wet is niet van toepassing op zelfstandige bestuursorganen die uitsluitend met openbaar gezag zijn bekleed
      voor zover zij bevoegd zijn besluiten te nemen op grond van de Wet open overheid.


      2. Op zelfstandige bestuursorganen die vóór het tijdstip van inwerkingtreding van deze wet zijn ingesteld, is deze
      wet van toepassing indien dit in de in artikel 1, onder a, bedoelde wet, algemene maatregel van bestuur of
      ministeriële regeling is bepaald.
    url: https://wetten.overheid.nl/BWBR0020495/2022-07-01#Artikel2
    # Niet gemodelleerd. Lid 1 is een uitsluiting door de hook-wet zelf, met
    # een soort als bereik, zoals Awb 1:6 (`excludes` met `kind`). Lid 2 maakt
    # het lidmaatschap van zbo's van vóór 2007 afhankelijk van hun
    # instellingsregeling: een opt-in, zoals Awir 1 lid 2.
  - number: '22'
    text: >-
      1. Onze Minister kan een besluit van een zelfstandig bestuursorgaan vernietigen.


      2. Van het vernietigingsbesluit wordt mededeling gedaan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0020495/2022-07-01#Artikel22
    machine_readable:
      # Lid 1: een hook op elk besluit dat een zelfstandig bestuursorgaan
      # neemt. De uitkomst is de bevoegdheid van de minister, niet een
      # vernietiging: of hij haar gebruikt, is een ander besluit. Lid 2 is
      # niet gemodelleerd.
      hooks:
        - hook_point: post_actions
          applies_to:
            kind: kaderwet_zelfstandige_bestuursorganen/zelfstandig_bestuursorgaan
      execution:
        output:
          - name: minister_kan_besluit_vernietigen
            type: boolean
            description: Of Onze Minister het besluit kan vernietigen (lid 1).
        actions:
          - output: minister_kan_besluit_vernietigen
            value: true
