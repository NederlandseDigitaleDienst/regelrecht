---
$schema: https://raw.githubusercontent.com/NederlandseDigitaleDienst/regelrecht/refs/tags/schema-v0.9.0/schema/v0.9.0/schema.json
$id: instellingswet_autoriteit_consument_en_markt
regulatory_layer: WET
# De datum van de wet zelf (Wet van 28 februari 2013).
publication_date: '2013-02-28'
valid_from: '2025-09-01'
bwb_id: BWBR0033043
url: https://wetten.overheid.nl/BWBR0033043/2025-09-01
name: Instellingswet Autoriteit Consument en Markt
# Alleen de artikelen die het voorbeeld van een hook op een organisatie
# nodig heeft.
articles:
  - number: '2'
    text: >-
      1. Er is een Autoriteit Consument en Markt.


      2. De Autoriteit Consument en Markt is belast met de taken die haar bij of krachtens de wet zijn opgedragen.


      3. De Autoriteit Consument en Markt heeft tevens tot taak om, binnen het kader van de in het tweede lid bedoelde
      taken, voorlichting te geven over de rechten en plichten van consumenten. Zij maakt daarbij gebruik van een
      informatieloket.


      4. Tot de taken van de Autoriteit Consument en Markt behoort het uit eigen beweging doen van marktonderzoeken en
      maken van rapportages, indien dat naar haar oordeel nuttig is voor de uitvoering van de taken, bedoeld in het
      tweede lid.


      5. De werkzaamheden van de Autoriteit Consument en Markt hebben tot doel het bevorderen van goed functionerende
      markten, van ordelijke en transparante marktprocessen en van een zorgvuldige behandeling van consumenten.
      Daaronder wordt verstaan het bewaken, bevorderen en beschermen van een effectieve mededinging en gelijke
      concurrentievoorwaarden op markten en het wegnemen van belemmeringen daarvoor.


      6. De toepassing van de Kaderwet zelfstandige bestuursorganen heeft mede betrekking op de taken die de Autoriteit
      Consument en Markt uitvoert in de openbare lichamen Bonaire, Sint Eustatius en Saba.
    url: https://wetten.overheid.nl/BWBR0033043/2025-09-01#Artikel2
    machine_readable:
      # Lid 1 stelt de organisatie in. Dat zij een zelfstandig bestuursorgaan
      # is, zegt de wet niet in die woorden: het volgt uit Kaderwet zbo art.
      # 1 onder a. Deze wet gaat er wel van uit: lid 6 breidt de toepassing
      # van de Kaderwet zbo uit tot de BES, en de artikelen 3, 4, 6 en 10
      # wijken van die wet af. Het lidmaatschap is dus afgeleid; het citaat
      # is lid 6, volledig. Een artikel met `competent_authority` "Autoriteit
      # Consument en Markt" handelt als deze organisatie.
      organizations:
        - id: autoriteit_consument_en_markt
          name: Autoriteit Consument en Markt
          member_of:
            - kind: kaderwet_zelfstandige_bestuursorganen/zelfstandig_bestuursorgaan
              legal_text_excerpt: >-
                De toepassing van de Kaderwet zelfstandige bestuursorganen
                heeft mede betrekking op de taken die de Autoriteit Consument
                en Markt uitvoert in de openbare lichamen Bonaire, Sint
                Eustatius en Saba.
  - number: '10'
    text: >-
      1. In afwijking van artikel 22, eerste lid, van de Kaderwet zelfstandige bestuursorganen kan Onze Minister of Onze
      Minister van Infrastructuur en Milieu een besluit van de Autoriteit Consument en Markt uitsluitend vernietigen
      indien het een besluit van algemene strekking betreft en de vernietiging geschiedt wegens onbevoegdheid van de
      Autoriteit Consument en Markt.


      2. Artikel 10:35 van de Algemene wet bestuursrecht is niet van toepassing.


      3. Onze Minister of Onze Minister van Infrastructuur en Milieu kan geen besluiten vernietigen op het gebied van
      energie, post, telecommunicatie en vervoer die de Autoriteit Consument en Markt neemt op grond van het bepaalde bij
      of krachtens een voor een specifieke marktsector geldende wet of op het gebied van mededinging. Artikel 22, eerste
      lid, van de Kaderwet zelfstandige bestuursorganen is op die besluiten niet van toepassing.


      4. Onze Minister of Onze Minister van Infrastructuur en Milieu zendt een afschrift van een besluit tot vernietiging
      aan de Tweede en de Eerste Kamer der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0033043/2025-09-01#Artikel10
    machine_readable:
      # Lid 3 sluit Kaderwet zbo artikel 22, eerste lid, uit voor de besluiten
      # die de ACM neemt op grond van een sectorwet (energie, post,
      # telecommunicatie, vervoer) of op het gebied van mededinging: een
      # uitsluiting met de organisatie als bereik en een voorwaarde. Lid 1 is
      # een afwijking, geen uitsluiting: voor de overige besluiten blijft de
      # bevoegdheid, maar alleen voor een besluit van algemene strekking. Dat
      # is een override; zij geldt alleen als de uitvoering bij deze wet
      # begint (RFC-007). Een besluit van de ACM op grond van een andere wet,
      # zoals de Mededingingswet, krijgt lid 3 wel (de uitsluiting reist mee
      # met het besluit) maar lid 1 niet: dan blijft de onbeperkte
      # bevoegdheid van art. 22 staan. Lid 1 noemt ook de grond
      # (onbevoegdheid); die hoort bij het vernietigingsbesluit en is niet
      # gemodelleerd. Lid 2 en 4 zijn niet gemodelleerd.
      excludes:
        - law: kaderwet_zelfstandige_bestuursorganen
          article: '22'
          kind: instellingswet_autoriteit_consument_en_markt/autoriteit_consument_en_markt
          when: besluit_op_gebied_van_sectorwet_of_mededinging
          legal_text_excerpt: >-
            Artikel 22, eerste lid, van de Kaderwet zelfstandige
            bestuursorganen is op die besluiten niet van toepassing.
      overrides:
        - law: kaderwet_zelfstandige_bestuursorganen
          article: '22'
          output: minister_kan_besluit_vernietigen
          legal_text_excerpt: >-
            uitsluitend vernietigen indien het een besluit van algemene
            strekking betreft
      definitions:
        # Lid 3: "op het gebied van energie, post, telecommunicatie en
        # vervoer". De codes zijn een eigen keuze.
        sectoren:
          value:
            - ENERGIE
            - POST
            - TELECOMMUNICATIE
            - VERVOER
      execution:
        parameters:
          - name: gebied_van_het_besluit
            type: string
            required: false
            nullable: true
            description: >-
              Het gebied waarop de ACM het besluit neemt: een van de sectoren
              van lid 3, MEDEDINGING, of een ander gebied. Eigen keuze: de wet
              noemt het gebied niet bij een code.
          - name: op_grond_van_sectorwet
            type: boolean
            required: false
            description: >-
              Of de ACM het besluit neemt op grond van het bepaalde bij of
              krachtens een voor een specifieke marktsector geldende wet (lid
              3).
          - name: besluit_van_algemene_strekking
            type: boolean
            required: false
            description: >-
              Of het besluit van algemene strekking is (lid 1). Een
              beschikking, zoals de boete van art. 12m, is dat nooit (Awb 1:3,
              tweede lid).
        output:
          - name: besluit_op_gebied_van_sectorwet_of_mededinging
            type: boolean
            description: Of het besluit valt onder lid 3.
          - name: minister_kan_besluit_vernietigen
            type: boolean
            description: >-
              Of Onze Minister het besluit kan vernietigen, in afwijking van
              Kaderwet zbo artikel 22, eerste lid (lid 1). Alleen de eerste
              voorwaarde van lid 1 is gemodelleerd; de vernietiging moet
              bovendien geschieden wegens onbevoegdheid van de ACM.
        actions:
          - output: besluit_op_gebied_van_sectorwet_of_mededinging
            value:
              operation: OR
              conditions:
                - operation: EQUALS
                  subject: $gebied_van_het_besluit
                  value: MEDEDINGING
                - operation: AND
                  conditions:
                    - operation: IN
                      subject: $gebied_van_het_besluit
                      value: $sectoren
                    - operation: EQUALS
                      subject: $op_grond_van_sectorwet
                      value: true
          - output: minister_kan_besluit_vernietigen
            value:
              operation: EQUALS
              subject: $besluit_van_algemene_strekking
              value: true
  - number: 12m
    text: >-
      1. De Autoriteit Consument en Markt kan aan de overtreder een bestuurlijke boete opleggen van ten hoogste € 900.000
      of, indien dat meer is, van ten hoogste 1% van de omzet van de marktorganisatie, indien deze een marktorganisatie
      is als bedoeld in artikel 1, onder 1°, dan wel, indien de overtreding door een marktorganisatie als bedoeld in
      artikel 1, onder 2°, is begaan van de gezamenlijke omzet van de aangesloten marktorganisaties, in geval van: a.
      overtreding van artikel 6b, eerste en tweede lid, b. overtreding van een zelfstandige last, c. overtreding van
      artikel 5:20, eerste lid, van de Algemene wet bestuursrecht, of d. verbreking, opheffing of beschadiging van een
      verzegeling als bedoeld in artikel 12b, eerste lid, het op andere wijze verijdelen van de door die verzegeling
      beoogde afsluiting of van het door de marktorganisatie achterwege laten van voldoende maatregelen om verijdeling
      van de door de verzegeling beoogde afsluiting van door haar gebruikte bedrijfsruimten of voorwerpen te voorkomen.


      2. De Autoriteit Consument en Markt kan in geval van overtreding van artikel 12h, vijfde lid, de overtreder een
      bestuurlijke boete opleggen van ten hoogste € 900.000, of indien dat meer is, van ten hoogste 10% van de omzet van
      de marktorganisatie, als bedoeld in artikel 1, onder 1°, dan wel, indien de overtreding door een marktorganisatie
      als bedoeld in artikel 1, onder 2°, is begaan, van de gezamenlijke omzet van de aangesloten marktorganisaties.


      3. Ingeval van een overtreding als bedoeld in het eerste lid, onderdeel a of b kan de Autoriteit Consument en Markt
      een last onder dwangsom opleggen.


      4. Artikel 184 van het Wetboek van Strafrecht is niet van toepassing op de in het eerste lid, onderdeel c, bedoelde
      overtreding en artikel 199 van het Wetboek van Strafrecht is niet van toepassing op de in het eerste lid,
      onderdeel d, bedoelde overtreding.


      5. De bestuurlijke boete die ingevolge het eerste of tweede lid ten hoogste kan worden opgelegd wordt verhoogd met
      100%, indien binnen een tijdvak van vijf jaar voorafgaand aan de dagtekening van het van de overtreding opgemaakte
      rapport, bedoeld in artikel 5:48, eerste lid, van de Algemene wet bestuursrecht, een aan die overtreder voor een
      eerdere overtreding van eenzelfde of een soortgelijk wettelijk voorschrift opgelegde bestuurlijke boete
      onherroepelijk is geworden.
    url: https://wetten.overheid.nl/BWBR0033043/2025-09-01#Artikel12m
    machine_readable:
      # Lid 1: de ACM kan een bestuurlijke boete opleggen, bij beschikking. De
      # ACM is het bevoegde orgaan, en daarmee haakt de Kaderwet zbo in.
      # Alleen de vraag of een boete kan worden opgelegd (lid 1, onderdelen a
      # tot en met d) is gemodelleerd, niet de hoogte (lid 1, 2 en 5) en niet
      # lid 3 en 4.
      competent_authority:
        name: Autoriteit Consument en Markt
      definitions:
        # Lid 1, onderdelen a tot en met d. De codes zijn een eigen keuze.
        beboetbare_overtredingen:
          value:
            - ARTIKEL_6B
            - ZELFSTANDIGE_LAST
            - AWB_5_20
            - VERZEGELING
      execution:
        produces:
          - type: algemene_wet_bestuursrecht/beschikking
        parameters:
          - name: overtreding
            type: string
            required: true
            description: >-
              Welke overtreding de ACM vaststelt, als een van de onderdelen a
              tot en met d van lid 1, of een andere.
        output:
          - name: bestuurlijke_boete_kan_worden_opgelegd
            type: boolean
        actions:
          - output: bestuurlijke_boete_kan_worden_opgelegd
            value:
              operation: IN
              subject: $overtreding
              value: $beboetbare_overtredingen
