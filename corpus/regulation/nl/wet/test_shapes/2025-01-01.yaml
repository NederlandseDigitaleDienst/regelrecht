---
$schema: https://raw.githubusercontent.com/NederlandseDigitaleDienst/regelrecht/refs/tags/schema-v0.8.23/schema/v0.8.23/schema.json
$id: test_shapes
name: Testwet vormen
regulatory_layer: WET
bwb_id: BWBR9999925
publication_date: '2025-01-01'
valid_from: '2025-01-01'
url: https://example.com/test_shapes

articles:
  - number: '1'
    url: https://example.com/test_shapes/1
    text: >-
      Als beperkingengebied wordt aangewezen de strook die op de bij deze wet
      behorende kaart is aangegeven.
    machine_readable:
      # De aanwijzing is een uitvoer van type shape (schema v0.8.23): de strook
      # staat als WKT in de actie. De coördinaten zijn verzonnen en volgen de
      # vorm van het Rijksdriehoeksstelsel; de strook is 3000 bij 50.
      execution:
        output:
          - name: beperkingengebied
            type: shape
        actions:
          - output: beperkingengebied
            value: POLYGON((154000 463600, 157000 463600, 157000 463650, 154000 463650, 154000 463600))

  - number: '2'
    url: https://example.com/test_shapes/2
    text: >-
      Een locatie ligt in het beperkingengebied indien zij het gebied, bedoeld
      in artikel 1, overlapt.
    machine_readable:
      # OVERLAPS is waar als de binnenkanten elkaar raken (DE-9IM T********):
      # een gedeelde rand of een punt op de rand telt niet.
      execution:
        parameters:
          - name: location
            type: shape
            required: true
            description: De locatie van de activiteit, als WKT.
        input:
          - name: beperkingengebied
            type: shape
            source:
              output: beperkingengebied
        output:
          - name: ligt_in_beperkingengebied
            type: boolean
        actions:
          - output: ligt_in_beperkingengebied
            value:
              operation: OVERLAPS
              subject: $location
              value: $beperkingengebied

  - number: '3'
    url: https://example.com/test_shapes/3
    text: >-
      Een aanvraag raakt het beperkingengebied indien ten minste een van de
      percelen waarop zij ziet, het gebied, bedoeld in artikel 1, overlapt.
    machine_readable:
      # Een rij is ongetypeerd, dus geen declaratie houdt een perceel zonder
      # vorm tegen aan de grens; OVERLAPS zelf doet dat (RFC-036).
      execution:
        parameters:
          - name: percelen
            type: array
            required: true
            description: De percelen van de aanvraag, elk met een vorm.
        input:
          - name: beperkingengebied
            type: shape
            source:
              output: beperkingengebied
        output:
          - name: raakt_beperkingengebied
            type: boolean
        actions:
          - output: raakt_beperkingengebied
            value:
              operation: FOREACH
              collection: $percelen
              as: perceel
              body:
                operation: OVERLAPS
                subject: $perceel.vorm
                value: $beperkingengebied
              combine: OR
