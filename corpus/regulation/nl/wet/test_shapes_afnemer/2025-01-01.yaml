---
$schema: https://raw.githubusercontent.com/NederlandseDigitaleDienst/regelrecht/refs/tags/schema-v0.8.23/schema/v0.8.23/schema.json
$id: test_shapes_afnemer
name: Testwet vormen afnemer
regulatory_layer: WET
bwb_id: BWBR9999926
publication_date: '2025-01-01'
valid_from: '2025-01-01'
url: https://example.com/test_shapes_afnemer

articles:
  - number: '1'
    url: https://example.com/test_shapes_afnemer/1
    text: >-
      Het is verboden zonder vergunning een activiteit te verrichten op een
      locatie in het beperkingengebied, bedoeld in artikel 1 van de Testwet
      vormen.
    machine_readable:
      # Deze wet wijst zelf geen gebied aan: zij leest het gebied dat de
      # Testwet vormen aanwijst en toetst haar eigen locatie daaraan.
      execution:
        parameters:
          - name: location
            type: shape
            required: true
            description: De locatie van de activiteit, als WKT.
        input:
          - name: beperkingengebied
            type: shape
            source:
              regulation: test_shapes
              output: beperkingengebied
        output:
          - name: vergunningplichtig
            type: boolean
        actions:
          - output: vergunningplichtig
            value:
              operation: OVERLAPS
              subject: $location
              value: $beperkingengebied
