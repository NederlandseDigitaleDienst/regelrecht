          - name: rij
            type: object
            source: {}
        output:
          - name: naar_boven
            type: number
        actions:
          - output: naar_boven
            value:
              operation: CEIL
              value: $rij.a
              precision: 0
  - number: '19'
    url: https://example.com/test_signaturen/19
    text: >-
      Het naar beneden afgeronde is het eerste, naar beneden afgerond op een geheel getal.
