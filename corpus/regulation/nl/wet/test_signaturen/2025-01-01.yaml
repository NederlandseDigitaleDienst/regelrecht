              value: $rij.b
  - number: '21'
    url: https://example.com/test_signaturen/21
    text: >-
      Het eerste is groter of gelijk indien het niet minder is dan het tweede.
    machine_readable:
      execution:
        parameters:
          - name: bsn
            type: string
            required: true
        input:
          - name: rij
            type: object
            source: {}
        output:
          - name: groter_of_gelijk
            type: boolean
        actions:
          - output: groter_of_gelijk
