      execution:
        parameters:
          - name: bsn
            type: string
            required: true
        input:
          - name: rij
            type: object
            source: {}
        output:
          - name: naar_beneden
            type: number
        actions:
          - output: naar_beneden
            value:
              operation: FLOOR
              value: $rij.a
              precision: 0
  - number: '20'
    url: https://example.com/test_signaturen/20
    text: >-
      Het eerste is kleiner indien het minder is dan het tweede.
    machine_readable:
      execution:
        parameters:
          - name: bsn
            type: string
            required: true
        input:
          - name: rij
            type: object
            source: {}
        output:
          - name: kleiner
            type: boolean
        actions:
          - output: kleiner
            value:
              operation: LESS_THAN
