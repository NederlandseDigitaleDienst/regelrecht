---
$schema: https://raw.githubusercontent.com/NederlandseDigitaleDienst/regelrecht/refs/tags/schema-v0.8.22/schema/v0.8.22/schema.json
$id: test_signaturen
name: Testwet signaturen
regulatory_layer: WET
bwb_id: BWBR9999922
publication_date: '2025-01-01'
valid_from: '2025-01-01'
url: https://example.com/test_signaturen

# Synthetische wet voor de conformance-suite van RFC-055: elke operatie heeft
# een gesloten lijst signaturen, en operanden die bij geen signatuur passen zijn
# een fout.
#
# Elke bewerking staat in een eigen artikel, omdat een bewerking die faalt het
# hele artikel laat falen. De operanden komen uit de velden van een record:
# daarvan kent de typecontrole het type niet, zodat de scenario's bepalen welk
# type de engine bereikt en de engine zelf moet weigeren wat niet past.

articles:
  - number: '1'
    url: https://example.com/test_signaturen/1
    text: >-
      De som is het eerste vermeerderd met het tweede.
    machine_readable:
      execution:
        parameters:
          - name: bsn
            type: string
            required: true
        input:
          - name: rij
            type: object
            source: {}
        output:
          - name: som
            type: number
        actions:
          - output: som
            value:
              operation: ADD
              values:
                - $rij.a
                - $rij.b
  - number: '2'
    url: https://example.com/test_signaturen/2
    text: >-
      De tekst is het eerste gevolgd door het tweede.
