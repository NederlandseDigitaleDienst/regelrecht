---
$schema: >-
  https://raw.githubusercontent.com/MinBZK/regelrecht/refs/tags/schema-v0.5.6/schema/v0.5.6/schema.json
$id: test_value_typing
name: Testwet waardetypering
regulatory_layer: WET
bwb_id: BWBR9999904
publication_date: '2023-01-01'
valid_from: '2023-01-01'
url: https://example.com/test_value_typing

articles:
  - number: '1'
    url: https://example.com/test_value_typing/1
    text: >-
      De tekst is tweeënveertig indien zij gelijk is aan "42", het getal indien
      het gelijk is aan 42, de vlag staat indien zij waar is, en twee staat in de lijst indien de
      lijst haar bevat.
    machine_readable:
      execution:
        parameters:
          - name: tekst
            type: string
            required: false
          - name: getal
            type: number
            required: false
          - name: vlag
            type: boolean
            required: false
          - name: lijst
            type: array
            required: false
        output:
          - name: tekst_is_42
            type: boolean
          - name: getal_is_42
            type: boolean
          - name: vlag_staat
            type: boolean
          - name: twee_in_lijst
            type: boolean
        actions:
          # Elke uitkomst leest één parameter, zodat een scenario alleen de
          # parameter hoeft te geven waar het over gaat.
          - output: tekst_is_42
            value:
              operation: EQUALS
              subject: $tekst
              value: '42'
          - output: getal_is_42
            value:
              operation: EQUALS
              subject: $getal
              value: 42
          - output: vlag_staat
            value:
              operation: EQUALS
              subject: $vlag
              value: true
          - output: twee_in_lijst
            value:
              operation: IN
              subject: 2
              value: $lijst
