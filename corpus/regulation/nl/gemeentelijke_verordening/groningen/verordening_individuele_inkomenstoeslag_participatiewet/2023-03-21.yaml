  - number: '4'
    text: |-
      **Hoogte individuele inkomenstoeslag**

      1. De individuele inkomenstoeslag bedraagt per kalenderjaar:

         a. voor een alleenstaande: 27,18 procent van de gehuwdennorm als bedoeld in artikel 21 onderdeel b van de wet zoals
         die op 1 januari van elk kalenderjaar geldt;

         b. voor een alleenstaande ouder: 34,81 procent van de gehuwdennorm als bedoeld in artikel 21 onderdeel b van de wet
         zoals die op 1 januari van elk kalenderjaar geldt;

         c. voor gehuwden: 38,78 procent van de gehuwdennorm als bedoeld in artikel 21 onderdeel b van de wet zoals die op 1
         januari van elk kalenderjaar geldt.

      2. Als één van de gehuwden is uitgesloten van het recht op individuele inkomenstoeslag ingevolge de artikelen 11 of 13,
      eerste lid, van de wet, komt de rechthebbende echtgenoot in aanmerking voor een individuele inkomenstoeslag naar de
      hoogte die voor hem als alleenstaande of alleenstaande ouder zou gelden.

      3. Voor toepassing van het eerste en tweede lid is de situatie op de peildatum bepalend.

      4. De bedragen genoemd in het eerste lid worden naar boven afgerond op hele euro’s.
    url: https://lokaleregelgeving.overheid.nl/CVDR367471/3#artikel_4_Hoogte_individuele_inkomenstoeslag
    machine_readable:
      implements:
        - law: participatiewet
          article: '8'
          open_term: hoogte_individuele_inkomenstoeslag
          gelet_op: Gelet op artikel 8, eerste lid, aanhef en onderdeel b, en tweede lid, van de Participatiewet
      markings:
        - about: de gehuwdennorm zoals die op 1 januari van elk kalenderjaar geldt
          reason: >-
            De binding leest artikel 21 van de Participatiewet op de rekendatum van de uitvoering. De verordening vraagt
            de norm zoals die op 1 januari van het kalenderjaar gold. De norm wijzigt op 1 januari en op 1 juli, dus
            een uitvoering met een rekendatum na 30 juni leest de norm van 1 juli. Een binding heeft geen veld voor
            een andere dag dan de rekendatum.
          resolution: model
          resolved_by: >-
            Een veld op een binding dat de dag noemt waarop de bron wordt gelezen, hier 1 januari van het kalenderjaar.
            Welk kalenderjaar dat is (van de peildatum of van het besluit), zegt de tekst niet (vraag U11).
          target: []
          legal_text_excerpt: >-
            de gehuwdennorm als bedoeld in artikel 21 onderdeel b van de wet zoals die op 1 januari van elk kalenderjaar
            geldt
          accepted: true
      definitions:
        # Eerste lid, onder a: "27,18 procent van de gehuwdennorm"
        percentage_alleenstaande:
          value: 27.18
          type: number
          type_spec:
            unit: percentage
        # Eerste lid, onder b: "34,81 procent van de gehuwdennorm"
        percentage_alleenstaande_ouder:
          value: 34.81
          type: number
          type_spec:
            unit: percentage
        # Eerste lid, onder c: "38,78 procent van de gehuwdennorm"
        percentage_gehuwden:
          value: 38.78
          type: number
          type_spec:
            unit: percentage
      execution:
        produces:
          legal_character: WAARDEBEPALING
        parameters:
          - name: leefvorm_op_peildatum
            type: string
            required: true
            description: >-
              "alleenstaande", "alleenstaande ouder" of "gehuwden", in de betekenis van de Participatiewet (artikel 1,
              tweede lid, van deze verordening), op de peildatum (derde lid).
          - name: echtgenoot_uitgesloten_ingevolge_artikel_11_of_13
            type: boolean
            required: false
            description: >-
              Bij gehuwden: of één van de echtgenoten is uitgesloten van het recht op individuele inkomenstoeslag
              ingevolge artikel 11 of artikel 13, eerste lid, van de wet, op de peildatum (tweede en derde lid).
          - name: rechthebbende_echtgenoot_zou_alleenstaande_ouder_zijn
            type: boolean
            required: false
            description: >-
              Bij het tweede lid: of voor de rechthebbende echtgenoot de hoogte van een alleenstaande ouder zou gelden,
              en niet die van een alleenstaande.
        input:
          - name: gehuwdennorm
            type: amount
            type_spec:
              unit: eurocent
            source:
              regulation: participatiewet
              output: norm_gehuwden_artikel_21
            description: De norm van artikel 21, onderdeel b, van de wet, per kalendermaand. Zie de markering.
        output:
          - name: toepasselijk_percentage
            type: number
            nullable: true
            type_spec:
              unit: percentage
          - name: hoogte_individuele_inkomenstoeslag
            type: amount
            nullable: true
            type_spec:
              unit: eurocent
            description: De individuele inkomenstoeslag per kalenderjaar, naar boven afgerond op hele euro's.
        actions:
          - output: toepasselijk_percentage
            value:
              operation: IF
              cases:
                - when:
                    operation: EQUALS
                    subject: $leefvorm_op_peildatum
                    value: alleenstaande
                  then: $percentage_alleenstaande
                - when:
                    operation: EQUALS
                    subject: $leefvorm_op_peildatum
                    value: alleenstaande ouder
                  then: $percentage_alleenstaande_ouder
                - when:
                    operation: AND
                    conditions:
                      - operation: EQUALS
                        subject: $leefvorm_op_peildatum
                        value: gehuwden
                      - operation: EQUALS
                        subject: $echtgenoot_uitgesloten_ingevolge_artikel_11_of_13
                        value: true
                      - operation: EQUALS
                        subject: $rechthebbende_echtgenoot_zou_alleenstaande_ouder_zijn
                        value: true
                  then: $percentage_alleenstaande_ouder
                - when:
                    operation: AND
                    conditions:
                      - operation: EQUALS
                        subject: $leefvorm_op_peildatum
                        value: gehuwden
                      - operation: EQUALS
                        subject: $echtgenoot_uitgesloten_ingevolge_artikel_11_of_13
                        value: true
                  then: $percentage_alleenstaande
                - when:
                    operation: EQUALS
                    subject: $leefvorm_op_peildatum
                    value: gehuwden
                  then: $percentage_gehuwden
              default: null
            legal_basis:
              law: Verordening individuele inkomenstoeslag Participatiewet 2015
              article: '4'
              explanation: >-
                Eerste lid, onder a tot en met c: het percentage hangt af van de leefvorm. Tweede lid: is één van de
                gehuwden uitgesloten ingevolge artikel 11 of 13, eerste lid, van de wet, dan geldt voor de
                rechthebbende echtgenoot de hoogte van een alleenstaande of alleenstaande ouder. Derde lid: de situatie
                op de peildatum is bepalend; de parameters zijn op die dag vastgesteld. Een andere leefvorm geeft
                geen bedrag.
          - output: hoogte_individuele_inkomenstoeslag
            value:
              operation: IF
              cases:
                - when:
                    operation: EQUALS
                    subject: $toepasselijk_percentage
                    value: null
                  then: null
              default:
                operation: CEIL
                value:
                  operation: MULTIPLY
                  values:
                    - $gehuwdennorm
                    - operation: DIVIDE
                      values:
                        - $toepasselijk_percentage
                        - 100
                precision: -2
            legal_basis:
              law: Verordening individuele inkomenstoeslag Participatiewet 2015
              article: '4'
              paragraph: '4'
              explanation: >-
                Eerste lid: het percentage van de gehuwdennorm. Vierde lid: "naar boven afgerond op hele euro's", op een
                bedrag in eurocent dus naar boven op honderdtallen.
  - number: '5'
    text: |-
      **Onvoorzien en nadere regels**

      1. In gevallen waarin deze verordening niet voorziet, beslist het college.

      2. Het college kan nadere regels stellen over de uitvoering van deze verordening.
