            legal_basis:
              law: Verordening individuele inkomenstoeslag Participatiewet 2015
              article: 3a
              explanation: >-
                Eerste lid: één aaneengesloten termijn van ten hoogste drie maanden met een hoger inkomen, in elk van
                die maanden niet meer dan honderdveertig procent van de norm (onder a), direct na ten minste twee jaar
                onafgebroken laag inkomen in de zin van artikel 3 (onder b). Die twee jaar kunnen vóór de referteperiode
                beginnen. Tweede lid: eenmalig. Of "eenmalig" per persoon voor altijd geldt en of "kan" een keuze van
                het college is, zegt de tekst niet (vraag U10); het model leest "kan" als het gevolg dat de tekst
                beschrijft, niet als een bevoegdheid, omdat de zin geen bestuursorgaan noemt.
