                              date: $begin_onderbreking
                              years:
                                operation: MULTIPLY
                                values:
                                  - $duur_laag_inkomen_voor_onderbreking
                                  - -1
                          - operation: LESS_THAN
                            subject: $maand.maand
                            value: $begin_onderbreking
                      body: 1
                      combine: ADD
                    value:
                      operation: DATE_DIFF
                      from:
                        operation: DATE_ADD
                        date: $begin_onderbreking
                        years:
                          operation: MULTIPLY
                          values:
