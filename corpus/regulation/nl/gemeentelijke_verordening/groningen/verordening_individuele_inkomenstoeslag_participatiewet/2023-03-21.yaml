                            - -1
                      to: $begin_onderbreking
                      in: months
                  - operation: FOREACH
                    collection: $inkomen_per_maand
                    as: maand
                    filter:
                      operation: AND
                      conditions:
                        - operation: GREATER_THAN_OR_EQUAL
                          subject: $maand.maand
                          value:
                            operation: DATE_ADD
                            date: $begin_onderbreking
                            years:
                              operation: MULTIPLY
                              values:
                                - $duur_laag_inkomen_voor_onderbreking
                                - -1
                        - operation: LESS_THAN
                          subject: $maand.maand
