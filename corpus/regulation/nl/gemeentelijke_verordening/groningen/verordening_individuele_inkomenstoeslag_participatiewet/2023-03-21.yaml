            type: string
            nullable: true
        actions:
          - output: beslissing_in_onvoorzien_geval
            value: $beslissing_college_in_onvoorzien_geval
            legal_basis:
              law: Verordening individuele inkomenstoeslag Participatiewet 2015
              article: '5'
