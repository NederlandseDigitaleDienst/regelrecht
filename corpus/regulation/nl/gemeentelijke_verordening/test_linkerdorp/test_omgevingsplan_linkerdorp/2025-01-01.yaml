$id: test_omgevingsplan_linkerdorp
name: Testomgevingsplan Linkerdorp
regulatory_layer: GEMEENTELIJKE_VERORDENING
publication_date: '2025-01-01'
valid_from: '2025-01-01'
gemeente_code: GM9901
officiele_titel: Omgevingsplan gemeente Linkerdorp
url: https://example.com/test_omgevingsplan_linkerdorp

# A fictional municipality. Its territory is not in this file: the caller
# gives it to the engine under the code GM9901.

articles:
  - number: '1'
    url: https://example.com/test_omgevingsplan_linkerdorp/1
    text: >-
      Het is verboden zonder omgevingsvergunning een bouwwerk te bouwen.
    machine_readable:
      # Two articles of this plan fill the same term: this article forbids
      # building, article 2 felling. About any other activity the article
      # says nothing, and that is null: not a "no", but silence.
      implements:
        - law: test_location_terms
          article: '1'
          open_term: verboden_in_omgevingsplan
          gelet_op: Gelet op artikel 1 van de Testwet plaatsgebonden termen
      execution:
        parameters:
          - name: activiteit
            type: string
            required: true
        output:
          - name: verboden_in_omgevingsplan
            type: boolean
            nullable: true
        actions:
          - output: verboden_in_omgevingsplan
            value:
              operation: IF
              cases:
                - when:
                    operation: EQUALS
                    subject: $activiteit
                    value: bouwen
                  then: true
              default: null

  - number: '2'
    url: https://example.com/test_omgevingsplan_linkerdorp/2
    text: >-
      Het is verboden zonder omgevingsvergunning een houtopstand te vellen.
    machine_readable:
      implements:
        - law: test_location_terms
          article: '1'
          open_term: verboden_in_omgevingsplan
          gelet_op: Gelet op artikel 1 van de Testwet plaatsgebonden termen
      execution:
        parameters:
          - name: activiteit
            type: string
            required: true
        output:
          - name: verboden_in_omgevingsplan
            type: boolean
            nullable: true
        actions:
          - output: verboden_in_omgevingsplan
            value:
              operation: IF
              cases:
                - when:
                    operation: EQUALS
                    subject: $activiteit
                    value: kappen
                  then: true
              default: null

  - number: '3'
    url: https://example.com/test_omgevingsplan_linkerdorp/3
    text: >-
      De bouwhoogte van een bouwwerk bedraagt ten hoogste 9 meter.
    machine_readable:
      implements:
        - law: test_location_terms
          article: '3'
