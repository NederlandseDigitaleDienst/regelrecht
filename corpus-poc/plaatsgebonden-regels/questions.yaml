---
# Not law. A question is something a person asks; the law does not contain it.
# This file says, per question, which outcomes of which law answer it, so that
# nothing about the question has to be hidden in a rulework.
#
# The answer to "may I do this here?" is "only with a permit" when one of the
# bans below holds, and "without a permit" when none does. That is not a rule
# about which article wins: each ban stands on its own, so one is enough.
#
# "without a permit" means that none of the bans listed here holds. The law
# has more bans than these; `not_covered` names them, so the answer cannot be
# read as wider than it is.

may_i_do_this_here:
  law: omgevingswet
  bans:
    - article: '5.1'
      output: vergunningplicht_omgevingsplanactiviteit
      # Reported with the answer when it holds: a permit that departs from
      # the plan is judged by other rules than one within it.
      also_report:
        - article: Bijlage onder A
          output: buitenplanse_omgevingsplanactiviteit
    - article: '5.3'
      output: vergunningplicht_waterschapsverordening
  not_covered:
    - article 5.1 lid 1 under b to g
    - article 5.1 lid 2, among them the technical bouwactiviteit
    - article 5.4 (omgevingsverordening)
