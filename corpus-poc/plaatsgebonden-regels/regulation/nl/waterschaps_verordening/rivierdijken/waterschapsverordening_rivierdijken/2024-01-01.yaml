---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/tags/schema-v0.8.22/schema/v0.8.22/schema.json
$id: waterschapsverordening_rivierdijken
regulatory_layer: WATERSCHAPS_VERORDENING
publication_date: '2024-01-01'
valid_from: '2024-01-01'
waterschap_code: WS9990
officiele_titel: Waterschapsverordening waterschap Rivierdijken
url: https://example.org/waterschapsverordening-rivierdijken

# FICTIONAL. Waterschap Rivierdijken does not exist; the text is written for
# this example.
#
# PROPOSED, not in the schema: `areas` and `applies_in`.
#
# This rulework names the area ON the article with `applies_in`: outside the
# area the article does not exist, and its logic knows nothing of places. The
# omgevingsplan next to it uses the area inside the logic. Both ways are here
# on purpose, to compare them.

areas:
  beperkingengebied_waterkering:
    geometry: areas/beperkingengebied_waterkering.geojson

articles:
  - number: '3.1'
    applies_in: beperkingengebied_waterkering
    text: |
      Het is verboden zonder omgevingsvergunning een bouwwerk te bouwen in het
      beperkingengebied waterkering.
    url: https://example.org/waterschapsverordening-rivierdijken#artikel3.1

    machine_readable:
      implements:
        - law: omgevingswet
          article: '5.3'
          open_term: waterschapsverordening_verbiedt_zonder_vergunning
          gelet_op: Gelet op artikel 5.3 van de Omgevingswet
      execution:
        parameters:
          - name: activiteit
            type: string
            required: true
            description: What the applicant wants to do
        output:
          - name: waterschapsverordening_verbiedt_zonder_vergunning
            type: boolean
            description: Whether this article forbids the activity without a permit
        actions:
          - output: waterschapsverordening_verbiedt_zonder_vergunning
            value:
              operation: IN
              subject: $activiteit
              values:
                - hoofdgebouw_bouwen
                - bijbehorend_bouwwerk_bouwen
