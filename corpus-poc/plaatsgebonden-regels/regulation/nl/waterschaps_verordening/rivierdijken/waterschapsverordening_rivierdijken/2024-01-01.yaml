---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/tags/schema-v0.8.22/schema/v0.8.22/schema.json
$id: waterschapsverordening_rivierdijken
regulatory_layer: WATERSCHAPS_VERORDENING
publication_date: '2024-01-01'
valid_from: '2024-01-01'
waterschap_code: WS9990
officiele_titel: Waterschapsverordening waterschap Rivierdijken
url: https://example.org/waterschapsverordening-rivierdijken

# FICTIONAL. Waterschap Rivierdijken does not exist; the text is written for
# this example.
#
# PROPOSED, not in the schema: the value type `shape` and the operation
# OVERLAPS. Nothing else is new.
#
# An area is the output of the article that designates it. Its value is a
# reference to the geometry adopted with this version of the rulework; the
# coordinates are never in the YAML. A geometry file is never edited: a
# changed boundary is a new file, named in a new version of the rulework.

articles:
  - number: '1.2'
    text: |
      Als beperkingengebied waterkering wordt aangewezen het gebied dat als
      zodanig is aangegeven in bijlage 1.
    url: https://example.org/waterschapsverordening-rivierdijken#artikel1.2

    machine_readable:
      execution:
        output:
          - name: beperkingengebied_waterkering
            type: shape
            description: The area designated as beperkingengebied waterkering
        actions:
          - output: beperkingengebied_waterkering
            value: areas/beperkingengebied_waterkering-2024-01-01.geojson

  - number: '3.1'
    text: |
      Het is verboden zonder omgevingsvergunning een bouwwerk te bouwen in het
      beperkingengebied waterkering.
    url: https://example.org/waterschapsverordening-rivierdijken#artikel3.1

    machine_readable:
      implements:
        - law: omgevingswet
          article: '5.3'
          open_term: waterschapsverordening_verbiedt_zonder_vergunning
          gelet_op: Gelet op artikel 5.3 van de Omgevingswet
      execution:
        parameters:
          - name: activiteit
            type: string
            required: true
            description: What the applicant wants to do
          - name: location
            type: shape
            required: true
            description: Where the applicant wants to do it
        input:
          - name: beperkingengebied_waterkering
            type: shape
            description: The area designated in article 1.2
            source:
              output: beperkingengebied_waterkering
        output:
          # Absent when the article does not speak about the case: it then
          # forbids nothing, and the default of the open term holds.
          - name: waterschapsverordening_verbiedt_zonder_vergunning
            type: boolean
            nullable: true
            description: Whether this article forbids the activity without a permit
        actions:
          - output: waterschapsverordening_verbiedt_zonder_vergunning
            value:
              operation: IF
              cases:
                - when:
                    operation: AND
                    conditions:
                      - operation: IN
                        subject: $activiteit
                        values:
                          - hoofdgebouw_bouwen
                          - bijbehorend_bouwwerk_bouwen
                      - operation: OVERLAPS
                        subject: $location
                        value: $beperkingengebied_waterkering
                  then: true
