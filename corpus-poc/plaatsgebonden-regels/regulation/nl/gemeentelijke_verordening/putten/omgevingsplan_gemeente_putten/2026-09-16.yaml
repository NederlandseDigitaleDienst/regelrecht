  - number: '22.28'
    text: |
      Inperkingen artikel 22.27 vanwege cultureel erfgoed

      1. Op een activiteit die wordt verricht in, aan of op een gemeentelijk
      monument, voorbeschermd gemeentelijk monument, provinciaal monument,
      voorbeschermd provinciaal monument, rijksmonument of voorbeschermd
      rijksmonument is Artikel 22.27 niet van toepassing.

      2. Op een activiteit die wordt verricht bij een gemeentelijk monument,
      voorbeschermd gemeentelijk monument, provinciaal monument, voorbeschermd
      provinciaal monument, rijksmonument of voorbeschermd rijksmonument is
      alleen Artikel 22.27, aanhef en onder d tot en met i, van toepassing.

      3. Op een activiteit die wordt verricht op een locatie waaraan in dit
      omgevingsplan de functie-aanduiding rijksbeschermd stads- of dorpsgezicht
      is gegeven, is Artikel 22.27 alleen van toepassing voor zover het gaat om:
      a. inpandige wijzigingen;
      b. een wijziging van een achtergevel of achterdakvlak, als die gevel of
      dat dakvlak niet naar openbaar toegankelijk gebied is gekeerd;
      c. een bouwwerk op een gebouwerf aan de achterkant van een hoofdgebouw,
      als dat gebouwerf niet ook deel uitmaakt van het gebouwerf aan de zijkant
      van dat gebouw en niet naar openbaar toegankelijk gebied is gekeerd; of
      d. een bouwwerk op een locatie die onderdeel is van openbaar toegankelijk
      gebied.

      4. Artikel 22.27, aanhef en onder a en b, is ook niet van toepassing als
      in het tijdelijke deel van dit omgevingsplan, bedoeld in artikel 22.1,
      onder a, van de Omgevingswet, voor de locatie waarop de bouwactiviteit
      wordt verricht, regels zijn gesteld als bedoeld in Artikel 22.22 over het
      verrichten van archeologisch onderzoek in het kader van een aanvraag om
      een omgevingsvergunning voor een bouwactiviteit, tenzij:
      a. het bouwwerk waarop de activiteit betrekking heeft een oppervlakte
      heeft van minder dan 50 m2; of
      b. het tijdelijke deel van dit omgevingsplan, bedoeld in artikel 22.1,
      onder a, van de Omgevingswet, een verbod bevat om grondwerkzaamheden die
      nodig zijn voor het verrichten van de bouwactiviteit zonder
      omgevingsvergunning te verrichten waarop regels als bedoeld in Artikel
      22.22 over het verrichten van archeologisch onderzoek in het kader van
      een aanvraag om een omgevingsvergunning voor het uitvoeren van een werk,
      geen bouwwerk zijnde, of een werkzaamheid, van toepassing zijn.
    url: https://lokaleregelgeving.overheid.nl/CVDR696248

    machine_readable:
      execution:
        parameters:
          - name: in_aan_of_op_monument
            type: boolean
            required: false
            description: Whether the activity takes place in, on or at a protected monument
          - name: bij_monument
            type: boolean
            required: false
            description: Whether the activity takes place near a protected monument
          - name: locatie_heeft_functieaanduiding_rijksbeschermd_stads_of_dorpsgezicht
            type: boolean
            required: false
            description: Conclusion of law - whether the plan gives the location that designation
          - name: op_gebouwerf_aan_achterkant_niet_zijkant_niet_naar_openbaar_gebied
            type: boolean
            required: false
            description: Article 22.28 lid 3 onder c
          - name: locatie_is_openbaar_toegankelijk_gebied
            type: boolean
            required: false
            description: Article 22.28 lid 3 onder d
          - name: archeologische_onderzoeksregels_gelden_voor_locatie
            type: boolean
            required: false
            description: Conclusion of law - article 22.28 lid 4, rules on archaeological research for the location
          - name: oppervlakte_bouwwerk_m2
            type: number
            required: false
            description: Surface of the structure, in m2
          - name: verbod_grondwerkzaamheden_met_archeologische_regels
            type: boolean
            required: false
            description: Article 22.28 lid 4 onder b
        output:
          - name: onder_a_uitgesloten_door_artikel_22_28
            type: boolean
            description: Whether this article takes article 22.27 onder a away
        actions:
          # Lid 3 onder a and b concern changes to an existing building, not
          # a new structure.
          - output: onder_a_uitgesloten_door_artikel_22_28
            value:
              operation: OR
              conditions:
                - $in_aan_of_op_monument
                - $bij_monument
                - operation: AND
                  conditions:
                    - $locatie_heeft_functieaanduiding_rijksbeschermd_stads_of_dorpsgezicht
                    - operation: NOT
                      value:
                        operation: OR
                        conditions:
                          - $op_gebouwerf_aan_achterkant_niet_zijkant_niet_naar_openbaar_gebied
                          - $locatie_is_openbaar_toegankelijk_gebied
                - operation: AND
                  conditions:
                    - $archeologische_onderzoeksregels_gelden_voor_locatie
                    - operation: GREATER_THAN_OR_EQUAL
                      subject: $oppervlakte_bouwwerk_m2
                      value: 50
                    - operation: NOT
                      value: $verbod_grondwerkzaamheden_met_archeologische_regels

  - number: '22.36'
    text: |
      Binnenplanse vergunningvrije activiteiten van rechtswege in
      overeenstemming met dit omgevingsplan

      Onverminderd de overige bepalingen van deze afdeling en de bepalingen van
      Afdeling 22.3 zijn in ieder geval in overeenstemming met dit
      omgevingsplan:
      a. het bouwen, in stand houden en gebruiken van een bijbehorend bouwwerk
      of een uitbreiding daarvan als bedoeld in Artikel 22.27, onder a, als in
      aanvulling op de in dat onderdeel gestelde eisen ook wordt voldaan aan de
      volgende eisen:
      1. voor zover op een afstand van niet meer dan 4 m van het oorspronkelijk
      hoofdgebouw, niet hoger dan:
      I. 5 m;
      II. 0,3 m boven de bovenkant van de scheidingsconstructie met de tweede
      bouwlaag van het hoofdgebouw; en
      III. het hoofdgebouw;
      2. voor zover op een afstand van meer dan 4 m van het oorspronkelijk
      hoofdgebouw:
      I. als het bijbehorend bouwwerk of de uitbreiding daarvan hoger is dan
      3 m: voorzien van een schuin dak, de dakvoet niet hoger dan 3 m, de
      daknok gevormd door twee of meer schuine dakvlakken, met een hellingshoek
      van niet meer dan 55°, en waarbij de hoogte van de daknok niet meer is dan
      5 m en verder wordt begrensd door de volgende formule: maximale
      daknokhoogte [m] = (afstand daknok tot de perceelsgrens [m] x 0,47) + 3;
      en
      II. functioneel ondergeschikt aan het hoofdgebouw, tenzij het gaat om
      huisvesting in verband met mantelzorg;
      3. de oppervlakte van bijbehorende bouwwerken in het bebouwingsgebied
      niet meer dan:
      I. bij een bebouwingsgebied kleiner dan of gelijk aan 100 m2: 50% van dat
      bebouwingsgebied;
      II. bij een bebouwingsgebied groter dan 100 m2 en kleiner dan of gelijk
      aan 300 m2: 50 m2, vermeerderd met 20% van het deel van het
      bebouwingsgebied dat groter is dan 100 m2; en
      III. bij een bebouwingsgebied groter dan 300 m2: 90 m2, vermeerderd met
      10% van het deel van het bebouwingsgebied dat groter is dan 300 m2, tot
      een maximum van in totaal 150 m2; en
      4. uitbreiding van of gelegen aan of bij een hoofdgebouw, anders dan:
      I. een woonwagen;
      II. een hoofdgebouw waarvoor in de omgevingsvergunning voor de
      bouwactiviteit of de omgevingsplanactiviteit bestaande uit een
      bouwactiviteit is bepaald dat de vergunninghouder na het verstrijken van
      een bij die vergunning gestelde termijn verplicht is de voor de verlening
      van de vergunning bestaande toestand te hebben hersteld; of
      III. een bouwwerk voor recreatief nachtverblijf door één huishouden;
      [onder b en c: niet overgenomen]
    url: https://lokaleregelgeving.overheid.nl/CVDR696248

