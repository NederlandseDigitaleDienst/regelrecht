regulatory_layer: GEMEENTELIJKE_VERORDENING
publication_date: '2026-09-16'
valid_from: '2026-09-16'
gemeente_code: GM0273
officiele_titel: Omgevingsplan gemeente Putten
url: https://lokaleregelgeving.overheid.nl/CVDR696248

# REAL. Parts of the Omgevingsplan gemeente Putten as published on
# lokaleregelgeving.overheid.nl, read on 2026-11-17. The article texts are
# quoted. The logic is a first reading and has not been checked by a lawyer.
# Not checked: the date in force; `valid_from` is the date in the identifiers
# of the geographic information objects.
#
# Modelled, for building a bijbehorend bouwwerk:
#   - the permit duty: articles 22.26, 22.27 (aanhef and onder a), 22.28;
#   - what accords with the plan by law: article 22.36 (aanhef and onder a),
#     with articles 22.37 lid 2 and 22.38;
#   - Oude Nijkerkerweg 33: Bijlage I, articles 21.3, 21.19, 21.22 lid 1 and
#     21.23.
#
# The three shapes are the published geometry of the geographic information
# objects that Bijlage I lists, taken from the GML at the identifier given
# with each. RD coordinates (EPSG:28992).
#
# WHAT IS ASKED AND NOT WORKED OUT. Each is a parameter whose description
# starts with "Not modelled" or "Conclusion of law". Where one of them decides
# the outcome and it is not given, the outcome is unknown; nothing is assumed.
#   - other structures than a bijbehorend bouwwerk: article 22.27 onder b to
#     i, and article 22.36 onder b and c;
#   - an activity that is not building;
#   - a conflict with the plan anywhere but in the area Wonen of this address,
#     or for something other than a bijgebouw. Those rules are in the older
#     plans that are part of this omgevingsplan (Omgevingswet article 22.1);
#   - the designation rijksbeschermd stads- of dorpsgezicht, the rules on
#     archaeological research, and article 22.39 (external safety). These
#     too rest on the older plans.
#
# Articles 21.3 and 22.26 fill a term of the Omgevingswet. The engine gives
# such an article only the parameters it declares, so each declares what the
# articles it reads need.

articles:
  # The plan designates its areas in an annex: a name and an identifier per
  # area. The annex is filed as an article because `articles` is the only
  # place the format has for a part of a regulation.
  - number: Bijlage I
    text: |
      Overzicht Informatieobjecten

      H21 Oude Nijkerkerweg 33
      /join/id/regdata/gm0273/2026/2077aab16efd4863b7d8372bb58a8aaf/nld@2026-09-16;13055780

      H21 Oude Nijkerkerweg 33 agrarisch vervallen aanduidingen
      /join/id/regdata/gm0273/2026/94a677e7853f437a9500dcf0cbe055ab/nld@2026-09-16;13055780

      H21 Oude Nijkerkerweg 33 functie Wonen
      /join/id/regdata/gm0273/2026/a7fcea763bbc4df89709471d06c3ce70/nld@2026-09-16;13055780

      H21 Oude Nijkerkerweg 33 maximale oppervlakte bijgebouwen: 287 m2
      /join/id/regdata/gm0273/2026/d919cf0c476f4fb887620b7534af3acd/nld@2026-09-16;13055780
    url: https://lokaleregelgeving.overheid.nl/CVDR696248

    machine_readable:
      execution:
        # The area "agrarisch vervallen aanduidingen" is read by article
        # 21.21, which is not modelled, so it is not given here.
        output:
          - name: gebied_oude_nijkerkerweg_33
            type: shape
            description: H21 Oude Nijkerkerweg 33
          - name: gebied_functie_wonen
            type: shape
            description: H21 Oude Nijkerkerweg 33 functie Wonen
          - name: gebied_maximale_oppervlakte_bijgebouwen
            type: shape
            description: 'H21 Oude Nijkerkerweg 33 maximale oppervlakte bijgebouwen: 287 m2'
        actions:
          - output: gebied_oude_nijkerkerweg_33
            value: 'POLYGON((167843.258 472393.888, 167846.47 472247.156, 167789.323 472246.037, 167781.826 472383.09, 167843.258 472393.888))'
          # The published geometry of this area and of the next is the same.
          - output: gebied_functie_wonen
            value: 'POLYGON((167815.493 472388.99, 167817.786 472292.639, 167786.742 472293.222, 167781.826 472383.09, 167815.493 472388.99))'
          - output: gebied_maximale_oppervlakte_bijgebouwen
            value: 'POLYGON((167815.493 472388.99, 167817.786 472292.639, 167786.742 472293.222, 167781.826 472383.09, 167815.493 472388.99))'

  # The rule that keeps the bestemmingsplan in force at the locations of this
  # chapter, except where the chapter says otherwise. A bijgebouw that goes
  # against those rules conflicts with the plan, and this is the article that
  # makes them count here. The text does not spell that test out; the logic
  # below is what lid 1 comes to for a bijgebouw at this address.
  - number: '21.3'
    text: |
      Van overeenkomstige toepassing verklaarde regels uit het bestemmingsplan

      1. Ter plaatse van het gebied waarop deze wijziging van het omgevingsplan
      betrekking heeft geldt het ter plaatse van toepassing zijnde
      bestemmingsplan uit het tijdelijk deel van het omgevingsplan. Dit
      bestemmingsplan en de bijbehorende verbeelding blijven van toepassing,
      met uitzondering van de gevallen waarin in dit hoofdstuk anders is
      bepaald.

      2. Voor zover in dit hoofdstuk regels uit een bestemmingsplan van
      overeenkomstige toepassing worden verklaard, worden die regels gelezen in
      samenhang met dit hoofdstuk.

      3. De in het eerste lid bedoelde regels blijven buiten toepassing voor
      zover in dit hoofdstuk uitdrukkelijk anders is bepaald.
    url: https://lokaleregelgeving.overheid.nl/CVDR696248

    machine_readable:
      implements:
        - law: omgevingswet
          article: Bijlage onder A
          open_term: activiteit_in_strijd_met_omgevingsplan
          gelet_op: Gelet op artikel 5.1, eerste lid, onder a, van de Omgevingswet
      execution:
        parameters:
          - name: activiteit
            type: string
            required: true
            description: The activity, in the terms of the Omgevingswet
          - name: location
            type: shape
            required: true
            description: Where the activity takes place
          - name: is_bijgebouw
            type: boolean
            required: false
            description: Whether what is built is a bijgebouw as the bestemmingsplan defines it
          - name: in_strijd_met_het_plan_buiten_wat_hier_is_uitgewerkt
            type: boolean
            required: false
            description: Not modelled - whether the activity conflicts with the plan in a case this article does not work out
          - name: oppervlakte_bijgebouwen_m2
            type: number
            required: false
            description: Total surface of the bijgebouwen of the dwelling after building, in m2
          - name: sloopmeters_eigen_terrein_m2
            type: number
            required: false
            description: Article 21.23 - surface demolished on the own plot, in m2
          - name: grootste_bijgebouw_m2
            type: number
            required: false
            description: Article 21.23 - surface of the largest single bijgebouw, in m2
          - name: goothoogte_m
            type: number
            required: false
            description: Bestemmingsplan article 19.2.8 onder c - in m
          - name: bouwhoogte_m
            type: number
            required: false
            description: Bestemmingsplan article 19.2.8 onder d - in m
          - name: woning_is_wooncomplex_kleine_woning_of_recreatiewoning
            type: boolean
            required: false
            description: Bestemmingsplan article 19.2.8 onder e
          - name: is_bijbehorend_bouwwerk
            type: boolean
            required: false
            description: Article 22.27 onder a - a bijbehorend bouwwerk or an extension of one
          - name: op_de_grond_staand
            type: boolean
            required: false
            description: Article 22.27 onder a, 1
          - name: gelegen_in_achtererfgebied
            type: boolean
            required: false
            description: Article 22.27 onder a, 2
          - name: afstand_tot_openbaar_toegankelijk_gebied_m
            type: number
            required: false
            description: Article 22.27 onder a, 3 - in m
          - name: hoogte_m
            type: number
            required: false
            description: Article 22.27 onder a, 4 - height of the structure, in m
          - name: verblijfsgebied_op_tweede_bouwlaag_of_hoger
            type: boolean
            required: false
            description: Article 22.27 onder a, 5
          - name: heeft_dakterras_balkon_of_buitenruimte_boven_de_grond
            type: boolean
            required: false
            description: Article 22.27 onder a, 6
          - name: afstand_tot_oorspronkelijk_hoofdgebouw_m
            type: number
            required: false
            description: Article 22.36 onder a, 1 and 2 - in m
          - name: hoogte_scheidingsconstructie_tweede_bouwlaag_hoofdgebouw_m
            type: number
            required: false
            description: Article 22.36 onder a, 1, II - in m
          - name: hoogte_hoofdgebouw_m
            type: number
            required: false
            description: Article 22.36 onder a, 1, III - in m
          - name: heeft_schuin_dak
            type: boolean
            required: false
            description: Article 22.36 onder a, 2, I
          - name: hoogte_dakvoet_m
            type: number
            required: false
            description: Article 22.36 onder a, 2, I - in m
          - name: daknok_gevormd_door_twee_of_meer_schuine_dakvlakken
            type: boolean
