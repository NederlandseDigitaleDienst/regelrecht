---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/tags/schema-v0.8.22/schema/v0.8.22/schema.json
$id: omgevingsplan_gemeente_putten
regulatory_layer: GEMEENTELIJKE_VERORDENING
publication_date: '2026-09-16'
valid_from: '2026-09-16'
gemeente_code: GM0273
officiele_titel: Omgevingsplan gemeente Putten
url: https://lokaleregelgeving.overheid.nl/CVDR696248

# REAL. Parts of the Omgevingsplan gemeente Putten as published on
# lokaleregelgeving.overheid.nl, read on 2026-11-17: the general permit duty
# for building (articles 22.26 and 22.27, aanhef and onder a) and part of
# afdeling 21.5 for Oude Nijkerkerweg 33 (Bijlage I, articles 21.19 and
# 21.23). The article texts are quoted. The logic is a first reading and has
# not been checked by a lawyer.
#
# The four shapes are the published geometry of the four geographic
# information objects that Bijlage I lists for this location, taken from the
# GML at the identifier given with each. RD coordinates (EPSG:28992).
#
# NOT modelled. Where the outcome depends on one of these, the article asks
# for it as a fact, so no answer rests on a rule that is not here:
#   - article 22.27 onder b to i (other structures than a bijbehorend bouwwerk);
#   - article 22.28 (limits on article 22.27 for cultural heritage);
#   - article 22.36 (activities that by law accord with the plan);
#   - article 19.2 of the bestemmingsplan 'Veegplan Westelijk Buitengebied',
#     which is part of this plan (Omgevingswet article 22.1) and which
#     article 21.23 adds to.
#
# Not checked: the date in force. `valid_from` is the date in the identifiers
# of the information objects.
#
# PROPOSED, not in the schema: the value type `shape` and the operation
# OVERLAPS.

articles:
  # The plan designates its areas in an annex: a name and an identifier per
  # area. The annex is filed as an article because `articles` is the only
  # place the format has for a part of a regulation.
  - number: Bijlage I
    text: |
      Overzicht Informatieobjecten

      H21 Oude Nijkerkerweg 33
      /join/id/regdata/gm0273/2026/2077aab16efd4863b7d8372bb58a8aaf/nld@2026-09-16;13055780

      H21 Oude Nijkerkerweg 33 agrarisch vervallen aanduidingen
      /join/id/regdata/gm0273/2026/94a677e7853f437a9500dcf0cbe055ab/nld@2026-09-16;13055780

      H21 Oude Nijkerkerweg 33 functie Wonen
      /join/id/regdata/gm0273/2026/a7fcea763bbc4df89709471d06c3ce70/nld@2026-09-16;13055780

      H21 Oude Nijkerkerweg 33 maximale oppervlakte bijgebouwen: 287 m2
      /join/id/regdata/gm0273/2026/d919cf0c476f4fb887620b7534af3acd/nld@2026-09-16;13055780
    url: https://lokaleregelgeving.overheid.nl/CVDR696248

    machine_readable:
      execution:
        output:
          - name: gebied_oude_nijkerkerweg_33
            type: shape
            description: H21 Oude Nijkerkerweg 33
          - name: gebied_agrarisch_vervallen_aanduidingen
            type: shape
            description: H21 Oude Nijkerkerweg 33 agrarisch vervallen aanduidingen
          - name: gebied_functie_wonen
            type: shape
            description: H21 Oude Nijkerkerweg 33 functie Wonen
          - name: gebied_maximale_oppervlakte_bijgebouwen
            type: shape
            description: 'H21 Oude Nijkerkerweg 33 maximale oppervlakte bijgebouwen: 287 m2'
        actions:
          - output: gebied_oude_nijkerkerweg_33
            value: 'POLYGON((167843.258 472393.888, 167846.47 472247.156, 167789.323 472246.037, 167781.826 472383.09, 167843.258 472393.888))'
          - output: gebied_agrarisch_vervallen_aanduidingen
            value: 'POLYGON((167846.47 472247.156, 167789.323 472246.037, 167786.742 472293.222, 167817.786 472292.639, 167815.493 472388.99, 167843.258 472393.888, 167846.47 472247.156))'
          - output: gebied_functie_wonen
            value: 'POLYGON((167815.493 472388.99, 167817.786 472292.639, 167786.742 472293.222, 167781.826 472383.09, 167815.493 472388.99))'
          - output: gebied_maximale_oppervlakte_bijgebouwen
            value: 'POLYGON((167815.493 472388.99, 167817.786 472292.639, 167786.742 472293.222, 167781.826 472383.09, 167815.493 472388.99))'

  # A whole afdeling that holds only in one area. The article that says so
  # gives that as a value, and the other articles of the afdeling read it.
  - number: '21.19'
    text: |
      Toepassingsbereik

      Deze afdeling bevat regels die nodig zijn voor de gewenste ontwikkeling
      ter plaatse van het gebied H21 Oude Nijkerkerweg 33 in Putten omdat deze
      ontwikkeling in strijd is met het tijdelijke deel van dit omgevingsplan.
      Daarom is deze afdeling alleen van toepassing ter plaatse van het gebied
      H21 Oude Nijkerkerweg 33 in Putten.
    url: https://lokaleregelgeving.overheid.nl/CVDR696248

    machine_readable:
      execution:
        parameters:
          - name: location
            type: shape
            required: true
            description: Where the activity takes place
        input:
          - name: gebied_oude_nijkerkerweg_33
            type: shape
            description: The area listed in Bijlage I
            source:
              output: gebied_oude_nijkerkerweg_33
        output:
          - name: afdeling_21_5_van_toepassing
            type: boolean
            description: Whether afdeling 21.5 applies at the location
        actions:
          - output: afdeling_21_5_van_toepassing
            value:
              operation: OVERLAPS
              subject: $location
              value: $gebied_oude_nijkerkerweg_33

  # The article widens what article 19.2 of the bestemmingsplan allows. It
  # forbids nothing itself: bijgebouwen within its limits accord with the
  # plan, and for anything else article 19.2 decides.
  - number: '21.23'
    text: |
      Wonen: uitbreiding oppervlak bijgebouwen

      In aanvulling op artikel 19.2 van het bestemmingsplan geldt het volgende:

      Ter plaatse van het gebied H21 Oude Nijkerkerweg 33 maximale oppervlakte
      bijgebouwen: 287 m2 is een oppervlak aan bijgebouwen toegestaan tot een
      maximum oppervlakte van 287m² onder de voorwaarde dat deze wordt
      gecompenseerd met 307,5m² sloopmeters van eigen terrein, waarbij de
      maximale oppervlakte per bijgebouw maximaal 200m2 is.
    url: https://lokaleregelgeving.overheid.nl/CVDR696248

    machine_readable:
      implements:
        - law: omgevingswet
          article: Bijlage onder A
          open_term: activiteit_in_strijd_met_omgevingsplan
          gelet_op: Gelet op artikel 5.1, eerste lid, onder a, van de Omgevingswet
      execution:
        parameters:
          - name: activiteit
            type: string
            required: true
            description: The activity, in the terms of the Omgevingswet
          - name: location
            type: shape
            required: true
            description: Where the activity takes place
          - name: is_bijgebouw
            type: boolean
            required: false
            description: Whether what is built is a bijgebouw
          - name: oppervlakte_bijgebouwen_m2
            type: number
            required: false
            description: Total surface of the bijgebouwen after building, in m2
          - name: sloopmeters_eigen_terrein_m2
            type: number
            required: false
            description: Surface demolished on the own plot as compensation, in m2
          - name: grootste_bijgebouw_m2
            type: number
            required: false
            description: Surface of the largest single bijgebouw, in m2
          # Article 19.2 of the bestemmingsplan is not modelled.
          - name: past_binnen_artikel_19_2_bestemmingsplan
            type: boolean
            required: false
            description: >-
              Whether the bijgebouwen fit within article 19.2 of the
              bestemmingsplan, apart from what this article adds
          # Article 22.36 is not modelled.
          - name: van_rechtswege_in_overeenstemming_artikel_22_36
            type: boolean
            required: false
            description: >-
              Whether the activity accords with the plan by law under
              article 22.36
        input:
          - name: afdeling_21_5_van_toepassing
            type: boolean
            description: Whether this afdeling applies at the location (article 21.19)
            source:
              output: afdeling_21_5_van_toepassing
          - name: gebied_maximale_oppervlakte_bijgebouwen
            type: shape
            description: The area listed in Bijlage I
            source:
              output: gebied_maximale_oppervlakte_bijgebouwen
        output:
          # Absent when the article does not speak about the case.
          - name: activiteit_in_strijd_met_omgevingsplan
            type: boolean
            nullable: true
            description: Whether the bijgebouwen conflict with the plan on their surface
        actions:
          - output: activiteit_in_strijd_met_omgevingsplan
            value:
              operation: IF
              cases:
                - when:
                    operation: AND
                    conditions:
                      - operation: EQUALS
                        subject: $activiteit
                        value: bouwactiviteit
                      - $is_bijgebouw
                      - $afdeling_21_5_van_toepassing
                      - operation: OVERLAPS
                        subject: $location
                        value: $gebied_maximale_oppervlakte_bijgebouwen
                  then:
                    operation: AND
                    conditions:
                      - operation: NOT
                        value: $van_rechtswege_in_overeenstemming_artikel_22_36
                      - operation: NOT
                        value: $past_binnen_artikel_19_2_bestemmingsplan
                      # Not within what this article adds.
                      - operation: NOT
                        value:
                          operation: AND
                          conditions:
                            - operation: LESS_THAN_OR_EQUAL
                              subject: $oppervlakte_bijgebouwen_m2
                              value: 287
                            - operation: GREATER_THAN_OR_EQUAL
                              subject: $sloopmeters_eigen_terrein_m2
                              value: 307.5
                            - operation: LESS_THAN_OR_EQUAL
                              subject: $grootste_bijgebouw_m2
                              value: 200

  - number: '22.26'
    text: |
      Binnenplanse vergunning omgevingsplanactiviteit bouwwerken

      Het is verboden zonder omgevingsvergunning een bouwactiviteit te
      verrichten en het te bouwen bouwwerk in stand te houden en te gebruiken.
    url: https://lokaleregelgeving.overheid.nl/CVDR696248

    machine_readable:
      implements:
        - law: omgevingswet
          article: Bijlage onder A
          open_term: omgevingsplan_verbiedt_zonder_vergunning
          gelet_op: Gelet op artikel 5.1, eerste lid, onder a, van de Omgevingswet
      execution:
        parameters:
          - name: activiteit
            type: string
            required: true
            description: The activity, in the terms of the Omgevingswet
        input:
          - name: uitzondering_artikel_22_27
            type: boolean
            description: Whether article 22.27 lifts the ban
            source:
              output: uitzondering_artikel_22_27
        output:
          # Absent when the article does not speak about the case.
          - name: omgevingsplan_verbiedt_zonder_vergunning
            type: boolean
            nullable: true
            description: Whether this article forbids the activity without a permit
        actions:
          - output: omgevingsplan_verbiedt_zonder_vergunning
            value:
              operation: IF
              cases:
                - when:
                    operation: EQUALS
                    subject: $activiteit
                    value: bouwactiviteit
                  then:
                    operation: NOT
                    value: $uitzondering_artikel_22_27

  - number: '22.27'
    text: |
      Uitzonderingen op vergunningplicht artikel 22.26 - omgevingsplan
      onverminderd van toepassing

      Het verbod, bedoeld in Artikel 22.26, geldt niet voor de activiteiten,
      bedoeld in dat artikel, als die betrekking hebben op een van de volgende
      bouwwerken:
      a. een bijbehorend bouwwerk of een uitbreiding daarvan, als wordt voldaan
      aan de volgende eisen:
      1. op de grond staand;
      2. gelegen in achtererfgebied;
      3. op een afstand van meer dan 1 m vanaf openbaar toegankelijk gebied;
      4. niet hoger dan 5 m;
      5. de ligging van een verblijfsgebied, bij meer dan een bouwlaag, alleen
      op de eerste bouwlaag; en
      6. niet voorzien van een dakterras, balkon of andere niet op de grond
      gelegen buitenruimte;
    url: https://lokaleregelgeving.overheid.nl/CVDR696248

    machine_readable:
      execution:
        parameters:
          - name: is_bijbehorend_bouwwerk
            type: boolean
            required: false
            description: Onder a - whether what is built is a bijbehorend bouwwerk or an extension of one
          - name: op_de_grond_staand
            type: boolean
            required: false
            description: Onder a, 1
          - name: gelegen_in_achtererfgebied
            type: boolean
            required: false
            description: Onder a, 2
          - name: afstand_tot_openbaar_toegankelijk_gebied_m
            type: number
            required: false
            description: Onder a, 3 - distance to openbaar toegankelijk gebied, in m
          - name: hoogte_m
            type: number
            required: false
            description: Onder a, 4 - height, in m
          - name: verblijfsgebied_alleen_op_eerste_bouwlaag
            type: boolean
            required: false
            description: Onder a, 5
          - name: heeft_dakterras_balkon_of_buitenruimte_boven_de_grond
            type: boolean
            required: false
            description: Onder a, 6
          # Article 22.28 is not modelled.
          - name: artikel_22_28_sluit_uitzondering_uit
            type: boolean
            required: false
            description: >-
              Whether article 22.28 (cultural heritage) takes this exception
              away
        output:
          - name: uitzondering_artikel_22_27
            type: boolean
            description: Whether the ban of article 22.26 is lifted
        actions:
          # Only onder a is modelled; for another structure the exception is
          # taken not to hold.
          - output: uitzondering_artikel_22_27
            value:
              operation: AND
              conditions:
                - $is_bijbehorend_bouwwerk
                - $op_de_grond_staand
                - $gelegen_in_achtererfgebied
                - operation: GREATER_THAN
                  subject: $afstand_tot_openbaar_toegankelijk_gebied_m
                  value: 1
                - operation: LESS_THAN_OR_EQUAL
                  subject: $hoogte_m
                  value: 5
                - $verblijfsgebied_alleen_op_eerste_bouwlaag
                - operation: NOT
                  value: $heeft_dakterras_balkon_of_buitenruimte_boven_de_grond
                - operation: NOT
                  value: $artikel_22_28_sluit_uitzondering_uit
