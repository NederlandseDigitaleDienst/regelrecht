          - name: oppervlakte_bijbehorende_bouwwerken_in_bebouwingsgebied_m2
            type: number
            required: false
            description: Article 22.36 onder a, 3 - after building, in m2
          - name: bebouwingsgebied_m2
            type: number
            required: false
            description: Article 22.36 onder a, 3 - in m2
          - name: uitbreiding_van_of_gelegen_aan_of_bij_hoofdgebouw
            type: boolean
            required: false
            description: Article 22.36 onder a, 4
          - name: hoofdgebouw_is_woonwagen_tijdelijk_vergund_of_recreatief_nachtverblijf
            type: boolean
            required: false
            description: Article 22.36 onder a, 4, I to III
          - name: geheel_of_in_delen_verplaatsbaar
            type: boolean
            required: false
            description: Article 22.37 lid 2 onder a
          - name: oppervlakte_bouwwerk_m2
            type: number
            required: false
            description: Surface of the structure, in m2
          - name: buiten_de_bebouwde_kom
            type: boolean
            required: false
            description: Article 22.37 lid 2 onder c
          - name: in_overeenstemming_volgens_artikel_22_36_onder_b_of_c
            type: boolean
            required: false
            description: Not modelled - whether onder b or c applies; false for a structure or use they do not name
          - name: artikel_22_39_sluit_artikel_22_36_uit
            type: boolean
            required: false
            description: Conclusion of law - whether article 22.39 (external safety) takes article 22.36 away
          - name: in_aan_of_op_monument
            type: boolean
            required: false
            description: Whether the activity takes place in, on or at a protected monument
          - name: bij_monument
            type: boolean
            required: false
            description: Whether the activity takes place near a protected monument
          - name: locatie_heeft_functieaanduiding_rijksbeschermd_stads_of_dorpsgezicht
            type: boolean
            required: false
            description: Conclusion of law - whether the plan gives the location that designation
        input:
          - name: bestemming_wonen_van_toepassing
            type: boolean
            description: Whether article 21.22 makes article 19 of the bestemmingsplan apply at the location
            source:
              output: bestemming_wonen_van_toepassing
          - name: verruiming_oppervlakte_bijgebouwen
            type: boolean
            description: Whether article 21.23 allows the surface
            source:
              output: verruiming_oppervlakte_bijgebouwen
          - name: van_rechtswege_in_overeenstemming
            type: boolean
            description: Whether the activity accords with the plan by law (article 22.36)
            source:
              output: van_rechtswege_in_overeenstemming
          - name: oppervlakte_bijgebouwen_binnen_artikel_19_2_8_onder_a
            type: boolean
            description: Whether the surface stays within the bestemmingsplan
            source:
              regulation: bestemmingsplan_veegplan_westelijk_buitengebied
              output: oppervlakte_bijgebouwen_binnen_artikel_19_2_8_onder_a
              parameters:
                oppervlakte_bijgebouwen_m2: $oppervlakte_bijgebouwen_m2
          - name: bijgebouw_voldoet_aan_artikel_19_2_8_onder_c_d_en_e
            type: boolean
            description: Whether the bijgebouw meets the other rules of the bestemmingsplan
            source:
              regulation: bestemmingsplan_veegplan_westelijk_buitengebied
              output: bijgebouw_voldoet_aan_artikel_19_2_8_onder_c_d_en_e
              parameters:
                goothoogte_m: $goothoogte_m
                bouwhoogte_m: $bouwhoogte_m
                woning_is_wooncomplex_kleine_woning_of_recreatiewoning: $woning_is_wooncomplex_kleine_woning_of_recreatiewoning
        output:
          - name: activiteit_in_strijd_met_omgevingsplan
            type: boolean
            description: Whether the activity conflicts with the plan
        actions:
          - output: activiteit_in_strijd_met_omgevingsplan
            value:
              operation: IF
              cases:
                - when:
                    operation: AND
                    conditions:
                      - operation: EQUALS
                        subject: $activiteit
                        value: bouwactiviteit
                      - $is_bijgebouw
                      - $bestemming_wonen_van_toepassing
                  then:
                    operation: AND
                    conditions:
                      # Article 22.36: what it names accords with the plan in
                      # any case.
                      - operation: NOT
                        value: $van_rechtswege_in_overeenstemming
                      # Lid 1: the bestemmingsplan holds, except where this
                      # chapter says otherwise. Article 21.23 says otherwise
                      # for the surface only.
                      - operation: NOT
                        value:
                          operation: AND
                          conditions:
                            - $bijgebouw_voldoet_aan_artikel_19_2_8_onder_c_d_en_e
                            - operation: OR
                              conditions:
                                - $oppervlakte_bijgebouwen_binnen_artikel_19_2_8_onder_a
                                - $verruiming_oppervlakte_bijgebouwen
              default: $in_strijd_met_het_plan_buiten_wat_hier_is_uitgewerkt

  # A whole afdeling that holds only in one area. The article that says so
  # gives that as a value, and the other articles of the afdeling read it.
  - number: '21.19'
    text: |
      Toepassingsbereik

      Deze afdeling bevat regels die nodig zijn voor de gewenste ontwikkeling
      ter plaatse van het gebied H21 Oude Nijkerkerweg 33 in Putten omdat deze
      ontwikkeling in strijd is met het tijdelijke deel van dit omgevingsplan.
      Daarom is deze afdeling alleen van toepassing ter plaatse van het gebied
      H21 Oude Nijkerkerweg 33 in Putten.
    url: https://lokaleregelgeving.overheid.nl/CVDR696248

    machine_readable:
      execution:
        parameters:
          - name: location
            type: shape
            required: true
            description: Where the activity takes place
        input:
          - name: gebied_oude_nijkerkerweg_33
            type: shape
            description: The area listed in Bijlage I
            source:
              output: gebied_oude_nijkerkerweg_33
        output:
          - name: afdeling_21_5_van_toepassing
            type: boolean
            description: Whether afdeling 21.5 applies at the location
        actions:
          - output: afdeling_21_5_van_toepassing
            value:
              operation: OVERLAPS
              subject: $location
              value: $gebied_oude_nijkerkerweg_33

  - number: '21.22'
    text: |
      Wonen: bestemming wonen van overeenkomstige toepassing

      1. Ter plaatse van het gebied H21 Oude Nijkerkerweg 33 functie Wonen is
      de bestemming Wonen als bedoeld in artikel 19 van het bestemmingsplan van
      overeenkomstige toepassing.

      [lid 2: niet overgenomen]
    url: https://lokaleregelgeving.overheid.nl/CVDR696248

    machine_readable:
      execution:
        parameters:
          - name: location
            type: shape
            required: true
            description: Where the activity takes place
        input:
          - name: afdeling_21_5_van_toepassing
            type: boolean
            description: Whether this afdeling applies at the location (article 21.19)
            source:
              output: afdeling_21_5_van_toepassing
          - name: gebied_functie_wonen
            type: shape
            description: The area listed in Bijlage I
            source:
              output: gebied_functie_wonen
        output:
          # False outside the area: there this article does not make article
          # 19 apply. Whether it applies there for another reason is not said
          # here.
          - name: bestemming_wonen_van_toepassing
            type: boolean
            description: Lid 1 - this article makes article 19 of the bestemmingsplan apply at the location
        actions:
          - output: bestemming_wonen_van_toepassing
            value:
              operation: AND
              conditions:
                - $afdeling_21_5_van_toepassing
                - operation: OVERLAPS
                  subject: $location
                  value: $gebied_functie_wonen

  # The article widens what article 19.2.8 of the bestemmingsplan allows. It
  # forbids nothing itself.
  - number: '21.23'
    text: |
      Wonen: uitbreiding oppervlak bijgebouwen

      In aanvulling op artikel 19.2 van het bestemmingsplan geldt het volgende:

      Ter plaatse van het gebied H21 Oude Nijkerkerweg 33 maximale oppervlakte
      bijgebouwen: 287 m2 is een oppervlak aan bijgebouwen toegestaan tot een
      maximum oppervlakte van 287m² onder de voorwaarde dat deze wordt
      gecompenseerd met 307,5m² sloopmeters van eigen terrein, waarbij de
      maximale oppervlakte per bijgebouw maximaal 200m2 is.
    url: https://lokaleregelgeving.overheid.nl/CVDR696248

    machine_readable:
      execution:
        parameters:
          - name: location
            type: shape
            required: true
            description: Where the activity takes place
          - name: oppervlakte_bijgebouwen_m2
            type: number
            required: false
            description: Total surface of the bijgebouwen of the dwelling after building, in m2
          - name: sloopmeters_eigen_terrein_m2
            type: number
            required: false
            description: Article 21.23 - surface demolished on the own plot, in m2
          - name: grootste_bijgebouw_m2
            type: number
            required: false
            description: Article 21.23 - surface of the largest single bijgebouw, in m2
        input:
          - name: afdeling_21_5_van_toepassing
            type: boolean
            description: Whether this afdeling applies at the location (article 21.19)
            source:
              output: afdeling_21_5_van_toepassing
          - name: gebied_maximale_oppervlakte_bijgebouwen
            type: shape
            description: The area listed in Bijlage I
            source:
              output: gebied_maximale_oppervlakte_bijgebouwen
        output:
          - name: verruiming_oppervlakte_bijgebouwen
            type: boolean
            description: Whether this article allows the surface of bijgebouwen
        actions:
          - output: verruiming_oppervlakte_bijgebouwen
            value:
              operation: AND
              conditions:
                - $afdeling_21_5_van_toepassing
                - operation: OVERLAPS
                  subject: $location
                  value: $gebied_maximale_oppervlakte_bijgebouwen
                - operation: LESS_THAN_OR_EQUAL
                  subject: $oppervlakte_bijgebouwen_m2
                  value: 287
                - operation: GREATER_THAN_OR_EQUAL
                  subject: $sloopmeters_eigen_terrein_m2
                  value: 307.5
                - operation: LESS_THAN_OR_EQUAL
                  subject: $grootste_bijgebouw_m2
                  value: 200

  - number: '22.26'
    text: |
      Binnenplanse vergunning omgevingsplanactiviteit bouwwerken

      Het is verboden zonder omgevingsvergunning een bouwactiviteit te
      verrichten en het te bouwen bouwwerk in stand te houden en te gebruiken.
    url: https://lokaleregelgeving.overheid.nl/CVDR696248

    machine_readable:
      implements:
        - law: omgevingswet
          article: Bijlage onder A
          open_term: omgevingsplan_verbiedt_zonder_vergunning
          gelet_op: Gelet op artikel 5.1, eerste lid, onder a, van de Omgevingswet
      execution:
        parameters:
          - name: activiteit
            type: string
            required: true
            description: The activity, in the terms of the Omgevingswet
          - name: verboden_zonder_vergunning_door_ander_artikel_van_het_plan
            type: boolean
            required: false
            description: Not modelled - whether another article of the plan forbids an activity that is not building
          - name: is_bijbehorend_bouwwerk
            type: boolean
            required: false
            description: Article 22.27 onder a - a bijbehorend bouwwerk or an extension of one
          - name: op_de_grond_staand
            type: boolean
            required: false
            description: Article 22.27 onder a, 1
          - name: gelegen_in_achtererfgebied
            type: boolean
            required: false
            description: Article 22.27 onder a, 2
          - name: afstand_tot_openbaar_toegankelijk_gebied_m
            type: number
            required: false
            description: Article 22.27 onder a, 3 - in m
          - name: hoogte_m
            type: number
            required: false
            description: Article 22.27 onder a, 4 - height of the structure, in m
          - name: verblijfsgebied_op_tweede_bouwlaag_of_hoger
            type: boolean
            required: false
            description: Article 22.27 onder a, 5
          - name: heeft_dakterras_balkon_of_buitenruimte_boven_de_grond
            type: boolean
            required: false
            description: Article 22.27 onder a, 6
          - name: uitzondering_volgens_artikel_22_27_onder_b_tot_en_met_i
            type: boolean
            required: false
            description: Not modelled - whether onder b to i, read with article 22.28, lift the ban; false for a structure they do not name
          - name: in_aan_of_op_monument
            type: boolean
            required: false
            description: Whether the activity takes place in, on or at a protected monument
          - name: bij_monument
            type: boolean
            required: false
            description: Whether the activity takes place near a protected monument
          - name: locatie_heeft_functieaanduiding_rijksbeschermd_stads_of_dorpsgezicht
            type: boolean
            required: false
            description: Conclusion of law - whether the plan gives the location that designation
          - name: op_gebouwerf_aan_achterkant_niet_zijkant_niet_naar_openbaar_gebied
            type: boolean
            required: false
            description: Article 22.28 lid 3 onder c
          - name: locatie_is_openbaar_toegankelijk_gebied
            type: boolean
            required: false
            description: Article 22.28 lid 3 onder d
          - name: archeologische_onderzoeksregels_gelden_voor_locatie
            type: boolean
            required: false
            description: Conclusion of law - article 22.28 lid 4, rules on archaeological research for the location
          - name: oppervlakte_bouwwerk_m2
            type: number
            required: false
            description: Surface of the structure, in m2
          - name: verbod_grondwerkzaamheden_met_archeologische_regels
            type: boolean
            required: false
            description: Article 22.28 lid 4 onder b
        input:
          - name: uitzondering_artikel_22_27
            type: boolean
            description: Whether article 22.27 lifts the ban
            source:
