                                        subject: $hoogte_m
                                        value: 5
                                      - operation: LESS_THAN_OR_EQUAL
                                        subject: $hoogte_m
                                        value:
                                          operation: ADD
                                          values:
                                            - operation: MULTIPLY
                                              values:
