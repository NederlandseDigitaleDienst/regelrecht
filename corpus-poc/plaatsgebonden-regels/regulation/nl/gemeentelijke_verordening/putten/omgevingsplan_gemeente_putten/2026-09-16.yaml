  - number: '22.37'
    text: |
      Bijbehorend bouwwerk in bijzondere gevallen

      1. Als een bijbehorend bouwwerk als bedoeld in Artikel 22.36, onder a,
      bestaat uit een deel dat op meer, en een deel dat op minder dan 4 m van
      het oorspronkelijk hoofdgebouw is gelegen zonder een inwendige
      scheidingsconstructie tussen beide delen, is op het deel dat op minder
      dan 4 m van het oorspronkelijk hoofdgebouw is gelegen Artikel 22.36,
      onder a, onder 2, onder ii, van overeenkomstige toepassing.

      2. Als een bijbehorend bouwwerk als bedoeld in Artikel 22.36, onder a,
      wordt gebruikt voor huisvesting in verband met mantelzorg, gelden in
      plaats van de in Artikel 22.36, onder a, onder 3°, gestelde eisen de
      volgende eisen:
      a. in zijn geheel of in delen verplaatsbaar;
      b. de oppervlakte niet meer dan 100 m2; en
      c. buiten de bebouwde kom.
    url: https://lokaleregelgeving.overheid.nl/CVDR696248

  - number: '22.38'
    text: |
      Inperkingen artikel 22.36 vanwege cultureel erfgoed

      Artikel 22.36 is niet van toepassing op een activiteit die wordt verricht:
      a. in, aan, op of bij een gemeentelijk monument, voorbeschermd
      gemeentelijk monument, provinciaal monument, voorbeschermd provinciaal
      monument, rijksmonument of voorbeschermd rijksmonument; of
      b. op een locatie waaraan in dit omgevingsplan de functie-aanduiding
      rijksbeschermd stads- of dorpsgezicht is gegeven.
    url: https://lokaleregelgeving.overheid.nl/CVDR696248

