---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/tags/schema-v0.8.22/schema/v0.8.22/schema.json
$id: omgevingsplan_dijkstad
regulatory_layer: GEMEENTELIJKE_VERORDENING
publication_date: '2024-01-01'
valid_from: '2024-01-01'
gemeente_code: GM9990
officiele_titel: Omgevingsplan gemeente Dijkstad
url: https://example.org/omgevingsplan-dijkstad

# FICTIONAL. Dijkstad does not exist; the text is written for this example.
#
# PROPOSED, not in the schema:
#   - `areas`: the areas this rulework designates, each a variable of type
#     shape whose value is the geometry adopted with the rulework.
#   - a parameter of type `shape`, here `location`.
#   - the operation OVERLAPS, which tests a shape against an area.
#
# This rulework uses the area INSIDE the logic (article 5.2). The
# waterschapsverordening next to it uses `applies_in` on the article. Both
# ways are here on purpose, to compare them.

areas:
  beschermd_stadsgezicht_binnenstad:
    geometry: areas/beschermd_stadsgezicht_binnenstad.geojson

articles:
  # No area named: holds in the whole municipality.
  - number: '4.1'
    text: |
      Het is verboden zonder omgevingsvergunning een boom te kappen.
    url: https://example.org/omgevingsplan-dijkstad#artikel4.1

    machine_readable:
      implements:
        - law: omgevingswet
          article: '5.1'
          open_term: omgevingsplan_verbiedt_zonder_vergunning
          gelet_op: Gelet op artikel 5.1, eerste lid, onder a, van de Omgevingswet
      execution:
        parameters:
          - name: activiteit
            type: string
            required: true
            description: What the applicant wants to do
        output:
          - name: omgevingsplan_verbiedt_zonder_vergunning
            type: boolean
            description: Whether this article forbids the activity without a permit
        actions:
          - output: omgevingsplan_verbiedt_zonder_vergunning
            value:
              operation: EQUALS
              subject: $activiteit
              value: boom_kappen

  # A ban for the whole municipality with an exception, and an exception to
  # that exception that holds only in a named area. `applies_in` cannot say
  # this: the area sits in the middle of the rule.
  - number: '5.2'
    text: |
      1. Het is verboden zonder omgevingsvergunning een bouwwerk te bouwen.

      2. Het verbod geldt niet voor een bijbehorend bouwwerk, tenzij de locatie
      ligt in het werkingsgebied 'beschermd stadsgezicht binnenstad'.
    url: https://example.org/omgevingsplan-dijkstad#artikel5.2

    machine_readable:
      implements:
        - law: omgevingswet
          article: '5.1'
          open_term: omgevingsplan_verbiedt_zonder_vergunning
          gelet_op: Gelet op artikel 5.1, eerste lid, onder a, van de Omgevingswet
      execution:
        parameters:
          - name: activiteit
            type: string
            required: true
            description: What the applicant wants to do
          - name: location
            type: shape
            required: true
            description: Where the applicant wants to do it
        output:
          - name: omgevingsplan_verbiedt_zonder_vergunning
            type: boolean
            description: Whether this article forbids the activity without a permit
        actions:
          - output: omgevingsplan_verbiedt_zonder_vergunning
            value:
              operation: OR
              conditions:
                # Lid 1, not lifted by lid 2.
                - operation: EQUALS
                  subject: $activiteit
                  value: hoofdgebouw_bouwen
                # Lid 2: lifted for a bijbehorend bouwwerk, except in the area.
                - operation: AND
                  conditions:
                    - operation: EQUALS
                      subject: $activiteit
                      value: bijbehorend_bouwwerk_bouwen
                    - operation: OVERLAPS
                      subject: $location
                      value: $beschermd_stadsgezicht_binnenstad
