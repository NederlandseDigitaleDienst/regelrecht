---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/tags/schema-v0.8.22/schema/v0.8.22/schema.json
$id: omgevingsplan_dijkstad
regulatory_layer: GEMEENTELIJKE_VERORDENING
publication_date: '2024-01-01'
valid_from: '2024-01-01'
gemeente_code: GM9990
officiele_titel: Omgevingsplan gemeente Dijkstad
url: https://example.org/omgevingsplan-dijkstad

# FICTIONAL. Dijkstad does not exist; the text is written for this example.
#
# PROPOSED, not in the schema: the value type `shape` and the operation
# OVERLAPS. Nothing else is new.
#
# Three ways an article here relates to a place:
#   - article 1.2 designates an area of its own;
#   - article 4.1 refers to an area another rulework designated;
#   - article 5.2 holds in the whole municipality and names an area only in an
#     exception.
# The municipality itself is not named in any article: a rulework with a
# `gemeente_code` speaks only about locations in that territory.

articles:
  - number: '1.2'
    text: |
      Als beschermd stadsgezicht binnenstad wordt aangewezen het gebied dat als
      zodanig is aangegeven in bijlage 1.
    url: https://example.org/omgevingsplan-dijkstad#artikel1.2

    machine_readable:
      execution:
        output:
          - name: beschermd_stadsgezicht_binnenstad
            type: shape
            description: The area designated as beschermd stadsgezicht binnenstad
        actions:
          - output: beschermd_stadsgezicht_binnenstad
            value: 'POLYGON((155400 463400, 155700 463400, 155700 463700, 155400 463700, 155400 463400))'

  - number: '4.1'
    text: |
      1. Het is verboden zonder omgevingsvergunning een boom te kappen.

      2. Het eerste lid geldt niet voor een boom in het beperkingengebied
      waterkering, bedoeld in artikel 1.2 van de Waterschapsverordening
      waterschap Rivierdijken.
    url: https://example.org/omgevingsplan-dijkstad#artikel4.1

    machine_readable:
      implements:
        - law: omgevingswet
          article: '5.1'
          open_term: omgevingsplan_verbiedt_zonder_vergunning
          gelet_op: Gelet op artikel 5.1, eerste lid, onder a, van de Omgevingswet
      execution:
        parameters:
          - name: activiteit
            type: string
            required: true
            description: What the applicant wants to do
          - name: location
            type: shape
            required: true
            description: Where the applicant wants to do it
        input:
          # An area of another rulework, read like any other value of it.
          - name: beperkingengebied_waterkering
            type: shape
            description: The area designated by the water board
            source:
              regulation: waterschapsverordening_rivierdijken
              output: beperkingengebied_waterkering
        output:
          - name: omgevingsplan_verbiedt_zonder_vergunning
            type: boolean
            nullable: true
            description: Whether this article forbids the activity without a permit
        actions:
          - output: omgevingsplan_verbiedt_zonder_vergunning
            value:
              operation: IF
              cases:
                - when:
                    operation: AND
                    conditions:
                      - operation: EQUALS
                        subject: $activiteit
                        value: boom_kappen
                      - operation: NOT
                        value:
                          operation: OVERLAPS
                          subject: $location
                          value: $beperkingengebied_waterkering
                  then: true

  - number: '5.2'
    text: |
      1. Het is verboden zonder omgevingsvergunning een bouwwerk te bouwen.

      2. Het verbod geldt niet voor een bijbehorend bouwwerk, tenzij de locatie
      ligt in het beschermd stadsgezicht binnenstad.
    url: https://example.org/omgevingsplan-dijkstad#artikel5.2

    machine_readable:
      implements:
        - law: omgevingswet
          article: '5.1'
          open_term: omgevingsplan_verbiedt_zonder_vergunning
          gelet_op: Gelet op artikel 5.1, eerste lid, onder a, van de Omgevingswet
      execution:
        parameters:
          - name: activiteit
            type: string
            required: true
            description: What the applicant wants to do
          - name: location
            type: shape
            required: true
            description: Where the applicant wants to do it
        input:
          - name: beschermd_stadsgezicht_binnenstad
            type: shape
            description: The area designated in article 1.2
            source:
              output: beschermd_stadsgezicht_binnenstad
        output:
          - name: omgevingsplan_verbiedt_zonder_vergunning
            type: boolean
            nullable: true
            description: Whether this article forbids the activity without a permit
        actions:
          - output: omgevingsplan_verbiedt_zonder_vergunning
            value:
              operation: IF
              cases:
                # Lid 1, which lid 2 does not lift for a hoofdgebouw.
                - when:
                    operation: EQUALS
                    subject: $activiteit
                    value: hoofdgebouw_bouwen
                  then: true
                # Lid 2: lifted for a bijbehorend bouwwerk, except in the area.
                - when:
                    operation: AND
                    conditions:
                      - operation: EQUALS
                        subject: $activiteit
                        value: bijbehorend_bouwwerk_bouwen
                      - operation: OVERLAPS
                        subject: $location
                        value: $beschermd_stadsgezicht_binnenstad
                  then: true
