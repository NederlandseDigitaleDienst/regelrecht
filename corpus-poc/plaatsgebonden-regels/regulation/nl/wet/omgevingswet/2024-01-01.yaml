---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/tags/schema-v0.8.22/schema/v0.8.22/schema.json
$id: omgevingswet
regulatory_layer: WET
publication_date: '2016-04-26'
valid_from: '2024-01-01'
bwb_id: BWBR0037885
url: https://wetten.overheid.nl/BWBR0037885

# REAL. Texts as on wetten.overheid.nl, read on 2026-11-17. Modelled: article
# 5.1 lid 1 under a, article 5.3, and three definitions from the annex.
#
# The bans sit in this law. A decentral rulework only fills what the law
# leaves open: for which activity the plan requires a permit, and which
# activity conflicts with the plan.
#
# NOT modelled, so nothing here answers for it:
#   - article 5.1 lid 1 under b to g, and lid 2 (among them the technical
#     bouwactiviteit);
#   - article 5.4 (omgevingsverordening);
#   - which cases an algemene maatregel van bestuur exempts under article 5.1
#     lid 1. That is asked as a fact.
#
# PROPOSED, not in the schema: `combine` on an open term. The definition of
# omgevingsplanactiviteit speaks of an activity "waarvoor in het omgevingsplan
# is bepaald dat ...". A plan says such things article by article, so the term
# holds when any article of the plan says so. Without `combine` a term takes
# one filler, as it does today.

articles:
  - number: Bijlage onder A
    text: |
      bouwactiviteit: activiteit inhoudende het bouwen van een bouwwerk;

      buitenplanse omgevingsplanactiviteit: activiteit, inhoudende:
      a. een activiteit waarvoor in het omgevingsplan is bepaald dat het is
      verboden deze zonder omgevingsvergunning te verrichten en die in strijd
      is met het omgevingsplan, of
      b. een andere activiteit die in strijd is met het omgevingsplan;

      omgevingsplanactiviteit: activiteit, inhoudende:
      a. een activiteit waarvoor in het omgevingsplan is bepaald dat het is
      verboden deze zonder omgevingsvergunning te verrichten en die niet in
      strijd is met het omgevingsplan,
      b. een activiteit waarvoor in het omgevingsplan is bepaald dat het is
      verboden deze zonder omgevingsvergunning te verrichten en die in strijd
      is met het omgevingsplan, of
      c. een andere activiteit die in strijd is met het omgevingsplan;
    url: https://wetten.overheid.nl/BWBR0037885#Bijlage

    machine_readable:
      open_terms:
        - id: omgevingsplan_verbiedt_zonder_vergunning
          type: boolean
          required: false
          delegated_to: gemeenteraad
          delegation_type: GEMEENTELIJKE_VERORDENING
          combine: OR
          legal_basis: bijlage onder A (omgevingsplanactiviteit, onder a en b) Omgevingswet
          default:
            actions:
              - output: omgevingsplan_verbiedt_zonder_vergunning
                value: false
        - id: activiteit_in_strijd_met_omgevingsplan
          type: boolean
          required: false
          delegated_to: gemeenteraad
          delegation_type: GEMEENTELIJKE_VERORDENING
          combine: OR
          legal_basis: bijlage onder A (omgevingsplanactiviteit, onder b en c) Omgevingswet
          default:
            actions:
              - output: activiteit_in_strijd_met_omgevingsplan
                value: false

      execution:
        parameters:
          - name: activiteit
            type: string
            required: true
            description: The activity, in the terms of this law (such as bouwactiviteit)
        output:
          - name: omgevingsplanactiviteit
            type: boolean
            description: Whether the activity is an omgevingsplanactiviteit
          - name: buitenplanse_omgevingsplanactiviteit
            type: boolean
            description: Whether the activity is a buitenplanse omgevingsplanactiviteit
        actions:
          # Onder a, b and c together: the plan requires a permit for it, or
          # it conflicts with the plan.
          - output: omgevingsplanactiviteit
            value:
              operation: OR
              conditions:
                - $omgevingsplan_verbiedt_zonder_vergunning
                - $activiteit_in_strijd_met_omgevingsplan
          # Onder a and b of the buitenplanse definition both require the
          # conflict with the plan, and onder b requires nothing else.
          - output: buitenplanse_omgevingsplanactiviteit
            value: $activiteit_in_strijd_met_omgevingsplan

  - number: '5.1'
    text: |
      1. Het is verboden zonder omgevingsvergunning de volgende activiteiten te verrichten:
      a. een omgevingsplanactiviteit,
      b. een rijksmonumentenactiviteit,
      c. een ontgrondingsactiviteit,
      d. een stortingsactiviteit op zee,
      e. een Natura 2000-activiteit,
      f. een jachtgeweeractiviteit,
      g. een valkeniersactiviteit,
      tenzij het gaat om een bij algemene maatregel van bestuur aangewezen geval.
    url: https://wetten.overheid.nl/BWBR0037885#Hoofdstuk5_Afdeling5.1_Paragraaf5.1.1_Artikel5.1

    machine_readable:
      execution:
        parameters:
          # "tenzij het gaat om een bij algemene maatregel van bestuur
          # aangewezen geval". The cases are in the Omgevingsbesluit, which is
          # not modelled; whoever asks must say whether one applies.
          - name: bij_amvb_aangewezen_geval
            type: boolean
            required: true
            description: Whether the case is one that an algemene maatregel van bestuur exempts
        input:
          - name: omgevingsplanactiviteit
            type: boolean
            description: Whether the activity is an omgevingsplanactiviteit (annex, onder A)
            source:
              output: omgevingsplanactiviteit
        output:
          - name: vergunningplicht_omgevingsplanactiviteit
            type: boolean
            description: Lid 1 under a - forbidden without an omgevingsvergunning
        actions:
          - output: vergunningplicht_omgevingsplanactiviteit
            value:
              operation: AND
              conditions:
                - $omgevingsplanactiviteit
                - operation: NOT
                  value: $bij_amvb_aangewezen_geval

  - number: '5.3'
    text: |
      Het is verboden zonder omgevingsvergunning een activiteit te verrichten
      wanneer dat in de waterschapsverordening is bepaald.
    url: https://wetten.overheid.nl/BWBR0037885#Hoofdstuk5_Afdeling5.1_Paragraaf5.1.1_Artikel5.3

    machine_readable:
      open_terms:
        - id: waterschapsverordening_verbiedt_zonder_vergunning
          type: boolean
          required: false
          delegated_to: algemeen bestuur van het waterschap
          delegation_type: WATERSCHAPS_VERORDENING
          combine: OR
          legal_basis: artikel 5.3 Omgevingswet
          default:
            actions:
              - output: waterschapsverordening_verbiedt_zonder_vergunning
                value: false

      execution:
        parameters:
          - name: activiteit
            type: string
            required: true
            description: The activity, in the terms of this law (such as bouwactiviteit)
        output:
          - name: vergunningplicht_waterschapsverordening
            type: boolean
            description: Forbidden without an omgevingsvergunning under the waterschapsverordening
        actions:
          - output: vergunningplicht_waterschapsverordening
            value: $waterschapsverordening_verbiedt_zonder_vergunning
