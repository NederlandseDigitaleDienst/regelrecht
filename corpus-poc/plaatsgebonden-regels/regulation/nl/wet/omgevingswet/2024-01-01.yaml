---
$schema: https://raw.githubusercontent.com/NederlandseDigitaleDienst/regelrecht/refs/tags/schema-v0.8.23/schema/v0.8.23/schema.json
$id: omgevingswet
regulatory_layer: WET
publication_date: '2016-04-26'
valid_from: '2024-01-01'
bwb_id: BWBR0037885
url: https://wetten.overheid.nl/BWBR0037885

# REAL. Texts as on wetten.overheid.nl, read on 2026-11-17. Not checked:
# since when the text reads so; `valid_from` is the date the law took effect.
#
# Modelled: article 5.1 lid 1 under a, and the definitions of
# omgevingsplanactiviteit and buitenplanse omgevingsplanactiviteit from the
# annex. The ban sits in this law. The omgevingsplan only fills what the law
# leaves open: for which activity the plan requires a permit, and which
# activity conflicts with the plan.
#
# NOT modelled, so nothing here answers for it: article 5.1 lid 1 under b to
# g and lid 2 (among them the technical bouwactiviteit), and articles 5.3
# and 5.4.
#
# The two terms of the annex name the location and combine with OR. The plan
# of the municipality the location lies in is asked, article by article, and
# a term holds when one article says so. They have no default: where no plan
# is loaded for that place, the engine cannot resolve them and says so. It
# does not read a missing plan as a plan that forbids nothing.

articles:
  - number: Bijlage onder A
    text: |
      buitenplanse omgevingsplanactiviteit: activiteit, inhoudende:
      a. een activiteit waarvoor in het omgevingsplan is bepaald dat het is
      verboden deze zonder omgevingsvergunning te verrichten en die in strijd
      is met het omgevingsplan, of
      b. een andere activiteit die in strijd is met het omgevingsplan;

      [...]

      omgevingsplanactiviteit: activiteit, inhoudende:
      a. een activiteit waarvoor in het omgevingsplan is bepaald dat het is
      verboden deze zonder omgevingsvergunning te verrichten en die niet in
      strijd is met het omgevingsplan,
      b. een activiteit waarvoor in het omgevingsplan is bepaald dat het is
      verboden deze zonder omgevingsvergunning te verrichten en die in strijd
      is met het omgevingsplan, of
      c. een andere activiteit die in strijd is met het omgevingsplan;
    url: https://wetten.overheid.nl/BWBR0037885#Bijlage

    machine_readable:
      open_terms:
        - id: omgevingsplan_verbiedt_zonder_vergunning
          type: boolean
          required: true
          delegated_to: gemeenteraad
          delegation_type: GEMEENTELIJKE_VERORDENING
          location: $location
          combine: OR
          legal_basis: bijlage onder A (omgevingsplanactiviteit, onder a en b) Omgevingswet
        - id: activiteit_in_strijd_met_omgevingsplan
          type: boolean
          required: true
          delegated_to: gemeenteraad
          delegation_type: GEMEENTELIJKE_VERORDENING
          location: $location
          combine: OR
          legal_basis: bijlage onder A (omgevingsplanactiviteit, onder b en c) Omgevingswet

      execution:
        parameters:
          - name: location
            type: shape
            required: true
            description: Where the activity takes place
        output:
          - name: omgevingsplanactiviteit
            type: boolean
            description: Whether the activity is an omgevingsplanactiviteit
          - name: buitenplanse_omgevingsplanactiviteit
            type: boolean
            description: Whether the activity is a buitenplanse omgevingsplanactiviteit
        actions:
          # Onder a, b and c together: the plan requires a permit for it, or
          # it conflicts with the plan.
          - output: omgevingsplanactiviteit
            value:
              operation: OR
              conditions:
                - $omgevingsplan_verbiedt_zonder_vergunning
                - $activiteit_in_strijd_met_omgevingsplan
          # Onder a and b of the buitenplanse definition both require the
          # conflict with the plan, and onder b requires nothing else.
          - output: buitenplanse_omgevingsplanactiviteit
            value: $activiteit_in_strijd_met_omgevingsplan

  - number: '5.1'
    text: |
      1. Het is verboden zonder omgevingsvergunning de volgende activiteiten te verrichten:
      a. een omgevingsplanactiviteit,
      b. een rijksmonumentenactiviteit,
      c. een ontgrondingsactiviteit,
      d. een stortingsactiviteit op zee,
      e. een Natura 2000-activiteit,
      f. een jachtgeweeractiviteit,
      g. een valkeniersactiviteit,
      tenzij het gaat om een bij algemene maatregel van bestuur aangewezen geval.

      [lid 2: niet overgenomen]
    url: https://wetten.overheid.nl/BWBR0037885#Hoofdstuk5_Afdeling5.1_Paragraaf5.1.1_Artikel5.1

    machine_readable:
      open_terms:
        # "tenzij het gaat om een bij algemene maatregel van bestuur
        # aangewezen geval". For building, the cases are in article 2.29 of
        # the Besluit bouwwerken leefomgeving.
        - id: bij_amvb_aangewezen_geval
          type: boolean
          required: true
          delegated_to: regering
          delegation_type: AMVB
          legal_basis: artikel 5.1, eerste lid, Omgevingswet

      execution:
        input:
          - name: omgevingsplanactiviteit
            type: boolean
            description: Whether the activity is an omgevingsplanactiviteit (annex, onder A)
            source:
              output: omgevingsplanactiviteit
        output:
          - name: vergunningplicht_omgevingsplanactiviteit
            type: boolean
            description: Lid 1 under a - forbidden without an omgevingsvergunning
        actions:
          - output: vergunningplicht_omgevingsplanactiviteit
            value:
              operation: AND
              conditions:
                - $omgevingsplanactiviteit
                - operation: NOT
                  value: $bij_amvb_aangewezen_geval
