---
name: Build and Push Docker Image

on:
  workflow_call:
    inputs:
      # Alleen de naam, zonder org: de namespace volgt de eigenaar van de repo,
      # zodat een transfer naar een andere org de pipeline niet breekt.
      image-name:
        required: true
        type: string
      dockerfile:
        required: true
        type: string
      context:
        required: false
        type: string
        default: '.'
      cache-scope:
        required: false
        type: string
        default: ''
      # Optional Dockerfile stage to build (--target); empty means the default
      # (last) stage.
      target:
        required: false
        type: string
        default: ''
      # Optional newline-separated list of build args (NAME=value); empty means
      # none.
      build-args:
        required: false
        type: string
        default: ''
      # Cache of only the dependency stage (`deps`), written by
      # warm-buildcache.yml. Empty for images without the Rust workspace.
      deps-cache-scope:
        required: false
        type: string
        default: ''
    outputs:
      image-tag:
        description: Docker image tags
        value: ${{ jobs.build.outputs.image-tag }}
      image-digest:
        description: Docker image digest
        value: ${{ jobs.build.outputs.image-digest }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4

      - name: Log in to Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR wil een namespace in kleine letters, en expressies kennen geen
      # lowercase-functie.
      - name: Resolve registry namespace
        id: ns
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6
        with:
          images: ghcr.io/${{ steps.ns.outputs.owner }}/${{ inputs.image-name }}
          tags: |
            type=ref,event=pr,prefix=pr-
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          # Empty target/build-args are ignored by build-push-action, so
          # callers that do not set them are unaffected.
          target: ${{ inputs.target }}
          build-args: ${{ inputs.build-args }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # De cache ligt in GHCR, niet in de Actions-cache.
          #
          # Waarom weg van type=gha: die schrijft per git-ref, en op main is
          # dat funest. Een PR-run leest alle scopes die zijn token ziet, dus
          # ook die van main, maar main ziet alleen zichzelf. Daarbovenop
          # evicteert LRU precies het verkeerde: main's index-bestandjes worden
          # zelden aangeraakt en vliegen eruit, terwijl de bijbehorende
          # gigabytes aan blobs vers blijven omdat elke PR ze leest. Gemeten
          # gevolg: build-jobs op main mediaan 799s, op PR-branches 203s.
          #
          # Alleen main schrijft. Een PR leest main's cache en exporteert niet,
          # zodat er geen tags achterblijven die niemand opruimt (GHCR ruimt
          # untagged manifests niet automatisch op). Prijs: een PR die
          # Cargo.lock wijzigt bouwt de cook-laag bij elke push opnieuw.
          #
          # ignore-error omdat een mislukte export anders de hele buildstap
          # laat falen; fork-PR's mogen niet naar GHCR schrijven.
          cache-from: |
            type=registry,ref=ghcr.io/${{ steps.ns.outputs.owner }}/regelrecht-buildcache:${{ inputs.cache-scope != '' && inputs.cache-scope || 'default' }}
            ${{ inputs.deps-cache-scope != '' && format('type=registry,ref=ghcr.io/{0}/regelrecht-buildcache:{1}-deps', steps.ns.outputs.owner, inputs.deps-cache-scope) || '' }}
          cache-to: ${{ github.ref == 'refs/heads/main' && format('type=registry,ref=ghcr.io/{0}/regelrecht-buildcache:{1},mode=max,ignore-error=true', steps.ns.outputs.owner, inputs.cache-scope != '' && inputs.cache-scope || 'default') || '' }}
          secrets: |
            GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}
