---
name: Build and Deploy

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed, labeled, unlabeled]

permissions: {}

env:
  REGISTRY: ghcr.io
  ZAD_PROJECT: regel-k4c

jobs:
  # Deze job is de poort van de hele keten: alles wat bouwt of deployt hangt er
  # via `needs: changes` aan, dus wat hier niet doorkomt kost geen runner.
  #
  # Een PR bouwt alleen met het label `deploy:preview` erop. Getoetst op aanwezigheid
  # van het label, niet op het soort gebeurtenis, zodat dezelfde regel geldt bij
  # openen, bij elke volgende commit en op het moment dat het label erbij komt.
  # Bij `unlabeled` bouwt de keten nooit; dat event bestaat hier alleen om
  # cleanup-preview af te trappen.
  #
  # Een fork-PR krijgt geen secrets en een read-only GITHUB_TOKEN, dus de push
  # naar GHCR faalt daar per definitie.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      github.event.action != 'closed' &&
      github.event.action != 'unlabeled' &&
      github.event.pull_request.head.repo.fork != true &&
      (
        github.event_name == 'push' ||
        contains(github.event.pull_request.labels.*.name, 'deploy:preview')
      )
    permissions:
      contents: read
    outputs:
      editor: ${{ steps.filter.outputs.editor }}
      admin: ${{ steps.filter.outputs.admin }}
      harvester-worker: ${{ steps.filter.outputs.harvester-worker }}
      enrich-worker: ${{ steps.filter.outputs.enrich-worker }}
      pipeline-api: ${{ steps.filter.outputs.pipeline-api }}
      grafana: ${{ steps.filter.outputs.grafana }}
      lawmaking: ${{ steps.filter.outputs.lawmaking }}
      docs: ${{ steps.filter.outputs.docs }}
      demo: ${{ steps.filter.outputs.demo }}
      poc: ${{ steps.filter.outputs.poc }}
      poc-napp: ${{ steps.filter.outputs.poc-napp }}
      poc-vakantieverlof: ${{ steps.filter.outputs.poc-vakantieverlof }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # De diff tegen de base (PR) of tegen de vorige commit (push) bepaalt
          # welke bestanden gewijzigd zijn.
          fetch-depth: 0

      - name: Bepaal gewijzigde bestanden
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # Een lege of nul-SHA (nieuwe branch, eerste push) betekent: geen
          # betrouwbare diff, dus alles bouwen. Dat regelt het script zelf als
          # de lijst leeg blijft.
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ] \
             && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git diff --name-only "$BASE_SHA" HEAD > changed.txt
          else
            : > changed.txt
          fi
          echo "Gewijzigde bestanden: $(wc -l < changed.txt)"

      # Welke componenten geraakt worden volgt uit de dependency-graaf van
      # cargo, niet uit een handmatige padenlijst. Die lijst dreef weg:
      # packages/auth en packages/law-model stonden er nergens in, terwijl
      # editor-api en admin op auth leunen en engine, corpus, pipeline en
      # harvester op law-model. Faalt het script, dan zet het alles op true.
      # Dezelfde Node als waarmee de testsuite in ci.yml draait. Dit script
      # bepaalt wat er naar productie gaat; het hoort niet stil mee te
      # verschuiven met wat er toevallig op de runner staat.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v6
        with:
          node-version: '22'

      - name: Bepaal geraakte componenten
        id: filter
        run: node script/deploy-filters.mjs --from-file changed.txt

  # ci.yml en deze workflow hangen allebei aan `push` op main en weten niets van
  # elkaar; er is geen `needs` tussen twee workflows. Op commit 4518c575 faalde
  # CI op Security Audit en ging de productie-deploy diezelfde minuut door.
  #
  # Deze baan staat vóór de builds en niet vóór de deploy. build-image.yml tagt
  # op main `latest` en pusht die naar GHCR; stond de poort achteraan, dan was
  # dat image van een rood commit al gepubliceerd en scant de wekelijkse scan
  # precies die tag.
  #
  # Geen job-level `if:`, maar guards per stap, zodat de baan op een pull request
  # gewoon rapporteert in plaats van over te slaan. Een overgeslagen voorganger
  # zou anders elke build meeslepen.
  ci-green:
    name: Wacht op een groene CI
    runs-on: ubuntu-latest
    # Ruim boven MAX_WAIT_SECONDS hieronder, zodat het script zelf stopt met een
    # leesbare melding in plaats van dat Actions de job afkapt.
    timeout-minutes: 25
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        with:
          fetch-depth: 1

      - name: Wacht op een groene CI voor deze commit
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          MAX_WAIT_SECONDS: '1200'
        run: script/require-ci-green.sh

      - name: Niet van toepassing
        if: "!(github.ref == 'refs/heads/main' && github.event_name == 'push')"
        run: echo "Alleen een push op main wacht op CI; een preview bouwt op verzoek."

  # -- Build jobs --
  build:
    needs: [changes, ci-green]
    if: >-
      github.event.action != 'closed' &&
      (
        needs.changes.outputs.editor == 'true' ||
        contains(github.event.pull_request.labels.*.name, 'deploy:editor')
      )
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yml
    with:
      image-name: regelrecht-editor
      dockerfile: frontend/Dockerfile
      cache-scope: editor
    # Only GITHUB_TOKEN is needed; it is automatically available to called workflows

  build-admin:
    needs: [changes, ci-green]
    if: github.event.action != 'closed' && needs.changes.outputs.admin == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yml
    with:
      image-name: regelrecht-admin
      dockerfile: packages/admin/Dockerfile
      cache-scope: admin
    # Only GITHUB_TOKEN is needed; it is automatically available to called workflows

  build-harvester-worker:
    needs: [changes, ci-green]
    if: github.event.action != 'closed' && needs.changes.outputs.harvester-worker == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yml
    with:
      image-name: regelrecht-harvester-worker
      dockerfile: packages/pipeline/Dockerfile
      target: harvester-worker
      build-args: BIN=regelrecht-harvest-worker
      cache-scope: harvester-worker
    # Only GITHUB_TOKEN is needed; it is automatically available to called workflows

  build-enrich-worker:
    needs: [changes, ci-green]
    if: >-
      github.event.action != 'closed' &&
      (
        needs.changes.outputs.enrich-worker == 'true' ||
        contains(github.event.pull_request.labels.*.name, 'deploy:enrich-worker')
      )
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yml
    with:
      image-name: regelrecht-enrich-worker
      dockerfile: packages/pipeline/Dockerfile
      target: enrich-worker
      build-args: BIN=regelrecht-enrich-worker
      cache-scope: enrich-worker
    # Only GITHUB_TOKEN is needed; it is automatically available to called workflows

  build-pipeline-api:
    needs: [changes, ci-green]
    if: github.event.action != 'closed' && needs.changes.outputs.pipeline-api == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yml
    with:
      image-name: regelrecht-pipeline-api
      dockerfile: packages/pipeline/Dockerfile
      target: pipeline-api
      build-args: BIN=regelrecht-pipeline-api
      cache-scope: pipeline-api

  build-grafana:
    needs: [changes, ci-green]
    if: >-
      github.ref == 'refs/heads/main' && github.event_name == 'push' &&
      needs.changes.outputs.grafana == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yml
    with:
      image-name: regelrecht-grafana
      dockerfile: packages/grafana/Dockerfile
      context: ./packages/grafana
      cache-scope: grafana
    # Only GITHUB_TOKEN is needed; it is automatically available to called workflows

  build-lawmaking:
    needs: [changes, ci-green]
    if: github.event.action != 'closed' && needs.changes.outputs.lawmaking == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yml
    with:
      image-name: regelrecht-lawmaking
      dockerfile: frontend-lawmaking/Dockerfile
      cache-scope: lawmaking
    # Only GITHUB_TOKEN is needed; it is automatically available to called workflows

  build-poc-napp:
    needs: [changes, ci-green]
    if: github.event.action != 'closed' && needs.changes.outputs.poc-napp == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yml
    with:
      image-name: regelrecht-poc-napp
      dockerfile: packages/poc-napp/Dockerfile
      cache-scope: poc-napp

  build-poc-vakantieverlof:
    needs: [changes, ci-green]
    if: github.event.action != 'closed' && needs.changes.outputs.poc-vakantieverlof == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yml
    with:
      image-name: regelrecht-poc-vakantieverlof
      dockerfile: packages/poc-vakantieverlof/Dockerfile
      cache-scope: poc-vakantieverlof

  build-poc:
    needs: [changes, ci-green]
    if: github.event.action != 'closed' && needs.changes.outputs.poc == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yml
    with:
      image-name: regelrecht-poc
      dockerfile: packages/poc-portal/Dockerfile
      cache-scope: poc

  build-docs:
    needs: [changes, ci-green]
    if: github.event.action != 'closed' && needs.changes.outputs.docs == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yml
    with:
      image-name: regelrecht-docs
      dockerfile: docs/Dockerfile
      cache-scope: docs
    # Only GITHUB_TOKEN is needed; it is automatically available to called workflows

  # De demo bouwt de engine als WASM in de image zelf (frontend-demo/Dockerfile),
  # dus deze bouwt langer dan de andere frontends.
  build-demo:
    needs: [changes, ci-green]
    if: github.event.action != 'closed' && needs.changes.outputs.demo == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yml
    with:
      image-name: regelrecht-demo
      dockerfile: frontend-demo/Dockerfile
      cache-scope: demo
    # Only GITHUB_TOKEN is needed; it is automatically available to called workflows

  # -- Deploy preview --
  deploy-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build, build-admin, build-harvester-worker, build-enrich-worker, build-pipeline-api, build-lawmaking, build-docs, build-demo, build-poc, build-poc-napp, build-poc-vakantieverlof, changes]
    if: >-
      always() &&
      github.event_name == 'pull_request' && github.event.action != 'closed' &&
      !cancelled() &&
      (
        needs.build.result == 'success' ||
        needs.build-admin.result == 'success' ||
        needs.build-harvester-worker.result == 'success' ||
        needs.build-enrich-worker.result == 'success' ||
        needs.build-pipeline-api.result == 'success' ||
        needs.build-lawmaking.result == 'success' ||
        needs.build-demo.result == 'success' ||
        needs.build-docs.result == 'success' ||
        needs.build-poc.result == 'success' ||
        needs.build-poc-napp.result == 'success' ||
        needs.build-poc-vakantieverlof.result == 'success'
      )
    permissions:
      pull-requests: write
    environment:
      name: pr${{ github.event.pull_request.number }}
      url: ${{ steps.editor-url.outputs.url }}

    steps:
      - name: Get short SHA
        id: sha
        run: echo "short=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      # ZAD kent per deployment één taak-scope: een tweede taak voor pr<N> zet de
      # eerste opzij ("superseded", zie RIG-Cluster features/task-supersede.md).
      # Componenten los deployen kan daarom niet parallel; ze gaan als één lijst
      # in één upsert-taak, die ze samen commit en in één ArgoCD-sync uitrolt.
      - name: Stel de componentenlijst samen
        id: plan
        env:
          SHA: ${{ steps.sha.outputs.short }}
          EDITOR: ${{ needs.build.result }}
          ADMIN: ${{ needs.build-admin.result }}
          HARVESTER_WORKER: ${{ needs.build-harvester-worker.result }}
          ENRICH_WORKER: ${{ needs.build-enrich-worker.result }}
          PIPELINE_API: ${{ needs.build-pipeline-api.result }}
          LAWMAKING: ${{ needs.build-lawmaking.result }}
          DEMO: ${{ needs.build-demo.result }}
          DOCS: ${{ needs.build-docs.result }}
          POC: ${{ needs.build-poc.result }}
          POC_NAPP: ${{ needs.build-poc-napp.result }}
          POC_VAKANTIEVERLOF: ${{ needs.build-poc-vakantieverlof.result }}
        run: |
          set -euo pipefail
          COMPONENTS='[]'
          add() {
            COMPONENTS=$(jq -c --arg name "$1" --arg image "${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/$2:sha-${SHA}" \
              '. + [{name: $name, image: $image}]' <<<"$COMPONENTS")
          }

          # De editor gaat als eerste in de lijst: de action leidt de
          # environment-URL af van de eerste component.
          if [ "$EDITOR" = success ]; then add editor regelrecht-editor; fi
          if [ "$ADMIN" = success ]; then add harvester-admin regelrecht-admin; fi
          if [ "$HARVESTER_WORKER" = success ]; then add harvester-worker regelrecht-harvester-worker; fi
          if [ "$ENRICH_WORKER" = success ]; then add enrichworker regelrecht-enrich-worker; fi
          if [ "$PIPELINE_API" = success ]; then add pipelineapi regelrecht-pipeline-api; fi
          if [ "$LAWMAKING" = success ]; then add lawmaking regelrecht-lawmaking; fi
          if [ "$DEMO" = success ]; then add demo regelrecht-demo; fi
          if [ "$DOCS" = success ]; then add docs regelrecht-docs; fi
          if [ "$POC" = success ]; then add poc regelrecht-poc; fi
          if [ "$POC_NAPP" = success ]; then add napp regelrecht-poc-napp; fi
          if [ "$POC_VAKANTIEVERLOF" = success ]; then add vakantieverlof regelrecht-poc-vakantieverlof; fi

          jq -r '.[] | "  \(.name): \(.image)"' <<<"$COMPONENTS"
          echo "components=$COMPONENTS" >> "$GITHUB_OUTPUT"

      - name: Deploy to ZAD (Preview)
        id: deploy
        uses: RijksICTGilde/zad-actions/deploy@4ac541a57542a22bde95b28f3ace4ee3123acd7a  # v4.2.0
        with:
          api-key: ${{ secrets.RIG_API_KEY }}
          project-id: ${{ env.ZAD_PROJECT }}
          deployment-name: pr${{ github.event.pull_request.number }}
          components: ${{ steps.plan.outputs.components }}
          # Bepaalt alleen de hostnaam-vorm. Of een component publiek bereikbaar
          # is, hangt aan publish-on-web in de gekloonde config: pipeline-api
          # heeft dat niet en blijft dus in-cluster, net als in productie.
          domain-format: component-deployment-project
          clone-from: regelrecht
          force-clone: false
          # De standaard van 300 seconden lag midden in de normale duur van
          # een preview-deploy: geslaagde runs duurden tot 568s, gefaalde
          # vielen al om na 251s (#1144). Een verlopen wachttijd zegt alleen
          # dat ZAD trager was dan het venster, de deploy loopt door, maar
          # de job werd rood en de preview-URL kwam niet in de PR. 900s
          # blijft binnen de timeout-minutes van de job.
          task-timeout: '900'
          comment-on-pr: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          comment-header: '## Preview Deployment'

      - name: Editor-URL voor de environment
        id: editor-url
        if: needs.build.result == 'success'
        env:
          URLS: ${{ steps.deploy.outputs.urls }}
        run: echo "url=$(jq -r '.editor // empty' <<<"$URLS")" >> "$GITHUB_OUTPUT"

      - name: Verklaar een mislukte deploy
        if: failure() && steps.deploy.outcome == 'failure'
        env:
          COMPONENTS: ${{ steps.plan.outputs.components }}
        run: |
          echo "::notice::Deploy van pr${{ github.event.pull_request.number }} mislukt voor: $(jq -r '[.[].name] | join(", ")' <<<"$COMPONENTS")"
          echo "'status: superseded' in de output hierboven betekent dat een nieuwere taak"
          echo "voor dit deployment (een nieuwe push, of het opruimen van een gesloten PR)"
          echo "het werk heeft overgenomen. Deze job opnieuw draaien is dan veilig."
          echo "Iets anders? Zie 'Debugging a failed preview deploy' in docs/src/content/docs/operations/deployment.md."

  # -- Deploy production --
  deploy-production:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Twee main-runs deployen onafhankelijk naar hetzelfde ZAD-deployment, en
    # zonder wachtrij wint niet de nieuwste commit maar degene die toevallig als
    # laatste aankomt. Op 17 september 2026 bouwde de run van #1448 het
    # docs-image met rfc-026 tot en met rfc-033 en rolde dat om 11:44:12 uit;
    # de run van #1457, van een oudere commit, deployde om 11:46:06 zijn eigen
    # docs-image daaroverheen. De RFC's stonden daarna niet op de site, terwijl
    # beide runs deden wat ze moesten doen.
    #
    # `cancel-in-progress: false`, want een deploy die halverwege wordt afgekapt
    # laat het deployment in een onbekende toestand achter; te laat is beter dan
    # half. Wachtenden worden wél opgeruimd: GitHub houdt alleen de nieuwste
    # wachtende run vast en annuleert de rest. Dat is hier de gewenste uitkomst,
    # want die nieuwste draagt de laatste staat van main. Zo'n geannuleerde run
    # kleurt rood zonder dat er iets mis is met de deploy; hij was ingehaald.
    #
    # De groep heeft een vaste naam en geen `github.ref`: deze job draait alleen
    # op main, en juist álle main-runs horen in dezelfde wachtrij.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    needs: [build, build-admin, build-harvester-worker, build-enrich-worker, build-pipeline-api, build-grafana, build-lawmaking, build-docs, build-demo, build-poc, build-poc-napp, build-poc-vakantieverlof]
    if: >-
      always() &&
      github.ref == 'refs/heads/main' && github.event_name == 'push' &&
      !cancelled() &&
      (
        needs.build.result == 'success' ||
        needs.build-admin.result == 'success' ||
        needs.build-harvester-worker.result == 'success' ||
        needs.build-enrich-worker.result == 'success' ||
        needs.build-pipeline-api.result == 'success' ||
        needs.build-grafana.result == 'success' ||
        needs.build-lawmaking.result == 'success' ||
        needs.build-demo.result == 'success' ||
        needs.build-docs.result == 'success' ||
        needs.build-poc.result == 'success' ||
        needs.build-poc-napp.result == 'success' ||
        needs.build-poc-vakantieverlof.result == 'success'
      )
    permissions:
      # Voor script/check-deployed-urls.sh onderaan.
      contents: read
    environment:
      name: production
      url: ${{ steps.editor-url.outputs.url }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      # Faalt één gevraagd image, dan gaat er niets. De conditie hierboven laat
      # de deploy al door zodra één build slaagt, en de lijst hieronder neemt
      # alleen de geslaagde mee: het gevolg was dat een component stil op zijn
      # vorige image bleef staan terwijl de rest meeschoof. De editor en
      # editor-api delen een contract, dus dat is geen halve deploy maar een
      # inconsistente. Nooit gebeurd in de laatste honderd runs op main, en dat
      # is precies waarom het onopgemerkt kon blijven.
      - name: Weiger een halve deploy
        env:
          RESULTS: >-
            ${{ needs.build.result }} ${{ needs.build-admin.result }}
            ${{ needs.build-harvester-worker.result }} ${{ needs.build-enrich-worker.result }}
            ${{ needs.build-pipeline-api.result }} ${{ needs.build-grafana.result }}
            ${{ needs.build-lawmaking.result }} ${{ needs.build-docs.result }}
            ${{ needs.build-demo.result }} ${{ needs.build-poc.result }} ${{ needs.build-poc-napp.result }}
            ${{ needs.build-poc-vakantieverlof.result }}
        run: |
          case " $RESULTS " in
            *" failure "*|*" cancelled "*)
              echo "::error title=Deploy-poort::Niet elk gevraagd image is gebouwd ($RESULTS). Een deploy zou de rest vooruit zetten en het gevallen component op zijn vorige image laten staan; er gaat daarom niets naar productie."
              exit 1
              ;;
          esac
          echo "Geen gevallen build; alle gevraagde images staan klaar."

      - name: Get short SHA
        id: sha
        run: echo "short=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      # Dezelfde reden als bij de preview: ZAD kent per deployment één
      # taak-scope, dus een tweede taak voor regelrecht zet de eerste opzij
      # ("superseded"). Alle componenten gaan als één lijst in één upsert-taak.
      - name: Stel de componentenlijst samen
        id: plan
        env:
          SHA: ${{ steps.sha.outputs.short }}
          EDITOR: ${{ needs.build.result }}
          ADMIN: ${{ needs.build-admin.result }}
          HARVESTER_WORKER: ${{ needs.build-harvester-worker.result }}
          ENRICH_WORKER: ${{ needs.build-enrich-worker.result }}
          PIPELINE_API: ${{ needs.build-pipeline-api.result }}
          GRAFANA: ${{ needs.build-grafana.result }}
          LAWMAKING: ${{ needs.build-lawmaking.result }}
          DEMO: ${{ needs.build-demo.result }}
          DOCS: ${{ needs.build-docs.result }}
          POC: ${{ needs.build-poc.result }}
          POC_NAPP: ${{ needs.build-poc-napp.result }}
          POC_VAKANTIEVERLOF: ${{ needs.build-poc-vakantieverlof.result }}
        run: |
          set -euo pipefail
          COMPONENTS='[]'
          add() {
            COMPONENTS=$(jq -c --arg name "$1" --arg image "${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/$2:sha-${SHA}" \
              '. + [{name: $name, image: $image}]' <<<"$COMPONENTS")
          }

          # De editor gaat als eerste in de lijst: de action leidt de
          # environment-URL af van de eerste component.
          if [ "$EDITOR" = success ]; then add editor regelrecht-editor; fi
          if [ "$ADMIN" = success ]; then add harvester-admin regelrecht-admin; fi
          if [ "$HARVESTER_WORKER" = success ]; then add harvester-worker regelrecht-harvester-worker; fi
          if [ "$ENRICH_WORKER" = success ]; then add enrichworker regelrecht-enrich-worker; fi
          if [ "$PIPELINE_API" = success ]; then add pipelineapi regelrecht-pipeline-api; fi
          # Grafana bouwt alleen op main, dus alleen productie kent deze regel.
          if [ "$GRAFANA" = success ]; then add grafana regelrecht-grafana; fi
          if [ "$LAWMAKING" = success ]; then add lawmaking regelrecht-lawmaking; fi
          if [ "$DEMO" = success ]; then add demo regelrecht-demo; fi
          if [ "$DOCS" = success ]; then add docs regelrecht-docs; fi
          if [ "$POC" = success ]; then add poc regelrecht-poc; fi
          if [ "$POC_NAPP" = success ]; then add napp regelrecht-poc-napp; fi
          if [ "$POC_VAKANTIEVERLOF" = success ]; then add vakantieverlof regelrecht-poc-vakantieverlof; fi

          jq -r '.[] | "  \(.name): \(.image)"' <<<"$COMPONENTS"
          echo "components=$COMPONENTS" >> "$GITHUB_OUTPUT"

      # Geen clone-from: regelrecht is zelf de bron waar de previews van
      # klonen. Geen domain-format: de hostnamen van productie liggen vast in
      # de bestaande config en moeten daar niet door een deploy verschuiven.
      - name: Deploy to ZAD (Production)
        id: deploy
        uses: RijksICTGilde/zad-actions/deploy@4ac541a57542a22bde95b28f3ace4ee3123acd7a  # v4.2.0
        with:
          api-key: ${{ secrets.RIG_API_KEY }}
          project-id: ${{ env.ZAD_PROJECT }}
          deployment-name: regelrecht
          components: ${{ steps.plan.outputs.components }}

      - name: Editor-URL voor de environment
        id: editor-url
        if: needs.build.result == 'success'
        env:
          URLS: ${{ steps.deploy.outputs.urls }}
        run: echo "url=$(jq -r '.editor // empty' <<<"$URLS")" >> "$GITHUB_OUTPUT"

      # De poort vooraan bewaakt dat er niets van een rood commit uitgaat en dat
      # er geen halve uitrol plaatsvindt. Geen van beide zegt iets over de
      # uitkomst, en daar bestond verder geen enkele controle voor.
      - name: Controleer of productie antwoordt
        env:
          URLS: ${{ steps.deploy.outputs.urls }}
        run: script/check-deployed-urls.sh

      - name: Verklaar een mislukte deploy
        if: failure() && steps.deploy.outcome == 'failure'
        env:
          COMPONENTS: ${{ steps.plan.outputs.components }}
        run: |
          echo "::notice::Deploy van regelrecht mislukt voor: $(jq -r '[.[].name] | join(", ")' <<<"$COMPONENTS")"
          echo "'status: superseded' in de output hierboven betekent dat een nieuwere taak"
          echo "voor dit deployment (een volgende merge naar main) het werk heeft overgenomen."
          echo "Deze job opnieuw draaien is dan veilig."
          echo "Iets anders? Zie 'Debugging a failed preview deploy' in docs/src/content/docs/operations/deployment.md."

  # -- Cleanup preview --
  cleanup-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Het label eraf halen ruimt op, net als het sluiten van de PR: een preview
    # waar niemand meer naar kijkt hoort niet te blijven draaien. Zat het label
    # er nooit op, dan valt er niets te verwijderen en doet deze job niets.
    #
    # Een fork-PR heeft nooit gebouwd of gedeployd, dus er valt niets op te
    # ruimen en de GHCR-aanroepen zouden alleen maar op rechten stuklopen.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.fork != true &&
      (
        github.event.action == 'closed' ||
        (github.event.action == 'unlabeled' && github.event.label.name == 'deploy:preview')
      )
    permissions:
      packages: write
      deployments: write
      pull-requests: write

    steps:
      - name: Cleanup ZAD deployment and container images
        uses: RijksICTGilde/zad-actions/cleanup@4ac541a57542a22bde95b28f3ace4ee3123acd7a  # v4.2.0
        with:
          api-key: ${{ secrets.RIG_API_KEY }}
          project-id: ${{ env.ZAD_PROJECT }}
          deployment-name: pr${{ github.event.pull_request.number }}
          delete-github-env: true
          delete-github-deployments: true
          delete-container: true
          containers: >-
            [
              {"org": "${{ github.repository_owner }}", "name": "regelrecht-editor", "tag": "pr-${{ github.event.pull_request.number }}"},
              {"org": "${{ github.repository_owner }}", "name": "regelrecht-admin", "tag": "pr-${{ github.event.pull_request.number }}"},
              {"org": "${{ github.repository_owner }}", "name": "regelrecht-harvester-worker", "tag": "pr-${{ github.event.pull_request.number }}"},
              {"org": "${{ github.repository_owner }}", "name": "regelrecht-enrich-worker", "tag": "pr-${{ github.event.pull_request.number }}"},
              {"org": "${{ github.repository_owner }}", "name": "regelrecht-pipeline-api", "tag": "pr-${{ github.event.pull_request.number }}"},
              {"org": "${{ github.repository_owner }}", "name": "regelrecht-lawmaking", "tag": "pr-${{ github.event.pull_request.number }}"},
              {"org": "${{ github.repository_owner }}", "name": "regelrecht-demo", "tag": "pr-${{ github.event.pull_request.number }}"},
              {"org": "${{ github.repository_owner }}", "name": "regelrecht-docs", "tag": "pr-${{ github.event.pull_request.number }}"},
              {"org": "${{ github.repository_owner }}", "name": "regelrecht-poc", "tag": "pr-${{ github.event.pull_request.number }}"},
              {"org": "${{ github.repository_owner }}", "name": "regelrecht-poc-napp", "tag": "pr-${{ github.event.pull_request.number }}"},
              {"org": "${{ github.repository_owner }}", "name": "regelrecht-poc-vakantieverlof", "tag": "pr-${{ github.event.pull_request.number }}"}
            ]
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-admin-token: ${{ secrets.ADMIN_TOKEN }}
          comment-header: '## Preview Deployment'

      # De sha-opruiming die hier stond kon het image onder productie vandaan
      # halen en draait nu in scheduled-cleanup.yml.
