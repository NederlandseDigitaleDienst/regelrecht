---
name: Setup sccache
description: >-
  Install sccache with the GitHub Actions cache as storage, and set
  RUSTC_WRAPPER only when the sccache server starts. When the cache storage is
  unreachable the job builds without sccache and gets a warning.

# The jobs do not set RUSTC_WRAPPER, SCCACHE_GHA_ENABLED or CARGO_INCREMENTAL
# themselves: start-server.sh writes them to GITHUB_ENV, so this action is the
# one place that decides whether cargo goes through sccache. Why the decision
# needs a pre-flight start instead of SCCACHE_IGNORE_SERVER_IO_ERROR is in
# start-server.sh.

runs:
  using: composite
  steps:
    - name: Install sccache
      uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba  # v0.0.11
      with:
        # Pinned: start-server.sh relies on how this release fails at startup.
        # Without a version the action installs the latest sccache release.
        version: v0.19.0

    - name: Start sccache server
      shell: bash
      env:
        SCCACHE_GHA_ENABLED: 'true'
        SCCACHE_IDLE_TIMEOUT: '0'
      run: ${{ github.action_path }}/start-server.sh
