---
# The base domain. With surfaces.split (the default) citizens reach the app on
# burger.wetsproces.<domain> and employees on medewerkers.wetsproces.<domain>;
# with one instance it is served on wetsproces.<domain>.
domain: ''
# The base host instead of wetsproces.<domain>: the host of the single
# instance, or the base of burger.<host> and medewerkers.<host>.
host: ''

image:
  # Built from this repository by .forgejo/workflows/wetsproces-image.yml, which
  # tags every build on main with its commit and then sets this line (and
  # appVersion in Chart.yaml) to that build, in a commit of its own on main. A
  # release that leaves image.ref out of its values follows main that way. The
  # screens come from the image and the case from case.ref; with case.ref main
  # the two stay close.
  ref: code.digitaledienst.overheid.nl/regelrecht/wetsproces:7122ddee6fa9d00a4b6aef5e86829fe03c054f85
  pullPolicy: IfNotPresent

# The case: a public git repository with a source manifest (bron.yaml). An init
# container clones it, shallow, into /case before the server starts.
case:
  # HTTPS URL of the public repository.
  repoUrl: https://code.digitaledienst.overheid.nl/regelrecht/fieldlab-2026.git
  # Branch, tag or full commit. .forgejo/workflows/wetsproces-image.yml sets
  # it to the commit of each new image while repoUrl is this repository, so
  # the case and the code that reads it always come from the same commit: a
  # case from a later commit may need a parser the image does not have yet.
  ref: main
  # Path of the manifest inside the repository. The manifest's `repo_root` is
  # resolved from there, so ../.. points at /case for the default path.
  path: packages/wetsproces/bron.yaml
  # A Secret in the release's namespace with the keys `username` and `token`,
  # for a private repository; empty for a public one. The init container
  # hands them to git as the credentials of repoUrl, and they stay out of the
  # pod's arguments.
  credentialsSecret: ''

# The image that clones the case.
gitImage:
  ref: alpine/git:2.54.0@sha256:6a1fdb962814ca11508ca8d1bab94375b5b7ac4e4a9a40981c29fc32c02f095d
  pullPolicy: IfNotPresent

# Test mode with the test login. Stable mode needs Keycloak and is not
# supported by this chart yet. Where the chronicles live follows from
# `database`, which side an instance serves from `surfaces`.
wetsproces:
  mode: test
  # The surface of the single instance; ignored with surfaces.split.
  surface: all
  login: testlogin

# PostgreSQL for the chronicles, the test clock and the sessions, as a
# CloudNativePG Cluster of this release. Off, the chronicles live in memory and
# are gone at every restart. Needs the CNPG operator on the cluster; the chart
# refuses to render without it. On by default, as the fieldlab runs on ZAD.
database:
  enabled: true
  # PostgreSQL instances; more than one adds replicas the server does not read.
  instances: 1
  storage:
    size: 1Gi
    # Empty takes the cluster's default StorageClass.
    storageClass: ''
  # The image catalog CNPG picks the PostgreSQL image from. An empty name
  # leaves the choice to the operator's default image.
  imageCatalog:
    kind: ClusterImageCatalog
    name: postgresql-standard-trixie
    major: 18
  # WETSPROCES_DB_MAX_CONNECTIONS per instance; at least 2, because the
  # migration holds its lock on one connection while it migrates on another.
  maxConnections: 5
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 1Gi

# Citizens and employees on two instances with an address each, both on the
# database above, as on ZAD. Off, one instance serves wetsproces.surface on the
# host; with `database.enabled: false` that is the small setup in memory.
surfaces:
  split: true
  burger:
    # Empty means burger.<host>.
    host: ''
  backoffice:
    # Empty means medewerkers.<host>.
    host: ''

# How the screens look.
theme:
  # The accent colour: the name of a theme of the NLDD design system
  # (bruin, donkerblauw, donkerbruin, donkergeel, donkergroen, geel, groen,
  # hemelblauw, lichtblauw, mintgroen, mosgroen, oranje, paars, robijnrood,
  # rood, roze or violet). Empty keeps the design system's own accent.
  accentColor: ''

gateway:
  # How the hosts are reached. Both modes make a Gateway API Gateway of this
  # release, which terminates TLS with a Let's Encrypt certificate per host,
  # and an HTTPRoute per host to its instance.
  #
  # - shared (the default): behind a Gateway the cluster already has, such as
  #   the Haven+ `public-gateway` on cluster-a, whose wildcard DNS name covers
  #   every host under the cluster's domain. Its TLS listener passes the TLS
  #   of this release's hosts through to this release's Gateway (a TLSRoute),
  #   and its HTTP listener carries the ACME challenge and the redirect to
  #   HTTPS. This release's Gateway then needs no public address: its Service
  #   is a ClusterIP. A host must be one label under the wildcard
  #   (x.cluster-a.fieldlab2026.nl); burger.x.cluster-a.fieldlab2026.nl is not
  #   covered by it, so set surfaces.*.host.
  # - own: this release's Gateway takes a public address of its own, with an
  #   HTTP listener of its own; the hosts need DNS records to it (see dns).
  mode: shared
  # The shared Gateway and its listeners, for mode shared. Both listeners
  # must accept routes from this namespace.
  shared:
    name: public-gateway
    namespace: istio-gateway
    httpListener: http
    tlsListener: tls-passthrough
  enabled: true
  className: istio
  # Mode own only: a fixed address for the Gateway. Empty lets the cluster pick one. On
  # cluster-a the addresses are ephemeral: the cloud controller allocates one
  # per Service and releases it with the Service, and refuses an address that
  # is not allocated to the project. Leave it empty there.
  address: ''
  # Mode own only: annotations on the Service the gateway controller creates. On cluster-a the
  # MetalLB pool does not assign addresses on its own, so the Service names it.
  serviceAnnotations:
    metallb.io/address-pool: internet-fire-ephemeral

dns:
  # Mode own only. A DNSEndpoint with an A record per host, for an external-dns that reads
  # them (source crd), such as the one on cluster-a for its zone
  # cluster-a.fieldlab2026.nl.
  enabled: false
  # The address the records point at; empty takes gateway.address. One of the
  # two is required, and it must be an address reserved for the project (ask a
  # Fundament operator): on cluster-a the Gateway's own address is ephemeral,
  # and a record left on it would point at whoever gets the address next. An
  # external-dns with upsert-only, as on cluster-a, never removes a record, so
  # remove the records by hand after an uninstall.
  target: ''
  ttl: 300

tls:
  # The chart creates a namespaced cert-manager Issuer for Let's Encrypt, with
  # the HTTP-01 solver on the Gateway above: staging or production. Use staging
  # until the Gateway and the route work; production has a weekly rate limit
  # per domain.
  acme: staging
  # Contact address for the ACME account; optional.
  email: ''

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 1Gi
