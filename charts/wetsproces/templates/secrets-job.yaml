{{- $kcOn := .Values.keycloak.enabled }}
{{- $front := .Values.voorkant.enabled }}
{{- if or $kcOn $front }}
{{- $name := include "wetsproces.secretsJobName" . }}
{{- $kc := include "wetsproces.keycloakName" . }}
{{- $org := include "wetsproces.organisatieName" . }}
{{- $k := .Values.keycloak }}
{{- /* The Secrets the Job may touch, and the keys of the Secret of Keycloak. */}}
{{- $secrets := list }}
{{- $keys := list "admin-password" }}
{{- if $kcOn }}
{{- $secrets = append $secrets $kc }}
{{- range splitList "," (include "wetsproces.realmSides" .) }}
{{- $keys = append $keys (get $.Values.oidc.clients .).secretKey }}
{{- end }}
{{- if $k.testUsers }}
{{- $keys = append $keys $k.testPasswordKey }}
{{- end }}
{{- end }}
{{- if $front }}
{{- $secrets = append $secrets $org }}
{{- end }}
# The Secrets of this release are generated in the cluster, once, by the Job
# below: with keycloak.enabled the Secret <release>-keycloak (the admin
# password, the client secrets and the test password), with voorkant.enabled
# the Secret <release>-organisatie (the P-256 key the front signs with). They
# are no objects of the release, so an upgrade never changes them and an
# uninstall leaves them behind; a key that is missing is added, one that
# exists is kept.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "wetsproces.labels" . | nindent 4 }}
    app.kubernetes.io/component: secrets
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
# The Job talks to the API with this account's token.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  labels:
    {{- include "wetsproces.labels" . | nindent 4 }}
    app.kubernetes.io/component: secrets
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ range $i, $s := $secrets }}{{ if $i }}, {{ end }}{{ $s | quote }}{{ end }}]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "wetsproces.labels" . | nindent 4 }}
    app.kubernetes.io/component: secrets
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  labels:
    {{- include "wetsproces.labels" . | nindent 4 }}
    app.kubernetes.io/component: secrets
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        # A name of its own, so no Service of the release selects this pod.
        app.kubernetes.io/name: wetsproces-secrets
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ $name }}
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
      {{- if $front }}
      # The image with kubectl has no openssl, so a step before it writes a
      # new key to a volume in memory; the step after uses it only when the
      # Secret has no key yet.
      initContainers:
        - name: keygen
          image: {{ .Values.voorkant.keyImage.ref }}
          imagePullPolicy: {{ .Values.voorkant.keyImage.pullPolicy }}
          command: ["openssl"]
          # PKCS#8 PEM with the public key in it, as the server reads it.
          args: ["genpkey", "-algorithm", "EC", "-pkeyopt", "ec_paramgen_curve:P-256", "-out", "/work/private-key.pem"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: work
              mountPath: /work
      {{- end }}
      containers:
        - name: generate
          image: {{ $k.secretsJob.image.ref }}
          imagePullPolicy: {{ $k.secretsJob.image.pullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              label() {
                kubectl label --overwrite secret "$1" app.kubernetes.io/name=wetsproces \
                  app.kubernetes.io/instance={{ .Release.Name }} app.kubernetes.io/component="$2"
              }
              {{- if $kcOn }}
              NAME={{ $kc }}
              secret() { head -c 48 /dev/urandom | base64 | tr -d '/+=\n' | head -c 32; }
              if ! kubectl get secret "$NAME" >/dev/null 2>&1; then
                ARGS=""
                for KEY in {{ join " " $keys }}; do
                  ARGS="$ARGS --from-literal=$KEY=$(secret)"
                done
                kubectl create secret generic "$NAME" $ARGS
                label "$NAME" keycloak
                echo "created $NAME"
              else
                for KEY in {{ join " " $keys }}; do
                  if [ -z "$(kubectl get secret "$NAME" -o "jsonpath={.data.$KEY}")" ]; then
                    kubectl patch secret "$NAME" --type merge -p "{\"stringData\":{\"$KEY\":\"$(secret)\"}}"
                    echo "added $KEY to $NAME"
                  fi
                done
              fi
              {{- end }}
              {{- if $front }}
              NAME={{ $org }}
              if ! kubectl get secret "$NAME" >/dev/null 2>&1; then
                kubectl create secret generic "$NAME" --from-file=private-key=/work/private-key.pem
                label "$NAME" organisatie
                echo "created $NAME"
              elif [ -z "$(kubectl get secret "$NAME" -o "jsonpath={.data.private-key}")" ]; then
                kubectl patch secret "$NAME" --type merge \
                  -p "{\"data\":{\"private-key\":\"$(base64 < /work/private-key.pem | tr -d '\n')\"}}"
                echo "added private-key to $NAME"
              fi
              {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          {{- if $front }}
          volumeMounts:
            - name: work
              mountPath: /work
              readOnly: true
          {{- end }}
      {{- if $front }}
      volumes:
        - name: work
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
      {{- end }}
{{- end }}
