{{- if .Values.gateway.enabled }}
{{- $host := include "wetsproces.host" . }}
{{- $issuer := printf "%s-letsencrypt-%s" .Release.Name .Values.tls.acme }}
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ $issuer }}
  labels:
    {{- include "wetsproces.labels" . | nindent 4 }}
spec:
  acme:
    {{- if eq .Values.tls.acme "production" }}
    server: https://acme-v02.api.letsencrypt.org/directory
    {{- else }}
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    {{- end }}
    {{- with .Values.tls.email }}
    email: {{ . }}
    {{- end }}
    privateKeySecretRef:
      name: {{ $issuer }}-account
    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - group: gateway.networking.k8s.io
                kind: Gateway
                name: {{ .Release.Name }}
                sectionName: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "wetsproces.labels" . | nindent 4 }}
  annotations:
    # cert-manager's gateway shim makes the Certificate for the HTTPS listener.
    cert-manager.io/issuer: {{ $issuer }}
spec:
  gatewayClassName: {{ .Values.gateway.className }}
  {{- with .Values.gateway.address }}
  addresses:
    - type: IPAddress
      value: {{ . }}
  {{- end }}
  {{- with .Values.gateway.serviceAnnotations }}
  infrastructure:
    annotations:
      {{- toYaml . | nindent 6 }}
  {{- end }}
  listeners:
    - name: http
      hostname: {{ $host }}
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      hostname: {{ $host }}
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: {{ .Release.Name }}-tls
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "wetsproces.labels" . | nindent 4 }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Release.Name }}
      sectionName: https
  hostnames:
    - {{ $host }}
  rules:
    - backendRefs:
        - name: {{ .Release.Name }}
          port: 8000
---
# Plain HTTP goes to HTTPS. The ACME solver's route on the same listener
# matches its exact path, which takes precedence over this one.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}-redirect
  labels:
    {{- include "wetsproces.labels" . | nindent 4 }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Release.Name }}
      sectionName: http
  hostnames:
    - {{ $host }}
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
{{- end }}
