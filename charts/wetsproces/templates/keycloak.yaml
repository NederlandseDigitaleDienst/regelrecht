{{- if .Values.keycloak.enabled }}
{{- $kc := include "wetsproces.keycloakName" . }}
{{- $k := .Values.keycloak }}
{{- $sides := splitList "," (include "wetsproces.realmSides" .) }}
{{- /* The keys of the generated Secret. */}}
{{- $keys := list "admin-password" }}
{{- range $sides }}
{{- $keys = append $keys (get $.Values.oidc.clients .).secretKey }}
{{- end }}
{{- if $k.testUsers }}
{{- $keys = append $keys $k.testPasswordKey }}
{{- end }}
# The Secret of this Keycloak is generated in the cluster, once, by the Job
# below: the admin password, the client secrets and the test password. It is
# no object of the release, so an upgrade never changes it and an uninstall
# leaves it behind; a key that is missing is added, one that exists is kept.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $kc }}-secrets
  labels:
    {{- include "wetsproces.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
# The Job talks to the API with this account's token.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $kc }}-secrets
  labels:
    {{- include "wetsproces.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ $kc | quote }}]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $kc }}-secrets
  labels:
    {{- include "wetsproces.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $kc }}-secrets
subjects:
  - kind: ServiceAccount
    name: {{ $kc }}-secrets
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $kc }}-secrets
  labels:
    {{- include "wetsproces.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        {{- include "wetsproces.keycloakSelectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: secrets
    spec:
      serviceAccountName: {{ $kc }}-secrets
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: generate
          image: {{ $k.secretsJob.image.ref }}
          imagePullPolicy: {{ $k.secretsJob.image.pullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              NAME={{ $kc }}
              secret() { head -c 48 /dev/urandom | base64 | tr -d '/+=\n' | head -c 32; }
              if ! kubectl get secret "$NAME" >/dev/null 2>&1; then
                ARGS=""
                for KEY in {{ join " " $keys }}; do
                  ARGS="$ARGS --from-literal=$KEY=$(secret)"
                done
                kubectl create secret generic "$NAME" $ARGS
                kubectl label secret "$NAME" app.kubernetes.io/name=wetsproces \
                  app.kubernetes.io/instance={{ .Release.Name }} app.kubernetes.io/component=keycloak
                echo "created $NAME"
                exit 0
              fi
              for KEY in {{ join " " $keys }}; do
                if [ -z "$(kubectl get secret "$NAME" -o "jsonpath={.data.$KEY}")" ]; then
                  kubectl patch secret "$NAME" --type merge -p "{\"stringData\":{\"$KEY\":\"$(secret)\"}}"
                  echo "added $KEY to $NAME"
                fi
              done
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
---
# The realm (templates/_realm.tpl), imported at Keycloak's first start. Only
# placeholders here, no secrets: Keycloak fills them in from its environment.
# An existing realm is left alone, so a change here reaches a new database only.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $kc }}-realm
  labels:
    {{- include "wetsproces.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak
data:
  {{ $k.realm }}-realm.json: {{ include "wetsproces.realm" . | fromYaml | toJson | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $kc }}
  labels:
    {{- include "wetsproces.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak
spec:
  replicas: 1
  # One pod at a time: Keycloak migrates its database at start, and two
  # versions side by side during a rollout would race on that migration.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "wetsproces.keycloakSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "wetsproces.keycloakSelectorLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        # The user `keycloak` of the image.
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 0
        fsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: keycloak
          image: {{ $k.image.ref }}
          imagePullPolicy: {{ $k.image.pullPolicy }}
          args: ["start", "--import-realm"]
          env:
            - name: KC_HOSTNAME
              value: {{ printf "https://%s" (include "wetsproces.keycloakHost" .) | quote }}
            # TLS ends at the Gateway, which sets X-Forwarded-*.
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_PROXY_HEADERS
              value: xforwarded
            - name: KC_HEALTH_ENABLED
              value: "true"
            # One pod: no cluster cache to discover.
            - name: KC_CACHE
              value: local
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL_HOST
              value: {{ $kc }}-db-rw
            - name: KC_DB_URL_DATABASE
              value: app
            - name: KC_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ $kc }}-db-app
                  key: username
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $kc }}-db-app
                  key: password
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: admin
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $kc }}
                  key: admin-password
            # The placeholders of the realm.
            {{- range $sides }}
            - name: WETSPROCES_{{ upper . }}_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $kc }}
                  key: {{ (get $.Values.oidc.clients .).secretKey }}
            {{- end }}
            {{- if $k.testUsers }}
            - name: WETSPROCES_TEST_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $kc }}
                  key: {{ $k.testPasswordKey }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: management
              containerPort: 9000
              protocol: TCP
          # The first start builds Keycloak's configuration and migrates the
          # database, which takes a few minutes on a small share of a node.
          startupProbe:
            httpGet:
              path: /health/started
              port: management
            periodSeconds: 5
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /health/ready
              port: management
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: management
            periodSeconds: 20
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            # Keycloak writes its build to its own directory at start.
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml $k.resources | nindent 12 }}
          volumeMounts:
            - name: realm
              mountPath: /opt/keycloak/data/import
              readOnly: true
      volumes:
        - name: realm
          configMap:
            name: {{ $kc }}-realm
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $kc }}
  labels:
    {{- include "wetsproces.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak
spec:
  selector:
    {{- include "wetsproces.keycloakSelectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
{{- end }}
