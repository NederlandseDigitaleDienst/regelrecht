{{- include "wetsproces.checkLogin" . }}
{{- include "wetsproces.checkLink" . }}
{{- range $i, $inst := include "wetsproces.instances" . | fromJsonArray }}
{{- with $ }}
{{- if $i }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $inst.name }}
  labels:
    {{- include "wetsproces.labels" . | nindent 4 }}
    {{- if $inst.suffix }}
    app.kubernetes.io/component: {{ $inst.surface }}
    {{- end }}
spec:
  replicas: 1
  {{- if .Values.database.enabled }}
  # The chronicles are in PostgreSQL, so the old pod serves until the new one
  # is ready. The new one migrates under the advisory lock at startup and
  # only listens, and so only turns ready, once that is done; a pod killed
  # while it waits or migrates loses its connection and with it the lock.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  {{- else }}
  # Memory store: a second replica would hold a second, separate set of
  # chronicles. Recreate keeps it at one during a rollout too.
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "wetsproces.selectorLabels" . | nindent 6 }}
      {{- if $inst.suffix }}
      app.kubernetes.io/component: {{ $inst.surface }}
      {{- end }}
  template:
    metadata:
      labels:
        {{- include "wetsproces.selectorLabels" . | nindent 8 }}
        {{- if $inst.suffix }}
        app.kubernetes.io/component: {{ $inst.surface }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        # The user `app` of the wetsproces image.
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: clone-case
          image: {{ .Values.gitImage.ref }}
          # A failed clone leaves its last lines in the container status, where
          # the Fundament plugin reads why a wetsproces does not start.
          terminationMessagePolicy: FallbackToLogsOnError
          imagePullPolicy: {{ .Values.gitImage.pullPolicy }}
          # Fetch rather than clone: `git clone --branch` takes a branch or a
          # tag, `git fetch` also a commit, so a release can pin the case to
          # the commit its image was built from. Repository and ref come in
          # through the environment and never become part of the script.
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              git init -q /case
              cd /case
              {{- if .Values.case.credentialsSecret }}
              # git asks this helper for the credentials of repoUrl; it reads
              # them from the environment, so they never appear in the
              # arguments of a process.
              git config credential.helper '!f() { echo "username=${GIT_USERNAME}"; echo "password=${GIT_TOKEN}"; }; f'
              {{- end }}
              git fetch -q --depth=1 "$CASE_REPO" "$CASE_REF"
              git checkout -q FETCH_HEAD
          env:
            # The emptyDir at /case belongs to root and the step runs as
            # another user, so git would refuse to work in it ("dubious
            # ownership"). This marks it safe, without a config file.
            - name: GIT_CONFIG_COUNT
              value: "1"
            - name: GIT_CONFIG_KEY_0
              value: safe.directory
            - name: GIT_CONFIG_VALUE_0
              value: /case
            - name: CASE_REPO
              value: {{ .Values.case.repoUrl | quote }}
            - name: CASE_REF
              value: {{ .Values.case.ref | quote }}
            - name: HOME
              value: /tmp
            # Never prompt for credentials: a public repository needs none,
            # and a private one gets them from the Secret below.
            - name: GIT_TERMINAL_PROMPT
              value: "0"
            {{- with .Values.case.credentialsSecret }}
            - name: GIT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: username
            - name: GIT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: token
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: case
              mountPath: /case
            - name: tmp
              mountPath: /tmp
      containers:
        - name: wetsproces
          image: {{ .Values.image.ref }}
          # The server's reason to stop (a manifest it cannot read, a case it
          # refuses) lands in the container status, for the plugin to show.
          terminationMessagePolicy: FallbackToLogsOnError
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: WETSPROCES_MODE
              value: {{ .Values.wetsproces.mode | quote }}
            - name: WETSPROCES_SURFACE
              value: {{ $inst.surface | quote }}
            {{- if .Values.database.enabled }}
            - name: WETSPROCES_STORE
              value: postgres
            # The connection string CNPG writes for the app user of the
            # cluster's own database.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "wetsproces.dbCluster" . }}-app
                  key: uri
            - name: WETSPROCES_DB_MAX_CONNECTIONS
              value: {{ .Values.database.maxConnections | quote }}
            {{- else }}
            - name: WETSPROCES_STORE
              value: memory
            {{- end }}
            - name: WETSPROCES_LOGIN
              value: {{ .Values.wetsproces.login | quote }}
            {{- if eq .Values.wetsproces.login "oidc" }}
            {{- $client := get .Values.oidc.clients (include "wetsproces.clientKey" $inst.surface) }}
            - name: OIDC_DISCOVERY_URL
              value: {{ include "wetsproces.oidcIssuer" . | quote }}
            - name: OIDC_CLIENT_ID
              value: {{ $client.clientId | quote }}
            # The secret comes from a Secret only; the chart never holds it.
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "wetsproces.oidcSecret" . }}
                  key: {{ $client.secretKey }}
            - name: OIDC_REQUIRED_ROLE
              value: {{ .Values.oidc.requiredRole | quote }}
            # Keycloak sends the browser back to <BASE_URL>/auth/callback, so
            # this must be the host the instance's client allows.
            - name: BASE_URL
              value: {{ printf "https://%s" $inst.host | quote }}
            {{- end }}
            - name: WETSPROCES_MANIFEST
              value: {{ printf "/case/%s" (include "wetsproces.casePath" .) | quote }}
            - name: WETSPROCES_PORT
              value: "8000"
            {{- if and .Values.fsc4b.enabled (ne $inst.surface "backoffice") }}
            # FSC voor Burgers on the demo Stelsel, for citizens only: the
            # server generates its keys at start, so no Secret is mounted.
            - name: WETSPROCES_FSC4B_DEMO
              value: "true"
            # Where apps reach this instance; the discovery configuration
            # names its services under it.
            - name: WETSPROCES_FSC4B_PUBLIC_URL
              value: {{ printf "https://%s" $inst.host | quote }}
            {{- end }}
            {{- with .Values.theme.accentColor }}
            - name: WETSPROCES_ACCENT_COLOR
              value: {{ . | quote }}
            {{- end }}
            {{- /*
            One instance of a release holds the link: the one for employees,
            or the single one. It sends, it is the address peers send to, and
            it signs, so a release has one key. What the citizens' instance
            records is in the shared chronicle, where the worker finds it.
            */}}
            {{- $linked := and .Values.koppeling.peers (ne $inst.surface "burger") }}
            {{- if and $linked .Values.koppeling.partij }}
            - name: WETSPROCES_LINK_PARTY
              value: {{ .Values.koppeling.partij | quote }}
            {{- end }}
            {{- if $linked }}
            - name: WETSPROCES_LINK_PEERS
              value: {{ .Values.koppeling.peers | toJson | quote }}
            {{- end }}
            {{- if and $linked .Values.koppeling.keySecret }}
            - name: WETSPROCES_LINK_KEY_FILE
              value: /koppeling/key.pem
            {{- end }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: case
              mountPath: /case
              readOnly: true
            - name: tmp
              mountPath: /tmp
            {{- if and .Values.koppeling.peers .Values.koppeling.keySecret (ne $inst.surface "burger") }}
            - name: koppeling
              mountPath: /koppeling
              readOnly: true
            {{- end }}
      volumes:
        {{- if and .Values.koppeling.peers .Values.koppeling.keySecret (ne $inst.surface "burger") }}
        - name: koppeling
          secret:
            secretName: {{ .Values.koppeling.keySecret }}
            items:
              - key: key.pem
                path: key.pem
        {{- end }}
        - name: case
          emptyDir:
            sizeLimit: 2Gi
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
{{- end }}
{{- end }}
