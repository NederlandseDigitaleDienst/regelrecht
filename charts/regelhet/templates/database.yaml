{{- if .Values.database.enabled }}
{{- if not (.Capabilities.APIVersions.Has "postgresql.cnpg.io/v1/Cluster") }}
{{- fail "database.enabled needs the CloudNativePG operator on the cluster (postgresql.cnpg.io/v1 Cluster); set database.enabled=false and surfaces.split=false for the setup in memory" }}
{{- end }}
# One PostgreSQL for the release, run by the CloudNativePG operator. CNPG makes
# the database `app`, owned by the user `app`, and writes its connection string
# to the secret <cluster>-app; the server makes its schema `regelhet` there.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ include "regelhet.dbCluster" . }}
  labels:
    {{- include "regelhet.labels" . | nindent 4 }}
spec:
  instances: {{ .Values.database.instances }}
  # With one instance, CloudNativePG's PodDisruptionBudget allows no
  # disruption at all, so it blocks draining the node, and on a cluster with
  # one node that blocks maintenance for every tenant. The platform's own
  # one-instance databases switch it off for the same reason.
  enablePDB: {{ gt (int .Values.database.instances) 1 }}
  {{- with .Values.database.imageCatalog }}
  {{- if .name }}
  imageCatalogRef:
    apiGroup: postgresql.cnpg.io
    kind: {{ .kind }}
    name: {{ .name }}
    major: {{ .major }}
  {{- end }}
  {{- end }}
  storage:
    size: {{ .Values.database.storage.size }}
    {{- with .Values.database.storage.storageClass }}
    storageClass: {{ . }}
    {{- end }}
  resources:
    {{- toYaml .Values.database.resources | nindent 4 }}
{{- end }}
