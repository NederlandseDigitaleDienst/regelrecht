---
apiVersion: v2
# The name stays wetsproces after the rename to RegelHet, while the directory
# is charts/regelhet. Flux's helm-controller uninstalls a release and installs
# it anew when the name of its chart changes, and an uninstall takes the
# CloudNativePG database and its volume with it: a live test lost its data
# that way. Keep this name as long as a release from before the rename exists.
name: wetsproces
description: >-
  The regelrecht RegelHet for one case: the server in test mode or,
  logging in through a Keycloak of its own, in stable mode, an instance per
  side on one PostgreSQL database, the case cloned from a public git
  repository at start; or, with voorkant, the front of an organisation over
  several such processes.
type: application
version: 0.10.0
# The commit of the RegelHet image the chart was tested with.
appVersion: 698a2209
home: https://code.digitaledienst.overheid.nl/regelrecht/fieldlab-2026
sources:
  - https://code.digitaledienst.overheid.nl/regelrecht/fieldlab-2026
