---
# A minimal CI for the fieldlab copy on Forgejo: Rust format, lint, corpus
# validation and tests, and the frontend unit tests and type checks.
#
# The GitHub workflows in .github/workflows/ do not run here: Forgejo reads
# .forgejo/workflows/ when it exists. Most jobs run on `default`, a container
# on Kubernetes as uid 1000 with HOME=/tmp, which cannot install packages; the
# database tests run on `vm` (see that job). The Rust jobs use the image from
# ci-image.yml. There is no build cache, so every Rust job compiles from
# scratch.
#
# "Runner resources" prints what a job gets.
name: CI
on:
  push:
  workflow_dispatch:

# A job on `default` sees 64 CPUs but may use 6 GiB of memory, and cargo,
# the test harness and vitest each start a worker per CPU they see. These
# limits keep the jobs on `default` under 6 GiB.
env:
  CARGO_BUILD_JOBS: 16
  RUST_TEST_THREADS: 8

jobs:
  rust-lint:
    name: Rust format, lint and validate
    runs-on: default
    timeout-minutes: 60
    container:
      image: code.digitaledienst.overheid.nl/regelrecht/fieldlab-ci:main
    steps:
      - uses: actions/checkout@v4
      - name: Runner resources
        run: |
          echo "nproc: $(nproc)"
          echo "cpu.max: $(cat /sys/fs/cgroup/cpu.max 2>/dev/null || echo unknown)"
          echo "memory.max: $(cat /sys/fs/cgroup/memory.max 2>/dev/null || echo unknown)"
          df -h . /tmp
      - run: just format
      - run: just lint
      - run: just validate

  rust-test:
    name: Rust tests
    runs-on: default
    timeout-minutes: 60
    container:
      image: code.digitaledienst.overheid.nl/regelrecht/fieldlab-ci:main
    steps:
      - uses: actions/checkout@v4
      - name: Runner resources
        run: |
          echo "nproc: $(nproc)"
          echo "cpu.max: $(cat /sys/fs/cgroup/cpu.max 2>/dev/null || echo unknown)"
          echo "memory.max: $(cat /sys/fs/cgroup/memory.max 2>/dev/null || echo unknown)"
          df -h . /tmp
      - run: just test-no-docker

  # On `default` this job was killed (exit code 137) in five runs out of five,
  # at a different point each time, with up to 6 GiB in use. `vm` gives the job
  # its own VM with 4 CPUs and no such limit. The job is root there, so the
  # tests run as uid 1000: as root, a test that makes a directory read-only to
  # force a failing write sees the write succeed.
  rust-test-db:
    name: Rust tests (database)
    runs-on: vm
    timeout-minutes: 60
    container:
      image: code.digitaledienst.overheid.nl/regelrecht/fieldlab-ci:main
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
    env:
      CARGO_BUILD_JOBS: 4
      RUST_TEST_THREADS: 4
      TEST_POSTGRES_URL: postgres://postgres:postgres@postgres:5432
    steps:
      - uses: actions/checkout@v4
      - name: Runner resources
        run: |
          echo "nproc: $(nproc)"
          free -h
          df -h . /tmp
      - name: just test-db, as uid 1000
        run: |
          chown -R 1000:1000 .
          HOME=/tmp setpriv --reuid 1000 --regid 1000 --clear-groups just test-db

  frontend:
    name: Frontend tests
    runs-on: default
    timeout-minutes: 30
    container:
      image: node:24-bookworm
    steps:
      - uses: actions/checkout@v4
      - name: Runner resources
        run: |
          echo "nproc: $(nproc)"
          echo "cpu.max: $(cat /sys/fs/cgroup/cpu.max 2>/dev/null || echo unknown)"
          echo "memory.max: $(cat /sys/fs/cgroup/memory.max 2>/dev/null || echo unknown)"
          df -h . /tmp
      - run: npm ci --ignore-scripts
      - name: BDD grammar codegen is in sync
        run: |
          node bdd/codegen/gen-js.mjs
          git diff --exit-code packages/frontend-shared/src/gherkin/grammar.generated.js \
            || { echo "grammar.generated.js is stale: run 'just bdd-codegen' and commit the result"; exit 1; }
      - run: npm test -w packages/frontend-shared -- --maxWorkers=2
      - run: npm run typecheck -w packages/frontend-shared
      - run: npm test -w frontend -- --maxWorkers=2
      - run: npm run typecheck -w frontend
      - run: npm test -w frontend-lawmaking -- --maxWorkers=2
      - run: npm run typecheck -w frontend-lawmaking
      - run: npm test -w frontend-demo -- --maxWorkers=2
      - run: npm run typecheck -w frontend-demo
      - run: npm test -w frontend-wetsproces -- --maxWorkers=2
      - run: npm run typecheck -w frontend-wetsproces
      - run: npm test -w packages/poc-chronolexografie/frontend -- --maxWorkers=2
      - run: npm test -w frontend-poc-wetsgeschiedenis -- --maxWorkers=2
